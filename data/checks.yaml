# Checks for the trailer. The bike garage's clearance, restraint and contact checks moved to the ute's bike box with
# the bikes (data/ute/garage-checks.yaml, UTE-GARAGE.md), so the trailer has no placed module and no module checks.
# severity: fail (a failure is a design failure) or report (the value is reported, never a failure).
# Limits are never changed to make a check pass.
checks: []

# Whole-trailer checks (TRAILER.md), measured on the block layout in assemblies/trailer.yaml by cad/trailer.py.
# Masses with growth carry the MASS-06 allowance (estimate +20 %, calculated +7 %, spec 0 %).
# The tow vehicle is the LandCruiser 79 (data/ute/ute.yaml, research report 16). Its towbar is rated 350 kg, and the
# plan caps the towball at 250 kg because the ute's rear axle binds. 6 % of the trailer's mass is the floor report 07
# sets for stability. VSB1 sets no towball share. Limits here are never changed to make a check pass.
trailer_checks:
  - id: MAS-01
    title: Trailer mass with growth within the 3,100 kg plated ATM
    type: mass
    quantity: mass
    limit: plated_atm
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The decision log plates the ATM at 3,100 kg, so it covers the heaviest case with the growth allowance. A 3,000 kg plate is the target once the estimates come in lighter (TRAILER.md open questions).
  - id: MAS-02
    title: Axle group load with growth, times 1.2 for VSB1's 120 % rule, within the kit's GTM
    type: mass
    quantity: axle_vsb1
    limit: kit_gtm
    basis: growth
    cases: all
    severity: fail
    inputs: [SUP-01, SUP-02, TW-01, TW-02, TW-03]
    why: VSB1 asks the axles to carry 120 % of their share where they do not share load, as the XT's do not (report 06). The kit's GTM is Cruisemaster's figure for the 4,500 kg XT Air build.
  - id: MAS-03
    title: Towball load never above 250 kg, the ute's plan cap
    type: mass
    quantity: towball
    basis: both
    cases: all
    max: 250
    severity: fail
    inputs: [UTE-02, TW-01, TW-02, TW-03]
    why: The towbar is rated 350 kg, but the plan caps the ball at 250 kg so the ute's rear axle keeps its 2,550 kg rating (data/ute/ute.yaml UTE-05, report 16 section 2.3).
  - id: MAS-04
    title: Towball load at least 6 % of the trailer's mass in every travel case (design target)
    type: mass
    quantity: towball_pct
    basis: both
    cases: all
    min: 6
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The decision log (11:25) keeps 6 % as the floor for a stable trailer. Every case here is one the trailer may be towed in.
  - id: MAS-05
    title: Towball load within 10 kg of the target fully loaded (design target)
    type: mass
    quantity: towball
    limit: target
    tolerance: 10
    basis: nominal
    cases: [TC2]
    severity: fail
    inputs: []
    why: The axle solve sets the towball fully loaded on base weights to the target, the middle of the decision log's 200 to 250 kg band less what the growth allowance can add.
  - id: MAS-06
    title: Tyre load with VSB1's 120 % rule within the tyre's rating
    type: mass
    quantity: tyre_load
    limit: tyre_rating
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: LT265/75R16 123/120, 1,550 kg per tyre (report 16, the ute's tyre). 1.2 times the axle group load over four tyres.
  - id: MAS-07
    title: Axle group load with growth within the NSW examiner's GTM cap
    type: mass
    quantity: axle
    limit: nsw_gtm_cap
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The NSW examiner caps GTM at the lowest of the tyre, coupling, chain and brake ratings (report 02 section 2.1).
  - id: MAS-08
    title: Trailer mass with growth within the NSW examiner's ATM cap
    type: mass
    quantity: mass
    limit: nsw_atm_cap
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The examiner caps ATM at the lower of the coupling and chain ratings (report 02 section 2.1).
  - id: MAS-09
    title: Wheel load rating covers VSB1's 120 % rule with growth
    type: mass
    quantity: tyre_load
    limit: wheel_rating
    basis: growth
    cases: all
    severity: fail
    inputs: [WHL-01, TW-01, TW-02, TW-03]
    why: The ROH Trak 2 16 x 7 ET 0 is rated 1,400 kg (measurements.yaml WHL-01), the ute's wheel.
  - id: GCM-01
    title: Ute and trailer within the ute's 6,900 kg GCM
    type: gcm
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: GCM is the ute's mass plus the trailer's (report 16 section 2.4). The check takes the larger of two sums. The plan's sum is the ute at its 3,850 kg weighed limit, which includes the ball load, plus the trailer at its plated ATM less the 250 kg on the ball. The model's sum is the ute with the bikes aboard (U1 case UC2, with growth) plus the heaviest trailer case with growth.
  - id: TBS-01
    title: Towball scale reading within 10 % of the model, fully loaded (reported)
    type: towball_scale
    tolerance: 0.10
    severity: report
    inputs: [UTE-03]
    why: Reported until the trailer exists. A reading more than 10 % off the model means a mass line or its position is wrong.
  - id: FIT-01
    title: The body holds its items and keeps the entry door, desk seats, bathroom door and aisle clear
    type: fit
    zone: inside
    severity: fail
    inputs: []
    why: Every block inside the body must sit inside it without overlapping another, and no solid item may stand in a keep-clear space (report 18 section 1.2).
  - id: FIT-03
    title: Tanks and battery fit between the rails and the crossmembers
    type: fit
    zone: underfloor
    severity: fail
    inputs: []
    why: The tanks sit in the two suspension bays and the battery box in its own bay, clear of every crossmember.
  - id: FIT-04
    title: The sealed drawbar box holds the generator and the jerry cans
    type: fit
    zone: drawbar_box
    severity: fail
    inputs: []
    why: The petrol rides outside the body in a sealed, vented box behind the stone guard (decision log 12:45), so no petrol vapour can reach the living area or the air-conditioner under the bed.
  - id: FIT-05
    title: Tyres swung through their full travel keep 50 mm from every chassis member
    type: tyre
    min_gap_mm: 50
    severity: fail
    inputs: []
    why: Report 06 open question 9 and report 11 section 5. The arc follows the XT arm about its pivot.
