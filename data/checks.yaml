# Clearance and contact checks from DESIGN.md ("Checks the model must pass").
# Each check measures real B-rep distances between placed items (refs or groups from the assembly).
# severity: fail (a failure is a design failure) or report (the value is reported, never a failure).
# Limits are DESIGN.md's. Do not change them to make a check pass.
checks:
  - id: CLR-01
    title: Tuareg to bed beams
    type: clearance
    a: [TU]
    b: ["6"]
    min_gap_mm: 40
    severity: fail
    inputs: [TU-03, TU-04]
    why: The beam underside at Z 1,460 must clear the Tuareg's screen (mirrors folded, front wheel in the chock).
  - id: CLR-01b
    title: Tuareg to bed beams with the photo-measured 1,390 mm screen
    type: clearance
    a: [TU-1390]
    b: ["6"]
    min_gap_mm: 40
    severity: report
    added_by_build: true
    inputs: [TU-03, TU-04]
    why: Sensitivity added by this build. The model uses the owner's 1,370 mm height. DESIGN.md set the beam height from Aprilia's image (1,390 mm), so this row shows the margin on that basis.
  - id: CLR-02
    title: Street Triple to bed beams
    type: clearance
    a: [ST]
    b: ["6"]
    min_gap_mm: 40
    severity: fail
    inputs: [TU-03, TU-04]
    why: The beam underside must clear the Street Triple.
  - id: CLR-03
    title: Tuareg to Street Triple, anywhere
    type: clearance
    a: [TU]
    b: [ST]
    min_gap_mm: 30
    severity: fail
    inputs: [TU-01, TU-05, TU-07, ST-01]
    why: The governing pair is expected to be the Street Triple's right bar end against the Tuareg's side panels. The owner measured the Tuareg 585 mm wide at that spot (measurements.yaml TU-01), so the half-width is 292.5 mm.
  - id: CLR-04
    title: Each bike to partition A, the walls, the closed rear door and everything stowed in the garage
    type: clearance
    each: [TU, ST]
    b: ["1", C2, C3, C8, C4, "21", "14", 14P, "17", C10, C11, C12]
    min_gap_mm: 15
    severity: fail
    inputs: [TU-05, TU-07, ST-01, CHK-01]
    why: Bars, pegs, panniers and tyres must not touch partition A, the walls, the closed rear door, the winch, the gas locker, the extinguisher or the stowed ramp, generator and jerry cans.
  - id: CLR-05
    title: Mattress top plus 50 mm bedding
    type: height
    a: ["9"]
    add_mm: bedding_allowance
    max_z: ceiling_z
    severity: fail
    inputs: [TU-03, TU-04]
    why: With the roof collapsed the bedding must fit under the 1,800 mm ceiling.
  - id: CLR-06
    title: Tuareg rear-most point to the closed rear door's inner face (owner's 2,220 mm length)
    type: clearance
    a: [TU]
    b: [C4]
    min_gap_mm: 15
    severity: fail
    inputs: [TU-02, CHK-01]
    why: The bike's tail and plate hanger must clear the closed rear door.
  - id: CLR-06b
    title: Tuareg rear-most point to the closed rear door with the photo-measured 2,263 mm length
    type: clearance
    a: [TU-2263]
    b: [C4]
    min_gap_mm: 15
    severity: report
    inputs: [CHK-01]
    why: Reported, not a build failure (DESIGN.md). Aprilia's image shows the plate hanger at least 1,915 mm behind the front axle.
  - id: CLR-08
    title: Tuareg's panniers to the straps and track fittings
    type: clearance
    a: [TU-BAGS]
    b: ["12", "13"]
    min_gap_mm: 0
    severity: report
    added_by_build: true
    inputs: [TU-05, TU-06]
    why: Added with the panniers, which stay on the Tuareg in the garage. A strap must not pass through a bag. DESIGN.md sets no limit for this, so the gap is reported. CLR-03, CLR-04 and CLR-06 already include the panniers, because they are part of the Tuareg's envelope.
  - id: CLR-09
    title: Each bike rolled straight back clears the rear door frame
    type: clearance
    each: [TU, ST]
    b: [C14]
    min_gap_mm: 15
    severity: fail
    inputs: [TU-01, TU-03, TU-05, ST-01]
    why: Revision D. The bikes unload backwards through the rear door, so each must pass the frame round the opening. The check measures each bike, as parked with its front wheel up in the chock, against the frame extended forward over the whole garage, which is what a bike rolled straight back meets. Going down the ramp the bike pitches nose-up about its front tyre, which only lowers the parts behind the front axle.
  - id: CLR-10
    title: Street Triple's kerb-side straps and fittings to the kerb-side stowage
    type: clearance
    a: [13.ST-F+, 13.ST-R+, 13.ST-W, 12.ST-FL, 12.ST-RL, 12.ST-WL]
    b: ["21", C10, C11, C12]
    min_gap_mm: 15
    severity: fail
    inputs: [TU-01, TU-07, ST-01]
    why: Revision D. The garage width is fixed, so if the bike spacing grows the Street Triple and its straps move towards the stowed ramp, generator and gas locker. This check is where a spacing that no longer fits the width shows up (measurements.yaml TU-01).
  - id: CLR-07
    title: Ladder foot to the living-area floor
    type: landing
    a: ["18"]
    b: [C1, C7]
    min_gap_mm: 0
    max_gap_mm: 10
    severity: fail
    inputs: [TU-03, TU-04]
    why: Added in revision B. The owner-built ladder hooks on the deck edge at partition A and must reach the living-area floor, taken level with the garage floor. A foot more than 10 mm up leaves the ladder hanging, and a foot below the floor means the ladder cannot stand at the 15 degree lean.
  - id: BED-01
    title: Bed beam sag at the garage's span, two sleepers spread over the bed
    type: beam
    a: ["6.3"]
    beam: {load_kg: 255, beams: 5, e_gpa: 69, i_cm4: 20.8, depth_mm: 50, baseline_span_mm: 2330}
    span_ratio: 300
    severity: report
    added_by_build: true
    inputs: []
    why: Revision D. The beams span the 2,330 mm interior width, so the revision C RHS 50x25x2.5 (about 11 mm sag here) became SHS 50x50x3, 6060-T5, I 20.8 cm4 (calculated), E 69 GPa. Span / 300 is a common floor deflection guide, used here for reporting. The engineer sets the real limit and the load cases.
  - id: RES-01
    title: Worst strap load within the strap's 1,000 kg lashing capacity, report 03's load cases along the trailer
    type: restraint
    restraint: {factor: 2.0, share: 0.6, lc_kg: 1000, cases: {forward_g: 0.8, rearward_g: 0.5, lateral_g: 0.5, up_g: 1.0},
                cg_z: {TU: 700, ST: 600}}
    severity: fail
    inputs: []
    why: Revision D. With the bikes along the trailer, braking pushes each bike into its chock and cornering pushes it sideways. Report 03's method with its off-road factor of 2, one strap taking 60 % of the sideways moment, and its design centre of gravity heights (700 mm Tuareg, 600 mm Street Triple, above the 05 estimates). Every anchor stays designed for 20 kN.
  - id: CON-01
    title: Chock bases, L-track and floor touch without overlap, beams sit on ledgers and the deck sits on beams, ledgers and partition A
    type: contact
    pairs:
      - [10.TU, C1]
      - [10.ST, C1]
      - [11.front, C1]
      - [11.rear, C1]
      - [11.stow, C1]
      - [10.TU, 11.front]
      - [10.ST, 11.front]
      - ["6.1", 5.road-wall]
      - ["6.1", 5.kerb-wall]
      - ["6.2", 5.road-wall]
      - ["6.2", 5.kerb-wall]
      - ["6.3", 5.road-wall]
      - ["6.3", 5.kerb-wall]
      - ["6.4", 5.road-wall]
      - ["6.4", 5.kerb-wall]
      - ["6.5", 5.road-wall]
      - ["6.5", 5.kerb-wall]
      - ["7", "6.1"]
      - ["7", "6.2"]
      - ["7", "6.3"]
      - ["7", "6.4"]
      - ["7", "6.5"]
      - ["7", 5.on-A]
      - ["7", 5.rear-wall]
      - ["7", "1"]
    tolerance_mm: 0.01
    severity: fail
    inputs: [TU-03, TU-04]
    why: Parts that carry load must touch their supports, and no two solids may overlap.

# Whole-trailer checks (TRAILER.md), measured on the block layout in assemblies/trailer.yaml by cad/trailer.py.
# Masses with growth carry the MASS-06 allowance (estimate +20 %, calculated +7 %, spec 0 %).
# The towball limits are design targets from report 07, not legal limits: 280 kg is the car's and the towbar's
# rating, used here as a ceiling, and 6 % of the trailer's mass is the floor report 07 sets for stability.
# VSB1 sets no towball share. Limits here are never changed to make a check pass.
trailer_checks:
  - id: MAS-01
    title: Trailer mass with growth within the 3,500 kg ATM
    type: mass
    quantity: mass
    basis: growth
    cases: all
    max: 3500
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The car's braked towing limit and the planned ATM (report 07). MASS-03 margin against ATM.
  - id: MAS-02
    title: Axle group load with growth, times 1.2 for VSB1's 120 % rule, within the kit's GTM
    type: mass
    quantity: axle_vsb1
    limit: kit_gtm
    basis: growth
    cases: all
    severity: fail
    inputs: [SUP-01, SUP-02, TW-01, TW-02, TW-03]
    why: Cruisemaster rates the 4,500 kg XT Air tandem build at 4,050 kg GTM (report 06, input SUP-01). VSB1 asks each axle of a non-load-sharing group to carry 120 % of its load, and Cruisemaster's ratings do not include that (input SUP-02).
  - id: MAS-03
    title: Towball load never above 280 kg (design target)
    type: mass
    quantity: towball
    basis: both
    cases: all
    max: 280
    severity: fail
    inputs: [CAR-01, CAR-02, CAR-05, CAR-06, TU-01, TU-07, ST-01, TW-01, TW-02, TW-03]
    why: Design target from report 07. 280 kg is the car's and the planned towbar's rating, so the design keeps every case under it, with and without growth.
  - id: MAS-04
    title: Towball load at least 6 % of the trailer's mass in every travel case (design target)
    type: mass
    quantity: towball_pct
    basis: both
    cases: all
    min: 6
    severity: fail
    inputs: [CAR-01, CAR-02, CAR-05, CAR-06, TU-01, TU-07, ST-01, TW-01, TW-02, TW-03]
    why: Design target from report 07, not a legal limit. A light nose makes a trailer prone to sway. Every case in load_cases.yaml can be towed.
  - id: MAS-05
    title: Towball load within 10 kg of the target fully loaded (design target)
    type: mass
    quantity: towball
    limit: target
    tolerance: 10
    basis: nominal
    cases: [TC2]
    severity: fail
    inputs: [CAR-01, CAR-02, CAR-05, CAR-06]
    why: The target is the highest towball load that keeps the car's 1,600 kg rear axle within its limit with the planned gear in the car, capped at 280 kg (report 07, inputs CAR-01 to CAR-06). The axle solve aims at it, so this row shows the solve worked.
  - id: MAS-07
    title: Axle group load with growth within the NSW examiner's GTM cap
    type: mass
    quantity: axle
    limit: nsw_gtm_cap
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: TfNSW VIB 78 (report 02 section 2.1). The examiner caps GTM at the lowest of the four tyres' load capacities, the coupling, the safety chains and the brakes (registration ratings in load_cases.yaml).
  - id: MAS-08
    title: Trailer mass with growth within the NSW examiner's ATM cap
    type: mass
    quantity: mass
    limit: nsw_atm_cap
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: TfNSW VIB 78 (report 02 section 2.1). The examiner caps ATM at the lower of the coupling and safety chain ratings.
  - id: MAS-09
    title: Wheel load rating meets VSB1's 120 % rule (reported until Porsche confirms it)
    type: wheel
    severity: report
    inputs: [WHL-01]
    why: Each wheel needs 1.2 x (ATM less the towball target) / 4. The plan keeps the Porsche wheel when its rating meets it and changes to a rated 5 x 130 wheel when it does not (measurements.yaml WHL-01).
  - id: BAL-01
    title: Ballast at the back of the garage to tow with no bikes aboard, with growth (reported)
    type: ballast
    severity: report
    inputs: [CAR-01, CAR-02, CAR-05, CAR-06]
    why: Revision C. With every heavy item at the back, the towball rises when the bikes come out. The build solves the least ballast at the back of the garage that keeps TC1, TC4 and TC5 at or under 280 kg on base weights and carries it in those cases. This row reports how much is needed with the growth allowance as well.
  - id: CAR-07
    title: Towball scale reading within 10 % of the model, fully loaded (reported)
    type: towball_scale
    tolerance: 0.10
    severity: report
    inputs: [CAR-07]
    why: Checks the centre of gravity estimates once the trailer exists (measurements.yaml CAR-07).
  - id: MAS-06
    title: Tyre load with VSB1's 120 % rule within the tyre's 1,030 kg rating
    type: mass
    quantity: tyre_load
    basis: growth
    cases: all
    max: 1030
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: VSB1 asks each axle of a non-load-sharing group and its tyres to carry 120 % of their load. 109 load index is 1,030 kg (report 07). The wheel's own rating is not published yet, so it is reported in TRAILER.md, not checked.
  - id: CAR-01
    title: Car's rear axle with two adults, the towbar and the fully loaded towball, before any gear
    type: car_axle
    cases: [TC2]
    max: 1600
    severity: report
    inputs: [CAR-01, CAR-02, CAR-05, CAR-06]
    why: Report 07 load budget method. The row also gives how much gear the car can then carry before its rear axle or GVM binds.
  - id: FIT-01
    title: Living area holds its items and keeps the entry door, ladder foot, bathroom door, walkway and seat clear
    type: fit
    zone: living
    severity: fail
    inputs: []
    why: Revision C. One living area from the front wall to partition A. Every item must sit inside it with no overlap, and the keep-clear spaces are floor space to stand in.
  - id: FIT-02
    title: Gas locker holds the two 9 kg cylinders and the regulator
    type: fit
    zone: gas_locker
    severity: fail
    inputs: []
    why: Revision C. Report 02 section 5.2 asks for a compartment that holds only the cylinders and their equipment.
  - id: FIT-03
    title: Tanks and battery fit between the rails and the crossmembers
    type: fit
    zone: underfloor
    severity: fail
    inputs: []
    why: The tanks and battery sit between the rails, clear of every crossmember.
  - id: FIT-04
    title: Kerb-strip stowage holds the generator and the jerry cans
    type: fit
    zone: kerb_strip
    severity: fail
    inputs: []
    why: Revision C. They sit in the garage against the kerb-side wall in front of the gas locker, inside the strip and clear of each other. The module checks CLR-04 and CLR-10 keep them clear of the bikes and straps.
  - id: FIT-05
    title: Tyres at full bump clear the chassis and body
    type: tyre
    min_gap_mm: 0
    severity: fail
    inputs: []
    why: No crossmember, outrigger, tank or panel may enter the tyre's space at full bump. The floor underside clearance (50 mm) is set by the floor height.
  - id: DIM-01
    title: Overall width with the awning within VSB1's 2,500 mm
    type: width
    max: 2500
    severity: fail
    inputs: []
    why: VSB1 measures width across the body including awnings and side racks (report 02 section 2.2).
  - id: DIM-02
    title: Front load space not shorter than the rear overhang (VSB1 5.1.1)
    type: overhang
    severity: fail
    inputs: [CAR-01, CAR-02, CAR-05, CAR-06, TU-01]
    why: VSB1 5.1.1 for this kind of trailer (report 08 section 5.1). The axle group centre must sit at or behind the middle of the body.
  - id: DIM-03
    title: Coupling height inside VSB1's 350 to 460 mm towball range, with its tolerance
    type: coupling
    min: 350
    max: 460
    severity: fail
    inputs: [CAR-04]
    why: VSB1 9.3.2 and report 08 (440 mm plus or minus 20 mm).
  - id: DIM-04
    title: Running clearance at least 100 mm, unladen (VSB1 5.4)
    type: clearance_ground
    min: 100
    severity: fail
    inputs: [CAR-04]
    why: Every part carried by the suspension needs 100 mm of running clearance. The arms, hubs and wheels are not carried by it.
  - id: JK-01
    title: Body front corners clear the Cayenne at a 90 degree jack-knife
    type: jackknife
    min_gap_mm: 100
    severity: fail
    inputs: [CAR-05]
    why: Plan view at 90 degrees about the ball. 100 mm is this layout's allowance for the unmeasured ball position and the car's rounded corners. Revision B set the drawbar length for the drawbar box, which revision C does not have.
  - id: JK-02
    title: Drawbar members and stone guard to the car's rear corner, plan view (reported)
    type: jackknife_aframe
    severity: report
    inputs: [CAR-05]
    why: Reported only. In plan the A-frame and the stone guard on it pass under the car's rear corner before 90 degrees. Whether they touch depends on the bumper height against the drawbar, which nobody has measured yet.
