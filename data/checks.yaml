    why: Report 02 and report 11 LC4. Governs the hinge crossmembers and the outriggers.
  - id: CHS-05A
    title: Chassis stress, LC5a twist with one wheel in a hole, within fy / 1.5
    type: chassis_stress
    load_case: LC5a
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 11 LC5a, 13.4 kNm between the axles on top of the static load.
  - id: CHS-05B
    title: Chassis stress, LC5b twist on the corner steadies at tare, within fy / 1.5
    type: chassis_stress
    load_case: LC5b
    severity: fail
    inputs: []
    why: Report 11 LC5b. One ARK DDS650 steady wound to its 875 kg rating with the other three touching.
  - id: CHS-06
    title: Chassis and drawbar stress, LC6 VSB1 9.1 drawbar forces, below yield
    type: chassis_stress
    load_case: LC6
    severity: fail
    inputs: []
    why: VSB1 9.1 and 14. 51.5 kN along, 17.2 kN across and 17.2 kN up and down at the coupling, each way, with the body held at its suspension mounts. No residual deformation, so the check is elastic.
  - id: CHS-06B
    title: Drawbar stress, LC6b VSB1 9.2.2 chain point forces, below yield
    type: chassis_stress
    load_case: LC6b
    severity: fail
    inputs: []
    why: VSB1 9.2.2. 34.3 kN along and 17.2 kN up and down at each chain lug, separately.
  - id: CHS-08A
    title: Chassis stress, LC8a recovery at 51.5 kN within 30 degrees sideways and 15 degrees up or down, below yield
    type: chassis_stress
    load_case: LC8a
    severity: fail
    inputs: []
    why: Report 11 LC8a, at each front and rear recovery point, with the body held at its suspension mounts.
  - id: CHS-08B
    title: Chassis stress, LC8b one side jacked at its pad with gravity times 2, below yield
    type: chassis_stress
    load_case: LC8b
    severity: fail
    inputs: []
    why: Report 11 LC8b. The jack lifts one side at the pad on the XT centre crossmember.
  - id: LOC-01
    title: Chain lugs hold the VSB1 9.2.2 forces (net tension, bearing, tear-out, weld)
    type: chassis_local
    item: chain_lug
    severity: fail
    inputs: []
    why: VSB1 9.2.2. Plate limits are fy (bearing 1.5 fy, tear-out shear 0.6 fy) so the lug does not deform. The weld limit is the SP fillet capacity, 0.8 x 0.6 x 490 MPa.
  - id: LOC-02
    title: Front recovery lugs hold 51.5 kN without yield and 78.5 kN without fracture
    type: chassis_local
    item: front_recovery
    severity: fail
    inputs: []
    why: Report 11 LC8a. A 30 degree sideways pull bends the lug out of its plane.
  - id: LOC-03
    title: Rear recovery tongues hold 51.5 kN without yield and 78.5 kN without fracture
    type: chassis_local
    item: rear_recovery
    severity: fail
    inputs: []
    why: Report 11 LC8a. A 30 degree sideways pull bends the tongue out of its plane.
  - id: LOC-04
    title: Jacking pads carry the jack without yield or crushing the wall
    type: chassis_local
    item: jacking_pad
    severity: fail
    inputs: []
    why: Report 11 LC8b, 38.6 kN on one pad, or the larger force the frame analysis gives.
  - id: LOC-05
    title: Spare carrier posts carry the spare wheel at 4 g down and 1.6 g forward
    type: chassis_local
    item: spare_posts
    severity: fail
    inputs: []
    why: Report 11 LC2 (4 g on fixings) and LC7 (0.8 g forward times 2 off road, fy / 1.5).
  - id: DEF-01
    title: Rail deflection between the drawbar root and the front hub within span / 500, LC1
