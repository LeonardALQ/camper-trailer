  - id: FAT-16
    title: "Fatigue, Corner steady's chassis mount bracket under the rail, longitudinal fillets along the rail's bottom corners only"
    type: chassis_fatigue
    item: FAT-16
    severity: report
    inputs: []
    why: "Report 11 LC10 and section 3.4. IIW 513, FAT 71, a non-load-carrying pad 50 to 150 mm long (72.5 mm of weld along the rail at the front pair, 117 mm at the rear), on the composite rail's extreme fibre at the brackets. ARK's guide welds the bracket to the chassis, so it is a longitudinal attachment on the rail's bottom flange. The frequent range (0.5 g either way, at the ATM-scaled cases) must stay under the CAFL, 0.585 FAT, and the occasional range (1.5 g either way, 100,000 cycles) must give a Miner damage of 0.5 or less. Planning method, for the engineer to accept."
  - id: FAT-17
    title: "Fatigue, Drawbar mitred butt splice at the body front, one side, no NDT"
    type: chassis_fatigue
    item: FAT-17
    severity: report
    inputs: []
    why: "Report 11 LC10 and section 3.4. IIW-1823-07 detail 234, a transverse butt weld splice in a rectangular hollow section, full penetration welded from one side in the flat position: FAT 56 with its root inspected by NDT, FAT 36 without. The design takes FAT 36, so it needs no NDT of the root. The A-frame member's mitre lies under the root gusset's heel, whose fillets join it to the rail's end plate, so the range is the member's far face on the section of the member and the gusset's 140 mm heel together, from the member's end actions at the body front. The heel stands 2.6 mm outboard of the member's axis (I2-60), so the joint section is unsymmetric, and each moment's coupling into the other axis is added at the far corner, on the safe side. On the member alone the range would be about twice this splice's CAFL. The frequent range (0.5 g either way, at the ATM-scaled cases) must stay under the CAFL, 0.585 FAT, and the occasional range (1.5 g either way, 100,000 cycles) must give a Miner damage of 0.5 or less. Planning method, for the engineer to accept."
  - id: FAT-18
    title: "Fatigue, Root gusset's heel to the rail's end plate, skewed fillets, legs 7 and 10 mm, throat 5.7 mm, root"
    type: chassis_fatigue
    item: FAT-18
    severity: report
    inputs: []
    why: "Report 11 LC10 and section 3.4. IIW 414, FAT 36, a load-carrying fillet welded T-joint whose root can crack, on the stress in the weld throat. The gusset's heel carries its share of the drawbar's moment into the rail's end plate through two fillets, one each side of the 10 mm plate. The gusset meets the plate 19.9 degrees off its normal in plan, so the inboard fillet lies in a dihedral angle of 70.1 degrees and the outboard one in 109.9 degrees, and a flat-faced fillet's throat is its leg times the cosine of half its angle. Legs of 7 mm inboard and 10 mm outboard give throats of 5.73 and 5.74 mm, where 8 mm legs both sides would give 6.6 and 4.6 mm (I2-72). The range is the gusset's stress at its top on the joint section times its thickness over twice the smaller throat. The sheets' default 5 mm fillets would carry about twice this range, over the CAFL. The frequent range (0.5 g either way, at the ATM-scaled cases) must stay under the CAFL, 0.585 FAT, and the occasional range (1.5 g either way, 100,000 cycles) must give a Miner damage of 0.5 or less. Planning method, for the engineer to accept."
  - id: FAT-19
    title: "Fatigue, Rail's end plate in bending under the gusset's heel, weld toe"
    type: chassis_fatigue
    item: FAT-19
    severity: report
    inputs: []
    why: "Report 11 LC10 and section 3.4. IIW 413, FAT 63, the toe of a fillet welded T-joint, here the toes of the heel's fillets on the 16 mm end plate CH-P15 that closes each rail's front end. The heel's line load, the gusset's stress times its thickness from its foot to its top, bends the plate across the rail's 46 mm between its webs. The range is the plate's largest bending stress, the plate taken as simply supported on the rail's webs and top, which its 4 mm walls hardly restrain, with its bottom edge free, 14 mm over the rail's underside, a 10 mm slot over the floor (I2-75, I2-79), and solved as a Kirchhoff plate by finite differences. The engineer checks it by the hot-spot method. The frequent range (0.5 g either way, at the ATM-scaled cases) must stay under the CAFL, 0.585 FAT, and the occasional range (1.5 g either way, 100,000 cycles) must give a Miner damage of 0.5 or less. Planning method, for the engineer to accept."
  - id: FAT-20
    title: "Fatigue, Rail's end plate to the RHS rail's walls, full penetration single bevel from outside, root inspected by videoscope"
    type: chassis_fatigue
    item: FAT-20
    severity: report
    inputs: []
    why: "Report 11 LC10 and section 3.4. IIW-1823-07 detail 424, a single-sided butt weld of a rectangular hollow section to an intermediate plate, failure from the toe, with NDT of the root to ensure full penetration: FAT 45 for walls under 8 mm (page 62). IIW gives hollow sections a lower class than plates for the same weld, and its plate T-joint, detail 415, would be FAT 71 (I2-74). Without the root inspected the root governs, FAT 36. The gusset's heel pulls the 16 mm end plate CH-P15 forward at every cycle, and the plate passes that pull to the rail through its welds to the webs and the top. The plate is flush with the rail's sides and stands over the raiser's bottom wall, its edges bevelled, so each wall's end is welded to it with full penetration from outside, the plate behind the root as the backing. Each root lies inside the tube, and before galvanising the inspector views it along its whole length with a videoscope of 6 mm or less through the front bay's cable hole in the rail's web, 85 to 95 mm behind the plate, or the drains 35 mm behind it, to a written remote visual procedure (AS 3978) in which the scope is shown to resolve the root at its working distance. The record passes only if it shows complete root fusion along each root's whole length, the top corners and the webs' bottom ends included, and no crack (CT-102 note 3), so the design takes FAT 45 (I2-67, I2-74). Ultrasonic testing is no option: AS 2207 starts at 6 mm walls and ISO 17640 at 8 mm, and the front crossmember's end covers the inboard web where a probe would sit. Fillets from one side would bend about their root, which IIW 416 counts as 1 + 6e/a. The gusset's heel stands 3 mm inboard of the plate's middle, 2.6 mm outboard of the member's line there, and pulls along the gusset's line, 19.9 degrees off the plate's normal in plan (I2-60). The pull's part normal to the plate bends it, and the line force along a weld is the plate's Kirchhoff edge shear with its bottom edge free, 14 mm over the rail's underside (I2-75, I2-79), the heel where it stands, over the wall's section there, a web's 4 mm or the 7.5 mm of the rail's top flange and the raiser's bottom wall. The pull's part along the plate, inboard, acts at the plate's front face, 8 mm off its mid-plane, so it also bends the plate as a line moment that pulls the outboard web harder. The top weld takes that part as shear along its length, and its moment from the heel's centroid up to the top weld goes into the two webs' welds as shear along them (est., the plate rigid in its plane). A weld's normal and shear ranges both come from the heel's one pull, so they vary in phase, and IIW 4.2 b) and 4.3 read the weld's maximum principal stress range, whose direction lies 25 to 35 degrees off the weld's normal, inside the 60 degrees to which 4.3 holds it (I2-67). IIW keeps its interaction of normal and shear for stresses out of phase and for directions further off. Where the member's line meets the plate, 5.6 mm inboard, the inboard web's weld carries the most, and on the plate's middle the outboard web's, so the heel stands where the two webs share the pull. The forces at the top corners from the plate's twist press it onto the walls' ends and are left out, on the safe side. The engineer checks it by the hot-spot method, the walls' bending at the weld included. The frequent range (0.5 g either way, at the ATM-scaled cases) must stay under the CAFL, 0.585 FAT, and the occasional range (1.5 g either way, 100,000 cycles) must give a Miner damage of 0.5 or less. Planning method, for the engineer to accept."
  - id: FAT-21
    title: "Fatigue, Drawbar member's lap under the rail, opened to 2.5 mm and stitch welded, the rail's bottom wall at the stitch ends"
    type: chassis_fatigue
    item: FAT-21
    severity: report
    inputs: []
    why: "Report 11 LC10 and section 3.4. The GAA's Design Guide for Hot Dip Galvanizing asks an overlap that is not sealed all round to be opened to at least 2.5 mm and stitch welded, so the zinc reaches both faces (pages 29 to 31, I2-79). The drawbar members' 1,000 mm laps under the rails cannot be sealed, because the seal across the snipe's toe would be a weld across the rail's bottom face, which Cruisemaster's TB 070 rules out. So each lap stands 2.5 mm open, with 8 mm fillets 50 mm long at 100 mm centres on both sides (est.). IIW-1823-07 detail 324 classes an intermittent longitudinal fillet's ends at FAT 80 (1 - shear range / normal range), not under FAT 36. The seam lies near the joint's neutral axis, where the shear is high and the normal range low, so the row takes the floor, FAT 36, on the rail's bottom wall's normal range along the whole lap (est.). The frequent range (0.5 g either way, at the ATM-scaled cases) must stay under the CAFL, 0.585 FAT, and the occasional range (1.5 g either way, 100,000 cycles) must give a Miner damage of 0.5 or less. Planning method, for the engineer to accept."
  - id: DIM-01
    title: Overall width within the 2,500 mm of ADR 43/04 and VSB1 5.2
    type: width
    max: 2500
    severity: fail
    inputs: [TR-11]
    why: ADR 43/04 clause 6.2.6.1 and VSB1 section 5.2 cap a trailer at 2,500 mm. The width runs across the body, its guards, the awning and everything that stands proud of a side wall (data/body/body.yaml `width`). Side-mounted lamps and reflectors are left out.
  - id: DIM-05
    title: Overall width at most 2,490 mm (design target)
    type: width
    max: 2490
    severity: fail
    inputs: [TR-11]
    why: The design keeps 10 mm under DIM-01's 2,500 mm so the build tolerance on the panels, frames and hoods cannot take the built trailer over it (TR-11 measures it).
  - id: DIM-02
    title: Front load space not shorter than the rear overhang to the rear-most point (VSB1 5.1.1)
    type: overhang
    severity: fail
    inputs: []
    why: VSB1 5.1.1 for this kind of trailer (report 08 section 5.1). The rear overhang runs from the axle group centre to the rear-most part, the split's outdoor unit on the rear wall.
  - id: DIM-03
    title: Coupling height inside VSB1's 350 to 460 mm towball range, with its tolerance
    type: coupling
    min: 350
    max: 460
    severity: fail
    inputs: [UTE-01]
    why: "VSB1 9.3.2. The decision log sets the coupling point at 440 mm laden, plus or minus 20 mm, so it stays under 460 mm. On the Super Duty the tow pin sits in Ford's 4.5 t hitch, whose receiver's centre is about 510 mm up laden in the truck's model (est., 160 mm of rail and 70 mm under Ford's frame top at 740 mm at GVM, BEMM p. 128, cad/model/vehicles/ranger_sd.py), and the hitch's drop is chosen at the measurement UTE-01 to put the pin at 440 mm."
  - id: DIM-04
    title: Running clearance at least 100 mm, unladen (VSB1 5.4)
    type: clearance_ground
    min: 100
    severity: fail
    inputs: [UTE-01]
    why: Every part carried by the suspension needs 100 mm of running clearance, the chassis fittings in their travel positions (the corner steadies folded, the jockey wheel swung up), the spare wheel, and every fixture and run of the services at its outside diameter, as FIT-05 has them (review I2-41), included. The arms, hubs and wheels are not carried by it, and the safety chains, the rubber mud flaps and the leads that hang between the two vehicles or ride on the arms bend or move with them, so they are left out.
  - id: DIM-06
    title: Lowest rigid sprung part at least the 200 mm running clearance of an off-road vehicle, unladen, for the tracks the trailer is built for
    type: clearance_ground
    min: 200
    severity: fail
    inputs: [UTE-01]
    why: "The trailer is built for off-road tracks (the drawing set's title, report 11's off-road load cases), where drainage berms, creek banks and ruts stand well above VSB1 5.4's 100 mm road minimum (review I2-22). Ford gives the Ranger Super Duty up to 299 mm of ground clearance (ford.com.au, the Super Duty's features page, read 23 Nov 2026) without saying where it is measured, and on its live rear axle the lowest point is the axle housing (est.), which a running clearance leaves out, so no Ford figure compares with this check (review I2-37). The limit is the published rule for a vehicle built for off-road use: a running clearance of at least 20 cm, one of the characteristics in 49 CFR 523.5(b)(2) and the same 200 mm as ADR's off-road passenger vehicle category (MC), with running clearance measured as 49 CFR 523.2 defines it, to the lowest point excluding unsprung weight, as this check does. It replaces the LandCruiser 70's 235 mm, measured under its axle housings. Measured on the same parts as DIM-04."
  - id: DIM-07
    title: Breakover between the ute's rear axle and the trailer's axle group (reported)
    type: breakover
    severity: report
    inputs: [UTE-01, UTE-02]
    why: "The crest the ute and the trailer can straddle before the ground touches a rigid sprung part between the ute's rear wheels and the trailer's axle group: for each part, the slope up from the Super Duty's rear axle, UTE-02's 1,455 mm (est.) ahead of the ball, plus the slope up from the axle group's centre, both to the part's underside at design ride height with both vehicles level (est.), over DIM-04's parts, the services' fixtures and runs included (I2-41). The least of these is reported. No rule sets a limit for a combination (review I2-22). For one vehicle between its own axles, 49 CFR 523.5(b)(2) counts a breakover angle of at least 14 degrees among an off-road vehicle's characteristics. The leads between the vehicles are read where their sprung arms hold them straight ahead (cad/routes.py lifted, I2-78), and the detail gives each lead's breakover with the truck's ball at UTE-13's low end as well."
  - id: DIM-08
    title: Leads between the vehicles at least DIM-06's 200 mm up in any turn, where their sprung arms hold them, at the design ball and at UTE-13's low end
    type: clearance_leads
    min: 200
    severity: fail
    inputs: [UTE-01]
    why: "The leads between the vehicles, the 12-pin flat plug's K-13 and the TSC's supply K-14, carry the brake request and the four magnets' current, so a lead that snags in a tight off-road turn can pull its plug out or tear (review I2-70). They bend and move, so DIM-04 and DIM-06 read them only as drawn, straight ahead. This check reads each where it hangs lowest in any turn and pitch of data/routes.yaml rules.between, up to a 70 degree turn with a 20 degree pitch either way (est.), at the design's 440 mm coupling height and with the truck's ball at UTE-13's low end, its 20 mm tolerance lower, the trailer turned nose down about its axle group (cad/routes.py between_reach). Each lead is clamped on the leads' bracket and its span from the truck's plug is held up by a sprung arm, so it is read where the arm rests in each position: each part of the span is a flexible catenary of its own length, its pull its horizontal pull plus the weight of lead under it, the strap turning with the seat as the arm swings, and the arm resting where its spring's torque balances those pulls (cad/routes.py lifted, I2-78, I2-83, est.). It also fails if any position, with rules.between's margin taken off the cut, would pull a span taut. The limit is DIM-06's 200 mm, the running clearance of a vehicle built for off-road use, as the leads hang where that vehicle's parts do."
  - id: JK-01
    title: Everything that stands above the bike box's underside clears its sweep by 100 mm at any jack-knife angle
    type: jackknife
    min_gap_mm: 100
    severity: fail
    inputs: [UTE-02]
    why: The bike box's rear corners sweep a circle about the ball as the trailer swings (build/ute/ute.json, from the U2 model). Any trailer part higher than the box's underside must stay outside that circle. 100 mm allows for the ball position, which is not yet measured (UTE-02).
  - id: JK-02
    title: Everything inside the bike box's sweep stays 50 mm below its underside
    type: jackknife_height
    min_gap_mm: 50
    severity: fail
    inputs: [UTE-01, UTE-02]
    why: The coupling, chains, drawbar members and stone guard sit inside the box's sweep, so they must pass under it. 50 mm allows for the ute's pitch as it squats on the ball (assumption, TRAILER.md).

  # ---------------------------------------------------------------- body (BODY.md, cad/body.py, research report 12)
  # Revision B: the bike wheel, chock and L-track checks (BDY-01, BDY-02, BDY-08, BDY-17) and the generator floor check
  # (BDY-05) left with the garage. The raising roof (BDY-12) and the rear portal (BDY-15) are gone with the fixed roof
  # and the full rear wall. BDY-19 and BDY-20 replace them.
  - {id: BDY-03, title: "Floor under a foot, LC2 3 g, with bearing on the core", type: body_panel, body: {item: BDY-03}, severity: fail,
     why: "Report 12 section 3. 100 kg on 100 x 150 mm. Bearing at most half the core's compressive strength. With the bikes gone this governs the floor (report 18 open question 13)"}
  - {id: BDY-04, title: "Floor edge beside the raisers between outriggers, LC2 3 g", type: body_panel, body: {item: BDY-04}, severity: fail,
     why: "Report 12 section 3 and report 11 section 5.3: 160 kg/m2 of floor and contents spanning between outriggers, no edge member"}
  - {id: BDY-26, title: "Floor round its cut-outs over 60 mm, with their high-density inserts, and its bearing on the raisers, LC2 3 g", type: body_panel, body: {item: BDY-26}, severity: fail,
     why: "Review I2-27 and TRAILER.md open point 11. Every cut-out in data/services.yaml `cutouts` (the transit frames G9, G15 and G20), with the Divinycell H200 insert laid round it, 30 mm wide (est.), at Diab's minimum strengths. BDY-03's foot standing beside the cut-out, the strip's effective width less the cut-out's length, and BDY-04's 160 kg/m2, both at 3 g on the one-way span between the raisers, with Kirsch's 3.0 at the cut-out's edge (a round hole's factor, a lower bound for a radiused rectangular cut-out that its bonded frame and insert stiffen, est.) and that field fallen off to the insert's outer edge for the H80 core. Where a cut-out takes a raiser's bearer strip away, the floor bridges the gap along the raiser with a foot at its middle and bears on the insert at its ends. BDY-03's criteria: skins at half their ultimate and half the wrinkling stress, the cores at half their shear strength, bearing at half the compressive strength"}
  - {id: BDY-06, title: "Side wall and its members in the ultimate wind, 41 m/s", type: body_panel, body: {item: BDY-06}, severity: fail,
     why: "AS/NZS 1170.2 for the parked trailer: 41 m/s, BDY-19's 40 m/s raised to STB-04's highest overturning speed, 40.9 m/s with a box's Cf (H23, F3-08), Cp,e 0.7 on the windward wall and Cp,i -0.3 inside (Tables 5.2(A) and 5.1(A)), 1.01 kPa net. Strapped down (STB-05) the trailer stands in stronger winds, so the detail also gives the walls at STB-05's gust, region B's 500-year wind at 3 m (F4-07). The wall spans from the floor joiner to the roof-to-wall joiner, 2,000 mm (H1a). Skins at half their ultimate without the members, each member at its yield over 1.5 for the share its stiffness draws, and the XPS behind it at half its compressive strength"}
  - {id: BDY-07, title: "Fixed roof with the bonded solar array, LC2 3 g, spanning between the walls", type: body_panel, body: {item: BDY-07}, severity: fail,
     why: "Report 12 section 3 with report 13's 29 kg Sunman array"}
  - {id: BDY-09, title: "Roof deflection with the solar array at 1 g within span/150 (reported)", type: body_deflection, body: {item: DEF-B2}, severity: report,
     why: "Report 12 section 3. Bonded panels flex with the roof"}
  - {id: BDY-10, title: "Wall deflection in region B's 25-year wind within span/100 (reported)", type: body_deflection, body: {item: DEF-B3}, severity: report,
     why: "AS/NZS 1170.2: region B's 25-year wind, 39 m/s, times 0.91 for terrain category 2 at 3 m (Tables 3.1 and 4.1), with Cp,e 0.7 and Cp,i -0.3, 0.76 kPa net. Decision H23: region B, the Queensland coast, is non-cyclonic and Leonard will camp there, and region A's 37 m/s is lower. Span/100, 20 mm on the 2,000 mm wall, is report 12's planning limit (section 3) for the engineer to set. The members on the inner skin carry the load with the sandwich (data/body/body.yaml)"}
  - {id: BDY-11, title: "Panel fixings: lift-bed rail screws in their hardpoints and the awning's roof bolts within half their rated load", type: body_insert, severity: fail,
     why: "Report 12 section 3 and report 02 MAT-05. The awning's Panelok bolts are rated for the 40 mm roof, and are checked in travel and with the canopy open in a 60 km/h gust, above the 40 km/h at which the operating rule closes it (data/body/body.yaml `awning`). That is a check of the fixing only: the 40 km/h rule protects the canopy, its arms and its legs. A pull test in the real panel confirms each insert (LR-09)"}
  - {id: BDY-22, title: "Inside surface over each wall member and over the joiners at least 4 K above the cold night's dew point", type: body_thermal, severity: fail,
     why: "Research report 19's design cold night, -5 C outside and 20 C inside, with the dew point held at 6 C or lower, and its rule that inside surfaces stay 4 K above it, so 10 C. ISO 13788 clause 4.4.1's Rsi of 0.25 m2K/W for surface condensation and mould, which allows for furniture against the wall (F3-01). The members sit on the inner skin with 13 mm of XPS behind them, so no metal crosses the core. Each stands on an insulating bearing block 20 mm clear of the floor joiner's inner leg, whose overlap with a member is a path through the bond and the skin (F4-01), and stops 10 mm under the top insert strip. A two-dimensional conduction model of the wall gives the surface at mid-length over a member, over a hardpoint beside W1 or W2 with its side insert and the window, and over the pair of members behind the bed, and a fin along the member, with its joiner taken at the outside air, the surface at its foot and head. The joiners' foam covers are checked with the joiner at the outside air. On the generators the front e2 pair stops, and the dew point in that mode is checked too (data/body/body.yaml `thermal`)"}
  - {id: BDY-24, title: "Side walls with their openings, as plates: deflection in region B's 25-year wind within span/100", type: body_plate_defl, severity: fail,
     why: "F4-04. BDY-10 smears each member over a full bay of panel and leaves the openings out, so it cannot see a line between two cut-outs, such as the wall between W1 and the entry door. Here each side wall is a Mindlin plate from the front wall to the rear wall with every opening cut out, its window's or door's wind load on the cut-out's edges by 45 degree lines, and each member a beam on its line with its own bending, shear and torsion. BDY-10's wind and limit, 0.76 kPa net and 20 mm. A fail check, so a layout change that overloads a line of the wall stops the build"}
  - {id: BDY-25, title: "Side walls with their openings, as plates: members, skins, core and the XPS behind the members in the ultimate wind", type: body_plate_strength, severity: fail,
     why: "F4-04. BDY-24's plates at BDY-06's 41 m/s, 1.01 kPa net, with BDY-06's criteria: each member at its yield over 1.5, the skins at half their ultimate and half their wrinkling stress, the core at half its shear strength and the XPS behind a member at half its compressive strength. The skins and the core are read 50 mm or more from the cut-outs' corners, which the model cuts square, so the stress at a corner is a singularity of the mesh (F5-02). The detail also gives the walls at STB-05's gust, held down"}
  - {id: BDY-23, title: "Awning legs: the lead bar's pitch on level ground and the reach left for uneven ground (reported)", type: body_awning, severity: report,
     why: "The F80s case sits on the roof at Z 2,965 to 3,078, above the 1.8 to 2.8 m Fiamma's sheets give for the F45 and F80 family. Its 370 to 450 leg, the same part as the F80L's for large motorhomes, sets where the lead bar stands. A fall of about 10 degrees sheds rain"}
  - {id: BDY-21, title: "Outdoor unit's cradle: wall bolts within half their rated load, and the stays carry the vertical load to the chassis", type: body_cradle, severity: fail,
     why: "The split's outdoor unit and cradle, 46 kg, stand off the rear wall over the rear overhang, where the bumps are largest. At the chassis cases (3 g down, 0.8 g braking taken both ways, 0.5 g sideways, all at once) the stays take the vertical load into the rear crossmember, so the skin carries none of it, and the wall's bolts hold the cradle to the wall. Half the rated load as for BDY-11 (report 02 MAT-05), stays at their buckling load over 3. A pull test confirms the bolts (LR-09)"}
  - {id: BDY-13, title: "Body share of the LC5a twist, with the body tied to the chassis at the mounts (reported)", type: body_twist, severity: report,
     why: "Report 12 section 4 claims about 80 %. The frame model checks it with the body as a torsion box, for the roof joint carrying shear or not"}
  - {id: BDY-14, title: "Skins and bonded joints under the body's share of LC5a", type: body_joint, severity: fail,
     why: "Shear flow T / 2A round the body box, with the roof carrying shear (the bound that loads the body most)"}
  - {id: BDY-16, title: "Body mounts: 32 bolts under LC2 to LC5a, and the 3 mm raiser face", type: body_mount, severity: fail,
     why: "Report 12 section 4. Lindapter's safe working loads, and a yield-line check of the 3 mm C450 face under the sleeve. The M12 nut-plate fallback is used where the HB10 does not pass"}
  - {id: BDY-18, title: "Openings keep 300 mm of full wall between them and 150 mm to a panel edge", type: body_openings, severity: fail,
     why: "Report 12 section 5's layout rules for the sandwich walls, and no opening within 300 mm of the rear corners"}
  - {id: BDY-19, title: "Roof-to-wall joint holds the fixed roof in a 40 m/s uplift", type: body_roof, severity: fail,
     why: "Report 12 section 3's uplift at 110 km/h into a 36 km/h headwind, on the bonded joiner round the roof edge with half the bond's tensile strength allowed"}
  - {id: BDY-20, title: "Rear wall as the box's rear diaphragm under the body's share of LC5a and LC5b", type: body_end_wall, severity: fail,
     why: "Report 12 section 5. The rear wall holds the box's rear end in shape. Its shear width is the wall less the openings at its worst height, the wet room door, the rinse box and the relief valve. Skin shear at half the ultimate over root 3, and the bonded joiner at half the bond strength"}
