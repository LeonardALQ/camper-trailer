# Checks for the trailer. The bike garage's clearance, restraint and contact checks moved to the ute's bike box with
# the bikes (data/ute/garage-checks.yaml, UTE-GARAGE.md), so the trailer has no placed module and no module checks.
# severity: fail (a failure is a design failure) or report (the value is reported, never a failure).
# Limits are never changed to make a check pass.
checks: []

# Whole-trailer checks (TRAILER.md), measured on the block layout in assemblies/trailer.yaml by cad/trailer.py.
# Masses with growth carry the MASS-06 allowance (estimate +20 %, calculated +7 %, spec 0 %).
# The tow vehicle is the Ford Ranger Super Duty single cab chassis on Ford's ratings (data/ute/ute.yaml, research report
# 31), since 23 Nov 2026 in place of the LandCruiser 79. Its tow ball limit is 450 kg (est.) and the DO45's 450 kg. H14
# (21 Nov 2026) replaced the plan's 250 kg towball cap with the rule it stood for: in every case the towball keeps the
# ute's rear axle within its rating with growth, computed from the ute model at that ball load. H17 also set the design
# towball range the axle solve uses: at least 9.0 % in every case and at most 420 kg with growth since the DO45 (23 Nov
# 2026), 8.0 % and 320 kg before. H2 sets the 7.5 %
# floor and the plate, 4,000 kg since 23 Nov 2026. VSB1 sets no towball share. Limits here are never changed to make a check pass.
# The services checks SVC-01 to SVC-13 (H28: clearance, bend radii, 230 V segregation, the battery's terminal face,
# coverage, voltage drop, falls, the runs' spacing, the glands' room, then the cables' ratings, heat and supports, and the
# runs against the XT kit's parts, reported) are defined beside the runs in data/routes.yaml `checks`, with their sources, and
# measured by cad/routes.py. The trailer's build adds their rows to these checks' results (build/trailer/trailer.json).
trailer_checks:
  - id: MAS-01
    title: Trailer mass with growth within the 4,000 kg plated ATM
    type: mass
    quantity: mass
    limit: plated_atm
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Decision H2, amended 23 Nov 2026, plates the ATM at 4,000 kg, inside the Ranger Super Duty's 4,500 kg braked towing and the DO45's 4,500 kg, so it covers every case with the growth allowance.
  - id: MAS-10
    title: Trailer mass with growth at most 3,900 kg in every case (design target)
    type: mass
    quantity: mass
    basis: growth
    cases: all
    max: 3900
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Decision H2 keeps 100 kg of the 4,000 kg plate in reserve for the estimates. H13 holds it with the travel limit on water, and H21 takes any excess off the water.
  - id: MAS-02
    title: Axle group load with growth within the kit's GTM, times 1.2 for VSB1's 120 % rule unless the tandem shares load
    type: mass
    quantity: axle_vsb1
    limit: kit_gtm
    basis: growth
    cases: all
    severity: fail
    inputs: [SUP-01, SUP-02, TW-01, TW-02, TW-03]
    why: "VSB1 Rev 6 (axles and suspension) asks the axles of a close-coupled group that does not share load to carry 120 % of their load at ATM. At the 4,000 kg plate that needs 4,440 kg of the XT Air build's 4,050 kg, so the XT Air is ordered in Cruisemaster's load-sharing tandem configuration (CIS-006, params load_sharing), each side's two bags on one circuit, and the check takes the axle group load itself. The kit's GTM is Cruisemaster's figure for the 4,500 kg XT Air build."
  - id: MAS-03
    title: Towball keeps the ute's rear axle within Ford's 2,800 kg with growth and stays within the Super Duty's tow ball download, in every case
    type: towball_ute
    basis: growth
    cases: all
    severity: fail
    inputs: [UTE-02, TW-01, TW-02, TW-03]
    why: Decision H14, on the Ranger Super Duty's rear axle rating of 2,800 kg (Ford's BEMM p. 33). The ute model gives its rear axle load with the bikes aboard (UC2, with growth) and how much each kilogram on the ball adds to it (UC3 against UC2). The ute's tow ball limit is data/ute/ute.yaml's towball_rating_kg, 450 kg (est.), since Ford's figure is in the owner guide, which was not read. The trailer's Cruisemaster DO45 Plus allows 450 kg on the ball too (its fitting guide), so neither governs below the other. They replace the 79's, the Hayman Reese bar's and the DO35's 350 kg.
  - id: MAS-03B
    title: The ute's towing cases carry at least the trailer's heaviest towball with growth
    type: towball_ute_input
    basis: growth
    cases: all
    severity: fail
    inputs: []
    why: The ute builds first and its towing cases (UC3, UC4) carry the trailer's heaviest towball as cad/towball.py solves it. The ute's own checks (UTE-01 to UTE-12) hold only if no trailer case puts more on the ball.
  - id: MAS-04
    title: Towball load at least 7.5 % of the trailer's mass in every travel case (design target)
    type: mass
    quantity: towball_pct
    basis: both
    cases: all
    min: 7.5
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Decision H2 sets 7.5 % in every case for a stable trailer. Every case here is one the trailer may be towed in.
  - id: MAS-05
    title: The towball window is open, so an axle position meets both of H17's towball targets (design rule)
    type: axle_window
    min: 0
    severity: fail
    inputs: []
    why: Decision H17. The axle solve sets the axle in the middle of the window between the position where the lightest case reaches 9.0 % on the ball and the one where the heaviest towball with growth reaches 420 kg (data/load_cases.yaml axle_window). A window under 0 mm means no axle position meets both.
  - id: MAS-12
    title: Towball load at least 9.0 % of the trailer's mass in every case (H17 design target)
    type: mass
    quantity: towball_pct
    basis: both
    cases: all
    min: 9.0
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Decision H17 asks for a towball well clear of H2's 7.5 % floor (MAS-04), because the masses are still estimates. 9.0 % since the 4,000 kg plate (8.0 % before), towards the 10 % Ford's towing guide aims at.
  - id: MAS-13
    title: Towball load at most 420 kg with growth in every case (H17 design target)
    type: mass
    quantity: towball
    basis: growth
    cases: all
    max: 420
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Decision H17 at the DO45 (23 Nov 2026). The DO45 allows 450 kg on the ball and the Ranger Super Duty 450 kg (est., 10 % of its 4,500 kg braked towing), so 420 kg keeps H17's 30 kg in hand. It was 320 kg under the 79's, the towbar's and the DO35's 350 kg.
  # MAS-14 retired (23 Nov 2026): it forecast the LandCruiser's return to the Lovells Platinum kit (cut CUT7). The Ranger
  # Super Duty has no GVM kit, so there is no kit to return to.
  - id: MAS-06
    title: Tyre load on the heavier side, with VSB1's 120 % rule, within the tyre's rating
    type: mass
    quantity: tyre_load_side
    limit: tyre_rating
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: LT265/75R16 123/120, 1,550 kg per tyre (report 16), the size chosen when the trailer shared the LandCruiser's wheels. The Super Duty's 8-stud 18 in wheels share nothing with it. 1.2 times the heavier side's share of the axle group load over its two tyres, from the lateral centre of gravity.
  - id: MAS-07
    title: Axle group load with growth within the NSW examiner's GTM cap
    type: mass
    quantity: axle
    limit: nsw_gtm_cap
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The NSW examiner caps GTM at the lowest of the tyre, coupling, chain and brake ratings (report 02 section 2.1).
  - id: MAS-08
    title: Trailer mass with growth within the NSW examiner's ATM cap
    type: mass
    quantity: mass
    limit: nsw_atm_cap
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The examiner caps ATM at the lower of the coupling and chain ratings (report 02 section 2.1).
  - id: MAS-09
    title: Wheel load rating covers VSB1's 120 % rule on the heavier side with growth
    type: mass
    quantity: tyre_load_side
    limit: wheel_rating
    basis: growth
    cases: all
    severity: fail
    inputs: [WHL-01, TW-01, TW-02, TW-03]
    why: The ROH Trak 2 16 x 7 ET 0 is rated 1,400 kg (measurements.yaml WHL-01), the trailer's own wheel since the Super Duty replaced the LandCruiser whose wheel it shared.
  - id: COU-01
    title: The combination's D-value and V-value within the DO45's 24.5 kN and 14.5 kN (ADR 62/02 12.3.3)
    type: coupling_dv
    severity: fail
    inputs: []
    why: "Over 3.5 t ATM ADR 62/02 rates a coupling by its D-value and V-value, and the DO45 Plus is marked D 24.5 kN and V 14.5 kN. AS 2213.1 clauses 6 and 7 (and UN R55) give the combination's own values: D = 9.81 T R / (T + R) from the tow vehicle's GVM T and the trailer's ATM R in tonnes, and V = a X2/l2 C for a rigid drawbar trailer, with a = 2.4 m/s2 (ADR 62/02 8.1.2), X the body's length, l the ball to the axle group, X2/l2 at least 1, and C the axle group at the plate in tonnes."
  - id: MAS-11
    title: Lateral centre of gravity within 50 mm of the centreline in every case
    type: lateral
    max: 50
    basis: both
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The battery plinth, washer and dryer sit on the kerb side. 50 mm is an estimated rule from the layout study. MAS-06 and MAS-09 check each side's wheels.
  - id: STB-01
    title: Static rollover threshold at least 0.35 g in every case (PBS level 1, estimate)
    type: rollover
    min: 0.35
    severity: fail
    inputs: [TR-01]
    why: The lateral acceleration at which the inner wheels lift, with the body rolled on its air springs, bump stops and tyres (Gillespie 1992 chapter 9, data/assemblies/trailer.yaml `stability`). 0.35 g is the National Transport Commission's Performance Based Standards level 1 for heavy vehicles, the nearest published rule. The air spring and tyre rates are estimates, the bump stop gap Cruisemaster's.
  - id: STB-02
    title: Static rollover threshold against a 0.40 g target (reported)
    type: rollover
    min: 0.40
    severity: report
    inputs: [TR-01]
    why: A margin over PBS level 1 while the masses and the centre of gravity height are estimates. TR-01 measures the height.
  - id: STB-03
    title: Yaw inertia and the lowest towball share, for sway (reported)
    type: yaw
    severity: report
    inputs: [TW-04, TW-05]
    why: A heavy rear and a light towball make a trailer more prone to snaking. The model gives the yaw inertia and the share. The Bosch TSC brakes the trailer when it senses sway (TRAILER.md).
  - id: STB-04
    title: Side wind that overturns the parked trailer, unhitched on its corner steadies, at tare and fully loaded (reported)
    type: overturn
    cases: [TC1, TC2]
    severity: report
    inputs: [TR-01, TW-04, TW-05]
    why: Decision H23. The trailer tips about its leeward wheels when the wind's moment on its side silhouette passes its weight's, and slides when the push passes the tyres' and steadies' friction on wet grass, 0.35 (est.). Both take the same force coefficient, ASCE 7-16's for a solid sign of these proportions, the high side for a box (data/assemblies/trailer.yaml `stability` `overturn`), and the lower speed is the headline (F4-07). The speed is the gust at the trailer, and the forecast gust is that over 0.91, the factor from 10 m to 3 m in open country. The operating rule's forecast gust is the lower speed's over the square root of 1.5, rounded down to 5 km/h, so the wind's force keeps a factor of at least 1.5 against both (TRAILER.md, CT-003), and STB-05 checks the tie-downs.
  - id: STB-05
    title: Tie-downs hold the parked trailer at region B's 500-year gust, against tipping and sliding
    type: tie_down
    cases: [TC1, TC2]
    severity: fail
    inputs: [TR-01]
    why: "Decision H23, F3-03 and F4-03. With the ute away the trailer can be neither hitched nor moved, so four rated lashing points under the outrigger ends (CH-B02) take 50 mm ratchet straps down and out at 48 to 55 degrees, 3 degrees clear of the listing's 45 degree minimum (F6-02), to ground anchors installed as their listing tested them, each with a stabilizer plate on the trailer side of its rod (24 CFR 3285.402, F5-01). The kit rides in the ute while towing and stays with the trailer whenever the ute is unhitched for more than a day. The windward pair holds the trailer against tipping and, with the tyres' friction on wet grass, against sliding, in region B's 500-year gust at 3 m in terrain category 2, 57 m/s times 0.91, 51.9 m/s, with STB-04's Cf of 1.6. Each strap's tension is checked against the strap's lashing capacity, the D-ring's working load limit, the outrigger in bending at its yield over 1.5, and the anchor at its listed working load in the listed installation, which carries a factor of 1.5 to its ultimate load. A torque probe at the helix depth measures the soil at each anchor's place against the anchor's minimum probe value. There is no pull test: the probe measures the soil class the listing rates the anchor in, and a pull to its working load needs a test rig the kit does not carry. So each anchor is wound into undisturbed soil, never dug in and backfilled, because Tie Down warns that loose soil may then need a test of the anchor's holding power (F6-01)"
  - id: GCM-01
    title: Ute and trailer within Ford's 8,000 kg GCM
    type: gcm
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: GCM is the ute's mass plus the trailer's (Ford's payload guide). The Ranger Super Duty's GCM is 8,000 kg from the factory (BEMM p. 33), so no revision and no fallback plate or water limit. Decision H20 sets the one sum, UTE-06's, the ute with the bikes aboard and growth (UC2) plus the trailer's plate from data/load_cases.yaml.
  - id: TBS-01
    title: Towball scale reading within 10 % of the model, fully loaded (reported)
    type: towball_scale
    tolerance: 0.10
    severity: report
    inputs: [UTE-03]
    why: Reported until the trailer exists. A reading more than 10 % off the model means a mass line or its position is wrong.
  - id: FIT-01
    title: The body holds its items and keeps the door landings, the desk's chair space, the aisle and the wet room's walk band clear
    type: fit
    zone: inside
    severity: fail
    inputs: []
    why: Every block inside the body must sit inside it without overlapping another, and no solid item may stand in a keep-clear space (TRAILER.md). The bed is up, as it travels.
  - id: FIT-03
    title: Fresh, grey and diesel tanks and the XT Air box fit between the rails and the crossmembers
    type: fit
    zone: underfloor
    severity: fail
    inputs: []
    why: The fresh tanks sit in the two suspension bays, the grey tank in the rear bay under the grey-bay crossmember and the diesel tank ahead of the XT front hinge, clear of every crossmember and fitting. Every chassis fitting is read at each of its places, the hinge gussets as the prisms of their cut outlines in plan, and each fresh tank as its box less the notches in its corners round the gussets (Layout.tank_notches), 10 mm clear of them.
  - id: FIT-08
    title: The frame's fittings and the tanks' guards clear the XT kit's parts between the rails over their travel
    type: kit_fit
    severity: fail
    inputs: []
    why: "FX20-FIT's and FX21-MRG's probes found the frame's welded and bolted parts standing in Cruisemaster's parts, which no check read: FIT-03 reads the tanks and the fittings in the underfloor zone, not one fitting against the kit. Every chassis fitting is read at every place it stands, a hinge gusset as the prism of its cut outline and each hinge cheek with its step, and both pieces of the tanks' guard UF-03 as the 3D model draws them, against the XT kit's parts between the rails (Chassis.xt_parts): the hinge bars and the arms' hinge plates, the airbags over their travel and their top brackets 33SA 013, and the shocks over the arms' whole travel and their brackets, each as Cruisemaster's 33XT AIR sheets 2 to 4 place it (est.). A fitting or a guard is welded or bolted to the frame, so it may touch a part of the kit, as FIT-03 lets two rigid parts touch, and any overlap past 0.5 mm is listed. A fail row since the front's parts clear the kit (fx23-mrg): the front hinge's steps stand clear of the front airbags' brackets, the front guard is cut round the front airbags and shocks, and the XT centre crossmember has no gussets ahead of it, where the front shocks' brackets and bodies stand."
  - id: FIT-04
    title: The sealed drawbar box holds the two generators, the jerry cans and the shelf
    type: fit
    zone: drawbar_box
    severity: fail
    inputs: []
    why: The petrol rides outside the body in a sealed, vented box behind the stone guard (decision log 12:45), so no petrol vapour can reach the living area or the air-conditioner under the bed.
  - id: FIT-06
    title: The bed in its night position clears the desk, the chair space and every other item
    type: fit
    zone: inside
    state: {bed_state: 1}
    severity: fail
    inputs: []
    why: H1. The layout is evaluated a second time with the bed lowered to its night stop (bed_state 1), 75 mm above the desk top.
  - id: FIT-07
    title: Wall members clear of every opening, gland, insert strip and each other by 25 mm, and no side-wall bay wider than their pitch
    type: body_members
    severity: fail
    inputs: []
    why: "F3-02. The side walls' members (BD-18, BD-19, BD-20, LB-06) are laid into the panels as they are made. Each stands at least 25 mm from every cut-out, gland and insert strip on its wall, the bench's, the tower's and the lockers' strips included, so the panel maker can rout its channel with XPS between, and with the kitchen tower's sides, the partition and the end walls they keep every bay within the 1,067 mm pitch BDY-06 and BDY-10 take (data/body/body.yaml `members_rule`). The exception (F4-02): at W1's and W2's sides an S4's frames clamp the panel, so a bonded insert fills the core from the cut-out to the hardpoint, at least 20 mm, in the hardpoint's own routed channel. Member to member the rule is the same 25 mm, or one routed channel for both with an H200 fill bonded between them, so no thin fin of XPS is left to rout (F5-03). BD-20 and the bed's rear kerb-side hardpoint, 16.5 mm apart, are the one such pair, listed in `shared_channels`"
  - id: BED-01
    title: Lift bed heights meet H1 by day and by night
    type: bed
    severity: fail
    inputs: []
    why: H1. By day the platform's underside is at least 1,600 mm above the floor, so a seated 95th percentile adult clears it. By night the mattress top is 950 to 1,050 mm up with at least 900 mm clear above it, and the platform stops at least 40 mm above the desk top.
  - id: BED-02
    title: Lift bed at night within the HappiJac's 272 kg static rating, and the bed alone within its 204 kg moving rating
    type: bed_load
    severity: fail
    inputs: []
    why: "Lippert's manual ccd-0002668 rates the HappiJac at 272 kg static and 204 kg while it moves (research report 21). At night it holds the 64 kg moving bed and two sleepers taken at 100 kg each (data/body/body.yaml). It moves with nobody on it."
  - id: FIT-05
    title: Tyres and arms swung through their full travel keep 50 mm from every rigid part, fixture and run
    type: tyre
    min_gap_mm: 50
    severity: fail
    inputs: []
    why: "Report 06 open question 9, report 11 section 5 and review I2-30. Each tyre and each XT trailing arm swings about the arm's pivot through 60 mm up and down, the tyre as a cylinder of its published size and the arm as Cruisemaster's 33XT AIR sheet 2's hinge plan and sheet 4's views draw it, an A-frame from its pivot tube between the hinge plates, its outer leg straight back along the rail and its inner leg closing on it to the rear beam that carries the airbag, the shocks and the stub axle out to the hub, with the brace between the legs, the tube and each leg 64 mm round at the bushes and each leg growing to 90 mm at the beam (est., review I2-110). It is tested against every rigid part the suspension carries at its true size (the chassis members and fittings, the solid blocks, the products' envelopes, the tanks as notched and stepped, and the tanks' guards, the rear bay's shear panel and the guard's hanger angles as cut), every fixture of the services and every run at its outside diameter. The guards, the panel and the tanks' bottom edges are cut in steps clear of each arm's pivot tube and legs by this clearance (Chassis.arm_cuts). What rides on the arms is left out, and so are the safety chains, which hang and swing. At full bump the floor is the design's 50 mm tyre clearance above the tyre (est.)."
  # ---------------------------------------------------------------- chassis and drawbar (CHASSIS.md, report 11)
  - id: CHS-01
    title: Chassis stress, LC1 static at ATM, within fy / 3
    type: chassis_stress
    load_case: LC1
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 11 LC1. The ARTSA factor of safety of 3 on yield (report 02 section 2.4). Every member, every trailer case scaled so the heaviest sits at the plated ATM, 4,000 kg.
  - id: CHS-02
    title: Chassis stress, LC2 vertical bump 3 g, below yield
    type: chassis_stress
    load_case: LC2
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 11 LC2. A 3 g bump on the structure must not yield any member.
  - id: CHS-03
    title: Chassis stress, LC3 braking 0.8 g plus 1 g, within fy / 1.5
    type: chassis_stress
    load_case: LC3
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 02 and report 11 LC3, with the trailer's own brakes taking the braking force at the tyres.
  - id: CHS-04
    title: Chassis stress, LC4 cornering 0.5 g either way plus 1 g, within fy / 1.5
    type: chassis_stress
    load_case: LC4
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 02 and report 11 LC4. Governs the hinge crossmembers and the outriggers.
  - id: CHS-05A
    title: Chassis stress, LC5a twist with one wheel in a hole, within fy / 1.5
    type: chassis_stress
    load_case: LC5a
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 11 LC5a, 13.4 kNm between the axles on top of the static load.
  - id: CHS-05B
    title: Chassis stress, LC5b twist on the corner steadies at tare, within fy / 1.5
    type: chassis_stress
    load_case: LC5b
    severity: fail
    inputs: []
    why: Report 11 LC5b. One ARK DDS650 steady wound to its 875 kg rating with the other three touching.
  - id: CHS-06
    title: Chassis and drawbar stress, LC6 VSB1 9.1 drawbar forces, below yield
    type: chassis_stress
    load_case: LC6
    severity: fail
    inputs: []
    why: VSB1 9.1 and 14, ADR 62/02 14.2, at the 4,000 kg plate. 58.9 kN along, 19.6 kN across and 19.6 kN up and down at the coupling (1.5, 0.5 and 0.5 times the ATM's weight), each way, with the body held at its suspension mounts. No residual deformation, so the check is elastic.
  - id: CHS-06B
    title: Drawbar stress, LC6b VSB1 9.2.2 chain point forces, below yield
    type: chassis_stress
    load_case: LC6b
    severity: fail
    inputs: []
    why: VSB1 9.2.2 and ADR 62/02 14.4.2 at the 4,000 kg plate. 39.2 kN along and 19.6 kN up and down at each chain lug (1.0 and 0.5 times the ATM's weight), separately.
  - id: CHS-08A
    title: Chassis stress, LC8a recovery at 58.9 kN within 30 degrees sideways and 15 degrees up or down, below yield
    type: chassis_stress
    load_case: LC8a
    severity: fail
    inputs: []
    why: "Report 11 LC8a, 1.5 times the plated ATM's weight (58.9 kN at 4,000 kg), at each front and rear recovery point, with the trailer's weight at tare and fully loaded at the plate, held by the ground at its four tyres or one held wheel through supports that cannot pull, the nose on its jockey wheel or coupled to the truck (review I2-94, CHASSIS.md's analysis). With one wheel held the pull is LC8a's held-wheel limit and with both wheels of one axle held its held-axle limit (I2-93, I2-114)."
  - id: CHS-08B
    title: Chassis stress, LC8b one side jacked at the jacking point under an arm with gravity times 2, below yield
    type: chassis_stress
    load_case: LC8b
    severity: fail
    inputs: []
    why: Report 11 LC8b. The jack lifts one side at Cruisemaster's jacking point under one of its arms, by the hub, the air released from the springs first, so the frame takes it through the arm's bump stop and hinge (LOC-04).
  - id: LOC-01
    title: Chain lugs hold the VSB1 9.2.2 forces (net tension, bearing, tear-out, weld)
    type: chassis_local
    item: chain_lug
    severity: fail
    inputs: []
    why: VSB1 9.2.2. Each chain hangs from its lug on a grade 100 connecting link, a pewag CW 8, whose 10 mm bow bears in the lug's 14 mm hole, so the chain is fixed to the trailer for good with no shackle, as WA's CI-119C asks over 3.5 t ATM. Plate limits are fy (bearing 1.5 fy, tear-out shear 0.6 fy) so the lug does not deform. The weld limit is the SP fillet capacity, 0.8 x 0.6 x 490 MPa.
  - id: LOC-02
    title: Front recovery lugs hold 58.9 kN without yield and 78.5 kN without fracture
    type: chassis_local
    item: front_recovery
    severity: fail
    inputs: []
    why: Report 11 LC8a. A 30 degree sideways pull bends the lug out of its plane.
  - id: LOC-03
    title: Rear recovery tongues hold 58.9 kN without yield and 78.5 kN without fracture
    type: chassis_local
    item: rear_recovery
    severity: fail
    inputs: []
    why: Report 11 LC8a. A 30 degree sideways pull bends the tongue out of its plane.
  - id: LOC-04
    title: The jacking points under the arms carry the jack into the frame without yield
    type: chassis_local
    item: jacking_point
    severity: fail
    inputs: []
    why: "Report 11 LC8b, 60 % of the axle group at the plate on one jack, times 2, 43.6 kN at 4,000 kg with the 7.5 % ball, or the larger force the frame analysis gives. Cruisemaster's XT user guide puts the jacking point under each arm, on its stub axle reinforcement plate by the hub (85-USERGUIDE-XT, its part 9 and its brake adjustment step), and asks the air released from the springs before the trailer is raised. So the jack's push reaches the frame through the arm's bump stop and its airbag's top bracket 33SA 013, welded along the rail's inner web, and the little left through its hinge, as LC8b's frame model carries it. The bracket's 6 mm fillets along its length and its returns are held to AS 4100 9.7.3's 0.8 x 0.6 fuw on their throats, and the rail's 4 mm web along them to 0.6 fy in shear. The arm and its jacking point are Cruisemaster's, rated by Cruisemaster."
  - id: LOC-05
    title: Spare carrier posts carry the spare wheel at 4 g down and 1.6 g forward
    type: chassis_local
    item: spare_posts
    severity: fail
    inputs: []
    why: Report 11 LC2 (4 g on fixings) and LC7 (0.8 g forward times 2 off road, fy / 1.5).
  - id: LOC-06
    title: Corner steady brackets carry the steady's 875 kg rating at 90 degrees (welds and the rail's webs)
    type: chassis_local
    item: steady_bracket
    severity: fail
    inputs: []
    why: "ARK's XO fitting guide (RTC614 V1 1/21) rates each steady at 875 kg at 90 degrees, its only jacking position, and has its chassis mount bracket welded to the chassis. The welds run along the rail's bottom corners only (Cruisemaster TB 070), at the SP fillet capacity, 0.8 x 0.6 x 490 MPa, and the rail's two 3 mm webs bear the load over the bracket's length plus 5 t at fy / 1.5, LC5b's criterion."
  - id: LOC-07
    title: The coupling plate and the DO45's four M14 8.8 bolts hold VSB1 9.1's drawbar forces at the plate (shear, tension, both, bearing)
    type: chassis_local
    item: coupling_plate
    severity: fail
    inputs: []
    why: "VSB1 Rev 6 9.1 and ADR 62/02 14.2 at the 4,000 kg plate, each force separately. AS 4100 9.3.2: a bolt's shear capacity 0.8 x 0.62 fuf on its minor diameter area with the threads in the shear plane, its tension 0.8 fuf on its stress area, and the two together within a circle. The pull's lever from the pin to the plate lifts one row of bolts."
  - id: CHS-08U
    title: LC8a recovery at the 78.5 kN ultimate, no fracture, the members on their effective sections and the holes on their net sections
    type: chassis_local
    item: ultimate
    severity: fail
    inputs: []
    why: "Review I2-87. Report 11's LC8a asks no yield at 58.9 kN (CHS-08A, CHS-09) and no fracture at the 78.5 kN ultimate, TJM's 8 t test load, at each front and rear recovery point within 30 degrees sideways and 15 degrees up or down. Report 11 gives no reaction, so the ground holds the trailer as it would: at its four unbraked wheels, each wheel's force along the trailer through its hub and each tyre on its rates with its arm (est.), and with one wheel held fast against an obstacle at its hub's height, the trailer turned until the pull passes through that hub, the others rolling free, with the trailer's weight at tare and fully loaded at the plate, through tyres and a nose that cannot pull, the trailer tipping where no set of them holds it (I2-94, CHASSIS.md, the analysis). Each member is read on its AS 4100 5.2 effective section, Ze about each axis (Austube's tabled values for C450L0, AS 4100 Table 5.2's limits for a cold-formed RHS otherwise, the rail and its raiser on their pair's plastic modulus, compact that way, and the sum of their slender weak-axis moduli), the axial and both bending stresses added as AS 4100 8.3.4's linear interaction and combined with the shear, against fy, the rails at the raiser's 350 MPa. Each hole is read on its net section against 0.85 fu, AS 4100 clause 7.2's fracture term, with every hole within a diameter of it along its member taken out of the same section (CHS-09, I2-111), the bolt holes of the fresh tanks' bearers and the front guard's hangers among them (I2-109). A rear tongue's pull acts at its shackle hole and enters the frame at the rear crossmember's end, where the tongue is welded through it and along the rail's web. The rear tank's bay carries the pull's racking as a shear panel (CHS-13). With one wheel held fast at its hub a recovery limit applies, LC8a `held_wheel_n` in data/chassis/chassis.yaml, and with both wheels of one axle held another, `held_axle_n`, each the largest pull at which every check passes with the wheel or the pair held on all three of the hinge bars' models, rounded down to 5 kN (I2-93, I2-114), and every point is read through each held wheel and with the front or the rear axle held at its limit and at its ultimate in LC8a's ratio."
  - id: CHS-12
    title: XT hinge joints as built, each hinge welded to its crossmember and held to the rail by its cheeks, in every case
    type: chassis_local
    item: hinge_joints
    severity: fail
    inputs: []
    why: "Review I2-88. Cruisemaster's 33XT AIR sheets weld each hinge bar to its hinge crossmember only, 6 mm fillets in three 80 mm runs a side, and not under the rail. The frame model ties each pivot to its crossmember at those runs (est., three 80 mm runs a side centred 40, 221 and 400 mm inboard of the rail's inner face, where sheet 3 draws them), and to the rail through the hinge's 10 mm cheeks (CH-P16), pinned at their short fillets to the hinge bar, the bar rigid down to the pivot, so the arm's moment stays in the bar and its weld runs (I2-92), with the 45 degree gussets TB 070 recommends either side of each hinge crossmember as members (CH-P08). This row reads the hinge crossmembers, the gussets, the cheeks and their holes, the bolt holes of the fresh tanks' bearers and the front guard's hanger among them (I2-109), in every case against that case's limit, each hole on CHS-09's net section and, within the outermost weld run's length, on the element outboard of the run's node (I2-112), or, elsewhere in the runs' span, at both of the span's ends (I2-109), LC8a at 58.9 kN and at 78.5 kN, and with one wheel held fast at the held-wheel limit and its ultimate, included, and FAT-03 and FAT-13 within their CAFL. TB 070 page 2 lets suspension crossmembers take holes only where their strength can be ensured, which this row reads, and Cruisemaster accepts the joint in writing before fabrication (CHASSIS.md, open point 15)."
  - id: CHS-13
    title: The rear tank's bay as a shear panel, its cut steel guard's shear and buckling, its roots, its bolts, its angles' welds and the sheet's bearing and tear-out at them, in every case
    type: chassis_local
    item: shear_panel
    severity: fail
    inputs: []
    why: "Review I2-87, I2-95 and I2-98, and FX20-FIT's item 4. The rear fresh tank fills its bay, so the bay has no plan brace, and the recovery pull's racking at the 78.5 kN ultimate bends the rails behind the XT centre crossmember past their limit through that bay, 1.09 with no bracing. Cruisemaster's rear airbags and shocks stand at the rails' sides of the bay over their travel and its airbags' top brackets fill the rails' webs beside them, so the tank's guard, an 8 mm hot-rolled steel sheet (AS/NZS 1594 HA250, fy 250 and fu 350 MPa), hot-dip galvanised, is cut 10 mm clear of them from the first one's front back to the XT rear shock crossmember, its inner corners radiused 25 mm (est.). It is bolted by M12 8.8 bolts in 13 mm holes to a short EA 50 x 50 x 5 angle welded to each rail's inner web between the XT centre's rear cheek and the airbag's bracket, two at 36 mm, and to three angles under the XT rear shock crossmember at 36 mm, where it reaches under them in tongues, so it ties the rails ahead of the airbags to that crossmember's middle. The frame model carries it as two diagonals, each from a rail's two bolts to the far side's bolts under the crossmember, of the sheet's shear stiffness over its net width between the cuts (est.). The racking shear V over that net width, V / (b t), is held to the lower of 0.6 fy and the sheet's elastic shear buckling stress over each case's factor, the buckling read by the Rayleigh-Ritz method over the sheet as cut, held at its bolts along the rails and its tongues' roots, the shear taken uniform over the whole sheet, its free edges too (est., on the safe side). Each rail's two bolts take its diagonal's force, and the rear group V and the diagonals' couple as an elastic bolt group, held to AS 4100 9.3.2's 0.8 x 0.62 fuf on the minor diameter area, and the rails' angles' welds take the diagonal's force on their throats. Each tongue and each wing, the sheet's part outboard of the cut ahead of it, is read as a free body, its force carried into the sheet through its root in shear, tension and in-plane bending by beam theory (est.), at every section along a tongue's 25 mm root radius: its von Mises stress against fy over each case's factor, and at the ultimate its plastic interaction against 1. The sheet at the most loaded bolt is read in bearing by AS 4100 9.3.2.4, 0.9 x 3.2 d t fu, and AS/NZS 4600 5.3.4.2, 0.6 alpha C d t fu with C 3.0 for d / t under 10 and alpha 1.0 in single shear with washers under the head and the nut, and in tear-out to its nearest edge in any direction by AS 4100 9.3.2.4, 0.9 a_e t fu, and AS/NZS 4600 5.3.2, 0.7 e t fu as fu / fy is over 1.08. Every bolt's centre stands at least AS 4100 Table 9.6.2's 1.75 d from a sheared edge of the sheet, 1.5 d from an angle's sawn end, and AS/NZS 4600's 3 d from the next bolt (cad/tests/test_chassis.py), and the detail gives the least edge distance."
  - id: CHS-14
    title: The hinge cheeks' welds hold the force the hinge bar passes them in LC8a, a held wheel's included
    type: chassis_local
    item: hinge_cheeks
    severity: fail
    inputs: []
    why: "Review I2-88 and I2-92. With one wheel held fast the whole pull along the trailer reaches one hinge. Each cheek is welded down the hinge bar's front or rear face by a 10 mm fillet each side over the bar's top 26 mm (est.), which pass a force but no moment, so the frame model pins the cheek there with the hinge bar rigid down to the pivot. On the rail's inner web the cheek has a 6 mm fillet along its top edge, 82.5 mm up the web, and a flare-bevel weld along the rail's R10 bottom corner, whose effective throat is AISC 360 Table J2.2's 5/16 of the radius for a manual metal arc weld, 3.1 mm. The row reads, in every LC8a case at 58.9 kN and at 78.5 kN, the force the model's pin passes from the bar into the hinge's cheeks, shared equally between its two, at the pin at the cheek's end, the fillets to the bar on their throats and the two web lines as one weld group by the elastic vector method, each against AS 4100 9.7.3's 0.8 x 0.6 fuw. The pin stands 88 mm under the hinge crossmember's axis and the pivot 174 mm, and the crossmember is far softer in torsion than the cheek is along the rail, so the pin passes about 1.8 times the hinge's force, the bar's runs pulling back the difference. Every hinge has both its cheeks, the front hinges' front ones clear of the run K-10 and the plan braces PB-2K and PB-2R (I2-93, CHASSIS.md revision S). Over the web each cheek's end is coped 12 mm by 45 degrees clear of its crossmember's 8 mm end fillet, so its two web welds start there and the row reads them on that shorter length (I2-100). LC8a's cases with both wheels of one axle held fast at the recovery limit are read too (I2-93)."
  - id: CHS-15
    title: The XT arms' droop limits, their brackets and the airbags' top brackets hold LC8a's arm moments
    type: chassis_local
    item: arm_limits
    severity: fail
    inputs: []
    why: "Review I2-94. An airbag cannot pull. Where an arm's balance about its hinge in LC8a asks less of its airbag than the airbag gives at full droop, its force at ride less the air spring's 88 N/mm (est.) over the 60 mm droop (33XT AIR sheet 2), the arm sits on its droop limit, its shock absorber at full extension (est., the XT Air kit lists no droop strap), which takes the rest of the arm's moment and pulls the frame down at its bracket on the next crossmember's front face. The row reads the largest such pull over every LC8a case, at 58.9 kN and at the 78.5 kN ultimate, on the shock's M12 eye bolts in double shear (AS 4100 9.3.2.1, est. property class 8.8) and on its bracket's 6 mm fillets to the crossmember's face as a weld group (est. geometry), and the airbag's largest push with its bump stop, its bump load, on its top bracket's 6 mm fillets along the rail's web (33SA 013, est. length). The shock's own capacity at full extension and the airbag's bump load are Cruisemaster's to accept (CHASSIS.md open point 15)."
  - id: CHS-16
    title: The hinge gussets' end welds, round both cut faces, in every case
    type: chassis_local
    item: hinge_gussets
    severity: fail
    inputs: []
    why: "Each hinge gusset CH-P08, an SHS 50 x 50 x 3 at 45 degrees in plan, is cut at both ends to bear on its hinge crossmember's face and on the inboard face of the step of the hinge cheek beside it, and welded all round each cut: 5 mm fillets along the top and bottom walls' 70.7 mm edges, throat 3.5 mm, a 5 mm fillet in the 45 degree angle on the short side, throat 4.6 mm (the leg times cos 22.5 degrees, its procedure qualified as the angle is under 60 degrees), and on the long side, in the 135 degree angle, the wall's edge bevelled and butt welded to its 3 mm. The frame model carries each gusset as a member tied by rigid links where its axis meets the two faces, the centres of its welds. Each end's force and moment are read round its weld by the elastic vector method, the normal force and the two moments in the face's plane over the throats' area and second moments, the two shears and the twist over the area and the polar moment, and the largest throat stress at any point of either weld of any gusset is held to AS 4100 9.7.3's 0.8 x 0.6 fuw over each case's factor, LC8a at 58.9 kN and at the 78.5 kN ultimate with one wheel held fast included. Review I2-99: each gusset's rail end lands on the step of the cheek beside it, a 10 mm plate 60.5 mm tall, 300 mm long at the front hinge and 140 mm at the XT centre, on the rail's 4 mm inner web, so the row also reads that web under the step in every case as CIDECT Design Guide 3's chord face plastification of an RHS T joint (2nd edition, Table 3.1), the step a rigid patch on the 150 mm web and the gusset's push normal to it, N* = fy0 t0 squared / (1 - beta) (2 eta + 4 sqrt(1 - beta)) Qf, beta and eta the step's height and length over the web's depth, with Qf = (1 - n) to the power 0.6 - 0.5 beta for the rail's own normal stress at the gusset's height over fy0, taken as compression whatever its sign, as the gusset's axial stress against the stress at which the web plastifies under it, and the step's two fillets under the gusset's pull. The web's b0 / t0 of 37.5 lies past the guide's 35 and the step is not its full-width reinforcing plate, so the reading is an estimate the engineer confirms (CHASSIS.md item 5)."
  - id: CHS-17
    title: The fresh tanks' bearers, their bolts, the crossmembers' webs and the rear bay's panel carry each tank full in LC1 to LC3
    type: tank_support
    severity: fail
    inputs: []
    why: "Review I2-109. Each fresh tank full, the tank with its growth and its share of water_full_l by its net, takes each case's accelerations at its centre, 1 g in LC1, 3 g in LC2 and 0.8 g forward with 1 g in LC3 (report 11), each reading times the case's factor, 3, 1 and 1.5. The front tank's ends sit on two pairs of 75 x 50 x 6 steel angles bolted through the XT crossmembers' webs (UF-01B) and the tank spans between them, its ends sharing its weight by its centre's place between their bearing lines, the front pair the more by the braking pull at the centre's height over the feet. The rear tank's front end sits on a pair on the XT centre crossmember's rear face, read as if the tank spanned to its rear end, and its body on the rear bay's shear panel PNL-1, read as if it carried the whole tank. Each angle's foot is read in bending at its root against fy, each angle's two M10 8.8 bolts in shear and tension together by AS 4100 9.3.2.3, the tension from the bearing's lever about the upright's heel, and the crossmember's 6 mm web and the angle's upright at each bolt in bearing and tear-out by AS 4100 9.3.2.4 and the web in pull-through round the washer at 0.6 fu (est.). The panel is read as a strip the width of its bolts under the XT rear shock crossmember, simply supported on its two bolt lines, its bolts in tension and the angles' flat legs CH-P17 in bending under them. The 3 mm aluminium guard under the front tank hangs on its angles guard_gap, 15 mm, under the tank's bottom, more than the bottom's sag between its baffles in LC2, about 10 mm (est.), so it carries only itself (I2-115)."
  - id: CHS-09
    title: Holes the runs and the galvanising make in the frame's members, net section in LC1 to LC8b within each case's limit
    type: chassis_local
    item: holes
    severity: fail
    inputs: []
    why: "Review I2-27. Every hole in data/services.yaml `holes`, the drains for galvanising at each rail's front end (data/chassis/chassis.yaml galvanising_holes, I2-75, I2-79), at its section of the composite rail with the hole taken out of the wall it is in (a seam hole out of both walls), and the holes CHS-11 asks of the drawbar members and every other closed section (member_galvanising_holes, I2-84) at the member's own section, a hinge gusset's by CHS-10's placing rules only since it carries no frame load in the model, and the bolt holes the fresh tanks' bearers and the front guard's hangers make through both webs of the rails and the XT crossmembers (Layout.fixing_holes, I2-109), in a rail as a run's hole is read and in a crossmember at its own section: the combined stress at the hole's edge in each of LC1 to LC8b against that case's limit, fy over its factor, or 0.85 fu over it where that is lower (AS 4100 clause 7.2's net-section term, kt 1). Every other hole within the larger diameter of it along its member, a slot's length added, comes out of the same net section, so the holes in one cross-section are read together, each with its own lever to the net centroid and its own wall's torsion (I2-111). A hole in a hinge crossmember within the outermost of a hinge bar's 80 mm weld runs is read on the element outboard of the run's node, at that node, since the frame model lumps the run at its centre (I2-112), and since the model ties the runs together through the rigid hinge bar, any other hole that reaches into the runs' span is read at both of its ends, outboard of the outermost run's node and inboard of the innermost's, the worse (I2-109). The rails take the raiser's 350 MPa, as CHS-01 to CHS-08B do, and every other member its own grade."
  - id: CHS-10
    title: Holes the runs and the galvanising make in the frame's members, placed clear of the tubes' corners and the welds, and their fatigue
    type: chassis_local
    item: hole_places
    severity: fail
    inputs: []
    why: "Review I2-27, I2-75 and I2-79 for the drains at the rails' front ends and the drawbar members' apex ends, and I2-84 for CHS-11's holes in every closed section, and I2-109 for the bolt holes of the fresh tanks' bearers and the front guard's hangers. Each hole's centre at least 1.25 d from the end of its face's flat, where the corner radius starts, and 1.5 d from the member's sawn end (AS 4100 Table 9.6.2, a rolled and a sawn edge), and its edge at least one hole diameter from every weld toe and the larger diameter from another hole, where Kirsch's solution for a hole in a plate puts the hole's stress field within 8 % of the nominal stress. The frequent range at the hole's edge, 3.0 times the net section's (Kirsch), on CHS-09's net section with the holes beside it, within the CAFL of IIW-1823-07 Table 3.2-1 no. 121, a machine-cut edge dressed, FAT 140, 81.9 MPa, and the occasional range's Miner damage at most 0.5 (report 11 section 3.4). A drain close behind a rail's end plate stands in the field the plate's weld puts into the web, so its range adds that field's normal range across the weld, at the drain's height, to the beam's, with the shear along the weld, undiminished on the safe side, and its edge reads Kirsch's 3 s1 - s2 in that biaxial field (I2-80, est.). A hole that breaks any of the three rules fails the build. The holes are the services' (data/services.yaml, held to the routes by cad/tests/test_routes.py), the dip's and the fixings' (Layout.fixing_holes), so a failing hole is fixed by moving its run or its fixing, never by easing a rule."
  - id: CHS-11
    title: Every closed section of the frame drained at its low points and vented at its high points in the dip, its holes to the guide's table
    type: chassis_local
    item: galvanising
    severity: fail
    inputs: []
    why: "Review I2-84. The frame is galvanised in one dip at Valmont Coatings Hexham, rolled 46 degrees across, either side down, and pitched drawbar end down at up to 9 degrees (galvanising_dip). Each closed section, the rails, raisers, crossmembers, outriggers, drawbar members, cross brace, plan braces and hinge gussets, is read on its members' axes in both rolls and at every whole degree of pitch from level to 9 degrees, sliced along its length with its inner section's corner radii (cad/chassis_dip.py, est.). Liquid leaves only through a drain, the rails' slot, an internal hole or an open end, so each low point must reach an opening whose lowest edge stands at most 50 mm over it, and each high point one whose top edge stands at most 50 mm under it: the GAA's Design Guide for Hot Dip Galvanizing asks the holes as near the high and low points as they can go (pages 8 and 14), and its shop detail puts a hollow section's holes 50 mm from its connection (Figure 16, est.). The holes within 150 mm of each otherwise closed end give at least the area of the one hole Tables 1 to 3 give that section, or of a quarter of its diagonal where they omit it (page 13), and each hole is at least 10 mm and its wall's thickness (pages 8 and 13). The model leaves out the galvaniser's chains and the swing as the frame goes in and out, takes a cable's bushed hole as closed, and reads the snipe's open end at the tube's full depth. The galvaniser's trial hang replaces it."
