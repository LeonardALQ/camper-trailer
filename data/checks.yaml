  - id: FAT-07
    title: "Fatigue, Drawbar root gusset's toe, radius ground, weld round its end"
    type: chassis_fatigue
    item: FAT-07
    severity: report
    inputs: []
    why: "Report 11 LC10 and section 3.4. IIW-1823-07 detail 522, FAT 90: a longitudinal gusset fillet welded on the member's face with a radius transition, here the 10 mm gusset CH-P03 standing on the drawbar member's top face. The class holds only with the radius over 150 mm (160 mm), the fillet welds wrapped round the gusset's end, the toe ground there and that end no taller than twice the gusset's thickness, at most 25 mm (10 mm, against 20 mm). Its nominal stress is the drawbar member's own at the gusset's end, 270 mm ahead of the body front. Behind the toe the gusset deepens the section, and FAT-17 to FAT-19 check the body front under its heel. The frequent range (0.5 g either way, at the ATM-scaled cases) must stay under the CAFL, 0.585 FAT, and the occasional range (1.5 g either way, 100,000 cycles) must give a Miner damage of 0.5 or less. Planning method, for the engineer to accept."
