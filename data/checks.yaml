# Clearance and contact checks from DESIGN.md ("Checks the model must pass").
# Each check measures real B-rep distances between placed items (refs or groups from the assembly).
# severity: fail (a failure is a design failure) or report (the value is reported, never a failure).
# Limits are DESIGN.md's. Do not change them to make a check pass.
checks:
  - id: CLR-01
    title: Tuareg to bed beams
    type: clearance
    a: [TU]
    b: ["6"]
    min_gap_mm: 40
    severity: fail
    why: The beam underside at Z 1,460 must clear the Tuareg's screen (mirrors folded, front wheel in the chock).
  - id: CLR-01b
    title: Tuareg to bed beams with the photo-measured 1,390 mm screen
    type: clearance
    a: [TU-1390]
    b: ["6"]
    min_gap_mm: 40
    severity: report
    added_by_build: true
    why: Sensitivity added by this build. The model uses the owner's 1,370 mm height. DESIGN.md set the beam height from Aprilia's image (1,390 mm), so this row shows the margin on that basis.
  - id: CLR-02
    title: Street Triple to bed beams
    type: clearance
    a: [ST]
    b: ["6"]
    min_gap_mm: 40
    severity: fail
    why: The beam underside must clear the Street Triple.
  - id: CLR-03
    title: Tuareg to Street Triple, anywhere
    type: clearance
    a: [TU]
    b: [ST]
    min_gap_mm: 30
    severity: fail
    why: The governing pair is expected to be the Street Triple's right bar end against the Tuareg's fairing and radiator shrouds (half-width estimate 300 mm).
  - id: CLR-04
    title: Each bike to partitions and side walls, door closed
    type: clearance
    each: [TU, ST]
    b: ["1", "2", "3", C2, C3, C4]
    min_gap_mm: 15
    severity: fail
    why: Bars, pegs and tyres must not touch the partitions, the walls or the closed garage door.
  - id: CLR-05
    title: Mattress top plus 50 mm bedding
    type: height
    a: ["9"]
    add_mm: bedding_allowance
    max_z: ceiling_z
    severity: fail
    why: With the roof collapsed the bedding must fit under the 1,800 mm ceiling.
  - id: CLR-06
    title: Tuareg rear-most point to the closed door's inner face (owner's 2,220 mm length)
    type: clearance
    a: [TU]
    b: [C4]
    min_gap_mm: 15
    severity: fail
    why: The bike's tail and plate hanger must clear the closed kerb-side door.
  - id: CLR-06b
    title: Tuareg rear-most point to the closed door with the photo-measured 2,263 mm length
    type: clearance
    a: [TU-2263]
    b: [C4]
    min_gap_mm: 15
    severity: report
    why: Reported, not a build failure (DESIGN.md). Aprilia's image shows the plate hanger at least 1,915 mm behind the front axle.
  - id: CLR-08
    title: Tuareg's panniers to the straps and track fittings
    type: clearance
    a: [TU-BAGS]
    b: ["12", "13"]
    min_gap_mm: 0
    severity: report
    added_by_build: true
    why: Added with the panniers, which stay on the Tuareg in the garage. A strap must not pass through a bag. DESIGN.md sets no limit for this, so the gap is reported. CLR-03, CLR-04 and CLR-06 already include the panniers, because they are part of the Tuareg's envelope.
  - id: CLR-07
    title: Ladder foot to the living-area floor
    type: landing
    a: ["18"]
    b: [C1, C7]
    min_gap_mm: 0
    max_gap_mm: 10
    severity: fail
    why: Added in revision B. The owner-built ladder hooks on the deck edge and must reach the living-area floor, taken level with the garage floor. A foot more than 10 mm up leaves the ladder hanging, and a foot below the floor means the ladder cannot stand at the 15 degree lean.
  - id: CON-01
    title: Chock bases, L-track and floor touch without overlap, beams sit on ledgers and the deck sits on beams and on partition B
    type: contact
    pairs:
      - [10.TU, C1]
      - [10.ST, C1]
      - [11.front, C1]
      - [11.rear, C1]
      - [10.TU, 11.front]
      - [10.ST, 11.front]
      - ["6.1", 5.on-A]
      - ["6.1", 5.on-B]
      - ["6.2", 5.on-A]
      - ["6.2", 5.on-B]
      - ["6.3", 5.on-A]
      - ["6.3", 5.on-B]
      - ["6.4", 5.on-A]
      - ["6.4", 5.on-B]
      - ["6.5", 5.on-A]
      - ["6.5", 5.on-B]
      - ["7", "6.1"]
      - ["7", "6.2"]
      - ["7", "6.3"]
      - ["7", "6.4"]
      - ["7", "6.5"]
      - ["7", "2"]
    tolerance_mm: 0.01
    severity: fail
    why: Parts that carry load must touch their supports, and no two solids may overlap.

# Whole-trailer checks (TRAILER.md), measured on the block layout in assemblies/trailer.yaml by cad/trailer.py.
# Masses with growth carry the MASS-06 allowance (estimate +20 %, calculated +7 %, spec 0 %).
# The towball limits are design targets from report 07, not legal limits: 280 kg is the car's and the towbar's
# rating, used here as a ceiling, and 6 % of the trailer's mass is the floor report 07 sets for stability.
# VSB1 sets no towball share. Limits here are never changed to make a check pass.
trailer_checks:
  - id: MAS-01
    title: Trailer mass with growth within the 3,500 kg ATM
    type: mass
    quantity: mass
    basis: growth
    cases: all
    max: 3500
    severity: fail
    why: The car's braked towing limit and the planned ATM (report 07). MASS-03 margin against ATM.
  - id: MAS-02
    title: Axle group load with growth within the kit's 3,330 kg GTM
    type: mass
    quantity: axle
    basis: growth
    cases: all
    max: 3330
    severity: fail
    why: Cruisemaster rates the 3,700 kg XT tandem build at 3,330 kg GTM (report 06).
  - id: MAS-03
    title: Towball load never above 280 kg (design target)
    type: mass
    quantity: towball
    basis: both
    cases: all
    max: 280
    severity: fail
    why: Design target from report 07. 280 kg is the car's and the planned towbar's rating, so the design keeps every case under it, with and without growth.
  - id: MAS-04
    title: Towball load at least 6 % of the trailer's mass in every travel case (design target)
    type: mass
    quantity: towball_pct
    basis: both
    cases: all
    min: 6
    severity: fail
    why: Design target from report 07, not a legal limit. A light nose makes a trailer prone to sway. Every case in load_cases.yaml can be towed.
  - id: MAS-05
    title: Towball load near 220 kg fully loaded (design target)
    type: mass
    quantity: towball
    basis: nominal
    cases: [TC2]
    min: 210
    max: 230
    severity: fail
    why: Report 07 sets about 220 kg fully loaded, where the car's 1,600 kg rear axle starts to bind. The axle solve aims at 220 kg, so this row shows the solve worked.
  - id: MAS-06
    title: Tyre load with VSB1's 120 % rule within the tyre's 1,030 kg rating
    type: mass
    quantity: tyre_load
    basis: growth
    cases: all
    max: 1030
    severity: fail
    why: VSB1 asks each axle of a non-load-sharing group and its tyres to carry 120 % of their load. 109 load index is 1,030 kg (report 07). The wheel's own rating is not published yet, so it is reported in TRAILER.md, not checked.
  - id: CAR-01
    title: Car's rear axle with two adults, the towbar and the fully loaded towball, before any gear
    type: car_axle
    cases: [TC2]
    max: 1600
    severity: report
    why: Report 07 load budget method. The row also gives how much gear the car can then carry before its rear axle or GVM binds.
  - id: FIT-01
    title: Front utility zone holds its items and keeps its door landing and walkway clear
    type: fit
    zone: front
    severity: fail
    why: Every item must sit inside the zone with no overlap. Keep-clear spaces are floor space to stand in.
  - id: FIT-02
    title: Rear living zone holds its items and keeps its landings clear
    type: fit
    zone: rear
    severity: fail
    why: The ladder's landing, the partition B doorway and the entry and bathroom doors need clear floor.
  - id: FIT-03
    title: Tanks and battery fit between the rails and the crossmembers
    type: fit
    zone: underfloor
    severity: fail
    why: The tanks and battery sit between the rails, clear of every crossmember.
  - id: FIT-04
    title: Drawbar box holds the generator, gas bottles and fuel
    type: fit
    zone: drawbar_box
    severity: fail
    why: Contents inside the box with no overlap.
  - id: FIT-05
    title: Tyres at full bump clear the chassis and body
    type: tyre
    min_gap_mm: 0
    severity: fail
    why: No crossmember, outrigger, tank or panel may enter the tyre's space at full bump. The floor underside clearance (50 mm) is set by the floor height.
  - id: DIM-01
    title: Overall width with the awning within VSB1's 2,500 mm
    type: width
    max: 2500
    severity: fail
    why: VSB1 measures width across the body including awnings and side racks (report 02 section 2.2).
  - id: DIM-02
    title: Front load space not shorter than the rear overhang (VSB1 5.1.1)
    type: overhang
    severity: fail
    why: VSB1 5.1.1 for this kind of trailer (report 08 section 5.1). The axle group centre must sit at or behind the middle of the body.
  - id: DIM-03
    title: Coupling height inside VSB1's 350 to 460 mm towball range, with its tolerance
    type: coupling
    min: 350
    max: 460
    severity: fail
    why: VSB1 9.3.2 and report 08 (440 mm plus or minus 20 mm).
  - id: DIM-04
    title: Running clearance at least 100 mm, unladen (VSB1 5.4)
    type: clearance_ground
    min: 100
    severity: fail
    why: Every part carried by the suspension needs 100 mm of running clearance. The arms, hubs and wheels are not carried by it.
  - id: JK-01
    title: Body front corners and drawbar box clear the Cayenne at a 90 degree jack-knife
    type: jackknife
    min_gap_mm: 100
    severity: fail
    why: Plan view at 90 degrees about the ball. 100 mm is this layout's allowance for the unmeasured ball position and the car's rounded corners. The drawbar length is set to meet it.
  - id: JK-02
    title: Drawbar member to the car's rear corner, plan view (reported)
    type: jackknife_aframe
    severity: report
    why: Reported only. In plan the A-frame meets the car's rear corner before 90 degrees. Whether it touches depends on the bumper height against the drawbar, which nobody has measured yet.
