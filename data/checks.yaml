    why: Report 02 and report 11 LC3, with the trailer's own brakes taking the braking force at the tyres.
  - id: CHS-04
    title: Chassis stress, LC4 cornering 0.5 g either way plus 1 g, within fy / 1.5
    type: chassis_stress
    load_case: LC4
    severity: fail
