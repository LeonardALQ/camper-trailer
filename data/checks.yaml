# Clearance and contact checks from DESIGN.md ("Checks the model must pass").
# Each check measures real B-rep distances between placed items (refs or groups from the assembly).
# severity: fail (a failure is a design failure) or report (the value is reported, never a failure).
# Limits are DESIGN.md's. Do not change them to make a check pass.
checks:
  - id: CLR-01
    title: Tuareg to bed beams
    type: clearance
    a: [TU]
    b: ["6"]
    min_gap_mm: 40
    severity: fail
    why: The beam underside at Z 1,460 must clear the Tuareg's screen (mirrors folded, front wheel in the chock).
  - id: CLR-01b
    title: Tuareg to bed beams with the photo-measured 1,390 mm screen
    type: clearance
    a: [TU-1390]
    b: ["6"]
    min_gap_mm: 40
    severity: report
    added_by_build: true
    why: Sensitivity added by this build. The model uses the owner's 1,370 mm height. DESIGN.md set the beam height from Aprilia's image (1,390 mm), so this row shows the margin on that basis.
  - id: CLR-02
    title: Street Triple to bed beams
    type: clearance
    a: [ST]
    b: ["6"]
    min_gap_mm: 40
    severity: fail
    why: The beam underside must clear the Street Triple.
  - id: CLR-03
    title: Tuareg to Street Triple, anywhere
    type: clearance
    a: [TU]
    b: [ST]
    min_gap_mm: 30
    severity: fail
    why: The governing pair is expected to be the Street Triple's right bar end against the Tuareg's fairing and radiator shrouds (half-width estimate 300 mm).
  - id: CLR-04
    title: Each bike to partitions and side walls, door closed
    type: clearance
    each: [TU, ST]
    b: ["1", "2", "3", C2, C3, C4]
    min_gap_mm: 15
    severity: fail
    why: Bars, pegs and tyres must not touch the partitions, the walls or the closed garage door.
  - id: CLR-05
    title: Mattress top plus 50 mm bedding
    type: height
    a: ["9"]
    add_mm: bedding_allowance
    max_z: ceiling_z
    severity: fail
    why: With the roof collapsed the bedding must fit under the 1,800 mm ceiling.
  - id: CLR-06
    title: Tuareg rear-most point to the closed door's inner face (owner's 2,220 mm length)
    type: clearance
    a: [TU]
    b: [C4]
    min_gap_mm: 15
    severity: fail
    why: The bike's tail and plate hanger must clear the closed kerb-side door.
  - id: CLR-06b
    title: Tuareg rear-most point to the closed door with the photo-measured 2,263 mm length
    type: clearance
    a: [TU-2263]
    b: [C4]
    min_gap_mm: 15
    severity: report
    why: Reported, not a build failure (DESIGN.md). Aprilia's image shows the plate hanger at least 1,915 mm behind the front axle.
  - id: CLR-07
    title: Ladder foot to the living-area floor
    type: landing
    a: ["18"]
    b: [C1, C7]
    min_gap_mm: 0
    max_gap_mm: 10
    severity: fail
    why: Added in revision B. The owner-built ladder hooks on the deck edge and must reach the living-area floor, taken level with the garage floor. A foot more than 10 mm up leaves the ladder hanging, and a foot below the floor means the ladder cannot stand at the 15 degree lean.
  - id: CON-01
    title: Chock bases, L-track and floor touch without overlap, beams sit on ledgers and the deck sits on beams and on partition B
    type: contact
    pairs:
      - [10.TU, C1]
      - [10.ST, C1]
      - [11.front, C1]
      - [11.rear, C1]
      - [10.TU, 11.front]
      - [10.ST, 11.front]
      - ["6.1", 5.on-A]
      - ["6.1", 5.on-B]
      - ["6.2", 5.on-A]
      - ["6.2", 5.on-B]
      - ["6.3", 5.on-A]
      - ["6.3", 5.on-B]
      - ["6.4", 5.on-A]
      - ["6.4", 5.on-B]
      - ["6.5", 5.on-A]
      - ["6.5", 5.on-B]
      - ["7", "6.1"]
      - ["7", "6.2"]
      - ["7", "6.3"]
      - ["7", "6.4"]
      - ["7", "6.5"]
      - ["7", "2"]
    tolerance_mm: 0.01
    severity: fail
    why: Parts that carry load must touch their supports, and no two solids may overlap.
