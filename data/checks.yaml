# Checks for the trailer. The bike garage's clearance, restraint and contact checks moved to the ute's bike box with
# the bikes (data/ute/garage-checks.yaml, UTE-GARAGE.md), so the trailer has no placed module and no module checks.
# severity: fail (a failure is a design failure) or report (the value is reported, never a failure).
# Limits are never changed to make a check pass.
checks: []

# Whole-trailer checks (TRAILER.md), measured on the block layout in assemblies/trailer.yaml by cad/trailer.py.
# Masses with growth carry the MASS-06 allowance (estimate +20 %, calculated +7 %, spec 0 %).
# The tow vehicle is the LandCruiser 79 (data/ute/ute.yaml, research report 16). Its towbar is rated 350 kg. H14
# (21 Nov 2026) replaced the plan's 250 kg towball cap with the rule it stood for: in every case the towball keeps the
# ute's rear axle within its rating with growth, computed from the ute model at that ball load. H17 put the Lovells Elite
# kit on the ute, and H18 plates its rear axle at 2,800 kg, twice the shared wheel's 1,400 kg. H17 also set the design
# towball range the axle solve uses: at least 9.0 % in every case and at most 420 kg with growth since the DO45 (23 Nov
# 2026), 8.0 % and 320 kg before. H2 sets the 7.5 %
# floor and the plate, 4,000 kg since 23 Nov 2026. VSB1 sets no towball share. Limits here are never changed to make a check pass.
# The services checks SVC-01 to SVC-12 (H28: clearance, bend radii, 230 V segregation, the battery's terminal face,
# coverage, voltage drop, falls, the runs' spacing, the glands' room, then the cables' ratings, heat and supports) are defined beside the runs in data/routes.yaml `checks`, with their sources, and
# measured by cad/routes.py. The trailer's build adds their rows to these checks' results (build/trailer/trailer.json).
trailer_checks:
  - id: MAS-01
    title: Trailer mass with growth within the 4,000 kg plated ATM
    type: mass
    quantity: mass
    limit: plated_atm
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Decision H2, amended 23 Nov 2026, plates the ATM at 4,000 kg, inside the Ranger Super Duty's 4,500 kg braked towing and the DO45's 4,500 kg, so it covers every case with the growth allowance.
  - id: MAS-10
    title: Trailer mass with growth at most 3,900 kg in every case (design target)
    type: mass
    quantity: mass
    basis: growth
    cases: all
    max: 3900
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Decision H2 keeps 100 kg of the 4,000 kg plate in reserve for the estimates. H13 holds it with the travel limit on water, and H21 takes any excess off the water.
  - id: MAS-02
    title: Axle group load with growth within the kit's GTM, times 1.2 for VSB1's 120 % rule unless the tandem shares load
    type: mass
    quantity: axle_vsb1
    limit: kit_gtm
    basis: growth
    cases: all
    severity: fail
    inputs: [SUP-01, SUP-02, TW-01, TW-02, TW-03]
    why: "VSB1 Rev 6 (axles and suspension) asks the axles of a close-coupled group that does not share load to carry 120 % of their load at ATM. At the 4,000 kg plate that needs 4,440 kg of the XT Air build's 4,050 kg, so the XT Air is ordered in Cruisemaster's load-sharing tandem configuration (CIS-006, params load_sharing), each side's two bags on one circuit, and the check takes the axle group load itself. The kit's GTM is Cruisemaster's figure for the 4,500 kg XT Air build."
  - id: MAS-03
    title: Towball keeps the ute's rear axle within its 2,800 kg plate with growth and stays within the 350 kg towbar, in every case
    type: towball_ute
    basis: growth
    cases: all
    severity: fail
    inputs: [UTE-02, TW-01, TW-02, TW-03]
    why: Decision H14, with the Elite kit's rear axle (H17). The ute model gives its rear axle load with the bikes aboard (UC2, with growth) and how much each kilogram on the ball adds to it (UC3 against UC2). The Hayman Reese bar, the 79's rating and the DO35 allow 350 kg.
  - id: MAS-03B
    title: The ute's towing cases carry at least the trailer's heaviest towball with growth
    type: towball_ute_input
    basis: growth
    cases: all
    severity: fail
    inputs: []
    why: The ute builds first and its towing cases (UC3, UC4) carry the trailer's heaviest towball as cad/towball.py solves it. The ute's own checks (UTE-01 to UTE-12) hold only if no trailer case puts more on the ball.
  - id: MAS-04
    title: Towball load at least 7.5 % of the trailer's mass in every travel case (design target)
    type: mass
    quantity: towball_pct
    basis: both
    cases: all
    min: 7.5
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Decision H2 sets 7.5 % in every case for a stable trailer. Every case here is one the trailer may be towed in.
  - id: MAS-05
    title: The towball window is open, so an axle position meets both of H17's towball targets (design rule)
    type: axle_window
    min: 0
    severity: fail
    inputs: []
    why: Decision H17. The axle solve sets the axle in the middle of the window between the position where the lightest case reaches 9.0 % on the ball and the one where the heaviest towball with growth reaches 420 kg (data/load_cases.yaml axle_window). A window under 0 mm means no axle position meets both.
  - id: MAS-12
    title: Towball load at least 9.0 % of the trailer's mass in every case (H17 design target)
    type: mass
    quantity: towball_pct
    basis: both
    cases: all
    min: 9.0
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Decision H17 asks for a towball well clear of H2's 7.5 % floor (MAS-04), because the masses are still estimates. 9.0 % since the 4,000 kg plate (8.0 % before), towards the 10 % Ford's towing guide aims at.
  - id: MAS-13
    title: Towball load at most 420 kg with growth in every case (H17 design target)
    type: mass
    quantity: towball
    basis: growth
    cases: all
    max: 420
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Decision H17 at the DO45 (23 Nov 2026). The DO45 allows 450 kg on the ball and the Ranger Super Duty 450 kg (est., 10 % of its 4,500 kg braked towing), so 420 kg keeps H17's 30 kg in hand. It was 320 kg under the 79's, the towbar's and the DO35's 350 kg.
  - id: MAS-14
    title: Platinum return, cut CUT7. The ute's rear axle without growth at the trailer's heaviest towball, on the Platinum, at least 30 kg under 2,550 kg (reported)
    type: platinum_return
    severity: report
    inputs: [UTE-03]
    why: Decision H17. The plan buys the Elite kit. Cut CUT7 takes the Platinum back if the S3 weighing leaves at least 30 kg under its 2,550 kg rear axle at the trailer's weighed towball. This row is the model's forecast of that weighing.
  - id: MAS-06
    title: Tyre load on the heavier side, with VSB1's 120 % rule, within the tyre's rating
    type: mass
    quantity: tyre_load_side
    limit: tyre_rating
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: LT265/75R16 123/120, 1,550 kg per tyre (report 16, the LandCruiser's size when chosen; the Super Duty's 8-stud 18 in wheels share nothing with it). 1.2 times the heavier side's share of the axle group load over its two tyres, from the lateral centre of gravity.
  - id: MAS-07
    title: Axle group load with growth within the NSW examiner's GTM cap
    type: mass
    quantity: axle
    limit: nsw_gtm_cap
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The NSW examiner caps GTM at the lowest of the tyre, coupling, chain and brake ratings (report 02 section 2.1).
  - id: MAS-08
    title: Trailer mass with growth within the NSW examiner's ATM cap
    type: mass
    quantity: mass
    limit: nsw_atm_cap
    basis: growth
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The examiner caps ATM at the lower of the coupling and chain ratings (report 02 section 2.1).
  - id: MAS-09
    title: Wheel load rating covers VSB1's 120 % rule on the heavier side with growth
    type: mass
    quantity: tyre_load_side
    limit: wheel_rating
    basis: growth
    cases: all
    severity: fail
    inputs: [WHL-01, TW-01, TW-02, TW-03]
    why: The ROH Trak 2 16 x 7 ET 0 is rated 1,400 kg (measurements.yaml WHL-01), the ute's wheel.
  - id: COU-01
    title: The combination's D-value and V-value within the DO45's 24.5 kN and 14.5 kN (ADR 62/02 12.3.3)
    type: coupling_dv
    severity: fail
    inputs: []
    why: "Over 3.5 t ATM ADR 62/02 rates a coupling by its D-value and V-value, and the DO45 Plus is marked D 24.5 kN and V 14.5 kN. AS 2213.1 clauses 6 and 7 (and UN R55) give the combination's own values: D = 9.81 T R / (T + R) from the tow vehicle's GVM T and the trailer's ATM R in tonnes, and V = a X2/l2 C for a rigid drawbar trailer, with a = 2.4 m/s2 (ADR 62/02 8.1.2), X the body's length, l the ball to the axle group, X2/l2 at least 1, and C the axle group at the plate in tonnes."
  - id: MAS-11
    title: Lateral centre of gravity within 50 mm of the centreline in every case
    type: lateral
    max: 50
    basis: both
    cases: all
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: The battery plinth, washer and dryer sit on the kerb side. 50 mm is an estimated rule from the layout study. MAS-06 and MAS-09 check each side's wheels.
  - id: STB-01
    title: Static rollover threshold at least 0.35 g in every case (PBS level 1, estimate)
    type: rollover
    min: 0.35
    severity: fail
    inputs: [TR-01]
    why: The lateral acceleration at which the inner wheels lift, with the body rolled on its air springs, bump stops and tyres (Gillespie 1992 chapter 9, data/assemblies/trailer.yaml `stability`). 0.35 g is the National Transport Commission's Performance Based Standards level 1 for heavy vehicles, the nearest published rule. The air spring and tyre rates are estimates, the bump stop gap Cruisemaster's.
  - id: STB-02
    title: Static rollover threshold against a 0.40 g target (reported)
    type: rollover
    min: 0.40
    severity: report
    inputs: [TR-01]
    why: A margin over PBS level 1 while the masses and the centre of gravity height are estimates. TR-01 measures the height.
  - id: STB-03
    title: Yaw inertia and the lowest towball share, for sway (reported)
    type: yaw
    severity: report
    inputs: [TW-04, TW-05]
    why: A heavy rear and a light towball make a trailer more prone to snaking. The model gives the yaw inertia and the share. The Bosch TSC brakes the trailer when it senses sway (TRAILER.md).
  - id: STB-04
    title: Side wind that overturns the parked trailer, unhitched on its corner steadies, at tare and fully loaded (reported)
    type: overturn
    cases: [TC1, TC2]
    severity: report
    inputs: [TR-01, TW-04, TW-05]
    why: Decision H23. The trailer tips about its leeward wheels when the wind's moment on its side silhouette passes its weight's, and slides when the push passes the tyres' and steadies' friction on wet grass, 0.35 (est.). Both take the same force coefficient, ASCE 7-16's for a solid sign of these proportions, the high side for a box (data/assemblies/trailer.yaml `stability` `overturn`), and the lower speed is the headline (F4-07). The speed is the gust at the trailer, and the forecast gust is that over 0.91, the factor from 10 m to 3 m in open country. The operating rule's forecast gust is the lower speed's over the square root of 1.5, rounded down to 5 km/h, so the wind's force keeps a factor of at least 1.5 against both (TRAILER.md, CT-003), and STB-05 checks the tie-downs.
  - id: STB-05
    title: Tie-downs hold the parked trailer at region B's 500-year gust, against tipping and sliding
    type: tie_down
    cases: [TC1, TC2]
    severity: fail
    inputs: [TR-01]
    why: "Decision H23, F3-03 and F4-03. With the ute away the trailer can be neither hitched nor moved, so four rated lashing points under the outrigger ends (CH-B02) take 50 mm ratchet straps down and out at 48 to 55 degrees, 3 degrees clear of the listing's 45 degree minimum (F6-02), to ground anchors installed as their listing tested them, each with a stabilizer plate on the trailer side of its rod (24 CFR 3285.402, F5-01). The kit rides in the ute while towing and stays with the trailer whenever the ute is unhitched for more than a day. The windward pair holds the trailer against tipping and, with the tyres' friction on wet grass, against sliding, in region B's 500-year gust at 3 m in terrain category 2, 57 m/s times 0.91, 51.9 m/s, with STB-04's Cf of 1.6. Each strap's tension is checked against the strap's lashing capacity, the D-ring's working load limit, the outrigger in bending at its yield over 1.5, and the anchor at its listed working load in the listed installation, which carries a factor of 1.5 to its ultimate load. A torque probe at the helix depth measures the soil at each anchor's place against the anchor's minimum probe value. There is no pull test: the probe measures the soil class the listing rates the anchor in, and a pull to its working load needs a test rig the kit does not carry. So each anchor is wound into undisturbed soil, never dug in and backfilled, because Tie Down warns that loose soil may then need a test of the anchor's holding power (F6-01)"
  - id: GCM-01
    title: Ute and trailer within the 7,400 kg GCM with Lovells' revision
    type: gcm
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: GCM is the ute's mass plus the trailer's (report 16 section 2.4). Decision H2 takes Lovells' 7,400 kg GCM revision, which Lovells rates for the 4,495 kg Elite kit of H17 too. Decision H20 sets the one sum, UTE-06's, the ute with the bikes aboard and growth (UC2) plus the trailer's plate. If the revision is refused, Toyota's 6,900 kg less that ute sets the trailer's plate, and the travel water is cut so the heaviest case with growth stays under it.
  - id: TBS-01
    title: Towball scale reading within 10 % of the model, fully loaded (reported)
    type: towball_scale
    tolerance: 0.10
    severity: report
    inputs: [UTE-03]
    why: Reported until the trailer exists. A reading more than 10 % off the model means a mass line or its position is wrong.
  - id: FIT-01
    title: The body holds its items and keeps the door landings, the desk's chair space, the aisle and the wet room's walk band clear
    type: fit
    zone: inside
    severity: fail
    inputs: []
    why: Every block inside the body must sit inside it without overlapping another, and no solid item may stand in a keep-clear space (TRAILER.md). The bed is up, as it travels.
  - id: FIT-03
    title: Fresh, grey and diesel tanks and the XT Air box fit between the rails and the crossmembers
    type: fit
    zone: underfloor
    severity: fail
    inputs: []
    why: The fresh tanks sit in the two suspension bays, the grey tank in the rear bay under the grey-bay crossmember and the diesel tank ahead of the XT front hinge, clear of every crossmember and fitting.
  - id: FIT-04
    title: The sealed drawbar box holds the two generators, the jerry cans and the shelf
    type: fit
    zone: drawbar_box
    severity: fail
    inputs: []
    why: The petrol rides outside the body in a sealed, vented box behind the stone guard (decision log 12:45), so no petrol vapour can reach the living area or the air-conditioner under the bed.
  - id: FIT-06
    title: The bed in its night position clears the desk, the chair space and every other item
    type: fit
    zone: inside
    state: {bed_state: 1}
    severity: fail
    inputs: []
    why: H1. The layout is evaluated a second time with the bed lowered to its night stop (bed_state 1), 75 mm above the desk top.
  - id: FIT-07
    title: Wall members clear of every opening, gland, insert strip and each other by 25 mm, and no side-wall bay wider than their pitch
    type: body_members
    severity: fail
    inputs: []
    why: "F3-02. The side walls' members (BD-18, BD-19, BD-20, LB-06) are laid into the panels as they are made. Each stands at least 25 mm from every cut-out, gland and insert strip on its wall, the bench's, the tower's and the lockers' strips included, so the panel maker can rout its channel with XPS between, and with the kitchen tower's sides, the partition and the end walls they keep every bay within the 1,067 mm pitch BDY-06 and BDY-10 take (data/body/body.yaml `members_rule`). The exception (F4-02): at W1's and W2's sides an S4's frames clamp the panel, so a bonded insert fills the core from the cut-out to the hardpoint, at least 20 mm, in the hardpoint's own routed channel. Member to member the rule is the same 25 mm, or one routed channel for both with an H200 fill bonded between them, so no thin fin of XPS is left to rout (F5-03). BD-20 and the bed's rear kerb-side hardpoint, 16.5 mm apart, are the one such pair, listed in `shared_channels`"
  - id: BED-01
    title: Lift bed heights meet H1 by day and by night
    type: bed
    severity: fail
    inputs: []
    why: H1. By day the platform's underside is at least 1,600 mm above the floor, so a seated 95th percentile adult clears it. By night the mattress top is 950 to 1,050 mm up with at least 900 mm clear above it, and the platform stops at least 40 mm above the desk top.
  - id: BED-02
    title: Lift bed at night within the HappiJac's 272 kg static rating, and the bed alone within its 204 kg moving rating
    type: bed_load
    severity: fail
    inputs: []
    why: "Lippert's manual ccd-0002668 rates the HappiJac at 272 kg static and 204 kg while it moves (research report 21). At night it holds the 64 kg moving bed and two sleepers taken at 100 kg each (data/body/body.yaml). It moves with nobody on it."
  - id: FIT-05
    title: Tyres swung through their full travel keep 50 mm from every chassis member
    type: tyre
    min_gap_mm: 50
    severity: fail
    inputs: []
    why: Report 06 open question 9 and report 11 section 5. The arc follows the XT arm about its pivot.
  # ---------------------------------------------------------------- chassis and drawbar (CHASSIS.md, report 11)
  - id: CHS-01
    title: Chassis stress, LC1 static at ATM, within fy / 3
    type: chassis_stress
    load_case: LC1
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 11 LC1. The ARTSA factor of safety of 3 on yield (report 02 section 2.4). Every member, every trailer case scaled so the heaviest sits at the plated ATM, 4,000 kg.
  - id: CHS-02
    title: Chassis stress, LC2 vertical bump 3 g, below yield
    type: chassis_stress
    load_case: LC2
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 11 LC2. A 3 g bump on the structure must not yield any member.
  - id: CHS-03
    title: Chassis stress, LC3 braking 0.8 g plus 1 g, within fy / 1.5
    type: chassis_stress
    load_case: LC3
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 02 and report 11 LC3, with the trailer's own brakes taking the braking force at the tyres.
  - id: CHS-04
    title: Chassis stress, LC4 cornering 0.5 g either way plus 1 g, within fy / 1.5
    type: chassis_stress
    load_case: LC4
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 02 and report 11 LC4. Governs the hinge crossmembers and the outriggers.
  - id: CHS-05A
    title: Chassis stress, LC5a twist with one wheel in a hole, within fy / 1.5
    type: chassis_stress
    load_case: LC5a
    severity: fail
    inputs: [TW-01, TW-02, TW-03]
    why: Report 11 LC5a, 13.4 kNm between the axles on top of the static load.
  - id: CHS-05B
    title: Chassis stress, LC5b twist on the corner steadies at tare, within fy / 1.5
    type: chassis_stress
    load_case: LC5b
    severity: fail
    inputs: []
    why: Report 11 LC5b. One ARK DDS650 steady wound to its 875 kg rating with the other three touching.
  - id: CHS-06
    title: Chassis and drawbar stress, LC6 VSB1 9.1 drawbar forces, below yield
    type: chassis_stress
    load_case: LC6
    severity: fail
    inputs: []
    why: VSB1 9.1 and 14, ADR 62/02 14.2, at the 4,000 kg plate. 58.9 kN along, 19.6 kN across and 19.6 kN up and down at the coupling (1.5, 0.5 and 0.5 times the ATM's weight), each way, with the body held at its suspension mounts. No residual deformation, so the check is elastic.
  - id: CHS-06B
    title: Drawbar stress, LC6b VSB1 9.2.2 chain point forces, below yield
    type: chassis_stress
    load_case: LC6b
    severity: fail
    inputs: []
    why: VSB1 9.2.2 and ADR 62/02 14.4.2 at the 4,000 kg plate. 39.2 kN along and 19.6 kN up and down at each chain lug (1.0 and 0.5 times the ATM's weight), separately.
  - id: CHS-08A
    title: Chassis stress, LC8a recovery at 58.9 kN within 30 degrees sideways and 15 degrees up or down, below yield
    type: chassis_stress
    load_case: LC8a
    severity: fail
    inputs: []
    why: Report 11 LC8a, 1.5 times the plated ATM's weight (58.9 kN at 4,000 kg), at each front and rear recovery point, with the body held at its suspension mounts.
  - id: CHS-08B
    title: Chassis stress, LC8b one side jacked at its pad with gravity times 2, below yield
    type: chassis_stress
    load_case: LC8b
    severity: fail
    inputs: []
    why: Report 11 LC8b. The jack lifts one side at the pad on the XT centre crossmember.
  - id: LOC-01
    title: Chain lugs hold the VSB1 9.2.2 forces (net tension, bearing, tear-out, weld)
    type: chassis_local
    item: chain_lug
    severity: fail
    inputs: []
    why: VSB1 9.2.2. Plate limits are fy (bearing 1.5 fy, tear-out shear 0.6 fy) so the lug does not deform. The weld limit is the SP fillet capacity, 0.8 x 0.6 x 490 MPa.
  - id: LOC-02
    title: Front recovery lugs hold 58.9 kN without yield and 78.5 kN without fracture
    type: chassis_local
    item: front_recovery
    severity: fail
    inputs: []
    why: Report 11 LC8a. A 30 degree sideways pull bends the lug out of its plane.
  - id: LOC-03
    title: Rear recovery tongues hold 58.9 kN without yield and 78.5 kN without fracture
    type: chassis_local
    item: rear_recovery
    severity: fail
    inputs: []
    why: Report 11 LC8a. A 30 degree sideways pull bends the tongue out of its plane.
  - id: LOC-04
    title: Jacking pads carry the jack without yield or crushing the wall
    type: chassis_local
    item: jacking_pad
    severity: fail
    inputs: []
    why: Report 11 LC8b, 60 % of the axle group at the plate on one pad, times 2, 43.6 kN at 4,000 kg with the 7.5 % ball, or the larger force the frame analysis gives.
  - id: LOC-05
    title: Spare carrier posts carry the spare wheel at 4 g down and 1.6 g forward
    type: chassis_local
    item: spare_posts
    severity: fail
    inputs: []
    why: Report 11 LC2 (4 g on fixings) and LC7 (0.8 g forward times 2 off road, fy / 1.5).
  - id: LOC-06
    title: Corner steady brackets carry the steady's 875 kg rating at 90 degrees (welds and the rail's webs)
    type: chassis_local
    item: steady_bracket
    severity: fail
    inputs: []
    why: "ARK's XO fitting guide (RTC614 V1 1/21) rates each steady at 875 kg at 90 degrees, its only jacking position, and has its chassis mount bracket welded to the chassis. The welds run along the rail's bottom corners only (Cruisemaster TB 070), at the SP fillet capacity, 0.8 x 0.6 x 490 MPa, and the rail's two 3 mm webs bear the load over the bracket's length plus 5 t at fy / 1.5, LC5b's criterion."
  - id: LOC-07
    title: The coupling plate and the DO45's four M14 8.8 bolts hold VSB1 9.1's drawbar forces at the plate (shear, tension, both, bearing)
    type: chassis_local
    item: coupling_plate
    severity: fail
    inputs: []
    why: "VSB1 Rev 6 9.1 and ADR 62/02 14.2 at the 4,000 kg plate, each force separately. AS 4100 9.3.2: a bolt's shear capacity 0.8 x 0.62 fuf on its minor diameter area with the threads in the shear plane, its tension 0.8 fuf on its stress area, and the two together within a circle. The pull's lever from the pin to the plate lifts one row of bolts."
  - id: CHS-09
    title: Holes the runs make in the rails and raisers, net section in LC1 to LC8b within each case's limit
    type: chassis_local
    item: holes
    severity: fail
    inputs: []
    why: "Review I2-27. Every hole in data/services.yaml `holes`, at its section of the composite rail with the hole taken out of the wall it is in (a seam hole out of both walls): the combined stress at the hole's edge in each of LC1 to LC8b against that case's limit, fy over its factor, or 0.85 fu over it where that is lower (AS 4100 clause 7.2's net-section term, kt 1). The rails take the raiser's 350 MPa, as CHS-01 to CHS-08B do."
  - id: CHS-10
    title: Holes the runs make in the rails and raisers, placed clear of the tubes' corners and the welds, and their fatigue
    type: chassis_local
    item: hole_places
    severity: fail
    inputs: []
    why: "Review I2-27. Each hole's centre at least 1.25 d from the end of its face's flat, where the corner radius starts, and 1.5 d from the member's sawn end (AS 4100 Table 9.6.2, a rolled and a sawn edge), and its edge at least one hole diameter from every weld toe and the larger diameter from another hole, where Kirsch's solution for a hole in a plate puts the hole's stress field within 8 % of the nominal stress. The frequent range at the hole's edge, 3.0 times the net section's (Kirsch), within the CAFL of IIW-1823-07 Table 3.2-1 no. 121, a machine-cut edge dressed, FAT 140, 81.9 MPa, and the occasional range's Miner damage at most 0.5 (report 11 section 3.4). Reported, not failed, because the holes are the services' (data/services.yaml) and CHASSIS.md lists the moves they need. It becomes a fail check once they are made."
  - id: DEF-01
