    max: 460
    severity: fail
    inputs: [UTE-01]
    why: VSB1 9.3.2. The decision log sets the ute's ball at 440 mm laden, plus or minus 20 mm, so the coupling stays under 460 mm.
  - id: DIM-04
    title: Running clearance at least 100 mm, unladen (VSB1 5.4)
    type: clearance_ground
    min: 100
    severity: fail
    inputs: [UTE-01]
    why: Every part carried by the suspension needs 100 mm of running clearance. The arms, hubs and wheels are not carried by it.
  - id: JK-01
    title: Everything that stands above the bike box's underside clears its sweep by 100 mm at any jack-knife angle
    type: jackknife
    min_gap_mm: 100
    severity: fail
    inputs: [UTE-02]
    why: The ute's bike box overhangs the ball, so its rear corners sweep a circle about the ball as the trailer swings (build/ute/ute.json, from the U2 model). Any trailer part higher than the box's underside must stay outside that circle. 100 mm allows for the ball position, which is not yet measured (UTE-02).
  - id: JK-02
    title: Everything inside the bike box's sweep stays 50 mm below its underside
    type: jackknife_height
    min_gap_mm: 50
    severity: fail
    inputs: [UTE-01, UTE-02]
    why: The coupling, chains, drawbar members and stone guard sit inside the box's sweep, so they must pass under it. 50 mm allows for the ute's pitch as it squats on the ball (assumption, TRAILER.md).

