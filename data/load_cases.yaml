# Whole-trailer load cases (TRAILER.md, report 18 section 3.2). The bikes ride in the ute's box (UTE-GARAGE.md), so
# no case carries a bike or ballast. `water_l` is an expression over the trailer parameters. `load` lists the payload
# tags carried (assemblies/trailer.yaml): fuel (the heater's diesel and the jerry cans in the drawbar box) and gear
# (food, clothes and other gear). All 400 L of water ride in the trailer. Every case here is one the trailer may be
# towed in, so every one is a travel case for the towball checks.
trailer_cases:
  - id: TC1
    name: Tare as built
    aboard: Trailer as built, empty tanks, no fuel or gear
    water_l: 0
    load: []
  - id: TC2
    name: Travel fully loaded
    aboard: 400 L of water, fuel and gear
    water_l: water_full_l
    load: [fuel, gear]
    towball_target: true
  - id: TC3
    name: Highway travel
    aboard: 50 L of water, fuel and gear
    water_l: water_highway_l
    load: [fuel, gear]
  - id: TC4
    name: Water full, no gear
    aboard: 400 L of water and fuel, no gear
    water_l: water_full_l
    load: [fuel]
  - id: TC5
    name: Tanks empty, gear aboard
    aboard: No water, fuel and gear
    water_l: 0
    load: [fuel, gear]
  - id: TC6
    name: Tanks empty, no gear
    aboard: No water, fuel only
    water_l: 0
    load: [fuel]

# The axle solve puts this much on the ball fully loaded (TC2) on base weights: 220 kg, the middle of the decision
# log's 200 to 250 kg band, so the growth allowance can add up to about 30 kg before MAS-03's 250 kg cap.
towball_target_kg: 220

# Registration (report 02 section 2.1). NSW, with Victoria as the fallback. The NSW examiner caps GTM at the
# lowest of the tyre, coupling, chain and brake ratings and ATM at the lower of the coupling and chain ratings.
registration:
  state: NSW
  fallback: Victoria
  plated_atm_kg: {v: 3100, src: "Decision log 12:10 UTC: it holds the heaviest case with growth, and the GCM stays inside 6,900 kg with the ute at 3,850 kg"}
  ratings:
    tyre_kg: {v: 1550, src: "LT265/75R16 123/120 load range E, load index 123, per tyre, four tyres (report 16, the ute's tyre)"}
    coupling_kg: {v: 3500, src: "Cruisemaster DO35 V3Plus, ADR rated 3,500 kg (report 08)"}
    chains_kg: {v: 3500, src: "Two safety chains marked 4177-35 (report 08)"}
    brakes_kg: {v: 4500, src: "Cruisemaster A/T 12 inch electric drums, 4.5 t tandem capacity (report 06)"}

# The tow vehicle: the LandCruiser 79 single cab V8 with the Lovells 4,200 kg GVM kit and its bike box. Its limits are
# in data/ute/ute.yaml and its masses and the bike box's sweep come from the ute model (build/ute/ute.json, cad/ute.py
# and cad/ute_garage.py). The Cayenne of report 07 is no longer the tow vehicle (reports 14 to 16 replace 07 and 10).
tow_vehicle:
  name: Toyota LandCruiser VDJ79 GXL single cab V8, Lovells 4,200 kg GVM kit, with the bike box
  data: data/ute/ute.yaml
  model: build/ute/ute.json
  gcm_case: UC2          # the ute with the bikes aboard and no towball, added to the trailer's own mass
