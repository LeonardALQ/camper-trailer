# Load cases from DESIGN.md (Mass). `include` selects BOM groups or tags. Bikes are payload items.
# removable = the kit that can stay home with the bikes: chocks, straps, loops, harness, ramp, winch (BOM.md).
load_cases:
  - id: LC1
    name: Module with the removable kit fitted, no bikes
    module: all
    bikes: []
  - id: LC2
    name: Both bikes in
    module: all
    bikes: [TU, ST]
  - id: LC3
    name: Bikes out, removable kit taken out
    module: fixed_only
    bikes: []
  - id: LC4
    name: Tuareg only
    module: all
    bikes: [TU]
  - id: LC5
    name: Street Triple only
    module: all
    bikes: [ST]
towball:
  computable: false
  note: The module's towball load needs the coupling and axle positions, so it is worked out for the whole trailer (TC cases below and TRAILER.md, MASS-04).

# Whole-trailer load cases (TRAILER.md). The module rows follow the module cases above. `water_l` is an
# expression over the trailer parameters. `load` lists the payload tags carried (assemblies/trailer.yaml):
# gas (LPG in the bottles), fuel (jerry cans), gear (food, clothes, other gear) and luggage (the Tuareg's
# panniers, carried only when the Tuareg is). The removable kit is fitted in the tare case, as built.
# Every case here is one the trailer may be towed in, so every one is a travel case for the towball checks.
trailer_cases:
  - id: TC1
    name: Tare as built
    aboard: Trailer as built with the removable kit fitted, empty tanks and bottles, no bikes or gear
    module: all
    bikes: []
    water_l: 0
    load: []
  - id: TC2
    name: Travel fully loaded
    aboard: Both bikes with their kit, water tanks full, gas, fuel and gear
    module: all
    bikes: [TU, ST]
    water_l: water_full_l
    load: [gas, fuel, gear, luggage]
    towball_target: true
  - id: TC3
    name: Highway travel
    aboard: As fully loaded, with 50 L of water
    module: all
    bikes: [TU, ST]
    water_l: water_highway_l
    load: [gas, fuel, gear, luggage]
  - id: TC4
    name: Bikes and kit out, water full
    aboard: No bikes and no removable kit, water tanks full, gas, fuel and gear
    module: fixed_only
    bikes: []
    water_l: water_full_l
    load: [gas, fuel, gear]
  - id: TC5
    name: Bikes out, tanks empty
    aboard: No bikes and no removable kit, water tanks empty, gas, fuel and gear aboard
    module: fixed_only
    bikes: []
    water_l: 0
    load: [gas, fuel, gear]
  - id: TC6
    name: Tuareg only
    aboard: Tuareg with its panniers, all the kit, water full, gas, fuel and gear
    module: all
    bikes: [TU]
    water_l: water_full_l
    load: [gas, fuel, gear, luggage]
  - id: TC7
    name: Street Triple only
    aboard: Street Triple, all the kit, water full, gas, fuel and gear
    module: all
    bikes: [ST]
    water_l: water_full_l
    load: [gas, fuel, gear]

towball_target_kg: 220   # report 07: about 220 kg fully loaded, set by the car's rear axle and GVM

# The tow vehicle, 2013 Porsche Cayenne GTS (report 07). Values the car's rear axle check needs, with their basis.
car:
  name: 2013 Porsche Cayenne GTS (958)
  towball_rating_kg: {v: 280, src: "Porsche Australia, confirmed by the owner (report 07)"}
  braked_towing_kg: {v: 3500, src: "Porsche (report 07)"}
  gvm_kg: {v: 2840, src: "Porsche Australia (report 07)"}
  gcm_kg: {v: 6340, src: "Read from the car by the owner (report 07)"}
  front_axle_limit_kg: {v: 1520, src: "Read from the car by the owner (report 07)"}
  rear_axle_limit_kg: {v: 1600, src: "Read from the car by the owner (report 07)"}
  kerb_kg: {v: 2085, src: "Porsche DIN kerb mass, standard car (report 07)"}
  payload_kg: {v: 755, src: "GVM less DIN kerb mass (report 07)"}
  wheelbase_mm: {v: 2895, src: "Porsche Australia (report 07)"}
  body_width_mm: {v: 1939, src: "Report 07"}
  rear_overhang_mm: {v: 980, src: "Rear axle to bumper, Transport Canada data (report 08 section 1.4)"}
  ball_behind_axle_mm: {v: [1060, 1230], src: "Estimate until the towbar is fitted (report 08 section 1.4)"}
  # Report 07 load budget assumptions, replaced by weighbridge figures later
  budget:
    front_share_of_kerb: {v: 0.54, src: "Report 07 assumption, no published figure"}
    occupants_kg: {v: 160, src: "Two adults (report 07)"}
    occupants_behind_front_axle_mm: {v: 1150, src: "Report 07 assumption"}
    towbar_kg: {v: 30, src: "Report 07 estimate"}
    rear_seats_out_kg: {v: 50, src: "Rear seats removed (report 07 estimate)"}
    gear_behind_front_axle_mm: {v: 2000, src: "Gear on the floor where the rear seats were (report 07 assumption)"}
    ball_behind_axle_mm: {v: 1100, src: "Report 07 load budget assumption"}
