# Whole-trailer load cases (TRAILER.md). The bikes ride in the ute's box (UTE-GARAGE.md), so no case carries a bike or
# ballast. `water_l` is the fresh water in the tanks, an expression over the trailer parameters. `load` lists the
# payload tags carried (assemblies/trailer.yaml): fuel (the heater's diesel and the jerry cans in the drawbar box),
# gear (food, clothes and other gear, 150 kg) and grey (130 L in the grey tank). H13 and H21 as amended 23 Nov 2026: at
# most 400 L of fresh and grey water ride while towing, the fresh tanks' whole net with the grey tank empty (I2-40), or less fresh
# water with grey water aboard. The grey tank is empty for travel except in TC7 and TC8, which must still pass every limit. Every case here is one the trailer may be towed in, so every one
# is a travel case for the towball checks.
trailer_cases:
  - id: TC1
    name: Tare as built
    aboard: Trailer as built, empty tanks, no fuel or gear
    water_l: 0
    load: []
  - id: TC2
    name: Travel fully loaded
    aboard: 400 L of fresh water, the full tanks and the travel limit (H13 and H21), fuel and gear
    water_l: water_travel_l
    load: [fuel, gear]
    towball_target: true
  - id: TC3
    name: Highway travel
    aboard: 50 L of water, fuel and gear
    water_l: water_highway_l
    load: [fuel, gear]
  - id: TC4
    name: Water at the travel limit, no gear
    aboard: 400 L of fresh water and fuel, no gear
    water_l: water_travel_l
    load: [fuel]
  - id: TC5
    name: Tanks empty, gear aboard
    aboard: No water, fuel and gear
    water_l: 0
    load: [fuel, gear]
  - id: TC6
    name: Tanks empty, no gear
    aboard: No water, fuel only
    water_l: 0
    load: [fuel]
  - id: TC7
    name: Grey tank full, at the travel limit
    aboard: 130 L of grey water and 270 L of fresh water (400 L in all, H13 and H21), fuel and gear
    water_l: water_travel_l - grey_full_l
    load: [fuel, gear, grey]
  - id: TC8
    name: Grey tank full, fresh tanks empty
    aboard: 130 L of grey water, fuel and gear
    water_l: 0
    load: [fuel, gear, grey]

# The axle solve's design targets (decision H17, cad/trailer.py). The axle sits in the middle of the window between the
# position where the lightest case has 9.0 % of its mass on the ball (both bases) and the one where the heaviest case
# has 420 kg on it with growth. The floor was 8.0 % until the 4,000 kg plate. Ford's towing guide aims at about 10 % and
# Smart Hitch recommends 10 to 15 %. At 9.0 % every case with the grey tank empty has at least 10.8 % on the ball and the
# lowest, TC7 with a full grey tank, about 9.9 % (I2-40, 23 Nov 2026). A 10 % floor would move the axle about 32 mm
# further back, which shortens the rear tank and the grey tank with it: the fresh tanks would drop from 401 to 393 L net,
# the grey tank from 135 to 129.5 L net, under report 21's 130 L with no room to deepen it in the underfloor zone, and the
# window from 104 to 41 mm, for half a point on TC7 alone. The ceiling is the lower of the DO45's 450 kg (its fitting guide) and the Ranger Super
# Duty's tow ball limit, 450 kg (est.: Ford's published sheets and BEMM give none, and 10 % of its 4,500 kg is what the
# standard Ranger allows at 3,500 kg and what Ford's towing guide aims at), less H17's 30 kg in hand, in place of 350 kg
# less 30 kg for the 79, its towbar and the DO35. The hard limits sit outside: 7.5 % (MAS-04, H2) and the ute's towbar
# and rear axle (MAS-03, H14).
axle_window:
  towball_pct_min: 9.0
  towball_max_kg: 420

# The towball used only for the supplier's note on the axle group at the plate (cad/inputs.py): the 7.5 % floor at the
# 4,000 kg plate (H2 as amended 23 Nov 2026), the lightest ball and so the heaviest axle group the plate allows.
towball_target_kg: 300

# Registration (report 02 section 2.1). NSW, with Victoria as the fallback. The NSW examiner caps GTM at the
# lowest of the tyre, coupling, chain and brake ratings and ATM at the lower of the coupling and chain ratings.
registration:
  state: NSW
  fallback: Victoria
  plated_atm_kg: {v: 4000, src: "Decision H2 as amended 23 Nov 2026 (Leonard: 'Yeah we can raise it to 4t that's fine'): the Ranger Super Duty tows 4,500 kg braked (Ford dealer specification sheet, 2026MY) and the DO45's 4,500 kg covers it. Target fully loaded with growth at most 3,900 kg (MAS-10), so H2's 100 kg reserve stays. It replaces 20 Nov's 3,500 kg, which came from the LandCruiser's towing rating and the DO35"}
  ratings:
    tyre_kg: {v: 1550, src: "LT265/75R16 123/120 load range E, load index 123, per tyre, four tyres (report 16, the LandCruiser's tyre when chosen)"}
    coupling_kg: {v: 4500, src: "Cruisemaster DO45 Plus, ADR rated 4,500 kg, D-value 24.5 kN, V-value 14.5 kN, 50 to 450 kg on the ball (Cruisemaster's DO45 Plus fitting guide and its DO45 page, read 23 Nov 2026). It replaces the DO35's 3,500 kg"}
    chains_kg: {v: 8000, src: "Two 8 mm grade 80 (T) chains to AS 2321, minimum breaking load 8.2 t each, which ADR 62/02 clause 14.3.1.3 and Table 1 allow up to 8.0 t ATM (over 3.5 t a trailer's chains are grade T with a breaking load over the ATM, VSB1 Rev 6 9.2.1). They replace the 4177-35 chains, which AS 4177.4 caps at 3,500 kg"}
    brakes_kg: {v: 4500, src: "Cruisemaster A/T 12 inch electric drums, 4.5 t tandem capacity (report 06)"}
  # The coupling's ADR 62/02 ratings (clause 12.3.3, couplings over 3.5 t ATM), which COU-01 checks the combination's own
  # values against, AS 2213.1's a = 2.4 m/s2 (ADR 62/02 clause 8.1.2), and H2's floor on the ball, which gives the heaviest
  # axle group the plate allows
  coupling: {d_kn: 24.5, v_kn: 14.5, vertical_kg: 450, a: 2.4, src: "Cruisemaster DO45 Plus fitting guide: ADR rated to 4,500 kg, D-value 24.5 kN, V-value 14.5 kN, 50 to 450 kg on the ball"}
  ball_floor_pct: 7.5

# The tow vehicle: the Ford Ranger Super Duty single cab chassis on Ford's ratings (GVM 4,500 kg, GCM 8,000 kg), with its
# bike box, since 23 Nov 2026 in place of the LandCruiser 79 with the Lovells Elite kit. Its limits are
# in data/ute/ute.yaml and its masses and the bike box's sweep come from the ute model (build/ute/ute.json, cad/ute.py
# and cad/ute_garage.py). The ute reads the plate below from `registration` and the towball from the trailer's solve.
tow_vehicle:
  name: Ford Ranger Super Duty single cab chassis, Ford's 4,500 kg GVM and 8,000 kg GCM, with the bike box
  data: data/ute/ute.yaml
  model: build/ute/ute.json
  gcm_case: UC2          # the ute with the bikes aboard and no towball, added to the trailer's own mass
