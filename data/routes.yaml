  pair:
    what: "Tinned flexible copper, double insulated, {size} mm2 red and black pair"
    group: "48 V main cables"
    sizes: [4, 10, 16, 25, 50, 70]
    od: "2 * 1.2 * od1"
    kg_m: "2 * 1.1 * kg1"
    bend_r: "1.2 * r1"
    aud_m: "2 * 0.45 * mm2"
    price_basis: "rate: 2 B&S single at AUD 14.90 a metre for 33.6 mm2, so AUD 0.45 a mm2 and metre (solar4rvs.com.au, 20 Nov 2026)"
    mass_basis: "Prysmian V-90 singles with 10 % for the fine strands and second sheath (est.)"
