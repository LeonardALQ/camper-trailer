# Every cable and pipe of the home trailer from its source to its load (H28), for the 3D services models, the cable
# and pipe schedules, CT-602, CT-612 and the checks SVC-01 to SVC-13. cad/routes.py resolves it on the solved layout.
#
# Positions are DIM-01, mm: X from the ball rearward, Y from the centreline with the road side positive, Z up from the
# ground. A path point is three expressions over the layout's parameters, the envelope boxes (EL_04.x0 is the front
# face of line EL-04's box, LA_11E.cz its centre height), the constants below, the fixtures, and L, the run's lane
# offset (its `lane` times the rule's lane pitch), so runs that share a way lie side by side. "." repeats the previous
# point's value. A run's two ends name a line of data/assemblies/trailer.yaml or a fixture here, and a point on its
# box. `passes` names the parts a run goes through by design, `along` the parts it is clipped to, `glands` the
# glands of data/services.yaml it uses, and `serves` the loads and outlets it feeds, for SVC-05.
# Sources for every size, radius and rule are in research/30-services-routing.md. `est` marks an assumption.
id: RTE-TR
revision: A

rules:
  clear_mm: 20                  # SVC-01: clear of every envelope box but the run's own ends (the brief, H27's merge)
  keep_clear:                   # SVC-01 tests the keep-clear boxes too (I2-14), from the floor up
    overhead_mm: 60             # (est.) to 60 mm under the ceiling, the depth of the ceiling's cable covers, which run over the aisles
  spacing:                      # SVC-08: run to run, centreline to centreline at least the two radii plus the gap
    gap_mm: 5                   # (est.) two runs on their own clips or saddles: a clip's band each side and room to fit it
    wet:                        # a wet line's least gap from a cable, surface to surface, by the line's system and the cable's band
      fresh: {ac230: 25}        # cold water: IB 052/2015's 25 mm for an above-ground cold water service, from the 230 V
      vent: {ac230: 25}         # (design) a tank breather can carry water when the tank is overfilled, so as cold water
      diesel: {ac230: 25}       # (design) the sealed PA12 fuel line, jointed only at the tank and the Combi, as cold water
      hot: {ac230: 50, ELV: 25} # (design) heated water: its heat on a cable and a scald-hot leak, half IB 052/2015's 100 mm for a building
      waste: {ac230: 50, ELV: 25}   # (design) wastes and drains: dirty water at every joint, half IB 052/2015's 100 mm for a building
    elv_inside_only: true       # (design) the hot lines' and wastes' 25 mm from the extra-low-voltage cables holds above the floor, the gap under it
    rigid_waste_elv_gap: true   # (design) a solvent-welded DWV waste has no joint between its trap and the tank, so it keeps the gap from ELV
    tempered: [H-02, H-03, H-04, H-05, H-06, L-01, L-02]   # (design) held at 50 C or less by the mixing valve or the shower's thermostat, so as cold water
    over_mm: 25                 # (design) and no wet line passes over a 230 V run within 25 mm in plan, the floor panel aside
    touch: [ELV, ac230]         # cables of one band that share a way are one loom and may touch their lane neighbours
    duct: LA-11E                # inside the board cabinet the cables lie in its 60 x 80 mm slotted duct (EL-06, sized to its fill) or, the four
                                # heavy ones, cleated to the panel to their terminals, laid out by the electrician, so the test starts at its faces
  drop_pct: 2.0                 # SVC-06: DC circuits at their design current, the design's own limit, stricter than AS/NZS 3000 (I2-15)
  drop_ac_pct: 5.0              # 230 V circuits, AS/NZS 3000:2018 clause 3.6.2
  segregation_mm: 50            # SVC-03: 230 V runs from extra-low-voltage runs, AS/NZS 3000 clause 3.9.8.3 by way of AS/NZS 3001.2
  segregation_reach_mm: 150     # where both enter the board or one appliance, at its terminals
  board: LA-11E
  conduit:                      # zones where the 230 V runs in its own conduit, a separate enclosure, as well as under the floor
    - {what: "The plinth's end slot, beside the battery fuses", box: [EL_02.x1, EL_02.y0, floor_z, rear_x0, EL_02.y1, EL_02.z1]}
    - {what: "The 230 V group's 50 mm conduit along the kerb wall over the dryer", box: [4425, -half_in, KAZ + 15, LA_11E.x0 + 30, -1100, KAZ + 110]}
    - {what: "The same conduit down the chase behind the washer", box: [4425, -half_in, floor_z, 4520, -1115, KAZ + 95]}
    - {what: "The same conduit along the chase's foot to the end slot", box: [4425, -half_in, floor_z, rear_x0, -1115, floor_z + 120]}
    - {what: "Its turn from the chase's foot into the end slot", box: [EL_02.x1, -half_in, floor_z, rear_x0, EL_02.y0, floor_z + 120]}
    - {what: "The 230 V's conduit up from the road frame under the MultiPlus-II, to it and into the bench, its elbow into the bench's conduit, clear of D-07", box: [G15_A_02.x0, 500, floor_z, G15_C1.x1, 620, EL_04.z0]}
    - {what: "The bench's 230 V conduit from the road frame along its back, under the sink and the hob", box: [4030, 500, BKZ + 5, 5160, half_in, BKZ + 55]}
    # Under the floor every 230 V cable runs in one of these corrugated conduits, saddled to the floor's underside or the
    # chassis members it passes at 500 mm at most (I2-36, est.), and nowhere else, so SVC-12 holds it only inside them
    - {what: "The 230 V group's 40 mm conduit under the floor from G20 to G15 behind the rear tank, its kerb leg", under: true, box: [G20.cx + 15, G20.cy - 12, UFZ + 5, wet_x0 + 70, G20_A_01.cy - 4, floor_underside_z]}
    - {what: "The 230 V group's 40 mm conduit, across the frame ahead of CM-06, over A-01's", under: true, box: [wet_x0 + 15, G20.cy - 12, UFZ + 5, wet_x0 + 70, G15_C1.cy + 8, floor_underside_z]}
    - {what: "The 230 V group's 40 mm conduit, its road leg up to G15", under: true, box: [G15_A_02.x0 - 3, G15_A_02.cy - 8, UFZ + 5, wet_x0 + 70, G15_C1.cy + 8, floor_underside_z]}
    - {what: "A-01's own 20 mm conduit under the floor from G20, its kerb leg", under: true, box: [G20_A_01.cx - 6, G20_A_01.cy - 4, UFZ - 4, wet_x0 + 39.5, G20_A_01.cy + 4, floor_underside_z]}
    - {what: "A-01's own 20 mm conduit across the frame, between the rear tank and the group's conduit, under it", under: true, box: [wet_x0 - 15, G20_A_01.cy - 4, UFZ - 4, wet_x0 + 39.5, G15_A_01.cy + 4, UFZ + 4]}
    - {what: "A-01's own 20 mm conduit, its road leg up to G15", under: true, box: [G15_A_01.cx - 6, G15_A_01.cy - 4, UFZ - 4, wet_x0 + 39.5, G15_A_01.cy + 4, floor_underside_z]}
    - {what: "C5's and C9's 25 mm conduit down from G20 beside the kerb raiser", under: true, box: [G20_C5.cx - 86, G20_C5.cy - 6, UFZ - 81, G20_C9.cx + 6, RS_K.y1 + 68, floor_underside_z]}
    - {what: "C5's and C9's 25 mm conduit forward along the kerb raiser's inner face, saddled to it", under: true, box: [UF_06.x1 + 19, RS_K.y1 + 41, UFZ - 81, G20_C9.cx - 61, RS_K.y1 + 68, UFZ - 69]}
    - {what: "C5's and C9's 25 mm conduit across behind the diesel tank and up to G19", under: true, box: [G19.cx - 4, RS_K.y1 + 41, UFZ - 81, UF_06.x1 + 90, G19.cy + 6, floor_underside_z]}
    - {what: "C9B's 20 mm conduit down from G19 and forward under CM-03 and CM-02 beside the XT Air box, saddled to them and to CM-01", under: true, box: [G17.cx - 6, G19.cy - 16, 595, G19.cx - 2, G19.cy - 4, floor_underside_z]}
    - {what: "C9B's 20 mm conduit across under the XT Air box along CM-01 and up to the kerb rail, through its webs in a grommeted hole (I2-41)", under: true, box: [G17.cx - 6, G17.cy - 6, 595, G17.cx + 6, G19.cy - 4, LOWZ + 6]}
    - {what: "C9B's 20 mm conduit out to the front kerb corner and up to G17, saddled to OR-01K's bracket", under: true, box: [G17.cx - 6, G17.cy - 6, RL_K.z1 - 60, G17.cx + 6, G17.cy + 50, floor_underside_z]}
  fall: 0.02                    # SVC-07: 1:50, the fall CT-611 and CT-612 give the wastes
  waste_pct: 10                 # cut-off and waste added to each run's price (est.)
  between:                      # I2-63: what a lead hanging between the vehicles must reach (cad/routes.py between_reach, test_routes)
    yaw_deg: 70                 # the truck turned either way about the pin: the DO45's articulation, at least 70 degrees (report 08)
    pitch_deg: 20               # the two pitched either way at once, a crest past DIM-07's 15.9 degrees or a dip as steep (est.)
    margin_mm: 30               # for the plugs' strain reliefs and the leads' stiffness at the clip and the clamp (est.)
    ramp_mm: 300                # TR-13: the truck's rear wheels on ramps this high for the coupled test (cad/routes.py on_ramps, est.)
    seat:                       # I2-91: each sprung arm's seat and its web, both arms alike, sized from the lead (cad/routes.py seat_parts, CT-601)
      channel_t: 1.2            # the channel, folded from 1.2 mm 5052 sheet, its base to the inside, bent round the arm's tip (est.)
      lining_t: 1.5             # EPDM bonded over the channel's base and its flanges' inner faces (est.)
      web_t: 1.6                # the web, cut from 1.6 mm 5052 sheet and fitted behind the arm (est.)
      spoke_w: 10               # each spoke, its end folded 10 mm into a tab under the channel's base, two 3.2 mm rivets through both
      spokes_deg: [-155, -85, -15]   # the spokes from the strap, forward negative: at the seat's front end, then every 70 degrees
      hub: [12.5, 40]           # the hub: the arm's half width, rounded ahead of the tip, and 40 mm along the arm from the tip
      bolts_mm: [10, 30]        # two M5 316 bolts with washers and nylocs through the hub and the arm, this far from the tip
      kg: {bolt: 0.0052, rivet: 0.0003, strap: 0.003}   # an M5 x 16 316 bolt with its washer and nyloc, a 3.2 mm aluminium rivet, the strap (est.)
      density: {alu: 2.68, epdm: 1.3}   # g/cm3, 5052 aluminium and EPDM rubber
  terminal_face:                # SVC-04: AS/NZS 3001.2 clause 5.4.10.2, the rule on CT-602
    line: EL-01                 # the modules stand terminals up, so the face is the top of EL-01's box
    mm: 300
    exempt: [W-02, F-10, W-09]  # the washer's drain and fill hoses and the drip tray's drain, in their dielectric sleeves
    cone: 0.2                   # (est.) and no wet line over the face inside a cone widening 1 in 5 as it rises, the trailer parked up to
                                # about 11 degrees off level, unless the drip tray lies between: it catches every drip that would reach the face
    tray: {line: EL-09, floor_mm: 1.5}   # the tray's own box in the layout (I2-35): its footprint, and its floor 1.5 mm over its box's base
  supports:                     # SVC-12 (I2-18 a): every cable supported at most every 600 mm (VSB1 section 7.1), from where it lies
    max_mm: 600
    clip_mm: 30                 # (est.) a P-clip, a saddle or a tie base holds a cable whose surface is within 30 mm of the part's face it is clipped to
    # A point of a cable is held where it lies inside a chassis member it is threaded through (`inside`), within clip_mm of a
    # part in its `along` (inside a cabinet's carcass, within clip_mm of its panels), of a support fixture, or of a cabinet's
    # outer face, inside the board cabinet (its duct and cleats), a 230 V conduit (the conduit has its own saddles, and under
    # the floor a 230 V cable is held only in one of the conduits listed for it, I2-36) or a box it ends at, or in a gland or
    # a frame's module. A way's lanes share their supports: where a cable in a shared way lies within clip_mm of another
    # cable of that way that is held there, the loom's clip holds it too.
  heat:                         # SVC-11 (I2-18 d): the hot line and the hot surfaces that every cable and the fuel line keep clear of
    lines: [H-01]               # the Combi's hot outlet before the mixing valve, over 50 C (Truma's Combi D 6 AU instructions)
    line_mm: {ELV: 25, ac230: 50}   # SVC-08's rule for heated water, IB 052/2015's 100 mm halved (design), here under the floor as well, where its heat is the same
    surfaces:
      - {what: "the Combi's exhaust duct and wall cowl in the 100 mm behind the unit, to the cowl in the road wall", box: [LA_03.x0, LA_03.y1, LA_03.z0, LA_03.x1, half_in, LA_03.z1], mm: 50, test: [cable, diesel],
         source: "Truma's Combi D 6 AU instructions: no fuel line beside the exhaust duct, an adequate distance from hot parts. 50 mm is the design's (est.)"}
      - {what: "the floor under the Combi, whose base runs hot", box: [LA_03.x0, LA_03.y0, floor_underside_z - 10, LA_03.x1, LA_03.y1, LA_03.z0], mm: 0, test: [cable, diesel, wet],
         source: "Truma's Combi D 6 AU instructions: nothing heat-sensitive, cables among them, under the unit"}
      - {what: "the oven's case, hot when it bakes or grills", box: [LA_13.x0, LA_13.y0, LA_13.z0, LA_13.x1, LA_13.y1, LA_13.z1], mm: 50, test: [cable, wet], ends: [LA-13, PO-09],
         within: [LA_11T.x0, LA_11T.y0, LA_11T.z0, LA_11T.x1, LA_11T.y1, LA_11T.z1],   # inside the tower's carcass, whose panels part the runs outside it
         source: "The design's own, as the Combi's exhaust (est.): the case of a convection oven runs hot while it bakes"}
  not_tested: [BD-11, LG-01]    # allowances with no box of their own
  ratings:                      # SVC-10 (I2-15 b): each cable's current-carrying capacity Iz where it lies, against its design current Ib and its device's In
    # No run line names its method. Each stretch of a run takes a zone from where it lies, in this order: inside a chassis
    # member it is threaded through (`inside`), crossing a panel's foam core, under the floor, on the drawbar, outside the
    # body, in the board cabinet, in the battery box, in a 230 V conduit zone above, in the ceiling's cable covers (the top
    # 60 mm under the ceiling), else in the cabin. The zone gives AS/NZS 3008.1.1's installation method and the air round
    # the cable on the design hot day (report 19: 42 C at 15:00 in the shade, the split holding 24 C inside). A run's Iz is
    # the least over its stretches, times its group's factor in each shared way it is in.
    zones:
      member:  {method: enclosed, ambient: 45, what: "inside a chassis member under the floor (est., 42 C shade air and 3 K for the sunlit ground round the trailer)"}
      core:    {method: touching, ambient: 50, what: "through a wall's or the roof's foam core at a gland (est., the core's middle between 24 C inside and a sunlit skin near 60 C)"}
      floor:   {method: touching, ambient: 45, what: "through the floor's foam core at a gland or a grommet, the shaded air under it (est.)"}
      frame:   {method: touching, ambient: 45, what: "through a transit frame's module in the floor, rubber in an aluminium frame and no foam round it"}
      under:   {method: touching, ac230: enclosed, ambient: 45, what: "under the floor, clipped to a member or the floor, the 230 V in its conduit (est., as in the members)"}
      drawbar: {method: touching, ambient: 50, what: "along the drawbar's members ahead of the body, in the sun for part of the day (est.)"}
      outside: {method: touching, ambient: 60, what: "on the body's outer skin or the roof, in the sun (est., a sunlit surface on the design hot day)"}
      board:   {method: enclosed, ambient: 40, what: "in the board cabinet's duct or cleated to its panel, with the cabinet's own heat (est., AS/NZS 3008.1.1's 40 C reference)"}
      battery: {method: touching, ambient: 40, what: "over the modules in the battery box (est., the 40 C reference)"}
      conduit: {method: enclosed, ambient: 40, what: "the 230 V in its conduit inside the body (est., the 40 C reference)"}
      ceiling: {method: enclosed, ambient: 40, what: "in the ceiling's cable covers (est., the 40 C reference)"}
      cabin:   {method: touching, ambient: 40, what: "clipped to a wall, the partition or a cabinet inside the body (est., the 40 C reference over the split's 24 C)"}
    covers_mm: 60               # the ceiling's cable covers, the same depth as SVC-01's services zone
    core_max_mm: 100            # a longer stretch in a foam core is rated as completely surrounded by thermal insulation, times its group's factor
    short: {50: 0.88, 100: 0.78}   # a shorter crossing at a gland takes BS 7671 Table 52.2's factor for a cable wholly in insulation over that length,
                                # with no group's factor, each cable in its own gland. A frame's 60 mm crossing is not rated on its own: its rubber
                                # module is no insulation and its heat flows along the conductor into the stretches either side (est.)
    # Prysmian's AS/NZS 3008.1.1 ratings for the two single cores of a circuit, V-90 at 75 C in 40 C air, A: in free air spaced
    # from a surface, touching a surface (clipped), in a wiring enclosure in air, and partially and completely surrounded by
    # thermal insulation. A method's ratio to `free` at the cable's size carries the cable's own free-air rating to that method.
    methods:
      sizes:      [1.0, 1.5, 2.5, 4, 6, 10, 16, 25, 35, 50, 70, 95, 120]
      free:       [16, 21, 29, 39, 49, 67, 89, 119, 145, 177, 223, 276, 321]
      touching:   [13, 16, 23, 31, 40, 54, 72, 97, 119, 146, 184, 230, 267]
      enclosed:   [13, 18, 24, 32, 41, 54, 70, 94, 112, 138, 170, 212, 242]
      partial:    [11, 14, 20, 25, 33, 44, 56, 75, 90, 110, 136, 169, 193]
      surrounded: [6, 8, 12, 16, 20, 27, 36, 48, 59, null, null, null, null]   # Prysmian gives none from 50 mm2
    dc:                         # the twin DC cables: Tycab's tinned copper V90 cables, one single core in free air at 30 C to JASO D609, A,
                                # by the code in Tycab's marine cable brochure: its 0.6/1 kV single core FVK to 6 mm2, its battery cable MBS from 8 B&S
      amps:
        1.5: 18                 # FVK130025
        2.5: 26                 # FVK150025
        4: 40                   # FVK15603
        6: 51                   # FVK18403
        8.4: 74                 # MBS111203, 8 B&S
        10: 84                  # MBS132002 (FVK132202 gives 69 A, the MBS range is kept from 8 B&S up so the table rises with size)
        13.3: 103               # MBS119203, 6 B&S
        16: 110                 # MBS122403
        21.2: 135               # MBS128703, 4 B&S
        25: 164                 # (est.) by area between MBS128703 (20.26 mm2, 135 A) and MBS136403 (25.7 mm2, 168 A)
        35: 210                 # MBS149403
        50: 246                 # MBS172803, the brochure's largest
      pair: 0.8                 # the circuit's two cores together, Tycab's factor for two cables, as its twin cables' own ratings are (MWS296032 59 A
                                # at 7.7 mm2, MWS2168032 82 A at 13.5 mm2 and MWS2399032 150 A at 32 mm2, each 0.8 of the single core)
      bundle: [1.0, 0.8, 0.7, 0.6, 0.55, 0.5, 0.5, 0.45, 0.45, 0.45, 0.4, 0.4]   # by the number of loaded cables bundled, 1 to 12, and 0.4 beyond (est.)
      ambient: {30: 1.00, 40: 0.90, 50: 0.76, 60: 0.60, 70: 0.45}
    pairs:                      # the 48 V double-insulated pairs (kind pair): Tycab gives its double-insulated range ZDT no rating, so they take
      kinds: [pair]             # AS/NZS 3008.1.1's for two V-90 insulated and sheathed single cores, a circuit, by Prysmian's table (methods.free,
                                # 40 C air), and AS/NZS 3008.1.1's ambient factor at 75 C, as the 230 V cables do
    ac:                         # the 230 V cables: Prysmian's 2C+E PVC circular, V-90 at 75 C, unenclosed spaced in 40 C air (AS/NZS 3008.1), A
      amps: {1.5: 19, 2.5: 27, 4: 37, 6: 46, 10: 64, 16: 85}
      conductor_c: 75           # its ambient factor is the square root of (75 - t) over (75 - 40), the basis of AS/NZS 3008.1.1's ambient table
    groups:                     # AS/NZS 3008.1.1 Table 22, by the number of loaded circuits: bunched on a surface or enclosed, and a single layer touching
      bunched: {1: 1.00, 2: 0.80, 3: 0.70, 4: 0.65, 5: 0.60, 6: 0.57, 7: 0.54, 8: 0.52, 9: 0.50, 10: 0.48, 12: 0.45, 14: 0.43, 16: 0.41, 18: 0.39, 20: 0.38}
      layer: {1: 1.00, 2: 0.85, 3: 0.79, 4: 0.75, 5: 0.73, 6: 0.72, 7: 0.72, 8: 0.71, 9: 0.70}
      layer_ceiling: {1: 1.00, 2: 0.81, 3: 0.72, 4: 0.68, 5: 0.66, 6: 0.64, 7: 0.63, 8: 0.62, 9: 0.61}   # a single layer under a ceiling (one circuit 0.95, in the method)
      layer_ways: [BAT, KB, RD, CH, UF]   # the DC ways' lanes lie side by side in one layer. Tycab's bundling holds where a run carries more
                                # than one circuit, and Table 22's bunched row in the 230 V ways' conduits
      light_pct: 30             # a circuit carrying at most 30 % of its grouped rating is not counted (IEC 60364-5-52), nor data and control cables (Table 22 note 2)
      shed:                     # circuits the load shedding never loads together (data/services.yaml shedding) count once (Table 22 note 3)
        - {stops: [C5, C6, C7], when: [C1, C2, C4]}
        - {stops: [C4], when: [C1, C2]}
        - {stops: [A-03], when: [A-04]}   # the changeover switch takes the shore inlet or the generator inlet, never both
    devices:                    # a protective device's rating In where the run's protection text does not give it alone, and the circuit's own Ib
      D-10: {in: 15, ib: 9, circuits: 2, why: "the two Orion-Tr 48/24-16 inputs, each on its own 15 A fuse (report 20 section 7), in one run"}
      D-11: {in: 15, ib: 9, circuits: 2, why: "the two Orion-Tr 48/12-30 inputs, each on its own 15 A fuse (report 20 section 7), in one run"}
      B-02: {in: 3, why: "a LUNOS controller output, behind its supply B-01's 3 A fuse on the 12 V panel, which all of the controller's current passes"}
      B-03: {in: 3, why: "a LUNOS controller output, behind its supply B-01's 3 A fuse on the 12 V panel"}
      B-04: {in: 3, why: "a LUNOS controller output, behind its supply B-01's 3 A fuse on the 12 V panel"}
      B-05: {in: 3, why: "a LUNOS controller output, behind its supply B-01's 3 A fuse on the 12 V panel"}
      B-06: {in: 3, why: "a LUNOS controller output, behind its supply B-01's 3 A fuse on the 12 V panel"}
      K-11: {no_device: "a TSC output driving the road side's brake magnets, fixed coils that draw their 4.0 A at most at the battery's voltage, so nothing can overload it, and a short blows K-10's 30 A MIDI fuse in the drawbar junction"}
      K-12: {no_device: "a TSC output driving the kerb side's brake magnets, as K-11"}
    # A run with a design current and no device (no rating in its protection text and none here) fails SVC-10, unless its
    # line's `no_device`, or its entry here, says why it cannot be overloaded (I2-31)

# The services' design checks, measured on the routed runs by cad/routes.py and listed with the trailer's checks
# (build/trailer/trailer.json, the Checks page). They live here beside the routes, as the lamps' checks live in
# data/services.yaml, because data/checks.yaml's trailer check types are cad/partsdb.py's; its SVC note points here.
# severity: fail (a failure is a design failure). Limits are never changed to make a check pass.
checks:
  - id: SVC-01
    title: Every run keeps 20 mm from every envelope box but its own ends and the parts it passes or is clipped to
    kind: clearance
    severity: fail
    why: "The brief's rule for H28, so the services can be fitted after the fit-out without cutting a part, and it2-interior's boxes can move by up to 20 mm without a clash. Runs threaded through a closed chassis member skip the parts welded to it while inside it."
    source: "H27 and H28 (docs/decisions.md), research/30-services-routing.md section 6"
  - id: SVC-02
    title: Every cable and hose bend at or above its least bending radius, PEX and DWV turning at fittings where it does not fit
    kind: bends
    severity: fail
    why: "A cable bent tighter than its installed radius damages its insulation and a hose kinks. Rigid DWV turns only at bend fittings and PEX at push-fit elbows."
    source: "Prysmian V-90 0.6/1 kV table (least installed radius by outside diameter), Helukabel 6 x D for flexible cable, John Guest Speedfit PEX 15 mm at 175 mm with clips, research/30 section 2"
  - id: SVC-03
    title: 230 V runs 50 mm from extra-low-voltage runs outside their own conduit, except at the board and a shared appliance's terminals
    kind: separation
    severity: fail
    why: "Segregation of low-voltage from extra-low-voltage wiring by spacing, partition or enclosure."
    source: "AS/NZS 3000:2018 clause 3.9.8.3, applied to caravans by AS/NZS 3001.2:2022"
  - id: SVC-04
    title: No water, waste or diesel line within 300 mm of the battery's terminal face or over it inside a cone widening 1 in 5, but over the drip tray, and the washer's hoses and the tray's drain in their sleeves
    kind: terminal_face
    severity: fail
    why: "A leak must not reach the battery's terminals, the rule on CT-602. A drip falls straight down, or up to about 11 degrees off with the trailer parked off level, so no wet line lies over the face inside a cone that widens 1 in 5 as it rises, unless the drip tray EL-09 lies between them and covers the cone where it lies, its own box in the layout. The washer's fill and drain hoses and the tray's drain W-09 pass in a dielectric sleeve."
    source: "AS/NZS 3001.2:2022 clause 5.4.10.2 and CT-602 for the 300 mm. The cone's 1 in 5 is the design's own (est., a site up to about 11 degrees off level)"
  - id: SVC-05
    title: Every load, outlet, DC point, water outlet and fitting has its run from its source
    kind: coverage
    severity: fail
    why: "The schedules and the models are complete only if every 230 V circuit, every 12 V and 24 V load of data/services.yaml and every water outlet is reached. The runs of each tag join up end to end, and each 230 V circuit runs from a source (the board's AC bar) to its load or the outlet the load plugs into."
    source: "data/services.yaml (circuits, buses), report 20 section 7, TRAILER.md (Plumbing and water)"
  - id: SVC-06
    title: Every sized circuit's voltage drop at its design current over its routed length within its limit
    kind: drops
    severity: fail
    why: "DC circuits are sized by their current and by a 2 % drop over the routed length, the design's own limit, stricter than AS/NZS 3000, so the 12 V and 24 V loads keep their voltage and the ute's feed charges at its rate from end to end. 230 V circuits keep AS/NZS 3000's 5 %. The ute's 48 V feed D-14 counts its truck half TW06 inside its 2 %. The TSC's supply splits its budget at the truck's SB50: the trailer's leads from the socket to the TSC, K-14, the TSC's fuse in the drawbar junction and K-10, hold the 2 %, and the truck's feed from its battery to the socket, TW07, holds 3 % of its own. The 5 % they make from the battery to the TSC is the design's own budget, half the 10 % AS/NZS 3000 allows an extra-low voltage installation, and at the four magnets' 16 A from a 12.0 V battery the TSC must still see its 10.5 V floor (est.)."
    source: "The design's own 2 % (research/30-services-routing.md section 2), against AS/NZS 3000:2018 clause 3.6.2 (5 % for low voltage) and clause 7.5.7 (10 % for extra-low voltage), with Prysmian's mV/A.m at 75 C. The truck feed's 3 % and the 5 % from the battery to the TSC are the design's own, half of clause 7.5.7's 10 % (I2-62). The TSC's 10.5 V floor is the low end of ISO 16750-2's code D, the narrowest range for 12 V parts (est.), as Bosch publishes no supply range"
  - id: SVC-07
    title: Every gravity waste falls at least 1:50 all the way to the grey tank
    kind: falls
    severity: fail
    why: "A waste laid flatter than 1:50 holds water and silts. CT-611 and CT-612 give the falls."
    source: "AS/NZS 3500.2 (1.65 % least grade for DN40 fixture discharge pipes), CT-611, CT-612"
  - id: SVC-08
    title: Every run keeps its radius plus 5 mm from every other, a wet line 25 to 50 mm from 230 V by its kind and never over it
    kind: spacing
    severity: fail
    why: "No two runs may pass through each other, and each needs room for its own clip. Cables of one band that share a way are one loom and may touch their lane neighbours. A leak or a drip must not reach a 230 V cable, so a cold water, vent or diesel line keeps 25 mm from one, a hot water line or a waste 50 mm, and none passes over one within 25 mm in plan, unless the floor is between them. A hot line or a waste also keeps 25 mm from the extra-low-voltage cables, for its heat and its dirty water. Inside the board cabinet the control and branch cables lie in its 60 x 80 mm slotted duct, at 73 % of the maker's 50 % fill at its busiest section (EL-06), and the four heavy cables are cleated to the panel to their terminals, which the electrician lays out, so each run is measured from where it leaves the cabinet."
    source: "The design's own rule (research/30-services-routing.md section 5). The 5 mm gap is a clip's band each side (est.). The 25 mm for cold water is the least above-ground separation of a cold water service from an electrical cable in the WA Building Commission's Industry Bulletin IB 052/2015, which asks 100 mm for heated water and for drains in a building. A trailer cannot keep 100 mm, so the design's own rule keeps 50 mm from 230 V for hot water and wastes, with the 230 V in TPS sheath and in its own conduit where the wet lines run near it, 25 mm from the other cables, and the vents' and diesel's 25 mm and the no-drip rule are the design's own too."
  - id: SVC-09
    title: Every gland's fitting has room in its panel, a spanner's room round each locknut, and no floor fitting stands in a keep-clear box or under a part
    kind: glands
    severity: fail
    why: "A gland is fitted and tightened after the fit-out, so two fittings in one panel need the web between them on both faces, and a spanner's jaw where a locknut is turned. A fitting proud of the floor must not stand in an aisle, a landing or the chair space, or under a part that stands on the floor. A transit frame is compressed from above, so nothing is turned under it."
    source: "CMP Products locknuts for cable glands (across flats M16 to M63), Roxtec CF 8 frame for the frames' proportions, data/services.yaml fittings (the spanner's 12 mm, the 10 mm web and the frames' 12 mm rim are estimates)"
  - id: SVC-10
    title: Every cable's design current and its protective device within its rating where it lies, Ib at most In at most Iz
    kind: ratings
    severity: fail
    why: "A cable carries its current without overheating only at the rating of the way it is installed, in the air round it and beside the other loaded cables. Each stretch of a run is rated for its installation method and the design hot day's air there, and derated for its group, and the least stretch is the run's rating Iz. The design current must not exceed it, and a fuse or circuit breaker must be rated between the two, so it carries the load and opens before the cable overheats (rules.ratings). A run that carries a design current with no device fails, unless its line says why it cannot be overloaded."
    source: "AS/NZS 3000:2018 clause 2.5.3, and for A-01 Victron's MultiPlus-II 4k5/6k5 GX installation manual section 8.4 (a fuse or circuit breaker rated for the expected load in series with AC-out-1). AS/NZS 3008.1.1 for the 230 V (Prysmian's 2C+E PVC circular ratings, its two single-core table for the methods, Table 22 for groups) and for the 48 V double-insulated pairs (Prysmian's two single-core table), Tycab's marine cable brochure (JASO D609, each size by its code, its bundling and ambient factors) for the twin DC cables, BS 7671 Table 52.2 for a short crossing of insulation, IEC 60364-5-52's 30 % rule for lightly loaded circuits, and the zones' air (est.) from report 19's design hot day"
  - id: SVC-11
    title: Every cable keeps clear of the Combi's hot outlet before the mixing valve, and every cable and the fuel line of the Combi's exhaust, its hot base and the oven's case
    kind: heat
    severity: fail
    why: "Heat ages a cable's insulation and lowers its rating, and diesel must not be warmed by the exhaust. The Combi's hot outlet H-01 carries water over 50 C to the mixing valve, so every cable keeps SVC-08's heated-water distance from it everywhere, under the floor too. No cable, fuel or water line lies under the Combi's base, every cable and the fuel line keep 50 mm from the 100 mm behind it, where its exhaust duct runs to the wall cowl, and every cable and pipe 50 mm from the oven's case, but the oven's own lead."
    source: "Truma Combi D 6 AU installation instructions (no heat-sensitive materials or cables under the unit, no fuel line beside the exhaust duct, an adequate distance from hot parts, hot water over 50 C), the WA Building Commission's IB 052/2015 (100 mm for heated water in a building, halved by the design as SVC-08's), the 50 mm from the exhaust zone and the oven's case the design's own (est.)"
  - id: SVC-12
    title: Every cable supported at most every 600 mm, from where it lies
    kind: supports
    severity: fail
    why: "A cable left hanging chafes on the chassis and fatigues at its terminals on corrugated roads. A cable is held inside a chassis member it is threaded through, by a clip, saddle or tie base on a part it runs along within 30 mm of the part's face, on a cleat, tray or saddle the design adds (rules.supports and the SP fixtures), in the board cabinet, a 230 V conduit, a box it ends at, a gland or a frame, or by the loom it shares a way with. Inside a cabinet only a panel it is clipped to holds it, within the same 30 mm, and under the floor a 230 V cable is held only inside the conduit modelled for it. The longest stretch between held points is its unsupported span."
    source: "VSB1 (Building small trailers) section 7.1: trailer wiring supported at intervals of at most 600 mm. The 30 mm reach of a clip is the design's own (est.)"
  - id: SVC-13
    title: Every run keeps 20 mm from the XT kit's parts between the rails at Cruisemaster's places, and no fixture stands in one
    kind: kit_clearance
    severity: fail
    why: "SVC-01's rule against the kit's parts as 33XT AIR sheets 2 to 4 place them (est., Chassis.xt_parts): the hinge bars and the arms' hinge plates under the hinge crossmembers, the airbags over their travel under their top brackets on the rails' inner faces, and the shocks over the arm's travel with their brackets, and no fixture of the services stands in one of them (I2-97). A lead's part that rides on its arm is FIT-05's, which reads every run and fixture against the arms themselves, but each drum lead's loop from its clip on the frame to the arm's tray, and its run in the tray along the inner leg and the rear beam to the brake, are read here against each of the arm's hinge plates, the ties turned with the arm over its travel (cad/routes.py loop_gaps, I2-110)."
    source: "H27 and H28 for the 20 mm, Cruisemaster's 33XT AIR installation guide rev 3 (27 Jul 2021) sheets 2 to 4 for the places, scaled (est.)"

# The priced quantities the routed ones are compared with on the Electrical and Plumbing pages: BD-11's price items
# (data/assemblies/trailer.yaml) and LGT-01's lamp loom (data/trailer-parts.yaml). Where the routed quantity is larger,
# the line is raised with this model as its source; an allowance is never lowered.
