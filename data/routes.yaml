# The shared ways. A run whose ends or path name a way's lane offset, L_<way>, is in that way, and its `lane` (one number,
# or a map by way) sets its place there. A way's pitch is the largest outside diameter among its runs, rounded up to the
# next mm, so lane neighbours touch at most (SVC-08), and cad/routes.py works it out with the runs' sizes.
ways:
  BAT: "The battery modules' 25 mm2 pairs to the bank busbar, side by side over the modules"
  KB: "The kerb wall's ceiling bulkhead: the PV strings in from G4, the wet room's runs, the bed zone, the living zone and the alarms"
  RD: {what: "The road DC lanes: across the ceiling in front of the split's indoor unit, then forward beside the tower top and down the kitchen loom", nest: true}
  CH: "The 12 V and 24 V loom down the chase's mid row behind the dryer and across the end slot to G20"
  UF: "Under the floor forward from G20, stacked beside the kerb raiser: the Combi's 12 V, the front fans and the tank senders"
  AB: "The 230 V lanes from the board down the chase behind the washer, through the end slot and under the floor in conduit"
  AK: "The kerb 230 V lane over the dryer and the washer, from the board to their outlets and the inlets at G2"
  BK: "The bench's 230 V lanes from G15, up the sink cabinet's front and along the bench's back under the hob"
  SP: "The split's 230 V supply C8 and its indoor-outdoor link A-05, together across the wet room's ceiling and out through G22"

