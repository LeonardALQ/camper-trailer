# Cable and pipe kinds. od, kg_m, bend_r and aud_m are expressions over the conductor's mm2, od1, kg1 and r1 and the
# kind's own od. `priced_in` is the line of the parts list or the mass schedule whose price and mass carry the run.
# `elbow_r` (times the od) lets a pipe turn at a push-fit elbow where its bend does not fit, and `rigid` turns at a
# bend fitting at every corner.
kinds:
  pair:
    what: "Tinned flexible copper, double insulated, {size} mm2 red and black pair"
    group: "48 V main cables"
    sizes: [4, 10, 16, 25, 35, 50, 70, 95]
    od: "2 * 1.2 * od1"
    kg_m: "2 * 1.1 * kg1"
    bend_r: "1.2 * r1"
    aud_m: "2 * 0.45 * mm2"
    price_basis: "rate: 2 B&S single at AUD 14.90 a metre for 33.6 mm2, so AUD 0.45 a mm2 and metre (solar4rvs.com.au, 20 Nov 2026)"
    mass_basis: "Prysmian V-90 singles with 10 % for the fine strands and second sheath (est.)"
    rating: free
    priced_in: EL-07
  twin8:
    what: "B&S tinned twin-core cable, {size} mm2"
    group: "48 V main cables"
    sizes: [8.4, 13.3, 21.2]
    od: "2 * od1 + 2.0"
    kg_m: "2 * kg1 + 0.025"
    bend_r: "6 * od"
    aud_m: "9.90 if mm2 < 10 else (14.90 if mm2 < 20 else 25.00)"
    price_basis: "listing: solar4rvs.com.au 8 B&S twin AUD 9.90 and 6 B&S twin AUD 14.90 a metre (report 20, 20 Nov 2026), 4 B&S twin AUD 25.00 a metre (solar4rvs.com.au, 22 Nov 2026)"
