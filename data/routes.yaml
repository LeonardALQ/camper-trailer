            source: "Car build line TW07 (data/vehicle/vehicle-parts.yaml), 7 m in all (est.), at the conductor table's 4 B&S and 6 B&S rows. 3 % of its own, so the chain from the battery to the TSC holds the design's 5 %, half of AS/NZS 3000:2018 clause 7.5.7's 10 % for extra-low voltage. Bosch publishes no supply range for the TSC, so its floor is 10.5 V (est.), the low end of ISO 16750-2's narrowest range for 12 V parts, code D"},
     serves: [brakes], from: {line: TB-SK, at: [TB_SK.x1, TB_SK.cy - 40, TB_SK.cz]}, path: [[DB_HK.x0 + 20, 205, DB_HK.z1 - 20], [600, 262, 555]], to: {line: DB-PL, at: [DB_PL.x0, DB_PL.cy - 5, DB_PL.cz]}}
