  # Each drum's lead (I2-50): its sprung part from the junction behind the TSC, under the TSC and forward under the front
  # tank's guard for the front arms, to its P-clip at the arm's inner bush (SP-L1 to SP-L4), a run like any other, and
  # its arm part (`rides: arm`) from the clip in a loop under the inner hinge plate to Cruisemaster's harness tray on the
  # A-frame's inner leg (33XT AIR sheet 4 step 7), tied in the tray along the leg to the brake's backing plate, laid by
  # cad/routes.py on the arm at ride height with its loop's slack over the arm's travel (routes.lead_slack) and swept with
  # the arm by FIT-05. Each part's drop adds the harness's and the sprung part's (`follows`), so the magnet's 4.0 A keeps
  # 2 % from the TSC. The road side's front lead runs 40 mm road side of K-10, where K-10 comes back to the TSC.
