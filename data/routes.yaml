# The ways, from the solved layout. research/30-services-routing.md section 4 explains why each is where it is.
consts:
  CZ: ceiling_z - 25                # the DC lanes of the ceiling bulkheads, clipped to the ceiling
  CAZ: ceiling_z - 25               # the 230 V lanes, in their own bulkhead
  KB_Y: -half_in + 50               # the kerb wall's ceiling bulkhead, lanes inboard, clear of the bed rails
  RB_Y: VE_04.y0 - 25               # the road side's DC lanes, inboard of the RESPA-CF2 and the top-up fan, lanes inboard
  RA_Y: VE_04.y0 - 155              # the road side's 230 V lane, 130 mm inboard of the DC lanes
  XD: AC_01.x0 - 36                 # the DC lanes cross the ceiling in front of the split's indoor unit
  XA: AC_01.x0 - 106                # the 230 V lanes cross 70 mm further forward
  UZ: AC_01.z0 - 45                 # the corridor under the indoor unit, over the inverter and the shower's unit
  RX: AC_01.x0 + 19                 # the riser in front of the inverter, between the landing and the bench
  RDY: LA_11B.y0 - 45               # the riser's DC lanes
  RAY: EL_04.y0 + 35                # the riser's 230 V lane
  KC_Y: -half_in + 25               # the chase behind the plinth: the electrical risers against the kerb wall
  KW_Y: -half_in + 100              # the chase: the water and waste lines, 75 mm inboard of the electrics
  DCR_X: rear_x0 - 25               # the battery's riser behind the dryer, to the isolator and the BMS, clipped to the partition
  DLX: rear_x0 - 96                 # the Lynx Distributor's riser to the MultiPlus-II, 71 mm forward
  UTX: rear_x0 - 140                # the ute feed's riser
  DCR_Y: -half_in + 65              # the risers' centre line in the chase
  DVX: rear_x0 - 125                # the 12 V and 24 V lanes down the chase, against the kerb wall (KC_Y), lanes rearward
  KAX: LA_02.x1 - 60                # the 230 V riser behind the washer, 550 mm forward of the DC risers
  KAY: -half_in + 15               # the 230 V lanes against the kerb wall, lanes inboard
  KAZ: LA_11E.z0 + 145              # the kerb 230 V lane over the dryer and the washer, from the board's front face
  ESZ: floor_z + 175                # the DC lanes through the plinth's end slot
  EAZ: floor_z + 45                 # the 230 V lane along the chase and through the end slot
  BFX: rear_x0 - 145                # the board's front lane, in front of its parts
  UFZ: floor_underside_z - 45       # under the floor, between the rails
  UFX: (UF_01R.x1 + UF_08.x0) / 2   # the slot over CM-06 that crosses the trailer between the fresh and grey tanks
  GAP_R: (UF_01.y1 + RS_R.y0) / 2   # the gap between the fresh tanks and the road rail
  GAP_K: (UF_01.y0 + RS_K.y1) / 2   # and the kerb rail
  LOWZ: (PB_1K.z1 + CM_02.z0) / 2   # under the floor crossmembers and over the plan braces, ahead of the tanks
  TOPZ: (CM_05.z1 + floor_underside_z) / 2 + 5   # over the XT crossmembers in the tank bays
  KRY: RL_K.y0 - 12                 # clipped to the kerb rail's outer face, under the outriggers
  KRZ: (RL_K.z0 + RL_K.z1) / 2 + 30
  FWX: in_x0 + 25                   # the bed zone's floor bulkhead along the front wall, under the desk
  FWZ: floor_z + 30
  WFX: wet_x0 + 20                  # the partition's wet face, in the wet room
  BKY: half_in - 35                 # the bench's back lane, above the freezer and under the hob
  BKZ: LA_06.z1 + 160
  KKY: LA_11B.y0 + 30               # the bench's and the tower's kick lane, along their front panels
  KKZ: floor_z + 45
  BX: rear_x0 - 65                  # the board panel's components, 65 mm off the partition

