# Every cable and pipe of the home trailer from its source to its load (H28), for the 3D services models, the cable
# and pipe schedules, CT-602, CT-612 and the checks SVC-01 to SVC-07. cad/routes.py resolves it on the solved layout.
#
# Positions are DIM-01, mm: X from the ball rearward, Y from the centreline with the road side positive, Z up from the
# ground. A path point is three expressions over the layout's parameters, the envelope boxes (EL_04.x0 is the front
# face of line EL-04's box, LA_11E.cz its centre height), the constants below, the fixtures, and L, the run's lane
# offset (its `lane` times the rule's lane pitch), so runs that share a way lie side by side. "." repeats the previous
# point's value. A run's two ends name a line of data/assemblies/trailer.yaml or a fixture here, and a point on its
# box. `passes` names the parts a run goes through by design, `along` the parts it is clipped to, `glands` the
# glands of data/services.yaml it uses, and `serves` the loads and outlets it feeds, for SVC-05.
# Sources for every size, radius and rule are in research/30-services-routing.md. `est` marks an assumption.
id: RTE-TR
revision: A

rules:
  clear_mm: 20                  # SVC-01: clear of every envelope box but the run's own ends (the brief, H27's merge)
  lane_mm: 14                   # pitch of the lanes in a shared way
  drop_pct: 2.0                 # SVC-06: DC circuits at their design current, report 20's limit (section 6, the ute feed)
  drop_ac_pct: 5.0              # 230 V circuits, AS/NZS 3000:2018 clause 3.6.2
  segregation_mm: 50            # SVC-03: 230 V runs from extra-low-voltage runs, AS/NZS 3000 clause 3.9.8.3 by way of AS/NZS 3001.2
  segregation_reach_mm: 150     # where both enter the board or one appliance, at its terminals
  board: LA-11E
  conduit:                      # zones where the 230 V runs in its own conduit, a separate enclosure, as well as under the floor
    - {what: "The plinth's end slot, beside the battery fuses", box: [EL_02.x1, EL_02.y0, floor_z, rear_x0, EL_02.y1, EL_02.z1]}
  fall: 0.02                    # SVC-07: 1:50, the fall CT-611 and CT-612 give the wastes
  waste_pct: 10                 # cut-off and waste added to each run's price (est.)
  terminal_face:                # SVC-04: AS/NZS 3001.2 clause 5.4.10.2, the rule on CT-602
    line: EL-01                 # the modules stand terminals up, so the face is the top of EL-01's box
    mm: 300
    exempt: [W-02, F-10]        # the washer's drain and fill hoses, in their dielectric sleeve
  not_tested: [BD-11, LG-01]    # allowances with no box of their own

# Copper conductors, PVC insulated: Prysmian's V-90 0.6/1 kV single-core table (outside diameter, mass, least installed
# bending radius) and its two-single-core table for AS/NZS 3008.1.1 (current enclosed in air, `free` unenclosed and spaced
# from a surface, and the single-phase drop at 75 C in mV per amp and metre of route, which is the two-wire DC drop). research/30-services-routing.md section 2.
conductors:
  1.0: {od: 2.8, kg_m: 0.017, r: 10, mv: 51.6, amps: 13, free: 16}
  1.5: {od: 3.2, kg_m: 0.022, r: 15, mv: 33.0, amps: 18, free: 21}
  2.5: {od: 3.7, kg_m: 0.033, r: 15, mv: 18.0, amps: 24, free: 29}
  4: {od: 4.6, kg_m: 0.053, r: 20, mv: 11.2, amps: 32, free: 39}
  6: {od: 5.2, kg_m: 0.074, r: 20, mv: 7.49, amps: 41, free: 49}
  10: {od: 6.2, kg_m: 0.12, r: 25, mv: 4.46, amps: 54, free: 67}
  16: {od: 7.3, kg_m: 0.18, r: 30, mv: 2.81, amps: 70, free: 89}
  25: {od: 8.9, kg_m: 0.28, r: 35, mv: 1.78, amps: 94, free: 119}
  35: {od: 10.1, kg_m: 0.37, r: 40, mv: 1.29, amps: 112, free: 145}
  50: {od: 11.9, kg_m: 0.50, r: 50, mv: 0.963, amps: 138, free: 177}
  70: {od: 13.5, kg_m: 0.69, r: 55, mv: 0.680, amps: 170, free: 223}
  95: {od: 15.9, kg_m: 0.96, r: 65, mv: 0.507, amps: 212, free: 276}
  8.4: {od: 5.8, kg_m: 0.095, r: 22, mv: 5.36, amps: 46, free: 60}    # 8 B&S: the 6 and 10 mm2 rows scaled by area (est.)
  13.3: {od: 6.9, kg_m: 0.145, r: 28, mv: 3.38, amps: 62, free: 80}   # 6 B&S: the 10 and 16 mm2 rows scaled by area (est.)

# Cable and pipe kinds. od, kg_m, bend_r and aud_m are expressions over the conductor's mm2, od1, kg1 and r1 and the
# kind's own od. `priced_in` is the line of the parts list or the mass schedule whose price and mass carry the run.
# `elbow_r` (times the od) lets a pipe turn at a push-fit elbow where its bend does not fit, and `rigid` turns at a
# bend fitting at every corner.
