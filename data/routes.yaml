  # The brake circuit (I2-32, I2-50): the four magnets draw 4.0 A each, 12 V over the least resistance Cruisemaster's
  # CIS-001 (rev 11) gives a magnet, 3.0 ohm (it rates a brake at 3 A), so the TSC's supply carries 16 A and each drum's
  # lead 4.0 A. Bosch's TSC drives the magnets from its own supply on the brake request from the truck's controller,
  # and Bosch's guideline (Y265K30237 v4.0, page 6) puts a fuse of 40 A at most between the trailer's supply terminal and
  # the TSC harness's supply wire. So the 16 A comes from the truck's battery through an Anderson SB50 beside the 12-pin
  # plug, as report 08 section 3.5 asks for a stability control's heavy current, and the 12-pin plug's pin 5, a small pin
  # rated 15 A (ARK FPP12), carries only the brake request. In the drawbar junction a 30 A MIDI fuse (`inline`, I2-61)
  # stands between the SB50's positive and K-10: the smallest MIDI, it carries the 16 A, 19 A from a charging 14.4 V, at
  # 53 to 64 % of its rating, under Bosch's 40 A, so it protects K-10 and the TSC's harness whichever truck tows, and no
  # larger than the truck's 30 A breaker. The SB50's lead K-14, the fuse and K-10 are one 12 V circuit for SVC-06's 2 %
  # (K-10 `follows` K-14), from the truck's SB50 to the TSC, and the fuse's 2.4 milliohm is counted in it. The truck's
  # own feed from its battery to that SB50 (car build line TW07) keeps a limit of its own, 3 % (`feed`). Together they
  # are 5 % from the battery to the TSC, the design's own budget, half the 10 % AS/NZS 3000:2018 clause 7.5.7 allows
  # an extra-low voltage installation (I2-62), and SVC-06 holds the TSC at its 10.5 V floor (est.) or over (`floor_v`).
  # The leads hang between the vehicles (`rides`). Coupled, each lead is clamped on the leads' bracket DB-HK ahead of the
  # stone guard and held up by its own sprung arm hinged there (`lift`, I2-78): from the truck's plug its span runs up to a
  # lined clip on the arm's tip and down to the clamp, and from the clamp the lead runs on along the drawbar member to the
  # junction, clipped, so no part of it hangs from a support with slack that can slide. A turn that brings the plug nearer
  # lets the arm's spring lift the clip and take the slack up in the span's arch, and a turn that takes it away pulls the
  # arm down and pays the slack out. cad/routes.py lifted reads each span as two flexible catenaries of fixed length, from
  # the plug to the clip and from the clip to the clamp, the strap turning with the seat as the arm swings (I2-83), the
  # arm resting where its spring's torque balances their pulls at the clip, over every turn and pitch of rules.between
  # (est.). Each is cut to the length with which no turn pulls its
  # span taut, and drawn at that length as the arm holds it straight ahead, so DIM-04 to DIM-07 read it. The SB50 sits on
  # the truck's bracket nearer the pin, so its stiffer lead needs less slack. K-10
  # leaves the drawbar loom's stack beside it, enters the road rail and leaves it through its outer web 190 mm ahead of the
  # XT front hinge crossmember, drops outside the rail and crosses under it ahead of the front hinge's front cheek, runs
  # along the crossmember's front face 35 mm ahead of it and clipped to it to 130 mm from the centreline, and comes back
  # under the front tank's guard 60 mm road side of the centreline to the TSC's front face, so it keeps SVC-01's 20 mm
  # from the cheek and the kit and FIT-05's 50 mm from the arms (I2-30, I2-97). K-11 and K-12 are Bosch's axle harness,
  # from the TSC's rear face under its lower edge to the junctions 40 mm behind it, within its 200 mm.
  - {id: K-13, system: lamps, kind: lamp12, rides: between, cut_m: 1.34, passes: [DB-HK],
     lift: {clip_mm: 680, arm_mm: 300, arm_kg: 0.18, pivot: [-15, 0], deg: [-25, 75], strap_deg: -15, seat_deg: [-155, 40], torque_nmm: [1500, 1000], why: "The 12-pin lead's arm, the outboard one of the two on the leads' bracket. Its seat is bent to the lead's 69 mm bend radius at its centreline round the arm's tip, from 155 degrees ahead of the strap to 40 degrees behind it, and held on the arm by its web (rules.between.seat, I2-91), so the strap stands at the seat's top when the arm points 15 degrees below level and turns with the arm (I2-83). Its torsion spring lifts the arm with 1.5 N m on the bottom stop and 1.0 N m on the top one (est.), the same spring as the SB50's arm"}, feeds: "The 12-pin flat plug's lead from the truck's socket up to the clip on its sprung arm, down to its clamp on the leads' bracket and along the drawbar member to the junction: the lamps, the brake request on pin 5 and the earth returns", protection: "The truck's lamp fuses and its brake controller",
     serves: [plug lead], from: {line: TB-SK, at: [TB_SK.x1, TB_SK.cy + 40, TB_SK.cz]}, path: [[DB_HK.x0 + 20, DB_HK.y1 - 15, DB_HK.z1 - 20], [600, 320, 555]], to: {line: DB-PL, at: [DB_PL.x0, DB_PL.cy + 20, DB_PL.cz]}}
  - {id: K-14, system: dc12, kind: sb50, size: 13.3, size_why: "6 B&S, so that K-14, the fuse and K-10 hold 2 % from the truck's socket to the TSC (8 B&S would drop 2.3 %)", amps: 16, volts: 12, rides: between, cut_m: 1.28, passes: [DB-HK],
     lift: {clip_mm: 610, arm_mm: 300, arm_kg: 0.18, pivot: [-15, 0], deg: [-25, 75], strap_deg: -15, seat_deg: [-155, 40], torque_nmm: [1500, 1000], why: "The SB50 lead's arm, the inboard one of the two on the leads' bracket. Its seat is bent to the lead's 94.8 mm bend radius at its centreline round the arm's tip, from 155 degrees ahead of the strap to 40 degrees behind it, and held on the arm by its web (rules.between.seat, I2-91), so the strap stands at the seat's top when the arm points 15 degrees below level and turns with the arm (I2-83). Its torsion spring lifts the arm with 1.5 N m on the bottom stop and 1.0 N m on the top one (est.), lighter than the 3.0 N m the strap at the seat's top needed, so the arm balances the span in most positions rather than holding it straight"},
     feeds: "The TSC's supply from the truck's Anderson SB50 up to the clip on its sprung arm, down to its clamp on the leads' bracket and along the drawbar member to the junction, the four magnets' current", protection: "30 A circuit breaker at the truck's battery for the TSC's supply (TW07)",
     feed: {line: TW07, what: "the truck's half from its battery to its SB50: 6.7 m of 4 B&S twin and a 0.3 m tail of 6 B&S twin", parts: [[6.7, 2.12], [0.3, 3.38]], limit_pct: 3,
