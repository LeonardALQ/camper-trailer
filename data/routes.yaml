  # but D-06, D-07 and D-13, which SVC-10 sized up (I2-15 b, I2-31). The five modules share D-06's 150 A in parallel, 30 A each and
  # 25 % more for uneven sharing (est.), so 37.5 A on a 60 A MEGA at the busbar, between Ib and the pair's rating. D-06 leaves
  # the busbar through a 200 A MEGA in the six-way holder's sixth way, so a load between its rating and the module fuses' 300 A
  # opens it, and it matches D-07's 200 A, so the bank's fuse is never the smaller of the two (I2-31).
