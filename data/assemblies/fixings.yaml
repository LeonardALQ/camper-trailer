# How the parts of the 3D models are held where they do not stand on something below them (decision H27). The support
# tests read this file: cad/tests/test_supported.py for the trailer's models and test_ute_supported.py for the ute's.
#
# A part stands on another where its underside touches the other's top over an area, and then it needs no rule here.
# Every other part needs a rule: the lines it covers (`lines`), what they are fixed to (`to`), how, and the maker's guide
# or design document that shows the fixing (`why`). Lines are named by their id, and * matches any characters.
#   screwed, bolted, riveted, clamped, hooked or seated: the model shows a contact with one of `to` at least 12 mm wide
#     both ways and 144 mm2 in area, the land an M6 flat washer needs (ISO 7089, 12 mm outside diameter). Seated is a
#     tyre's beads on its rim
#   welded, bonded, let in or looped: any contact over an area, or the one solid running into the other, as a weld, a
#     bond, a sleeve let into a wall, or a strap's hook through its ring does
# A deep overlap that no welded, bonded or let-in rule covers holds nothing: it is two parts in one space. A fixing
# holds both of its sides, so each pair is listed once.

trailer:
  # ---------------------------------------------------------------- chassis and drawbar (data/chassis/chassis.yaml)
  - lines: ["RL-*", "RS-*", "CM-*", "OR-*", "PB-*", "DB-KA", "DB-KB", "DB-RA", "DB-RB", "DB-BR", "SP-P?"]
    to: ["RL-*", "RS-*", "CM-*", "OR-*", "PB-*", "DB-KA", "DB-KB", "DB-RA", "DB-RB", "DB-BR", "SP-P?"]
    how: welded
    why: "The frame and the drawbar are one welded frame, every structural weld SP to AS/NZS 1554.1 (CHASSIS.md)"
  - lines: [CH-P01, CH-P02, CH-P03, CH-P04]
    to: ["DB-??", "RL-*"]
    how: welded
    why: "The coupling plate, chain lugs, root gussets and front recovery lugs are welded to the drawbar members (CHASSIS.md)"
  - lines: [CH-P05, CH-P06, CH-P07, CH-P08]
    to: ["CM-*", "RL-*"]
    how: welded
    why: "The rear recovery tongues through the rear crossmember, the jacking pads, shock plates and hinge gussets (CHASSIS.md)"
  - lines: [CH-P09]
    to: ["SP-P?"]
    how: welded
    why: "The spare carrier's cleats and hub plate are welded to its posts (CHASSIS.md)"
  - lines: [CH-P14, CH-B02]
    to: ["RS-*", "OR-*"]
    how: welded
    why: "The nut plates inside the raisers and outrigger tips, and the D-rings' clips under the outriggers' ends (CHASSIS.md)"
  - lines: [DB-07]
    to: [DB-BR]
    how: bolted
    why: "The breakaway kit's box bolts to the drawbar cross brace's front face, under the stone guard"
  - lines: [CH-B01]
    to: ["RL-*"]
    how: welded
    why: "Each ARK XO DDS650 comes with its chassis mount bracket, welded under the rail along the rail's bottom corners before galvanising, and the steady bolts into the bracket with two 8 mm bolts at 78 mm centres, folded flat at 0 degrees for travel or locked at 90 degrees for use, its leg hanging from the same head (ARK's XO fitting guide, RTC614 V1 1/21)"
  - lines: [DB-08]
    to: [DB-KA, CH-P11]
    how: bolted
    why: "The jockey bracket's four spacer tubes sit on M12 bolts through the bracket plate and the drawbar member (TRAILER.md)"
  - lines: [DB-05]
    to: [CH-P11]
    how: clamped
    why: "The ARK XO750's swivel clamp bolts to the bracket plate (ARK's fitting instructions)"
  - lines: [DB-03]
    to: [CH-P01]
    how: bolted
    why: "The Cruisemaster DO35 bolts under the coupling plate with 4 x M12 8.8 bolts (Cruisemaster's fitting guide)"
  - lines: [DB-06]
    to: [CH-P02]
    how: hooked
    why: "Each safety chain's shackle passes through its chain lug (AS 4177.4)"
  # ---------------------------------------------------------------- running gear and the spare wheel
  - lines: ["RG-01*"]
    to: ["RL-*", "CM-*"]
    how: welded
    why: "Each XT arm's pivot hanger and shock bracket are welded to the rail's outer face (Cruisemaster's XT fitting guide)"
  - lines: ["RG-06*"]
    to: ["RG-01*"]
    how: bolted
    why: "Each wheel bolts to its hub on five studs (ROH, Cruisemaster)"
  - lines: [RG-03]
    to: [CM-05]
    how: bolted
    why: "The Bosch TSC module bolts under the XT centre crossmember (Cruisemaster's TSC guide)"
  - lines: [RG-04]
    to: [CM-01]
    how: bolted
    why: "The XT air supply box bolts to the front crossmember on its brackets (TRAILER.md)"
  - lines: [SP-02]
    to: [CH-P09]
    how: bolted
    why: "The spare wheel bolts to the carrier's hub plate on five studs (CHASSIS.md)"
  - lines: [UF-03, UF-09]
    to: ["RL-*"]
    how: bolted
    why: "The tank guards hang from the rails' inner faces on aluminium angles (UF-03's and UF-09's parts)"
  - lines: [UF-06B]
    to: ["RS-*"]
    how: bolted
    why: "The diesel tank's cradle angles bolt to the raisers' inner faces through their end cleats (TRAILER.md)"
  - lines: ["BD-10*"]
    to: ["OR-06*"]
    how: bolted
    why: "Each mud flap's hanger plate bolts to the XT rear shock outrigger's back face (BODY.md)"
  - lines: ["RG-02*", SP-01]
    to: ["RG-06*", SP-02]
    how: seated
    why: "Each tyre's beads sit on its rim's bead seats, held there by the inflation pressure"
  # ---------------------------------------------------------------- the body (BODY.md)
  - lines: ["BD-03*", "BD-04*", BD-08]
    to: [BD-01, BD-02, "BD-03*", "BD-04*", BD-08]
    how: bonded
    why: "The walls are bonded to the floor, to each other at the corners and to the roof through the roof-to-wall joiner (BODY.md)"
  - lines: [BD-02]
    to: [BD-08]
    how: bonded
    why: "The fixed roof is bonded on the roof-to-wall joiner (BODY.md)"
  - lines: ["WN-*", BD-07, BD-15, BD-17, "VE-0*", LA-03, WR-05, G2]
    to: ["BD-03*", "BD-04*"]
    how: let in
    why: "Each window, door, service door, vent, cowl, rinse box and inlet is let into its cut-out and screwed through its frame (the makers' guides)"
  - lines: [BD-13]
    to: ["BD-03*", BD-02, BD-08]
    how: bolted
    why: "The Fiamma F80s bolts to the roof's kerb edge on its brackets (Fiamma's fitting guide)"
  # ---------------------------------------------------------------- the fit-out (cad/model/products, research report 28)
  - lines: ["LB-04.*"]
    to: ["BD-03*"]
    how: screwed
    why: "The HappiJac rails screw into the hardpoints in the side walls (Lippert's HappiJac guide, LB-06)"
  - lines: [LB-04M]
    to: [BD-02, BD-08, "LB-04.*"]
    how: screwed
    why: "The HappiJac drive screws to the ceiling and drives the rails' shafts (Lippert's HappiJac guide)"
  - lines: [LA-11L]
    to: ["BD-03*", "BD-04*", WR-03]
    how: screwed
    why: "The overhead lockers screw through their back rail into the kerb wall's insert strips"
  - lines: [LA-11E]
    to: [WR-03, "BD-03*"]
    how: screwed
    why: "The board cabinet screws to the partition and to the kerb wall"
  - lines: [EL-04]
    to: [WR-03, LA-11B]
    how: hooked
    why: "The MultiPlus-II hangs on its wall bracket on the partition (Victron's manual)"
  - lines: [EL-05]
    to: [EL-06]
    how: screwed
    why: "The Lynx Smart BMS, the MPPTs and the Orion-Tr converters screw to the board panel (Victron's manuals)"
  - lines: [EL-06]
    to: [LA-11E]
    how: screwed
    why: "The board panel screws to the cabinet's back, the Lynx Distributor, Cerbo GX and 230 V board to the panel"
  - lines: [AC-01]
    to: [WR-03]
    how: hooked
    why: "The indoor unit hangs on its installation plate on the partition (Mitsubishi Electric's installation guide)"
  - lines: [AC-03]
    to: ["BD-04*", "AC-04*"]
    how: bolted
    why: "The cradle bolts to the rear wall and stands on its stays (AC-04, BDY-21)"
  - lines: ["AC-04*"]
    to: ["BD-04*", CM-08]
    how: bolted
    why: "The stays bolt to the rear wall and to the rear crossmember"
  - lines: [VE-04]
    to: ["BD-03*"]
    how: bolted
    why: "The RESPA-CF2 bolts to the road wall behind its intake hood (Sy-Klone's guide)"
  - lines: [VE-05]
    to: ["BD-03*", VE-04]
    how: screwed
    why: "The top-up fan's box screws to the road wall beside the RESPA"
  - lines: [VE-07]
    to: ["BD-03*", LA-11T, LA-11B]
    how: screwed
    why: "The range hood screws to the underside of the cupboard over the bench and to the road wall"
  - lines: [WR-08]
    to: [WR-03, "BD-03*", "BD-04*"]
    how: screwed
    why: "The basin, mirror cabinet and towel rail screw to the partition"
  - lines: [WR-09]
    to: [WR-03]
    how: screwed
    why: "The DauerShower's technical unit screws to the partition in its dry cabinet (DauerShower's guide)"
  - lines: [WR-03]
    to: [WR-01, "BD-03*", BD-02, BD-08]
    how: bonded
    why: "The partition is bonded to the tray, the walls and the ceiling"
  - lines: [WR-02]
    to: [WR-01]
    how: let in
    why: "The linear grate is let into the tray's floor over its sand basket"
  - lines: [WR-10]
    to: [BD-01, WR-01]
    how: let in
    why: "The shower's well is let into the floor under the drain and bonded to the tray (H4a)"
  - lines: [LG-02]
    to: ["OR-*"]
    how: riveted
    why: "Each cap is riveted over an outrigger's open end"
  - lines: ["LG-01.*"]
    to: ["BD-0*", LG-02, "OR-*", "CM-*"]
    how: screwed
    why: "Each lamp and reflector screws to the body, a cap or the frame where cad/lamps.py places it (ADR 13/00)"

# The ute's models (cad/ute_model.py): the LandCruiser's parts by their node (CAB, FRAME, WH-RK) and the bike box's by
# their label's first word (data/assemblies/ute-garage.yaml: B5.K-post-1, 12.TU-FL)
ute:
  # ---------------------------------------------------------------- the LandCruiser (data/ute/ute.yaml)
  - lines: [FAXLE, RAXLE]
    to: ["WH-*"]
    how: bolted
    why: "Each wheel bolts to its hub (Toyota)"
  - lines: [BAR, SPARE, TOWBAR, FRONT]
    to: [FRAME, CAB]
    how: bolted
    why: "The bull bar, the spare's carrier, the towbar and the front guards bolt to the frame and the cab (Toyota, the makers' fitting guides)"
  - lines: [TANK]
    to: [FRAME]
    how: clamped
    why: "The ARB Frontier tank hangs on its straps between the rails (ARB's fitting guide)"
  # ---------------------------------------------------------------- the box's body and subframe (UTE-GARAGE.md)
  - lines: [B1, "B2*", "B3*", "B5*", "B6*", "B7*"]
    to: [B1, "B2*", "B3*", "B5*", "B6*", "B7*"]
    how: welded
    why: "The box's frame, floor, skins, tubs and flares are TIG-welded aluminium (UTE-GARAGE.md, data/ute/parts/body.yaml)"
  - lines: ["S4*", "S5*", "S6*"]
    to: ["S1*"]
    how: welded
    why: "The subframe's crossmembers and outriggers are welded to its runners (UTE-GARAGE.md)"
  - lines: ["C1*"]
    to: [FRAME]
    how: riveted
    why: "Toyota's deck mount brackets are riveted to the frame rails at the factory"
  - lines: ["C7*"]
    to: ["C7*", "S5*", "S6*"]
    how: bolted
    why: "Lovells' mudflap bracket is one bent bar, bolted under the rear outrigger (Lovells' Elite kit)"
  - lines: ["C6*"]
    to: ["C7*"]
    how: bolted
    why: "Each mudflap bolts to its bracket's downturned flange"
  # ---------------------------------------------------------------- doors, safety and security
  - lines: ["D1*", "D2*"]
    to: ["D5*", "D6*"]
    how: bolted
    why: "Each barn door leaf bolts to its hinge"
  - lines: ["D5*", "D6*", D8]
    to: ["B5*"]
    how: bolted
    why: "The barn door hinges bolt to the rear posts and the lift-up door's hinge to the door head"
  - lines: [D4]
    to: [D8]
    how: hooked
    why: "The kerb-side door hangs on its top hinge"
  - lines: [D3, D9, K1]
    to: ["D1*", "D2*", D4, "B5*"]
    how: bolted
    why: "The cam bar's keepers, the latch and the hasp bolt to the doors and the frame"
  - lines: [D7]
    to: [D3]
    how: bolted
    why: "The cam bar's handle is bolted on the bar"
  - lines: ["V1*", V2D]
    to: ["B3*", "B5*"]
    how: let in
    why: "The low vents and the fan's inlet duct are let into the walls"
  - lines: [V2, "V3*", "V4*", V4B, V5B, K3, K3P, "14*"]
    to: [V2D, B4, "B3*", "B5*", "B6*", V4B, K3P]
    how: screwed
    why: "The fan, the LED strips, the fume sensors and their bracket, the extinguisher's rail, the tracker's plate and the winch plates screw or bolt to the walls, the roof bows and the frame"
  - lines: [V5]
    to: [V5B]
    how: clamped
    why: "The extinguisher sits in its bracket's clamp"
  # ---------------------------------------------------------------- the restraint (report 24)
  - lines: ["11*"]
    to: [B1, "S2*", "S3*", "S9*"]
    how: let in
    why: "Each L-track row is let into the floor and bolted through the steel anchor crossmember under it (report 24)"
  - lines: ["12*"]
    to: ["11*"]
    how: clamped
    why: "Each double-stud fitting locks into its L-track"
  - lines: ["13*"]
    to: ["12*", TU, ST]
    how: looped
    why: "Each strap's snap hook passes through its fitting's ring and its soft loop round the bike (report 24)"
  - lines: ["K2*"]
    to: [B1]
    how: bolted
    why: "Each ground anchor bolts through the floor into the subframe"
  - lines: [R2]
    to: [B1, "B5*"]
    how: hooked
    why: "The ramp hooks on the sill for loading"
  - lines: [R4]
    to: [TU, "14*"]
    how: looped
    why: "The winch rope runs from the winch to a soft loop round the Tuareg's lower triple clamp"
