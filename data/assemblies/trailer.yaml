# Whole-trailer block layout (TRAILER.md). Every block is an envelope with a mass, placed in the project datum
# DIM-01 (research/02): X along the trailer from the coupling ball centre, positive rearward. Y across from the
# centreline, positive to the road (right) side. Z up from the ground with the trailer level at design ride height.
# Units are mm and kg.
#
# Revision C: the garage and bed module (ASM-GB, garage-bed.yaml, revision D) sits at the back of the body with
# its rear door in the body's rear wall. Its frame has the same axis directions as the datum, so it only moves:
# module X 0 (the rear face of partition A) sits at X = module_x0, fixed by the rear wall, and the garage floor
# (module Z 0) at Z = floor_z. One living area runs from the front wall to partition A.
#
# Any number may be an expression over `params` (as in garage-bed.yaml). Names starting with mod_ are read from
# the module model by the build (every module parameter, with the prefix). axle_x is set by the axle solve and
# ballast_kg by the ballast solve (cad/trailer.py), which never change a limit or a block size. Items marked
# PLACEHOLDER have no position from the design yet.
id: ASM-TR
name: Whole trailer, block layout
revision: G

lengths_compared: [5000, 5500, 6000]   # body lengths compared by the build (owner: 6,000 at most, 5,500 accepted)

params:
  # ---------------------------------------------------------------- owner options (report 13), defaults until the owner answers
  # (TRAILER.md open questions). LPG is the module parameter `lpg` (garage-bed.yaml), read here as mod_lpg.
  opt_dryer: 0               # 0: Camec 3.5 kg washer only (report 13 default). 1: Whirlpool WWPB8502IW washer-dryer, 66 kg
  opt_batteries: 2           # Victron Lithium NG 25.6 V 200 Ah modules of 5.12 kWh: 2 gives 10.24 kWh (report 13 default), 3 gives 15.36 kWh
  # ---------------------------------------------------------------- body (settled inputs)
  body_length: 5500
  body_width: 2400
  half_bw: body_width / 2
  wall_t: 35                 # side walls, as in DESIGN.md (2,330 inside)
  end_wall_t: 35             # front and rear walls, taken as the same panel (assumption)
  half_in: half_bw - wall_t
  interior_h: 1800           # garage floor to ceiling with the roof down (target, 2,000 hard limit)
  floor_t: 30                # floor panel, as the module's floor (assumption until the body design)
  roof_t: 40                 # roof panel (older block model)
  # ---------------------------------------------------------------- running gear (report 06, wheels and tyres report 09)
  tyre_d: 752                # Yokohama Geolandar A/T G015 LT245/70R16 118/115R on the ROH Trak 2 16x7, Yokohama's published diameter (report 09 section 2)
  tyre_w: 251                # tyre envelope width, the widest published figure for the size (report 09)
  slr_deflection: 20         # static loaded radius = free radius less 20 mm (estimate, report 06 section 7)
  hub_z: tyre_d / 2 - slr_deflection
  hub_below_rail: 215        # Cruisemaster XT standard arm at ride height: air 205 to 230 (coil 215 +/- 60), spec
  bump_travel: 60            # XT bump travel (spec)
  tyre_clearance: 50         # tyre at full bump to the floor underside (estimate, report 06 open question 9)
  axle_spacing: 830          # tyres up to 760 mm (spec). 78 mm between the 752 mm tyres
  wheel_offset: 7            # ET +7 on the ROH Trak 2 16x7 (spec, report 09)
  cf: 195                    # hub face from the rail outside face, C/F (measurements.yaml SUP-04). Effective C/F (C/F - ET) at most 200 mm
  car_track: 1660            # Cayenne track used in report 06 (estimate), for comparison only
  rail_outer_w: 1286         # rail outer width at the XT hinges, kept from revision C (report 09 section 3)
  track: rail_outer_w + 2 * (cf - wheel_offset)   # 1,662 mm. OPEN: wider for roll stability needs a wider rail (report 09)
  rail_underside_z: hub_z + hub_below_rail
  floor_underside_z: hub_z + bump_travel + tyre_d / 2 + tyre_clearance
  floor_z: floor_underside_z + floor_t        # garage floor surface, module Z 0
  ceiling_z: floor_z + interior_h
  roof_top_z: ceiling_z + roof_t
  roof_lift: 825             # raising roof lift, four LINAK LA36 actuators (report 12 section 6). Parked only
  raised_height: roof_top_z + roof_lift + 2   # top of the solar panels with the roof raised
  # ---------------------------------------------------------------- chassis (block sizes until the engineer sizes them)
  rail_h: 150                # report 08 assumption, the engineer sizes it
  rail_w: 50                 # Cruisemaster: 50 mm wide sections
  rail_top_z: rail_underside_z + rail_h
  raiser_h: floor_underside_z - rail_top_z
  rail_c: rail_outer_w / 2 - rail_w / 2         # rail centreline from the trailer centreline
  rail_in: rail_outer_w / 2 - rail_w            # inner face of a rail
  hub_y: rail_outer_w / 2 + cf - wheel_offset   # tyre centre plane
  xm_w: 50                   # crossmember width along X
  xm_max_pitch: 700          # PLACEHOLDER rule for the intermediate crossmembers and outriggers, the engineer sets it
  # XT positions about the axle group centre, 830 mm spacing (report 06 section 8, from drawing 33XT COIL; XT Air shares the arm, confirm on 33XT AIR)
  xt_front_hinge_rear: -834
  xt_centre_front: -54
  xt_rear_shock_front: 776
  front_hub_dx: -415
  rear_hub_dx: 415
  battery_l: max(600, 130 + 235 * opt_batteries)   # sealed battery box, the modules on their sides 235 mm each along X (report 13 section 2)
  battery_from_rear: 400     # battery centre from the rear wall's inner face (owner's brief)
  battery_x0: in_x1 - battery_from_rear - battery_l / 2
  # ---------------------------------------------------------------- coupling and drawbar (report 08)
  coupling_z: 440            # coupling point at the car's Normal level, +/- 20 (target)
  drawbar_length: 1820       # ball centre to the body front. Revision B set it for the drawbar box at a 90 degree jack-knife; revision C has no box and keeps it (TRAILER.md)
  db_depth: 150              # drawbar members, same depth as the rails, run under them (report 08 option 1)
  db_apex_x: 250             # rear of the coupling head plate
  db_apex_y: 60
  db_tail: 1000              # drawbar members run on under the rails this far behind the body front (PLACEHOLDER)
  sg_l: 570                  # stone guard length along X (revision B's size)
  spare_bracket_d: 60        # spare wheel bracket depth off the front wall (estimate)
  spare_z: floor_z + 400     # spare wheel centre height on the front wall (layout choice, clear of the drawbar)
  # ---------------------------------------------------------------- the body positions
  body_x0: drawbar_length
  body_x1: drawbar_length + body_length
  in_x0: body_x0 + end_wall_t
  in_x1: body_x1 - end_wall_t
  # ---------------------------------------------------------------- solved and read from the module
  axle_x: 5000               # axle group centre from the ball. The build solves it for the towball target
  ballast_kg: 0              # ballast in the garage for the cases without bikes. The build solves it
  ballast_from_rear: 300     # ballast centre from the rear wall's inner face, at the back of the garage
  mod_bikes_cog_x: 1100      # read from the module model: the two bikes' combined CoG, module X
  mod_ladder_x0: -480        # read from the module model: front-most X of the ladder (its foot), module X
  mod_ladder_w: 330
  module_x0: in_x1 - mod_garage_length                           # the garage ends at the rear wall
  part_a_x: module_x0 - mod_partition_t                          # front face of partition A
  ladder_x0: module_x0 + mod_ladder_x0
  # ---------------------------------------------------------------- living area layout
  lz_kitchen_x: body_x0 + 150   # kitchen slide-out opening 150 mm from the front corner (report 12 section 5)
  lz_door_x: lz_kitchen_x + lz_kitchen_l + 305   # entry door, 300 mm of full wall behind the kitchen opening (report 12 section 5)
  lz_door_w: 622             # Aussie Traveller DC door (report 12 section 7)
  lz_door_h: 1623
  lz_kitchen_l: 1500         # kitchen slide-out and the wardrobe over it (older block model)
  # ---------------------------------------------------------------- water
  water_full_l: 400          # owner's wanted capacity
  water_highway_l: 50        # owner's highway figure
  water_travel_l: 200        # fully loaded travel: the other 200 L rides in the car's tank and tops up the trailer at camp (owner, 19 Nov)
  tank_z0: rail_underside_z
  tank_h: floor_underside_z - 10 - rail_underside_z
  tank_w: 2 * rail_in - 100  # 50 mm each side for the airbag and shock mounts (estimate until the kit drawing)
  # ---------------------------------------------------------------- equipment (report 13)
  diesel_l: 15               # heater fuel tank (report 13 open question 6)
  diesel_kg_per_l: 0.84
  diesel_tank_l: 440         # 440 x 400 x 100 mm HDPE tank, 17.6 L gross (estimate)
  diesel_tank_x0: axle_x + xt_front_hinge_rear - xm_w - 60 - diesel_tank_l   # ahead of the XT front hinge crossmember, in the braced bay
  solar_l: 2054              # Sunman eArc SMF430F-12X12UW, 2,054 x 1,084 x 2 mm, bonded to the lid (report 13 section 4)
  solar_w: 1084
  solar_x0: body_x0 + 780    # array 4,108 x 2,168 mm, 780 mm from the front edge so the Midi Heki fits ahead of it (layout choice)

# The trailer's own wheel and hub (report 09). WHL-01 in measurements.yaml is the wheel's load rating, and MAS-09
# checks it against the per-wheel load MAS-06 uses. The car keeps its own wheels (report 10).
wheel:
  name: "ROH Trak 2 16x7 +7 steel, 6 x 139.7, part 4116776 (gloss white) or Blak Trak 4116775"
  offset_mm: 7
  pcd: "6 x 139.7"
  spigot_mm: 93
  hub: "Cruisemaster LC6 1/2 inch UNF x 41 mm studs on the 12 inch ABS-enabled A/T drum, 93 mm spigot (standard part, Cruisemaster to confirm)"
  tyre: "Yokohama Geolandar A/T G015 LT245/70R16 118/115R, load range E, 1,320 kg"
  src: "Report 09 sections 1 to 3. ROH publishes the 1,250 kg rating but not the weight, centre bore or nut seat"

# Crossmember stations that the layout fixes (front face X). The build adds intermediate stations so that no gap
# between two of them exceeds xm_max_pitch. `keep_out` gaps are bays for tanks and the battery, where no
# intermediate station goes. The chassis design (data/chassis/chassis.yaml, CHASSIS.md) gives each station its
# crossmember section and an outrigger each side, and adds the rails, raisers, drawbar and fittings.
crossmembers:
  fixed:
    - {id: front, x: body_x0}
    - {id: XT front hinge, x: axle_x + xt_front_hinge_rear - xm_w}
    - {id: XT centre, x: axle_x + xt_centre_front}
    - {id: XT rear shock, x: axle_x + xt_rear_shock_front}
    - {id: battery-bay, x: battery_x0 - 10 - xm_w}
    - {id: rear, x: body_x1 - xm_w}
  keep_out: [[XT front hinge, XT centre], [XT centre, XT rear shock], [battery-bay, rear]]

# Ways to shorten the living area, worked out by the build for the length comparison (TRAILER.md). None is
# proposed in revision C, because the 5,500 mm body holds the living area and the 5,000 mm body cannot without
# dropping items.
fit_options: []

# Zones for the fit checks: box [x0, y0, z0, dx, dy, dz]. Items name their zone. A `keep_clear` item is floor
# space that must stay free (door landings, walkways). Keep-clear spaces may overlap one another, but no solid
# item may enter one.
zones:
  living: {name: Living area, box: [in_x0, -half_in, floor_z, part_a_x - in_x0, 2 * half_in, interior_h]}
  gas_locker: {name: Gas locker (inside), box: [module_x0 + mod_locker_x0 + 20, mod_locker_y0, floor_z + 20, mod_locker_l - 40, mod_locker_w - 20, mod_locker_h - 40]}
  kerb_strip: {name: Kerb-strip stowage in the garage, box: [module_x0 + mod_stow_row_x0, mod_locker_y0, floor_z, mod_locker_x0 + (1 - mod_lpg) * mod_locker_l - mod_stow_row_x0, mod_locker_w, mod_locker_h]}
  underfloor: {name: Under the floor between the rails, box: [body_x0, -rail_in, rail_underside_z - 10, body_length, 2 * rail_in, floor_underside_z - rail_underside_z + 10]}

items:
  # ================================================================ running gear (report 06)
  - id: RG-01
    name: Cruisemaster XT Freestyle Air (4,500 kg build), arm, Firestone style 26 airbag, LC6 hub drum and 12 inch ABS-enabled electric brake
    note: "Hub: Cruisemaster LC6 pattern, 6 x 139.7 with 1/2 inch UNF x 41 mm knurled studs and a 93 mm spigot, on the 12 inch ABS-enabled A/T electric drum (VT hub). A Cruisemaster standard pattern on 12 inch drums, to be confirmed as an off-the-shelf ABS-enabled part (report 09 sections 1 and 8)."
    system: running_gear
    for: {h: [front_hub_dx, rear_hub_dx], s: [1, -1]}
    box: [axle_x + h - 419, s * (rail_outer_w / 2 + (hub_y - rail_outer_w / 2) / 2) - (hub_y - rail_outer_w / 2) / 2, hub_z - 60, 480, hub_y - rail_outer_w / 2, rail_underside_z - hub_z + 60]
    cog: [axle_x + h - 150, s * (rail_outer_w / 2 + 60), hub_z + 40]
    mass: {basis: declared, unit_kg: 45, maturity: estimate, source: "https://www.diycaravans.com.au/shop/cruisemaster-xt-freestyle-coil-suspension-kit-tandem/", note: "180 kg per tandem kit for the coil version (retailer listing), a quarter per wheel. The air kit's weight is not published"}
  - id: RG-02
    name: Tyre, Yokohama Geolandar A/T G015 LT245/70R16 118/115R, load range E
    system: running_gear
    for: {h: [front_hub_dx, rear_hub_dx], s: [1, -1]}
    cyl: {c: [axle_x + h, s * hub_y, hub_z], r: tyre_d / 2, w: tyre_w}
    mass: {basis: declared, unit_kg: 19.3, maturity: spec, source: "https://tiresize.com/tires/Yokohama/Geolandar-AT-G015.htm", note: "Maker's size table, 42.6 lb (report 09 section 2)"}
    note: Rated 1,320 kg (load index 118), 80 psi maximum. The cylinder is the wheel and tyre envelope.
  - id: RG-06
    name: Wheel, ROH Trak 2 16x7 +7 steel, 6 x 139.7, part 4116776
    system: running_gear
    for: {h: [front_hub_dx, rear_hub_dx], s: [1, -1]}
    point: [axle_x + h, s * hub_y, hub_z]
    mass: {basis: declared, unit_kg: 13.5, maturity: estimate, source: "Report 09 section 6: ROH does not publish it. Estimated from ROH's 14.3 to 14.4 kg for the wider 16x8 Trak D"}
    note: Rated 1,250 kg (ROH's published table, measurements.yaml WHL-01). Its mass sits at the hub centre, inside the tyre envelope (RG-02), so it has no geometry of its own.
  - id: RG-03
    name: Bosch TSC kit (ABS and sway control) and wheel nuts
    note: The ECU sits under the centre crossmember, within 300 mm of the centreline (Bosch, report 06).
    system: running_gear
    box: [axle_x + xt_centre_front, -100, rail_underside_z - 45, xm_w, 200, 45]
    mass: {basis: declared, total_kg: 4.2, maturity: estimate, source: "Report 06: TSC 2 to 3 kg and nuts 1.2 kg (estimates)"}
  - id: RG-04
    name: XT Air supply, 12 V compressor, 11 litre tank, gauges, pressure switch, height valves and air lines
    note: In the living area against partition A, on top of the diesel heater, where it stays dry and out of the garage. The lines run along the rails to the four bags.
    system: running_gear
    zone: living
    box: [part_a_x - 400, half_in - 1650 - 300, floor_z + 350, 400, 300, 300]
    mass: {basis: declared, total_kg: 10, maturity: estimate, source: "Report 06 section 2: 8 to 12 kg for the compressor, tank, panel and lines (estimate, not published)"}
  - id: RG-05
    name: Spare Firestone style 26 airbag with fittings, tube and Loctite 567
    note: A punctured bag cannot be repaired (Cruisemaster CIS-006), so the spare travels with the trailer. It sits on the air supply.
    system: running_gear
    zone: living
    box: [part_a_x - 400, half_in - 1650 - 300, floor_z + 650, 400, 300, 150]
    mass: {basis: declared, total_kg: 3, maturity: estimate, source: "Report 06 section 2: 2.4 kg bag (Firestone style 26 sheet) plus fittings (estimate)"}

  # ================================================================ spare wheel (revision D, report 09 section 7)
  - id: SP-01
    name: Spare tyre, Yokohama Geolandar A/T G015 LT245/70R16 118/115R
    system: spare
    box: [body_x0 - spare_bracket_d - tyre_w, -tyre_d / 2, spare_z - tyre_d / 2, tyre_w, tyre_d, tyre_d]
    mass: {basis: declared, total_kg: 19.3, maturity: spec, source: "https://tiresize.com/tires/Yokohama/Geolandar-AT-G015.htm", note: "As RG-02"}
    note: On the body's front wall above the drawbar, centred on Y, so the rear door and ramp stay clear. The box is the wheel and tyre envelope.
  - id: SP-02
    name: Spare wheel, ROH Trak 2 16x7 +7 steel
    system: spare
    point: [body_x0 - spare_bracket_d - tyre_w / 2, 0, spare_z]
    mass: {basis: declared, total_kg: 13.5, maturity: estimate, source: "As RG-06 (report 09 section 6)"}

  # ================================================================ body shell (BODY.md, research report 12 section 10)
  - id: BD-01
    name: Floor, 30 mm woven roving and Divinycell H80 sandwich, one piece, with hardpoint strips and vinyl
    system: body
    box: [body_x0, -half_bw, floor_underside_z, body_length, body_width, floor_t]
    parts:
      - {item: "Floor panel, 13.2 m2 at 8.92 kg/m2 (two 3.22 kg/m2 woven roving skins, 2.08 kg/m2 of H80, 0.4 kg/m2 of adhesive)", kg: 117.7, basis: calculated, source: "Report 12 sections 2 and 10"}
      - {item: "Hardpoint strips, pultruded GRP 50 x 26 mm solid, 4.3 m under the two L-track rows at 2.5 kg/m", kg: 10.6, basis: calculated, source: "BODY.md, density 1,900 kg/m3"}
      - {item: "Vinyl over the 7.2 m2 living area at 1.5 kg/m2", kg: 10.8, basis: estimate}
  - id: BD-02
    name: Raising roof lid, 40 mm GRP and XPS sandwich, flat top skin under the solar array
    system: body
    box: [body_x0, -half_bw, ceiling_z, body_length, body_width, roof_t]
    parts:
      - {item: "Lid panel, 13.2 m2 less 0.51 m2 for the Midi Heki and Mini Heki at the lid's ends, at 7.0 kg/m2", kg: 88.8, basis: calculated, source: "Report 12 section 10, report 13 section 4"}
      - {item: Insert strips for the latches, lifters and hatches, kg: 2.0, basis: estimate}
  - id: BD-03
    name: Side walls, 35 mm GRP and XPS sandwich, one piece each
    system: body
    for: {s: [1, -1]}
    box: [body_x0, s * (half_bw - wall_t / 2) - wall_t / 2, floor_z, body_length, wall_t, interior_h]
    parts:
      - {item: "Half of 19.8 m2 less 2.58 m2 of openings (no gas hatch), at 6.0 kg/m2", kg: 51.7, basis: calculated, source: "Report 12 section 10, less the 0.42 m2 gas hatch, plus the 0.08 m2 bathroom vent"}
      - {item: Insert strips (half of 6 kg), kg: 3.0, basis: estimate}
  - id: BD-04
    name: End walls and the rear portal
    system: body
    for: {e: [0, 1]}
    box: [body_x0 + e * (body_length - end_wall_t), -half_in, floor_z, end_wall_t, 2 * half_in, interior_h]
    parts:
      - {item: "Front wall 3.87 m2 at 6.7 kg/m2 (2.0 mm outer skin) or rear wall 1.44 m2 at 6.0 kg/m2, by end", kg: "25.9 * (1 - e) + 8.7 * e", basis: calculated, source: "Report 12 section 10"}
      - {item: "Rear portal, hot-dip galvanised C350L0 SHS 50 x 50 x 5 and 40 x 40 x 5 with fixed feet (BODY.md redesign), rear end only", kg: "33.1 * e", basis: calculated, source: "data/body/body.yaml portal"}
      - {item: Brackets, kg: 0.5, basis: estimate}
  - id: BD-05
    name: Garage door, the rear wall cut-out on a piano hinge, two gas struts, four Southco E3 latches
    system: body
    box: [in_x1, mod_door_y0, floor_z, end_wall_t, mod_door_y1 - mod_door_y0, mod_door_h]
    parts:
      - {item: "Leaf 16.4, 2 mm door profiles 6.4, hinge 3.0, struts 1.1, latches 1.4, seals 1.0, drip rail 1.0", kg: 30.3, basis: calculated, source: "Report 12 section 7"}
    note: Opening 1,910 x 1,440 mm, header at the bed beams. Gas struts of about 750 N carry the 230 Nm hinge moment.
  - id: BD-06
    name: Gas locker hatch, Aussie Traveller service door 650 x 650, kerb side
    system: body
    when: mod_lpg
    box: [module_x0 + mod_hatch_x0, -half_in - wall_t, floor_z + mod_hatch_z0, mod_hatch_x1 - mod_hatch_x0, wall_t, mod_hatch_z1 - mod_hatch_z0]
    mass: {basis: declared, total_kg: 5, maturity: estimate, source: "Report 12 section 7: retailer listing, possibly a shipping mass"}
    note: Only with LPG (the module parameter lpg). The gas locker's only access (report 02 section 5.2).
  - id: BD-07
    name: Entry door, Aussie Traveller DC 1,623 x 622, kerb side, hinged on its front edge
    system: body
    box: [lz_door_x, -half_in - wall_t, floor_z, lz_door_w, wall_t, lz_door_h]
    mass: {basis: declared, total_kg: 25, maturity: estimate, source: "Report 12 section 7: retailer listing, possibly a shipping mass"}
    note: VSB1 13.2.1 wants one door on the left side or the rear. The cut-out is 1,626 x 625 mm with a 90 mm top radius.
  - id: BD-08
    name: Extrusions, adhesive, sealant and the body mount fixings
    system: body
    point: [body_x0 + body_length / 2, 0, floor_z + interior_h / 2]
    parts:
      - {item: "Floor joiners 15.7 m at 1.4 kg/m, corner joiners 7.2 m at 2.0 kg/m, pop-top bottom ring 15.8 m at 1.65 kg/m", kg: 62.4, basis: estimate, source: "Scaled from DIY Caravans' extrusion masses to 35 mm panels (report 12 section 10)"}
      - {item: Adhesive and sealant, kg: 8.0, basis: estimate}
      - {item: "36 M12 8.8 mount bolts, GRP crush tubes and 100 x 100 x 3 aluminium spreaders", kg: 6.0, basis: estimate}
  - id: BD-09
    name: Windows, roof hatches, vents and the dust fan
    system: body
    point: [body_x0 + body_length / 2, 0, floor_z + 1300]
    parts:
      - {item: "Dometic S4 windows 900 x 500 road side and 800 x 400 front (scaled by area)", kg: 14.8, basis: estimate}
      - {item: Dometic S4 window 500 x 450 kerb side, kg: 5.0, basis: maker}
      - {item: Dometic Midi Heki at the lid's front end, kg: 7.5, basis: estimate}
      - {item: Dometic Mini Heki Style at the lid's rear end, kg: 3.3, basis: maker}
      - {item: "Bathroom vent in the road-side wall, Carafan Sahara CP700 with ducts, kitchen opening frame, garage vents, cassette door", kg: 19.0, basis: estimate}
  - id: BD-10
    name: Mud flap behind the rear wheel, 610 x 455 mm rubber, on a galvanised hanger from the XT rear shock outrigger
    system: body
    for: {s: [1, -1]}
    point: [axle_x + rear_hub_dx + tyre_d / 2 + 60, s * hub_y, 530]
    parts:
      - {item: "Flap 24X18B, 610 x 455 x 6 mm at 1,500 kg/m3", kg: 2.5, basis: calculated, source: "https://www.thebossshop.com.au/mudflap-rubber-610mmw-x-455mml-black"}
      - {item: Hanger and bolts, kg: 2.1, basis: estimate}
    note: The bottom edge hangs at Z 300 or lower (VSB1 10.2.2, approach 2 for off-road). The corner steadies are CH-B01 (CHASSIS.md).
  - id: BD-11
    name: Wiring, plumbing, lighting and hardware
    system: body
    point: [body_x0 + body_length / 2, 0, floor_z + 400]
    mass: {basis: declared, total_kg: 60, maturity: estimate, source: "Older block model, kept until the systems design (report 12 section 10)"}
  - id: BD-12
    name: Pop-top lift and skirt, four LINAK LA36 actuators with guide posts, top ring, canvas, latches and seals
    system: body
    point: [body_x0 + body_length / 2, 0, ceiling_z]
    parts:
      - {item: "Top ring 15.8 m at 1.65 kg/m", kg: 26.1, basis: calculated, source: "DIY Caravans' pop-top extrusion masses (report 12 section 6)"}
      - {item: "Canvas skirt with zip windows and the quilted liner", kg: 9.4, basis: estimate}
      - {item: "Four LA36 actuators (36120 series, gear G), telescopic guide posts and IC Parallel control", kg: 30.0, basis: estimate}
      - {item: Six over-centre latches with secondary catches, kg: 2.4, basis: estimate}
      - {item: Bulb seal and drip lip, kg: 3.2, basis: estimate}
  - id: BD-13
