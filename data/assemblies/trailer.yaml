    point: [body_x0 + 2530, s * (half_bw - wall_t / 2), floor_z + interior_h / 2]
    mass: {basis: declared, unit_kg: 4.50, maturity: calculated, source: "1.941 m at 2.306 kg/m, 854 mm2 at 2.70 t/m3, with its 54 x 20 x 19 mm rigid PVC bearing block (calculated)"}
    note: "With the lift-bed hardpoints (LB-06), the entry door's jamb members (BD-19, BD-20), the tower's sides and the partition, no side-wall bay is wider than 1,067 mm (data/body/body.yaml, BDY-06, BDY-10). On the road side behind the kitchen bench, 145 mm clear of W4's insert strip and of the range hood's duct, and the bench's insert strip stops 25 mm short of it (FIT-07). The kerb side needs none: the hardpoints and the jamb members keep its bays within 1,067 mm. Bonded to the inner skin only, so no metal crosses the core and the inside surface over them stays above the cold night's dew point (BDY-22). They also take cabinetry screws"
