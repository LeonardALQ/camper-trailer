# Whole-trailer block layout (TRAILER.md). Every block is an envelope with a mass, placed in the project datum
# DIM-01 (research/02): X along the trailer from the coupling ball centre, positive rearward. Y across from the
# centreline, positive to the road (right) side. Z up from the ground with the trailer level at design ride height.
# Units are mm and kg.
#
# Revision J, 21 Nov 2026: the home trailer (TRAILER.md revision J, decisions H1 to H19). The body stays
# 4,420 x 2,400 mm with a fixed roof 2,000 mm inside (H1a, H12) and rounded front edges. From the front: the lift bed
# over the desk (H1), the kitchen on the road side and the battery plinth with the washer and dryer on the kerb side,
# the partition with the 48 V board and the split's indoor unit, and the wet room across the rear with its own door
# (H4). The batteries moved inside (research report 20), the grey tank took the rear bay (report 21), and two Honda
# EU22i ride in the drawbar box (report 20). Revision H was the LandCruiser 79 layout (report 18, layout 1). Inside the
# body, u is the distance from the front wall's inner face (X = in_x0 + u).
#
# Any number may be an expression over `params`. axle_x is set by the axle solve (cad/trailer.py): the middle of the
# window in which every case keeps at least 8.0 % of its mass on the ball (MAS-12) and the heaviest towball with growth
# stays at or under 320 kg (MAS-13), decision H17's design targets in data/load_cases.yaml. The hard limits sit outside
# it: 7.5 % (MAS-04) and the ute's rear axle within the Elite kit's 2,800 kg plate (H18) and the 350 kg towbar (MAS-03, H14). The
# solve never changes a limit or a block size. An item's optional `material` says what it is made of. The 3D
# viewer on the site shows it on the part's card (cad/partsmeta.py), and the chassis members and plates take theirs
# from the chassis data. Every tare item carries a `price`, AUD including GST, in the forms data/trailer-parts.yaml
# describes. That file prices the chassis stock, the labour, compliance and freight, and the parts list adds them up
# (cad/trailer_costs.py). Payload, water and fuel carry no price.
id: ASM-TR
name: Whole trailer, block layout
revision: J

params:
  # ---------------------------------------------------------------- body (report 18 section 4.1)
  body_length: 4420
  body_width: 2400
  half_bw: body_width / 2
  wall_t: 35                 # side walls, report 12's 35 mm panel (2,330 mm inside)
  end_wall_t: 35             # front and rear walls
  half_in: half_bw - wall_t
  interior_h: 2000           # fixed roof, 2,000 mm inside for the lift bed's day position (H1a, H12)
  floor_t: 30                # report 12's floor panel
  roof_t: 40                 # report 12's 40 mm roof panel, bonded to the walls
  roof_front_r: 150          # rounded front edges (H12, report 25 option A+): roof to front wall
  front_vert_r: 250          # and both front vertical edges, in bonded GRP corner pieces
  # ---------------------------------------------------------------- running gear (reports 06 and 16, report 18 section 3.4)
  tyre_d: 805                # LT265/75R16 123/120, the ute's tyre (report 16, Yokohama G015)
  tyre_w: 272                # tyre envelope width (estimate, report 18 open question 9)
  slr_deflection: 20         # static loaded radius = free radius less 20 mm (estimate, report 06 section 7)
  hub_z: tyre_d / 2 - slr_deflection
  hub_below_rail: 215        # Cruisemaster XT standard arm at ride height: air 205 to 230 (coil 215 +/- 60), spec
  bump_travel: 60            # XT bump travel (spec)
  tyre_clearance: 50         # tyre at full bump to the floor underside (estimate, report 06 open question 9)
  axle_spacing: 900          # LC5 M14 hubs at 900 mm (decision log 11:25), 95 mm between the 805 mm tyres
  wheel_offset: 0            # ET 0 on the ROH Trak 2 16 x 7, the ute's wheel (report 16)
  cf: 190                    # hub face from the rail outside face, C/F (measurements.yaml SUP-04). Effective C/F at most 200 mm
  rail_outer_w: 1175         # rail outer width, set for the 1,555 mm track (report 18 section 3.4)
  track: rail_outer_w + 2 * (cf - wheel_offset)   # 1,555 mm, the ute's front track, so the trailer runs in its ruts
  rail_underside_z: hub_z + hub_below_rail
  floor_underside_z: hub_z + bump_travel + tyre_d / 2 + tyre_clearance
  floor_z: floor_underside_z + floor_t        # floor surface
  ceiling_z: floor_z + interior_h
  roof_top_z: ceiling_z + roof_t
  # ---------------------------------------------------------------- chassis (CHASSIS.md sizes them)
  rail_h: 150                # RHS 150 x 50 x 3 rail
  rail_w: 50                 # Cruisemaster: 50 mm wide sections
  rail_top_z: rail_underside_z + rail_h
  raiser_h: floor_underside_z - rail_top_z
  rail_c: rail_outer_w / 2 - rail_w / 2         # rail centreline from the trailer centreline
  rail_in: rail_outer_w / 2 - rail_w            # inner face of a rail
  hub_y: rail_outer_w / 2 + cf - wheel_offset   # tyre centre plane
  xm_w: 50                   # crossmember width along X
  xm_max_pitch: 700          # rule for the intermediate crossmembers and outriggers (report 11), the engineer confirms it
  # XT positions about the axle group centre at 900 mm spacing (report 18 section 4.3, from drawing 33XT with the arm unchanged)
  xt_front_hinge_rear: -869
  xt_centre_front: -19
  xt_rear_shock_front: 811
  front_hub_dx: -axle_spacing / 2
  rear_hub_dx: axle_spacing / 2
  # ---------------------------------------------------------------- coupling and drawbar (report 08, report 18 sections 3.5 and 3.6)
  coupling_z: 440            # coupling point at the ute's laden ball height, +/- 20 (measurements.yaml UTE-01 sets it)
  drawbar_length: 1820       # ball centre to the body front, as designed (report 18 section 3.6)
  db_depth: 150              # drawbar members, same depth as the rails, run under them (report 08 option 1)
  db_apex_x: 250             # rear of the coupling head plate
  db_apex_y: 60
  db_tail: 1000              # drawbar members run on under the rails this far behind the body front
  sg_l: 570                  # stone guard length along X
  spare_bracket_d: 60        # spare wheel bracket depth off the front wall (estimate)
  spare_z: floor_z + 815     # spare wheel centre on the front wall, high enough that the tyre lifts off over the drawbar box
  # the sealed drawbar box for two Honda EU22i, the jerry cans and a shelf (decision log 12:45, report 20, H16)
  dbx_x0: 1150               # behind the jockey clamp at X 1,000 and the stone guard, outside the bike box's sweep (JK-01)
  dbx_l: 320                 # to X 1,470, 18 mm ahead of the spare tyre
  dbx_w: 1480                # two EU22i side by side (2 x 509 mm) and the jerry cans (report 20 open point 10)
  dbx_h: 720                 # the generators and cans below, a 0.1 m3 shelf above (H16)
  dbx_t: 1.6                 # 1.6 mm aluminium walls and lid (saving 1e, H13)
  dbx_z0: rail_underside_z   # on brackets across the drawbar members' tops
  # ---------------------------------------------------------------- the body positions
  body_x0: drawbar_length
  body_x1: drawbar_length + body_length
  in_x0: body_x0 + end_wall_t
  in_x1: body_x1 - end_wall_t
  # ---------------------------------------------------------------- the zones inside the body (TRAILER.md)
  bed_u1: 1590               # bed and desk zone u 0 to 1,590: the lift bed over the desk, nothing else under it (H1)
  living_u1: 3330            # living zone to u 3,330: the kitchen on the road side, the plinth with the laundry on the kerb side
  part_t: 20                 # partition between the living zone and the wet room
  bed_x1: in_x0 + bed_u1
  rear_x0: in_x0 + living_u1 # partition front face. The wet room runs from wet_x0 to the rear wall (H4)
  wet_x0: rear_x0 + part_t
  # the lift bed (H1, research report 21 section 1): a Lippert HappiJac 42 in kit, its rails on both side walls
  bed_state: 0               # 0: day and travel position (bed up), 1: night position. The cases and the checks use 0
  bed_day_h: 1600            # platform underside above the floor by day and in travel (H1: at least 1,600 mm)
  bed_night_h: 805           # platform underside at night: the 730 mm desk top plus 75 mm (report 21 section 2)
  deck_t: 40                 # platform, 40 mm aluminium honeycomb
  underlay_t: 19             # HyperVent underlay
  mattress_t: 180            # Pure Sleep Orion Caravan Deluxe, queen, 180 mm
  deck_z: floor_z + bed_day_h + bed_state * (bed_night_h - bed_day_h)   # platform underside
  mattress_z: deck_z + deck_t + underlay_t                               # mattress underside
  bed_rail_u: 262            # front pair of HappiJac rails from the front wall's inner face, the rear pair 1,067 mm behind
  desk_top_h: 730            # desk top above the floor (H1)
  # the kitchen on the road side and the battery plinth on the kerb side (reports 20 and 21)
  kit_d: 600                 # kitchen depth from the road-side wall
  tower_l: 585               # tall unit: Combi D 6 E, fridge, oven, RESPA-CF2 and the top-up fan
  bench_top_h: 900           # bench top above the floor
  lz_door_x: 3462            # entry door, kerb side, 300 mm of full wall behind W1 (BDY-18)
  lz_door_w: 622             # Aussie Traveller DC door with pleated blind, 1,750 x 622 (report 19 section 8)
  lz_door_h: 1750
  plinth_x0: lz_door_x + lz_door_w + 21   # battery plinth, kerb side, behind the entry door's landing
  plinth_l: 1075             # battery box 900 mm and a 175 mm slot for the fuses or a sixth module (report 20 open point 3)
  plinth_d: 700              # battery box 700 mm across
  plinth_y0: -half_in + 125  # 125 mm off the kerb wall, so the centre of gravity comes inboard (MAS-11). The aisle stays 905 mm
  bat_box_h: 320             # battery box height outside (report 20)
  plinth_h: bat_box_h + 40   # the 40 mm machine base for the washer and the dryer on top
  rear_door_y0: -300         # rear door into the wet room, hinged on its kerb-side edge, away from the outdoor unit on the road half
  rear_door_w: 625           # its cut-out, 625 x 1,753 mm
  rear_door_h: 1753
  # ---------------------------------------------------------------- axle (solved)
  axle_x: 4381               # axle group centre from the ball. The build solves it: the middle of the towball window (H17)
  # ---------------------------------------------------------------- water (H13)
  water_full_l: 420          # the fresh tanks' net capacity, filled at camp with the transfer pump, CR45 filter and chlorine (H13)
  water_travel_l: 350        # most fresh and grey water aboard while towing (H13). 232 L if the 7,400 kg GCM revision is refused (H17)
  water_highway_l: 50        # owner's highway figure
  grey_full_l: 130           # grey tank's net capacity (report 21 section 10)
  tank_z0: rail_underside_z
  tank_h: floor_underside_z - 10 - rail_underside_z
  tank_w: 2 * rail_in - 100  # 50 mm each side for the airbag and shock mounts (estimate until the kit drawing)
  tank_f_x0: axle_x + xt_front_hinge_rear + 10
  tank_f_l: xt_centre_front - 10 - (xt_front_hinge_rear + 10)          # 830 mm
  tank_r_x0: axle_x + xt_centre_front + xm_w + 10
  tank_r_l: xt_rear_shock_front - 10 - (xt_centre_front + xm_w + 10)   # 760 mm
  grey_x0: axle_x + xt_rear_shock_front + xm_w + 10   # grey tank in the rear bay, behind the XT rear shock crossmember
  grey_l: 890                # to 50 mm ahead of the rear crossmember at the solved axle
  grey_z0: rail_underside_z - 40   # 40 mm below the rails, so the grey-bay floor crossmember crosses its middle above it
  grey_h: 190                # 878 x 963 x 178 mm inside, about 140 L net with its baffle (report 21 asks 130 L)
  # ---------------------------------------------------------------- equipment (report 13)
  diesel_l: 15               # heater fuel tank (report 13 open question 6)
  diesel_tank_l: 440         # 440 x 400 x 100 mm HDPE tank, 17.6 L gross (estimate)
  diesel_tank_x0: axle_x + xt_front_hinge_rear - xm_w - 60 - diesel_tank_l   # ahead of the XT front hinge crossmember, in the braced bay
  solar_l: 2054              # Sunman eArc SMF430F-12X12UW, 2,054 x 1,084 x 2 mm, bonded to the roof (report 13 section 4)
  solar_w: 1084
  solar_x0: body_x0 + 156    # array 4,108 x 2,168 mm, centred on the 4,420 mm roof, no roof hatches (report 18 section 1.2)
  solar_dy: 70               # the array sits 70 mm toward the road edge, 28 mm clear of the awning case on the kerb edge

# The trailer's wheel and hub, shared with the ute (report 16). WHL-01 in measurements.yaml is the wheel's load rating,
# and MAS-09 checks it against the per-wheel load MAS-06 uses.
wheel:
  name: "ROH Trak 2 16 x 7 ET 0 steel, 5 x 150, the ute's wheel"
  offset_mm: 0
  pcd: "5 x 150"
  spigot_mm: 110
  hub: "Cruisemaster LC5 M14 (5 x 150), 110 mm spigot, on the 12 inch ABS-enabled A/T drum (decision log 11:25)"
  tyre: "LT265/75R16 123/120 load range E, Yokohama Geolandar A/T G015, 1,550 kg"
  src: "Report 16 section 4 and the decision log. One spare on the trailer and one under the ute's tray, each fitting both"

# Crossmember stations that the layout fixes (front face X). The build adds intermediate stations so that no gap
# between two of them exceeds xm_max_pitch. `keep_out` gaps are bays for tanks, where no intermediate station goes.
# The grey-bay floor crossmember crosses the middle of the grey tank, above it, so the floor keeps an outrigger pair
# there. The chassis design (data/chassis/chassis.yaml, CHASSIS.md) gives each station its crossmember section and an
# outrigger each side, and adds the rails, raisers, drawbar and fittings.
crossmembers:
  fixed:
    - {id: front, x: body_x0}
    - {id: diesel bay, x: diesel_tank_x0 - 10 - xm_w}
    - {id: XT front hinge, x: axle_x + xt_front_hinge_rear - xm_w}
    - {id: XT centre, x: axle_x + xt_centre_front}
    - {id: XT rear shock, x: axle_x + xt_rear_shock_front}
    - {id: grey-bay, x: grey_x0 + grey_l / 2 - xm_w / 2}
    - {id: rear, x: body_x1 - xm_w}
  keep_out: [[diesel bay, XT front hinge], [XT front hinge, XT centre], [XT centre, XT rear shock], [XT rear shock, grey-bay], [grey-bay, rear]]

# Zones for the fit checks: box [x0, y0, z0, dx, dy, dz]. Items name their zone. A `keep_clear` item is floor
# space that must stay free (door landings, walkways). Keep-clear spaces may overlap one another, but no solid
# item may enter one. The underfloor zone reaches 50 mm below the rails for the grey tank and its guard.
zones:
  inside: {name: Inside the body, box: [in_x0, -half_in, floor_z, in_x1 - in_x0, 2 * half_in, interior_h]}
  drawbar_box: {name: Drawbar box (inside), box: [dbx_x0 + dbx_t, -dbx_w / 2 + dbx_t, dbx_z0 + dbx_t, dbx_l - 2 * dbx_t, dbx_w - 2 * dbx_t, dbx_h - 2 * dbx_t]}
  underfloor: {name: Under the floor between the rails, box: [body_x0, -rail_in, rail_underside_z - 50, body_length, 2 * rail_in, floor_underside_z - rail_underside_z + 50]}

items:
  # ================================================================ running gear (reports 06 and 16)
  - id: RG-01
    name: Cruisemaster XT Freestyle Air (4,500 kg build), arm, Firestone style 26 airbag, LC5 M14 hub drum and 12 inch ABS-enabled electric brake
    material: "Steel arm, galvanised (est.), rubber airbag, cast iron brake drum (est.)"
    note: "Hub: Cruisemaster LC5, 5 x 150 with M14 studs and a 110 mm spigot, the ute's pattern, on the 12 inch ABS-enabled A/T electric drum (decision log 11:25)."
    system: running_gear
    price: {aud: 7442.04, basis: listing, url: "https://www.diycaravans.com.au/shop/cruisemaster-xt-freestyle-air-suspension-kit-tandem/", date: 2026-11-20, note: "One tandem kit for all four arms: 4,500 kg build, 12 in ABS-enabled A/T electric drums, LC5 M14 studs, Level 1 (SKU 8015 ABS). Research report 22"}
    for: {h: [front_hub_dx, rear_hub_dx], s: [1, -1]}
    box: [axle_x + h - 419, s * (rail_outer_w / 2 + (hub_y - rail_outer_w / 2) / 2) - (hub_y - rail_outer_w / 2) / 2, hub_z - 60, 480, hub_y - rail_outer_w / 2, rail_underside_z - hub_z + 60]
    cog: [axle_x + h - 150, s * (rail_outer_w / 2 + 60), hub_z + 40]
    mass: {basis: declared, unit_kg: 45, maturity: estimate, source: "https://www.diycaravans.com.au/shop/cruisemaster-xt-freestyle-coil-suspension-kit-tandem/", note: "180 kg per tandem kit for the coil version (retailer listing), a quarter per wheel. The air kit's weight is not published"}
  - id: RG-02
    name: Tyre, LT265/75R16 123/120 load range E, Yokohama Geolandar A/T G015
    material: "Radial light-truck tyre, rubber on steel belts (est.)"
    system: running_gear
    price:
      - {item: "Yokohama Geolandar A/T G015 LT265/75R16 123/120R", aud_each: 471.18, basis: listing, converted_from: "USD 303.99", url: "https://www.tiremart.com/yokohama-geolandar-a-t-g015-lt-265-75r16-123-120r-e-10-ply-at-all-terrain-tire-dc", date: 2026-11-20, note: "No Australian listing for this size could be read (research report 22)"}
      - {item: "Fitting and balancing", aud_each: 35, basis: estimate, date: 2026-11-20, note: "As the ute's tyre fitting"}
    for: {h: [front_hub_dx, rear_hub_dx], s: [1, -1]}
    cyl: {c: [axle_x + h, s * hub_y, hub_z], r: tyre_d / 2, w: tyre_w}
    mass: {basis: declared, unit_kg: 22.6, maturity: spec, source: "Yokohama's size table, 22.6 kg (report 16 section 4)"}
    note: Rated 1,550 kg (load index 123), 80 psi maximum. The ute's tyre. The cylinder is the wheel and tyre envelope.
  - id: RG-06
    name: Wheel, ROH Trak 2 16 x 7 ET 0 steel, 5 x 150
    material: "Steel wheel"
    system: running_gear
    price: {aud_each: 230, basis: estimate, url: "https://roh.com.au/wheels/trak-2", date: 2026-11-20, note: "ROH publishes no price and no retailer listing was found (research report 22)"}
    for: {h: [front_hub_dx, rear_hub_dx], s: [1, -1]}
    point: [axle_x + h, s * hub_y, hub_z]
    mass: {basis: declared, unit_kg: 14.5, maturity: estimate, source: "Report 16 section 4: ROH does not publish it (estimate)"}
    note: Rated 1,400 kg (measurements.yaml WHL-01). Its mass sits at the hub centre, inside the tyre envelope (RG-02).
  - id: RG-03
    name: Bosch TSC kit (ABS and sway control) and wheel nuts
    material: "Electronic control unit and wheel speed sensors (est.), steel wheel nuts"
    note: The ECU sits under the centre crossmember, within 300 mm of the centreline (Bosch, report 06).
    system: running_gear
    price:
      - {item: "Bosch Trailer Safety Control, ABS-enabled, tandem kit", aud: 1558.70, basis: listing, url: "https://www.diycaravans.com.au/shop/bosch-trailer-safety-control-tsc-abs-enabled/", date: 2026-11-20, note: "SKU 8037.1, programmed for LT265/75R16 at checkout"}
      - {item: "24 wheel nuts, M14 x 1.5, 20 on the hubs and 4 spare", aud: 96, basis: estimate, date: 2026-11-20}
    box: [axle_x + xt_centre_front, -100, rail_underside_z - 45, xm_w, 200, 45]
