# Whole-trailer block layout (TRAILER.md). Every block is an envelope with a mass, placed in the project datum
# DIM-01 (research/02): X along the trailer from the coupling ball centre, positive rearward. Y across from the
# centreline, positive to the kerb (left) side. Z up from the ground with the trailer level at design ride height.
# Units are mm and kg.
#
# The garage and bed module (ASM-GB, garage-bed.yaml) is placed as a sub-assembly. Its frame has the same axis
# directions as the datum, so it only moves: module X 0 (inner face of partition A) sits at X = module_x0 and the
# garage floor (module Z 0) at Z = floor_z. Partition A faces the front utility zone, partition B the living zone.
#
# Any number may be an expression over `params` (as in garage-bed.yaml). Names starting with mod_ are read from
# the module model by the build. axle_x and axle_offset are set by the axle solve (cad/trailer.py), which never
# changes a limit or a block size. Items marked PLACEHOLDER have no position from the design yet.
id: ASM-TR
name: Whole trailer, block layout
revision: B

lengths_compared: [5000, 5500, 6000]   # body lengths compared by the build (owner: 6,000 at most, 5,500 accepted)

params:
  # ---------------------------------------------------------------- body (settled inputs)
  body_length: 5500
  body_width: 2400
  half_bw: body_width / 2
  wall_t: 35                 # side walls, as in DESIGN.md (2,330 inside)
  end_wall_t: 35             # front and rear walls, taken as the same panel (assumption)
  half_in: half_bw - wall_t
  interior_h: 1800           # garage floor to ceiling with the roof down (target, 2,000 hard limit)
  floor_t: 30                # floor panel, as the module's floor (assumption until the body design)
  roof_t: 40                 # roof panel (older block model)
  # ---------------------------------------------------------------- running gear (report 06)
  tyre_section: 255          # 255/55 R18 109H (report 07)
  tyre_aspect: 0.55
  rim_in: 18
  tyre_d: rim_in * 25.4 + 2 * tyre_aspect * tyre_section     # 737.7 mm, calculated
  slr_deflection: 20         # static loaded radius = free radius less 20 mm (estimate, report 06 section 7)
  hub_z: tyre_d / 2 - slr_deflection
  hub_below_rail: 215        # Cruisemaster XT standard arm at ride height: air 205 to 230 (coil 215 +/- 60), spec
  bump_travel: 60            # XT bump travel (spec)
  tyre_clearance: 50         # tyre at full bump to the floor underside (estimate, report 06 open question 9)
  axle_spacing: 830          # tyres up to 760 mm (spec)
  wheel_offset: 53           # ET53 on the Porsche 8J x 18 (spec)
  cf: 240                    # hub face from the rail outside face, C/F (Cruisemaster range 175 to 260 with 12 inch brakes)
  car_track: 1660            # Cayenne track used in report 06 (estimate)
  track: car_track           # OPEN: matched to the car, or wider for roll stability (report 06)
  rail_underside_z: hub_z + hub_below_rail
  floor_underside_z: hub_z + bump_travel + tyre_d / 2 + tyre_clearance
  floor_z: floor_underside_z + floor_t        # garage floor surface, module Z 0
  ceiling_z: floor_z + interior_h
  roof_top_z: ceiling_z + roof_t
  # ---------------------------------------------------------------- chassis (block sizes until the engineer sizes them)
  rail_h: 150                # report 08 assumption, the engineer sizes it
  rail_w: 50                 # Cruisemaster: 50 mm wide sections
  rail_top_z: rail_underside_z + rail_h
  raiser_h: floor_underside_z - rail_top_z
  rail_outer_w: track - 2 * (cf - wheel_offset)
  rail_c: rail_outer_w / 2 - rail_w / 2         # rail centreline from the trailer centreline
  rail_in: rail_outer_w / 2 - rail_w            # inner face of a rail
  hub_y: rail_outer_w / 2 + cf - wheel_offset   # tyre centre plane
  xm_w: 50                   # crossmember width along X
  xm_max_pitch: 700          # PLACEHOLDER rule for the intermediate crossmembers and outriggers, the engineer sets it
  # XT positions about the axle group centre, 830 mm spacing (report 06 section 8, from drawing 33XT COIL; XT Air shares the arm, confirm on 33XT AIR)
  xt_front_hinge_rear: -834
  xt_centre_front: -54
  xt_rear_shock_front: 776
  front_hub_dx: -415
  rear_hub_dx: 415
  battery_bay: 620           # battery bay length, next to the suspension
  battery_behind: 1          # 1 puts the battery bay behind the rear shock crossmember, 0 ahead of the front hinge (layout choice, TRAILER.md)
  battery_bay_x0: axle_x + battery_behind * (xt_rear_shock_front + xm_w) + (1 - battery_behind) * (xt_front_hinge_rear - xm_w - battery_bay)
  # ---------------------------------------------------------------- coupling and drawbar (report 08)
  coupling_z: 440            # coupling point at the car's Normal level, +/- 20 (target)
  drawbar_length: 1820       # ball centre to the body front (set for the 90 degree jack-knife, TRAILER.md)
  db_depth: 150              # drawbar members, same depth as the rails, run under them (report 08 option 1)
  db_apex_x: 250             # rear of the coupling head plate
  db_apex_y: 60
  db_tail: 1000              # drawbar members run on under the rails this far behind the body front (PLACEHOLDER)
  box_gap: 50                # drawbar box to the body front
  box_l: 700                 # drawbar box (older block model)
  box_w: 1500
  box_h: 550
  # ---------------------------------------------------------------- the body positions
  body_x0: drawbar_length
  body_x1: drawbar_length + body_length
  in_x0: body_x0 + end_wall_t
  in_x1: body_x1 - end_wall_t
  box_x0: body_x0 - box_gap - box_l
  box_z0: rail_underside_z
  # ---------------------------------------------------------------- solved and read from the module
  axle_x: 3900               # axle group centre from the ball. The build solves it for the towball target
  axle_offset: 0             # axle centre less the bikes' combined CoG X. Zero puts the bikes over the axles
  mod_bikes_cog_x: 909       # read from the module model: the two bikes' combined CoG, module X
  mod_ladder_x1: 2300        # read from the module model: rear-most X of the ladder, module X
  mod_ladder_y: 800
  mod_ladder_w: 330
  mod_doorway_y: 0
  mod_doorway_w: 700
  mod_garage_length: 1800
  mod_partition_t: 20
  mod_door_x0: 40
  mod_door_x1: 1760
  mod_door_h: 1440
  module_x0: axle_x - axle_offset - mod_bikes_cog_x
  part_a_x: module_x0 - mod_partition_t                          # front face of partition A
  part_b_x: module_x0 + mod_garage_length + mod_partition_t      # living-area face of partition B
  ladder_x1: module_x0 + mod_ladder_x1
  # ---------------------------------------------------------------- front utility zone layout (X from the front wall)
  fz_kitchen_l: 1500         # kitchen slide-out and the wardrobe over it (older block model)
  fz_door_x: in_x0 + 650     # utility door opening, road-side wall (older block model)
  fz_door_w: 650
  fz_door_h: 1700
  # ---------------------------------------------------------------- living zone layout
  rz_door_x: ladder_x1 + 20  # entry door opening, kerb-side wall, just behind the ladder foot
  rz_door_w: 700
  rz_door_h: 1700
  # ---------------------------------------------------------------- water
  water_full_l: 400          # owner's wanted capacity
  water_highway_l: 50        # owner's highway figure
  tank_z0: rail_underside_z
  tank_h: floor_underside_z - 10 - rail_underside_z
  tank_w: 2 * rail_in - 100  # 50 mm each side for the airbag and shock mounts (estimate until the kit drawing)

# The wheel the trailer shares with the car. WHL-01 in measurements.yaml decides which one the plan uses
# (cad/inputs.py): the Porsche wheel if its rating meets VSB1's 120 % rule, the fallback if not.
wheels:
  porsche: {name: "Porsche 8J x 18 ET53, the Cayenne's own wheel", offset_mm: 53, spigot_mm: 71.5, centre_bore_mm: 71.6,
            src: "Reports 06 and 07. Hub drums special order, 5 x 130, M14 x 1.5 studs, 71.5 mm spigot"}
  fallback: {name: "a rated 5 x 130 aftermarket wheel, for example the OZ Rally Raid (up to 1,200 kg)", offset_mm: 53, spigot_mm: 84.1,
             centre_bore_mm: 84.1, rating_kg: 1200,
             src: "Report 06 section 3. The 84.1 mm bore is a retailer figure. The offset is taken as ET53 until a wheel is chosen, and its fit over the GTS brakes needs checking"}

# Crossmembers that the layout fixes (front face X). The build adds intermediate crossmembers so that no gap
# between two of them exceeds xm_max_pitch, and outriggers at the same stations wherever the tyres are not.
# `keep_out` gaps are bays for tanks and the battery, where no intermediate crossmember goes.
crossmembers:
  fixed:
    - {id: front, x: body_x0, section: body}
    - {id: battery-bay, x: battery_bay_x0 + battery_behind * battery_bay - (1 - battery_behind) * xm_w, section: body}
    - {id: XT front hinge, x: axle_x + xt_front_hinge_rear - xm_w, section: xt}
    - {id: XT centre, x: axle_x + xt_centre_front, section: xt}
    - {id: XT rear shock, x: axle_x + xt_rear_shock_front, section: xt}
    - {id: rear, x: body_x1 - xm_w, section: body}
  keep_out: [[battery-bay, XT front hinge], [XT front hinge, XT centre], [XT centre, XT rear shock], [XT rear shock, battery-bay]]
  sections:
    xt: {name: "RHS 150 x 50 x 3, full rail height (Cruisemaster TB 070, tandem trailer up to 3,700 kg ATM)", kg_per_m: 8.96, maturity: estimate,
         source: "Cruisemaster section from report 06 section 8, mass per metre for 150 x 50 x 3 C350L0 RHS (estimate until sized)"}
    body: {name: "RHS 100 x 50 x 3 (block size, the engineer sizes it)", kg_per_m: 6.6, maturity: estimate,
           source: "Block size chosen for this layout, mass per metre for 100 x 50 x 3 RHS (estimate)"}
  outrigger: {name: "RHS outrigger to the body edge, raiser height (block size)", kg_per_m: 6.6, maturity: estimate,
              source: "Block size chosen for this layout, mass per metre for 100 x 50 x 3 RHS (estimate)",
              tyre_keep_out: 30}

# Ways to shorten the zones, worked out by the build for the length comparison (TRAILER.md). None of them is
# taken: each is the owner's decision. `skip` leaves items out of the zone they sit in now, `overrides` changes
# parameters. The mass change is the item's own estimate, or zero where the item only moves.
fit_options:
  - id: OPT-1
    title: Move the diesel heater and hot water unit out of the front zone, into the drawbar box or under the floor
    skip: [FZ-05]
    mass_change_kg: 0
  - id: OPT-2
    title: Move the partition B doorway 200 mm towards the kerb side (DESIGN.md does not place it yet)
    overrides: {mod_doorway_y: 200}
    mass_change_kg: 0
  - id: OPT-3
    title: Options 1 and 2 together
    skip: [FZ-05]
    overrides: {mod_doorway_y: 200}
    mass_change_kg: 0
  - id: OPT-4
    title: Options 1 and 2 with a 1,200 mm kitchen slide-out and wardrobe in place of 1,500 mm
    skip: [FZ-05]
    overrides: {mod_doorway_y: 200, fz_kitchen_l: 1200}
    mass_change_kg: -23
    mass_note: Kitchen and wardrobe masses scaled by length (80 + 35 kg at 1,500 mm), an estimate

# Zones for the fit checks: box [x0, y0, z0, dx, dy, dz]. Items name their zone. A `keep_clear` item is floor
# space that must stay free (door landings, walkways). Keep-clear spaces may overlap one another, but no solid
# item may enter one.
zones:
  drawbar_box: {name: Drawbar box (inside), box: [box_x0 + 10, -box_w / 2 + 10, box_z0 + 10, box_l - 20, box_w - 20, box_h - 20]}
  front: {name: Front utility zone, box: [in_x0, -half_in, floor_z, part_a_x - in_x0, 2 * half_in, interior_h]}
  rear: {name: Rear living zone, box: [part_b_x, -half_in, floor_z, in_x1 - part_b_x, 2 * half_in, interior_h]}
  underfloor: {name: Under the floor between the rails, box: [body_x0, -rail_in, rail_underside_z - 10, body_length, 2 * rail_in, floor_underside_z - rail_underside_z + 10]}

items:
  # ================================================================ drawbar and coupling
  - id: DB-01
    name: Drawbar member
    system: drawbar
    for: {s: [-1, 1]}
    bar: {p0: [db_apex_x, s * db_apex_y, rail_underside_z - db_depth / 2], p1: [body_x0, s * rail_c, rail_underside_z - db_depth / 2], w: rail_w, h: db_depth}
    mass: {basis: per_length, kg_per_m: 11.6, maturity: estimate, source: "Older block model section, RHS 150 x 50 x 4 at 11.6 kg/m (the engineer sizes it)"}
    note: Runs under the main rails (report 08 option 1), so the coupling end starts one rail depth lower.
  - id: DB-02
    name: Drawbar member under the rail
    system: drawbar
    for: {s: [-1, 1]}
    box: [body_x0, s * rail_c - rail_w / 2, rail_underside_z - db_depth, db_tail, rail_w, db_depth]
    mass: {basis: per_length, kg_per_m: 11.6, measure: dx, maturity: estimate, source: "As DB-01"}
    note: PLACEHOLDER length. It runs back to a crossmember (report 02 FAIL-01). The engineer sets where it ends.
  - id: DB-03
    name: Coupling head, Cruisemaster DO35 V3Plus, chains, breakaway kit and plugs
    system: drawbar
    box: [-60, -90, coupling_z - 60, db_apex_x + 60, 180, rail_underside_z - coupling_z + 60]
    cog: [80, 0, coupling_z + 40]
    mass: {basis: declared, total_kg: 40, maturity: estimate, source: "Older block model: coupling, sway control and jockey wheel 45 kg, less the sway control now in RG-03"}
  - id: DB-04
    name: Stone guard
    system: drawbar
    box: [db_apex_x + 200, -500, rail_underside_z, box_x0 - db_apex_x - 250, 1000, 10]
    mass: {basis: declared, total_kg: 15, maturity: estimate, source: "Older block model: stone guard, legs and mud flaps 40 kg, split 15 here and 25 in BD-10"}
  - id: DB-05
    name: Drawbar box, empty
    system: drawbar
    box: [box_x0, -box_w / 2, box_z0, box_l, box_w, box_h]
    hollow: true
    mass: {basis: declared, total_kg: 25, maturity: estimate, source: "Older block model"}
  - id: DB-06
    name: Generator
    system: drawbar
    zone: drawbar_box
    box: [box_x0 + 20, -box_w / 2 + 20, box_z0 + 10, 520, 320, 460]
    mass: {basis: declared, total_kg: 40, maturity: estimate, source: "Older block model"}
  - id: DB-07
    name: Gas bottle, 9 kg, empty
    system: drawbar
    zone: drawbar_box
    for: {k: [0, 1]}
    box: [box_x0 + 20 + k * 340, box_w / 2 - 20 - 320, box_z0 + 10, 320, 320, 500]
    mass: {basis: declared, unit_kg: 8.5, maturity: estimate, source: "Older block model: two full bottles 34 kg, split into bottle and gas"}
  - id: DB-08
    name: LPG in the bottles
    system: drawbar
    load: gas
    zone: drawbar_box
    for: {k: [0, 1]}
    point: [box_x0 + 20 + k * 340 + 160, box_w / 2 - 20 - 160, box_z0 + 10 + 200]
    mass: {basis: declared, unit_kg: 8.5, maturity: estimate, source: "Older block model: two full bottles 34 kg, split into bottle and gas"}
  - id: DB-09
    name: Petrol and diesel in jerry cans
    system: drawbar
    load: fuel
    zone: drawbar_box
    box: [box_x0 + 20, -box_w / 2 + 360, box_z0 + 10, 300, 360, 450]
    mass: {basis: declared, total_kg: 17, maturity: estimate, source: "Older block model"}

  # ================================================================ chassis
  - id: CH-01
    name: Main rail
    system: chassis
    for: {s: [-1, 1]}
    box: [body_x0, s * rail_c - rail_w / 2, rail_underside_z, body_length, rail_w, rail_h]
    mass: {basis: per_length, kg_per_m: 11.6, measure: dx, maturity: estimate, source: "Older block model section, RHS 150 x 50 x 4 at 11.6 kg/m (the engineer sizes it)"}
  - id: CH-02
    name: Raiser on the rail
    system: chassis
    for: {s: [-1, 1]}
    box: [body_x0, s * rail_c - rail_w / 2, rail_top_z, body_length, rail_w, raiser_h]
    mass: {basis: per_length, kg_per_m: 6.6, measure: dx, maturity: estimate, source: "Block size for this layout, 100 x 50 x 3 RHS at 6.6 kg/m on packers (estimate)"}
    note: Fills the gap from the rail top to the floor underside (report 06 section 8). Deeper rails would do the same job.
  - id: CH-03
    name: Suspension mounts, gussets and shock plates
    system: chassis
    point: [axle_x, 0, rail_underside_z + rail_h / 2]
    mass: {basis: declared, total_kg: 50, maturity: estimate, source: "Older block model"}

  # ================================================================ running gear (report 06)
  - id: RG-01
    name: Cruisemaster XT Freestyle Air (4,500 kg build), arm, Firestone style 26 airbag, hub drum and 12 inch electric brake
    system: running_gear
    for: {h: [front_hub_dx, rear_hub_dx], s: [-1, 1]}
    box: [axle_x + h - 419, s * (rail_outer_w / 2 + (hub_y - rail_outer_w / 2) / 2) - (hub_y - rail_outer_w / 2) / 2, hub_z - 60, 480, hub_y - rail_outer_w / 2, rail_underside_z - hub_z + 60]
    cog: [axle_x + h - 150, s * (rail_outer_w / 2 + 60), hub_z + 40]
    mass: {basis: declared, unit_kg: 45, maturity: estimate, source: "https://www.diycaravans.com.au/shop/cruisemaster-xt-freestyle-coil-suspension-kit-tandem/", note: "180 kg per tandem kit for the coil version (retailer listing), a quarter per wheel. The air kit's weight is not published"}
  - id: RG-02
    name: Wheel and tyre, Porsche 8J x 18 ET53 with 255/55 R18 109H
    system: running_gear
    for: {h: [front_hub_dx, rear_hub_dx], s: [-1, 1]}
    cyl: {c: [axle_x + h, s * hub_y, hub_z], r: tyre_d / 2, w: tyre_section}
    mass: {basis: declared, unit_kg: 26, maturity: estimate, source: "Estimate: wheel about 11 kg and tyre about 15 kg. Neither is published in reports 06 and 07"}
    note: The wheel's load rating is not published (report 07). Each wheel needs about 984 kg under VSB1's 120% rule.
  - id: RG-03
    name: Bosch TSC kit (ABS and sway control) and wheel nuts
    note: The ECU sits under the centre crossmember, within 300 mm of the centreline (Bosch, report 06).
    system: running_gear
    box: [axle_x + xt_centre_front, -100, rail_underside_z - 45, xm_w, 200, 45]
    mass: {basis: declared, total_kg: 4.2, maturity: estimate, source: "Report 06: TSC 2 to 3 kg and nuts 1.2 kg (estimates)"}
  - id: RG-04
    name: XT Air supply, 12 V compressor, 11 litre tank, gauges, pressure switch, height valves and air lines
    note: Low in the front zone against partition A on the road side, where it stays dry and out of the garage. The lines run along the rails to the four bags.
    system: running_gear
    zone: front
    box: [part_a_x - 400, -half_in, floor_z, 400, 300, 300]
    mass: {basis: declared, total_kg: 10, maturity: estimate, source: "Report 06 section 2: 8 to 12 kg for the compressor, tank, panel and lines (estimate, not published)"}
  - id: RG-05
    name: Spare Firestone style 26 airbag with fittings, tube and Loctite 567
    note: A punctured bag cannot be repaired (Cruisemaster CIS-006), so the spare travels with the trailer.
    system: running_gear
    zone: front
    box: [part_a_x - 400, -half_in + 320, floor_z, 400, 300, 150]
    mass: {basis: declared, total_kg: 3, maturity: estimate, source: "Report 06 section 2: 2.4 kg bag (Firestone style 26 sheet) plus fittings (estimate)"}

  # ================================================================ body shell (masses per area from the older block model)
  - id: BD-01
    name: Floor panel
    system: body
    box: [body_x0, -half_bw, floor_underside_z, body_length, body_width, floor_t]
    mass: {basis: per_area, kg_per_m2: 8.0, measure: dx * dy, maturity: estimate, source: "Older block model: 115 kg for a 6.0 x 2.4 m floor"}
  - id: BD-02
    name: Roof panel (pop-top roof designed later)
    system: body
    box: [body_x0, -half_bw, ceiling_z, body_length, body_width, roof_t]
    mass: {basis: per_area, kg_per_m2: 5.56, measure: dx * dy, maturity: estimate, source: "Older block model: 80 kg for a 6.0 x 2.4 m roof"}
  - id: BD-03
    name: Side wall
    system: body
    for: {s: [-1, 1]}
    box: [body_x0, s * (half_bw - wall_t / 2) - wall_t / 2, floor_z, body_length, wall_t, interior_h]
    mass: {basis: per_area, kg_per_m2: 5.0, measure: dx * dz, maturity: estimate, source: "Older block model: 69 kg for a 6.0 x 2.3 m wall. Door openings are not taken off"}
  - id: BD-04
    name: End wall
    system: body
    for: {e: [0, 1]}
    box: [body_x0 + e * (body_length - end_wall_t), -half_in, floor_z, end_wall_t, 2 * half_in, interior_h]
    mass: {basis: per_area, kg_per_m2: 5.0, measure: dy * dz, maturity: estimate, source: "Older block model wall panel rate"}
  - id: BD-05
    name: Garage door, kerb side, top-hinged
    system: body
    box: [module_x0 + mod_door_x0, half_in, floor_z, mod_door_x1 - mod_door_x0, wall_t, mod_door_h]
    mass: {basis: declared, total_kg: 45, maturity: estimate, source: "Older block model (garage door)"}
    note: Opening as DESIGN.md. Product and structure come with the body design.
  - id: BD-06
    name: Utility zone door, road side
    system: body
    box: [fz_door_x, -half_bw, floor_z, fz_door_w, wall_t, fz_door_h]
    mass: {basis: declared, total_kg: 20, maturity: estimate, source: "Older block model"}
    note: PLACEHOLDER side and position, from the older block model.
  - id: BD-07
    name: Entry door, kerb side
    system: body
    box: [rz_door_x, half_in, floor_z, rz_door_w, wall_t, rz_door_h]
    mass: {basis: declared, total_kg: 20, maturity: estimate, source: "Older block model"}
    note: PLACEHOLDER position. VSB1 13.2.1 wants one door on the left side or the rear.
  - id: BD-08
    name: Corner extrusions, adhesive and sealant
    system: body
    point: [body_x0 + body_length / 2, 0, floor_z + interior_h / 2]
    mass: {basis: declared, total_kg: 50, maturity: estimate, source: "Older block model (6.0 m body)"}
  - id: BD-09
    name: Windows and hatches
    system: body
    point: [body_x0 + body_length / 2, 0, floor_z + 1300]
    mass: {basis: declared, total_kg: 50, maturity: estimate, source: "Older block model (6.0 m body)"}
  - id: BD-10
    name: Corner legs and mud flaps
    system: body
    point: [body_x0 + body_length / 2, 0, rail_underside_z]
    mass: {basis: declared, total_kg: 25, maturity: estimate, source: "Older block model: stone guard, legs and mud flaps 40 kg, split 15 in DB-04 and 25 here"}
  - id: BD-11
    name: Wiring, plumbing, lighting and hardware
    system: body
    point: [body_x0 + body_length / 2, 0, floor_z + 400]
    mass: {basis: declared, total_kg: 60, maturity: estimate, source: "Older block model (6.0 m body)"}
  - id: BD-12
    name: Pop-top lift mechanism and skirt (allowance)
    system: body
    point: [body_x0 + body_length / 2, 0, roof_top_z]
    mass: {basis: declared, total_kg: 45, maturity: estimate, source: "Older block model allowance. The roof is designed later"}
  - id: BD-13
    name: Awning, kerb side
    system: body
    box: [body_x0 + 300, half_bw, ceiling_z - 160, body_length - 600, 100, 120]
    mass: {basis: declared, total_kg: 35, maturity: estimate, source: "Older block model"}
    note: PLACEHOLDER product. It may stand at most 100 mm proud of the 2,400 mm body to stay inside VSB1's 2,500 mm width.

  # ================================================================ roof
  - id: RF-01
    name: Solar panel, 400 W
    system: roof
    for: {k: [0, 1], s: [-1, 1]}
    box: [body_x0 + (body_length - 2 * 1722) / 2 + k * 1722, "min(0, s * 1134)", roof_top_z + 20, 1722, 1134, 30]
    mass: {basis: declared, unit_kg: 22.5, maturity: estimate, source: "Older block model (1,722 x 1,134 x 30 mm panel)"}

  # ================================================================ under the floor (positions are PLACEHOLDERS until the XT kit drawing and the engineer)
  - id: UF-01
    name: Water tank
