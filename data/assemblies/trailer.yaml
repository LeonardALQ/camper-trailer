# Whole-trailer block layout (TRAILER.md). Every block is an envelope with a mass, placed in the project datum
# DIM-01 (research/02): X along the trailer from the coupling ball centre, positive rearward. Y across from the
# centreline, positive to the road (right) side. Z up from the ground with the trailer level at design ride height.
# Units are mm and kg.
#
# Revision H, 20 Nov 2026: the trailer for the LandCruiser 79 (report 18, layout 1). The bikes ride in the ute's
# bike box (UTE-GARAGE.md), so the garage and bed module is gone. The queen bed lies across the front of a 4,420 mm
# body with the kitchen slide-out, the air-conditioner and storage under it. The roof is fixed, 1,950 mm inside. The
# generator and the jerry cans ride in a sealed drawbar box behind the stone guard (decision log 12:45). Inside the
# body, u is the distance from the front wall's inner face (X = in_x0 + u).
#
# Any number may be an expression over `params`. axle_x is set by the axle solve (cad/trailer.py), which never changes
# a limit or a block size.
id: ASM-TR
name: Whole trailer, block layout
revision: H

params:
  # ---------------------------------------------------------------- owner options (report 13), defaults until the owner answers
  opt_dryer: 0               # 0: Camec 3.5 kg washer only (report 13 default). 1: Whirlpool WWPB8502IW washer-dryer, 66 kg
  opt_batteries: 2           # Victron Lithium NG 25.6 V 200 Ah modules of 5.12 kWh: 2 gives 10.24 kWh (report 13 default), 3 gives 15.36 kWh
  # ---------------------------------------------------------------- body (report 18 section 4.1)
  body_length: 4420
  body_width: 2400
  half_bw: body_width / 2
  wall_t: 35                 # side walls, report 12's 35 mm panel (2,330 mm inside)
  end_wall_t: 35             # front and rear walls
  half_in: half_bw - wall_t
  interior_h: 1950           # fixed roof, standing room (decision log 12:10, report 18 section 2)
  floor_t: 30                # report 12's floor panel
  roof_t: 40                 # report 12's 40 mm roof panel, bonded to the walls
  # ---------------------------------------------------------------- running gear (reports 06 and 16, report 18 section 3.4)
  tyre_d: 805                # LT265/75R16 123/120, the ute's tyre (report 16, Yokohama G015)
  tyre_w: 272                # tyre envelope width (estimate, report 18 open question 9)
  slr_deflection: 20         # static loaded radius = free radius less 20 mm (estimate, report 06 section 7)
  hub_z: tyre_d / 2 - slr_deflection
  hub_below_rail: 215        # Cruisemaster XT standard arm at ride height: air 205 to 230 (coil 215 +/- 60), spec
  bump_travel: 60            # XT bump travel (spec)
  tyre_clearance: 50         # tyre at full bump to the floor underside (estimate, report 06 open question 9)
  axle_spacing: 900          # LC5 M14 hubs at 900 mm (decision log 11:25), 95 mm between the 805 mm tyres
  wheel_offset: 0            # ET 0 on the ROH Trak 2 16 x 7, the ute's wheel (report 16)
  cf: 190                    # hub face from the rail outside face, C/F (measurements.yaml SUP-04). Effective C/F at most 200 mm
  rail_outer_w: 1175         # rail outer width, set for the 1,555 mm track (report 18 section 3.4)
  track: rail_outer_w + 2 * (cf - wheel_offset)   # 1,555 mm, the ute's front track, so the trailer runs in its ruts
  rail_underside_z: hub_z + hub_below_rail
  floor_underside_z: hub_z + bump_travel + tyre_d / 2 + tyre_clearance
  floor_z: floor_underside_z + floor_t        # floor surface
  ceiling_z: floor_z + interior_h
  roof_top_z: ceiling_z + roof_t
  # ---------------------------------------------------------------- chassis (CHASSIS.md sizes them)
  rail_h: 150                # RHS 150 x 50 x 3 rail
  rail_w: 50                 # Cruisemaster: 50 mm wide sections
  rail_top_z: rail_underside_z + rail_h
  raiser_h: floor_underside_z - rail_top_z
  rail_c: rail_outer_w / 2 - rail_w / 2         # rail centreline from the trailer centreline
  rail_in: rail_outer_w / 2 - rail_w            # inner face of a rail
  hub_y: rail_outer_w / 2 + cf - wheel_offset   # tyre centre plane
  xm_w: 50                   # crossmember width along X
  xm_max_pitch: 700          # rule for the intermediate crossmembers and outriggers (report 11), the engineer confirms it
  # XT positions about the axle group centre at 900 mm spacing (report 18 section 4.3, from drawing 33XT with the arm unchanged)
  xt_front_hinge_rear: -869
  xt_centre_front: -19
  xt_rear_shock_front: 811
  front_hub_dx: -axle_spacing / 2
  rear_hub_dx: axle_spacing / 2
  battery_l: max(600, 130 + 235 * opt_batteries)   # sealed battery box, the modules on their sides 235 mm each along X (report 13 section 2)
  battery_from_rear: 400     # battery centre from the rear wall's inner face (owner's brief)
  battery_x0: in_x1 - battery_from_rear - battery_l / 2
  # ---------------------------------------------------------------- coupling and drawbar (report 08, report 18 sections 3.5 and 3.6)
  coupling_z: 440            # coupling point at the ute's laden ball height, +/- 20 (measurements.yaml UTE-01 sets it)
  drawbar_length: 1820       # ball centre to the body front, as designed (report 18 section 3.6)
  db_depth: 150              # drawbar members, same depth as the rails, run under them (report 08 option 1)
  db_apex_x: 250             # rear of the coupling head plate
  db_apex_y: 60
  db_tail: 1000              # drawbar members run on under the rails this far behind the body front
  sg_l: 570                  # stone guard length along X
  spare_bracket_d: 60        # spare wheel bracket depth off the front wall (estimate)
  spare_z: floor_z + 400     # spare wheel centre height on the front wall (layout choice, clear of the drawbar)
  # the sealed drawbar box for the generator and the jerry cans (decision log 12:45)
  dbx_x0: 1150               # behind the jockey clamp at X 1,000 and the stone guard, outside the bike box's sweep (JK-01)
  dbx_l: 320                 # to X 1,470, 18 mm ahead of the spare tyre
  dbx_w: 960
  dbx_h: 520
  dbx_t: 2                   # 2 mm aluminium walls and lid
  dbx_z0: rail_underside_z   # on brackets across the drawbar members' tops
  # ---------------------------------------------------------------- the body positions
  body_x0: drawbar_length
  body_x1: drawbar_length + body_length
  in_x0: body_x0 + end_wall_t
  in_x1: body_x1 - end_wall_t
  # ---------------------------------------------------------------- the zones inside the body (report 18 section 1.2)
  bed_u1: 1650               # bed zone u 0 to 1,650
  living_u1: 3350            # living zone to u 3,350, the rear zone to the rear wall
  bed_x1: in_x0 + bed_u1
  rear_x0: in_x0 + living_u1
  deck_h: 537                # clear height under the bed deck
  deck_t: 20
  deck_z: floor_z + deck_h   # bed deck underside
  mattress_t: 150
  froli_h: 43
  mattress_z: deck_z + deck_t + froli_h       # mattress underside, its top at floor + 750
  lz_kitchen_x: body_x0 + 150   # kitchen slide-out opening 150 mm from the front corner (report 12 section 5)
  lz_kitchen_l: 1500
  lz_door_x: 3775            # entry door, kerb side, 300 mm of full wall behind the kitchen opening's 625 mm cut-out (BDY-18)
  lz_door_w: 622             # Aussie Traveller DC door (report 12 section 7)
  lz_door_h: 1623
  # ---------------------------------------------------------------- axle (solved)
  axle_x: 4247               # axle group centre from the ball. The build solves it for the towball target
  # ---------------------------------------------------------------- water
  water_full_l: 400          # owner's wanted capacity, all of it in the trailer now
  water_highway_l: 50        # owner's highway figure
  tank_z0: rail_underside_z
  tank_h: floor_underside_z - 10 - rail_underside_z
  tank_w: 2 * rail_in - 100  # 50 mm each side for the airbag and shock mounts (estimate until the kit drawing)
  tank_f_x0: axle_x + xt_front_hinge_rear + 10
  tank_f_l: xt_centre_front - 10 - (xt_front_hinge_rear + 10)          # 830 mm
  tank_r_x0: axle_x + xt_centre_front + xm_w + 10
  tank_r_l: xt_rear_shock_front - 10 - (xt_centre_front + xm_w + 10)   # 760 mm
  # ---------------------------------------------------------------- equipment (report 13)
  diesel_l: 15               # heater fuel tank (report 13 open question 6)
  diesel_tank_l: 440         # 440 x 400 x 100 mm HDPE tank, 17.6 L gross (estimate)
  diesel_tank_x0: axle_x + xt_front_hinge_rear - xm_w - 60 - diesel_tank_l   # ahead of the XT front hinge crossmember, in the braced bay
  solar_l: 2054              # Sunman eArc SMF430F-12X12UW, 2,054 x 1,084 x 2 mm, bonded to the roof (report 13 section 4)
  solar_w: 1084
  solar_x0: body_x0 + 156    # array 4,108 x 2,168 mm, centred on the 4,420 mm roof, no roof hatches (report 18 section 1.2)

# The trailer's wheel and hub, shared with the ute (report 16). WHL-01 in measurements.yaml is the wheel's load rating,
# and MAS-09 checks it against the per-wheel load MAS-06 uses.
wheel:
  name: "ROH Trak 2 16 x 7 ET 0 steel, 5 x 150, the ute's wheel"
  offset_mm: 0
  pcd: "5 x 150"
  spigot_mm: 110
  hub: "Cruisemaster LC5 M14 (5 x 150), 110 mm spigot, on the 12 inch ABS-enabled A/T drum (decision log 11:25)"
  tyre: "LT265/75R16 123/120 load range E, Yokohama Geolandar A/T G015, 1,550 kg"
  src: "Report 16 section 4 and the decision log. One spare on the trailer and one under the ute's tray, each fitting both"

# Crossmember stations that the layout fixes (front face X). The build adds intermediate stations so that no gap
# between two of them exceeds xm_max_pitch. `keep_out` gaps are bays for tanks and the battery, where no
# intermediate station goes. The chassis design (data/chassis/chassis.yaml, CHASSIS.md) gives each station its
# crossmember section and an outrigger each side, and adds the rails, raisers, drawbar and fittings.
crossmembers:
  fixed:
    - {id: front, x: body_x0}
    - {id: diesel bay, x: diesel_tank_x0 - 10 - xm_w}
    - {id: XT front hinge, x: axle_x + xt_front_hinge_rear - xm_w}
    - {id: XT centre, x: axle_x + xt_centre_front}
    - {id: XT rear shock, x: axle_x + xt_rear_shock_front}
    - {id: battery-bay, x: battery_x0 - 10 - xm_w}
    - {id: rear, x: body_x1 - xm_w}
  keep_out: [[diesel bay, XT front hinge], [XT front hinge, XT centre], [XT centre, XT rear shock], [battery-bay, rear]]

# Zones for the fit checks: box [x0, y0, z0, dx, dy, dz]. Items name their zone. A `keep_clear` item is floor
# space that must stay free (door landings, walkways). Keep-clear spaces may overlap one another, but no solid
# item may enter one.
zones:
  inside: {name: Inside the body, box: [in_x0, -half_in, floor_z, in_x1 - in_x0, 2 * half_in, interior_h]}
  drawbar_box: {name: Drawbar box (inside), box: [dbx_x0 + dbx_t, -dbx_w / 2 + dbx_t, dbx_z0 + dbx_t, dbx_l - 2 * dbx_t, dbx_w - 2 * dbx_t, dbx_h - 2 * dbx_t]}
  underfloor: {name: Under the floor between the rails, box: [body_x0, -rail_in, rail_underside_z - 10, body_length, 2 * rail_in, floor_underside_z - rail_underside_z + 10]}

items:
  # ================================================================ running gear (reports 06 and 16)
  - id: RG-01
    name: Cruisemaster XT Freestyle Air (4,500 kg build), arm, Firestone style 26 airbag, LC5 M14 hub drum and 12 inch ABS-enabled electric brake
    note: "Hub: Cruisemaster LC5, 5 x 150 with M14 studs and a 110 mm spigot, the ute's pattern, on the 12 inch ABS-enabled A/T electric drum (decision log 11:25)."
    system: running_gear
    for: {h: [front_hub_dx, rear_hub_dx], s: [1, -1]}
    box: [axle_x + h - 419, s * (rail_outer_w / 2 + (hub_y - rail_outer_w / 2) / 2) - (hub_y - rail_outer_w / 2) / 2, hub_z - 60, 480, hub_y - rail_outer_w / 2, rail_underside_z - hub_z + 60]
    cog: [axle_x + h - 150, s * (rail_outer_w / 2 + 60), hub_z + 40]
    mass: {basis: declared, unit_kg: 45, maturity: estimate, source: "https://www.diycaravans.com.au/shop/cruisemaster-xt-freestyle-coil-suspension-kit-tandem/", note: "180 kg per tandem kit for the coil version (retailer listing), a quarter per wheel. The air kit's weight is not published"}
  - id: RG-02
    name: Tyre, LT265/75R16 123/120 load range E, Yokohama Geolandar A/T G015
    system: running_gear
    for: {h: [front_hub_dx, rear_hub_dx], s: [1, -1]}
    cyl: {c: [axle_x + h, s * hub_y, hub_z], r: tyre_d / 2, w: tyre_w}
    mass: {basis: declared, unit_kg: 22.6, maturity: spec, source: "Yokohama's size table, 22.6 kg (report 16 section 4)"}
    note: Rated 1,550 kg (load index 123), 80 psi maximum. The ute's tyre. The cylinder is the wheel and tyre envelope.
  - id: RG-06
    name: Wheel, ROH Trak 2 16 x 7 ET 0 steel, 5 x 150
    system: running_gear
    for: {h: [front_hub_dx, rear_hub_dx], s: [1, -1]}
    point: [axle_x + h, s * hub_y, hub_z]
    mass: {basis: declared, unit_kg: 14.5, maturity: estimate, source: "Report 16 section 4: ROH does not publish it (estimate)"}
    note: Rated 1,400 kg (measurements.yaml WHL-01). Its mass sits at the hub centre, inside the tyre envelope (RG-02).
  - id: RG-03
    name: Bosch TSC kit (ABS and sway control) and wheel nuts
    note: The ECU sits under the centre crossmember, within 300 mm of the centreline (Bosch, report 06).
    system: running_gear
    box: [axle_x + xt_centre_front, -100, rail_underside_z - 45, xm_w, 200, 45]
    mass: {basis: declared, total_kg: 4.2, maturity: estimate, source: "Report 06: TSC 2 to 3 kg and nuts 1.2 kg (estimates)"}
  - id: RG-04
    name: XT Air supply, 12 V compressor, 11 litre tank, gauges, pressure switch, height valves and air lines
    note: On a shelf over the diesel heater, against the bathroom's front wall. The lines run along the rails to the four bags.
    system: running_gear
    zone: inside
    box: [rear_x0 - 425, 282, floor_z + 350, 400, 300, 300]
    mass: {basis: declared, total_kg: 10, maturity: estimate, source: "Report 06 section 2: 8 to 12 kg for the compressor, tank, panel and lines (estimate, not published)"}
  - id: RG-05
    name: Spare Firestone style 26 airbag with fittings, tube and Loctite 567
    note: A punctured bag cannot be repaired (Cruisemaster CIS-006), so the spare travels with the trailer. It sits on the air supply.
    system: running_gear
    zone: inside
    box: [rear_x0 - 425, 282, floor_z + 650, 400, 300, 150]
    mass: {basis: declared, total_kg: 3, maturity: estimate, source: "Report 06 section 2: 2.4 kg bag (Firestone style 26 sheet) plus fittings (estimate)"}

  # ================================================================ spare wheel on the front wall (one of the plan's two, the other under the ute's tray)
  - id: SP-01
    name: Spare tyre, LT265/75R16 123/120
    system: spare
    box: [body_x0 - spare_bracket_d - tyre_w, -tyre_d / 2, spare_z - tyre_d / 2, tyre_w, tyre_d, tyre_d]
    mass: {basis: declared, total_kg: 22.6, maturity: spec, source: "As RG-02"}
    note: On the body's front wall above the drawbar, centred on Y. It fits the ute too. The box is the wheel and tyre envelope.
  - id: SP-02
    name: Spare wheel, ROH Trak 2 16 x 7 ET 0
    system: spare
    point: [body_x0 - spare_bracket_d - tyre_w / 2, 0, spare_z]
    mass: {basis: declared, total_kg: 14.5, maturity: estimate, source: "As RG-06 (report 16 section 4)"}

  # ================================================================ body shell (BODY.md, report 12, fixed roof, report 18 section 3.1)
  - id: BD-01
    name: Floor, 30 mm woven roving and Divinycell H80 sandwich, one piece, with vinyl
    system: body
    box: [body_x0, -half_bw, floor_underside_z, body_length, body_width, floor_t]
    parts:
      - {item: "Floor panel, 10.61 m2 at 8.92 kg/m2 (two 3.22 kg/m2 woven roving skins, 2.08 kg/m2 of H80, 0.4 kg/m2 of adhesive)", kg: 94.6, basis: calculated, source: "Report 12 sections 2 and 10"}
      - {item: "GRP crush tubes and HD PVC inserts at the 32 body mounts", kg: 3.0, basis: estimate}
      - {item: "Vinyl over the 10.1 m2 inside at 1.5 kg/m2", kg: 15.2, basis: estimate}
  - id: BD-02
    name: Fixed roof, 40 mm GRP and XPS sandwich, bonded to the walls, flat top skin under the solar array
    system: body
    box: [body_x0, -half_bw, ceiling_z, body_length, body_width, roof_t]
    parts:
      - {item: "Roof panel, 10.61 m2 at 7.0 kg/m2, no hatches", kg: 74.3, basis: calculated, source: "Report 12 section 10, report 18 section 2"}
      - {item: Insert strips for the awning rail and the cable glands, kg: 1.3, basis: estimate}
  - id: BD-03
    name: Side walls, 35 mm GRP and XPS sandwich, one piece each, 1,950 mm tall
    system: body
    for: {s: [1, -1]}
    box: [body_x0, s * (half_bw - wall_t / 2) - wall_t / 2, floor_z, body_length, wall_t, interior_h]
    parts:
      - {item: "8.62 m2 less the wall's openings at 6.0 kg/m2: road side less 0.62 m2 (desk window, cassette door, bathroom vent), kerb side less 2.13 m2 (kitchen, entry door, two windows)", kg: "48.0 * (1 + s) / 2 + 38.9 * (1 - s) / 2", basis: calculated, source: "Report 12 section 10, report 18 section 1.2"}
      - {item: Insert strips, kg: 3.0, basis: estimate}
  - id: BD-04
    name: End walls, full height, no rear portal
    system: body
    for: {e: [0, 1]}
    box: [body_x0 + e * (body_length - end_wall_t), -half_in, floor_z, end_wall_t, 2 * half_in, interior_h]
    parts:
      - {item: "Front wall 4.18 m2 at 6.7 kg/m2 (2.0 mm outer skin against stones) or rear wall 4.27 m2 at 6.0 kg/m2, less their windows", kg: "28.0 * (1 - e) + 25.6 * e", basis: calculated, source: "Report 12 section 10"}
      - {item: Brackets, kg: 0.5, basis: estimate}
  - id: BD-07
    name: Entry door, Aussie Traveller DC 1,623 x 622, kerb side, hinged on its front edge
    system: body
    box: [lz_door_x, -half_in - wall_t, floor_z, lz_door_w, wall_t, lz_door_h]
    mass: {basis: declared, total_kg: 25, maturity: estimate, source: "Report 12 section 7: retailer listing, possibly a shipping mass"}
    note: VSB1 13.2.1 wants one door on the left side or the rear. The cut-out is 1,626 x 625 mm with a 90 mm top radius.
  - id: BD-08
    name: Extrusions, adhesive, sealant and the body mount fixings
    system: body
    point: [body_x0 + body_length / 2, 0, floor_z + interior_h / 2]
    parts:
      - {item: "Floor joiners 13.6 m at 1.4 kg/m, corner joiners 7.8 m at 2.0 kg/m, roof-to-wall joiner 13.6 m at 1.65 kg/m in place of the pop-top ring", kg: 57.0, basis: estimate, source: "Scaled from DIY Caravans' extrusion masses to 35 mm panels (report 12 section 10)"}
      - {item: Adhesive and sealant, kg: 6.5, basis: estimate}
      - {item: "32 M12 8.8 mount bolts and 100 x 100 x 3 aluminium spreaders", kg: 5.0, basis: estimate}
  - id: BD-09
    name: Windows, vents and the dust fan
    system: body
    point: [body_x0 + body_length / 2, 0, floor_z + 1300]
    parts:
      - {item: "Dometic S4 windows 900 x 500 road side, 800 x 400 front and 600 x 450 rear (scaled by area)", kg: 20.8, basis: estimate}
      - {item: "Two Dometic S4 windows 500 x 450, kerb side, one of them the second way out over the bed", kg: 10.0, basis: maker}
      - {item: "Bathroom vent in the road-side wall, Carafan Sahara CP700 with ducts, kitchen opening frame, cassette door", kg: 17.4, basis: estimate}
  - id: BD-10
    name: Mud flap behind the rear wheel, 610 x 455 mm rubber, on a galvanised hanger from the XT rear shock outrigger
    system: body
    for: {s: [1, -1]}
    point: [axle_x + rear_hub_dx + tyre_d / 2 + 60, s * hub_y, 530]
    parts:
      - {item: "Flap 24X18B, 610 x 455 x 6 mm at 1,500 kg/m3", kg: 2.5, basis: calculated, source: "https://www.thebossshop.com.au/mudflap-rubber-610mmw-x-455mml-black"}
      - {item: Hanger and bolts, kg: 2.1, basis: estimate}
    note: The bottom edge hangs at Z 300 or lower (VSB1 10.2.2, approach 2 for off-road). The corner steadies are CH-B01 (CHASSIS.md).
  - id: BD-11
    name: Wiring, plumbing, lighting and hardware
    system: body
    point: [body_x0 + body_length / 2, 0, floor_z + 400]
    mass: {basis: declared, total_kg: 60, maturity: estimate, source: "Older block model, kept until the systems design (report 12 section 10)"}
  - id: BD-13
    name: Awning, Fiamma F45s 450, kerb side, below the roof line
    system: body
    box: [body_x0 + 95, -half_bw - 100, ceiling_z - 160, 4230, 100, 120]
    parts:
      - {item: "Fiamma F45s 450, 4,230 mm case", kg: 29.5, basis: maker, source: "https://www.fiammausa.com/en/f45s-en.html"}
      - {item: Wall brackets and bolts, kg: 2.0, basis: estimate}
    note: Case 4,230 mm, 2,500 mm extension. It may stand at most 100 mm proud of the 2,400 mm body (VSB1 5.2).

  # ================================================================ roof
  - id: RF-01
    name: Solar panel, Sunman eArc SMF430F-12X12UW, 430 W, glass-free and frameless, bonded to the roof
    system: roof
    for: {k: [0, 1], s: [1, -1]}
    box: [solar_x0 + k * solar_l, "min(0, s * solar_w)", roof_top_z, solar_l, solar_w, 2]
    mass: {basis: declared, unit_kg: 7.3, maturity: spec, source: "https://www.master-instruments.com.au/files/battery_information/e_arc_doing_more_web.pdf", note: "Sunman brochure, 7.3 kg each (report 13 section 4)"}
    note: Four panels in two pairs, each pair in series to its own MPPT. The roof has no hatches, so the whole 4,108 x 2,168 mm array fits.
  - id: RF-02
    name: Panel adhesive and cable
    system: roof
    point: [solar_x0 + solar_l, 0, roof_top_z]
    mass: {basis: declared, total_kg: 2.0, maturity: estimate, source: "Report 13 section 4: adhesive and cable as Sunman specifies, about 2 kg (estimate)"}

  # ================================================================ under the floor (the tanks, guards and diesel tank move with the axle group)
  - id: UF-01
    name: Water tank, front suspension bay
    system: underfloor
    zone: underfloor
    box: [tank_f_x0, -tank_w / 2, tank_z0, tank_f_l, tank_w, tank_h]
    tank: true
    mass: {basis: declared, unit_kg: 19.3, maturity: calculated, source: "Report 13 section 5's 18.8 kg tank (custom welded HDPE, 6 mm walls, two cross baffles and one lengthwise) scaled by area to 830 mm (report 18 section 1.1)"}
    note: Between the XT front hinge and centre crossmembers, over the front axle. About 220 L net (report 18 open question 8). It sits on two aluminium angle bearers bolted to the XT crossmembers on 10 mm rubber, held by two padded stainless straps, never hung from the floor.
  - id: UF-01R
    name: Water tank, rear suspension bay
    system: underfloor
    zone: underfloor
    box: [tank_r_x0, -tank_w / 2, tank_z0, tank_r_l, tank_w, tank_h]
    tank: true
    mass: {basis: declared, unit_kg: 18.3, maturity: calculated, source: "As UF-01, scaled to 760 mm (report 18 section 1.1)"}
    note: Between the XT centre and rear shock crossmembers, over the rear axle. About 200 L net.
  - id: UF-02
    name: Water in the tanks
    system: underfloor
    load: water
    water: true
    mass: {basis: declared, total_kg: 0, maturity: spec, source: "Load case water volume, 1 kg per litre"}
  - id: UF-03
    name: Tank guards
    system: underfloor
    box: [axle_x + xt_front_hinge_rear, -rail_in, rail_underside_z - 6, xt_rear_shock_front - xt_front_hinge_rear, 2 * rail_in, 6]
    mass: {basis: declared, total_kg: 20, maturity: estimate, source: "Older block model"}
  - id: UF-04
    name: Battery box, sealed 2 mm aluminium with lid gasket, cable glands, a vent to the road side and a fuse per battery
