    name: Road-side wall stiffener, RHS 110 x 19 x 3.5 aluminium on the inner skin, between the kitchen tower and the partition
    material: "6060-T5 aluminium RHS 110 x 19 x 3.5, made to order, bonded into a 19 mm channel the panel maker routs in the XPS from the inner face, 13 mm of XPS behind it, on a rigid PVC bearing block 20 mm above the floor joiner's inner leg and 10 mm under the top insert strip"
