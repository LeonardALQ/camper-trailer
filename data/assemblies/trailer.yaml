    mass: {basis: declared, unit_kg: 4.50, maturity: calculated, source: "1.941 m at 2.306 kg/m, 854 mm2 at 2.70 t/m3, with its 54 x 20 x 19 mm rigid PVC bearing block (calculated)"}
