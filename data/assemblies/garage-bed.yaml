# Garage and bed module assembly: placements from DESIGN.md (revision D), driven by named parameters.
# Module frame (DESIGN.md): origin on the garage floor at the rear face of partition A, on the trailer
# centreline. X rearward towards the rear door, Y to the kerb side, Z up. mm. The axes are the project
# datum's (DIM-01), so the module only moves: module X 0 sits at datum X module_x0 and Z 0 at the floor height.
# The bikes stand along the trailer, noses against partition A, and load through the rear door.
# Any number may be an expression over `params` (+ - * / and parentheses, min, max, abs, sqrt).
id: ASM-GB
name: Garage and bed module
revision: D

params:
  # Envelope
  interior_width: 2330
  half_width: interior_width / 2
  wall_t: 35
  garage_length: 2330       # partition A's rear face to the rear wall's inner face (revision D)
  partition_t: 20
  ceiling_z: 1800
  ceiling_limit_z: 2000
  body_x0: -partition_t     # context walls and floor start at partition A's front face (display only)
  body_x1: garage_length + wall_t
  # Bikes, along the trailer, side by side
  bike_spacing: 760
  tuareg_y: -600            # Tuareg towards the road-side wall, so the spare width is on the kerb side
  st_y: tuareg_y + bike_spacing
  front_tyre_x: 50          # chock nose allowance from partition A (measurements.yaml CHK-01)
  chock_rise: 25
  # Restraint: research/03 section 4 positions, two rows across the trailer
  front_row_x: 250          # 148 mm ahead of the Tuareg's front axle, 100 mm ahead of the Street Triple's
  rear_row_x: 2048          # 1,650 mm behind the Tuareg's front axle
  rear_row_y1: locker_y0    # the rear row stops at the gas locker
  tu_strap_dy: 450
  st_strap_dy: 400
  wheel_strap_dy: 250
  stow_row_y: 985           # short row along the kerb strip for the generator and jerry cans
  stow_row_x0: 700
  stow_row_x1: locker_x0 - 10
  track_w: 34.5
  track_h: 13.7
  fitting_h: 22
  # Bed stack
  beam_underside_z: 1460
  beam_h: 50
  beam_x: [233, 699, 1165, 1631, 2097]   # beams across the trailer, 466 mm pitch
  ledger_leg: 40
  ledger_t: 3
  deck_z: beam_underside_z + beam_h
  deck_t: 20
  deck_x0: -partition_t - cleat_leg      # the deck laps over partition A and the cleat on its living-area face
  deck_length: garage_length + partition_t + cleat_leg
  froli_z: deck_z + deck_t
  froli_h: 43
  mattress_z: froli_z + froli_h
  mattress_t: 150
  mattress_x: 1530           # along the trailer: the mattress lies across the trailer at the back of the deck
  mattress_y: 2030
  mattress_x0: garage_length - mattress_x
  bedding_allowance: 50
  # Partition A and the rear door
  partition_a_h: deck_z
  cleat_leg: 25
  door_y0: -1125             # rear door opening: road-side jamb 40 mm in from the wall
  door_y1: locker_y0         # kerb-side jamb at the gas locker's inner face
  door_h: 1440               # header at the bed beams (1,460 mm), less a 20 mm frame
  # Gas locker in the kerb-side rear corner (report 02 section 5.2), two 9 kg cylinders
  locker_l: 760
  locker_w: 380
  locker_h: 690
  locker_x0: garage_length - locker_l
  locker_y0: half_width - locker_w
  hatch_x0: locker_x0 + 30
  hatch_x1: garage_length - 30
  hatch_z0: 30
  hatch_z1: locker_h - 30
  cyl_d: 320                 # 9 kg cylinder envelope (older block model)
  cyl_h: 500
  # Kerb-strip stowage
  ramp_fold_l: 1524          # Black Widow MF-12038 folded
  ramp_fold_t: 152
  ramp_fold_w: 965
  ramp_y0: 620
  ramp_x0: garage_length - 10 - ramp_fold_l
  gen_l: 520                 # generator envelope (older block model)
  gen_w: 320
  gen_h: 460
  gen_x0: locker_x0 - 10 - gen_l
  fuel_l: 300                # jerry cans envelope (older block model)
  fuel_w: 360
  fuel_h: 450
  fuel_x0: gen_x0 - 20 - fuel_l
  # Placeholders for items DESIGN.md does not place exactly
  winch_z0: 650
  ladder_y: 1000             # kerb side, so the heavy items fit along partition A (TRAILER.md)
  ladder_length: 1580        # A-01 rev B: foot about 4 mm above the floor at 15 deg, closed by the rubber feet
  ladder_lean_deg: 15        # A-01 rev B: lean from vertical, into the living area
  living_floor_x0: -720      # start of the living-area floor shown under the ladder (display only)
  net_y0: -1100
  ground_drop: 869           # garage floor height at design ride height, from the trailer model (TRAILER.md revision D, 869.4 mm)

items:
  # ---------------------------------------------------------------- bikes
  - {ref: TU, part: BIKE-TU, group: bikes, label: Aprilia Tuareg 660 Rally, step: S11,
     bike: {centre_y: tuareg_y, front_tyre_x: front_tyre_x, front_rise: chock_rise}}
  - {ref: ST, part: BIKE-ST, group: bikes, label: Triumph Street Triple 765, step: S11,
     bike: {centre_y: st_y, front_tyre_x: front_tyre_x, front_rise: chock_rise}}
  # Variants used only by the checks (not exported, no mass)
  - {ref: TU-2263, part: BIKE-TU, group: bikes, label: "Tuareg with the photo-measured 2,263 mm length", check_only: true,
     bike: {centre_y: tuareg_y, front_tyre_x: front_tyre_x, front_rise: chock_rise, length: 2263}}
  - {ref: TU-1390, part: BIKE-TU, group: bikes, label: "Tuareg with the photo-measured 1,390 mm screen", check_only: true,
     bike: {centre_y: tuareg_y, front_tyre_x: front_tyre_x, front_rise: chock_rise, screen_top_z: 1390}}
  - {ref: TU-BAGS, part: BIKE-TU, group: bikes, label: "Tuareg's Mosko Moto panniers on their own", check_only: true,
     bike: {centre_y: tuareg_y, front_tyre_x: front_tyre_x, front_rise: chock_rise, luggage_only: true}}

  # ---------------------------------------------------------------- partition A
  - {ref: "1", part: P-01, group: partitions, label: Partition A (to the deck underside), step: S05,
     at: [-partition_t, -half_width, 0],
     params: {dx: partition_t, dy: interior_width, dz: partition_a_h, normal: x}}
  # Cleats on the living-area face, mitred at the corners (lengths are the long-point cut lengths)
  - ref: "4"
    part: P-02
    group: partitions
    label: Partition cleat
    copies:
      - {id: A-bottom, step: S05, cleat: {face_x: -partition_t, dir_x: -1, axis: y, at_u: -half_width, length: interior_width, at_z: 0, corner: floor}}
      - {id: A-top, step: S05, cleat: {face_x: -partition_t, dir_x: -1, axis: y, at_u: -half_width, length: interior_width, at_z: partition_a_h, corner: ceiling}}
      - {id: A-road, step: S05, cleat: {face_x: -partition_t, dir_x: -1, axis: z, at_u: -half_width, length: partition_a_h, at_z: 0, corner: wall_neg}}
      - {id: A-kerb, step: S05, cleat: {face_x: -partition_t, dir_x: -1, axis: z, at_u: half_width, length: partition_a_h, at_z: 0, corner: wall_pos}}

  # ---------------------------------------------------------------- gas locker
  - {ref: "21", part: G-15, group: safety, label: Gas locker (outside access only), step: S06,
     at: [locker_x0, locker_y0, 0], params: {dx: locker_l, dy: locker_w, dz: locker_h}}

  # ---------------------------------------------------------------- bed
  # Ledgers: 40x40x3 angle. The side-wall ledgers carry the beam ends, the ones on partition A and the rear
  # wall carry the deck edges.
  - ref: "5"
    part: B-05
    group: bed
    label: Ledger
    copies:
      - {id: on-A, step: S07, ledger: {wall: partition_a, length: interior_width, top_z: deck_z}}
      - {id: rear-wall, step: S07, ledger: {wall: rear, length: interior_width, top_z: deck_z}}
      - {id: road-wall, step: S07, ledger: {wall: road, length: garage_length, top_z: beam_underside_z}}
      - {id: kerb-wall, step: S07, ledger: {wall: kerb, length: garage_length, top_z: beam_underside_z}}
  - ref: "6"
    part: B-04
    group: bed
    label: Beam
    for: {x: beam_x}
    step: S07
    at: [x, -half_width, beam_underside_z]
    params: {length: interior_width, axis: y}
  - {ref: "7", part: B-03, group: bed, label: Deck and garage ceiling, step: S08,
     at: [deck_x0, -half_width, deck_z], params: {dx: deck_length, dy: interior_width, dz: deck_t, normal: z}}
  - ref: "8"
    part: B-02
    group: bed
    label: Froli Star Mobil pack
    step: S10
    copies:
      - {id: road, at: [mattress_x0, -mattress_y / 2, froli_z], params: {dx: mattress_x, dy: mattress_y / 2}}
      - {id: kerb, at: [mattress_x0, 0, froli_z], params: {dx: mattress_x, dy: mattress_y / 2}}
  - {ref: "9", part: B-01, group: bed, label: Mattress, step: S10,
     at: [mattress_x0, -mattress_y / 2, mattress_z], params: {dx: mattress_x, dy: mattress_y, dz: mattress_t}}
  # Ladder hooked on the deck edge at partition A: `at` is the deck end (X), ladder centreline (Y), deck top (Z)
  - {ref: "18", part: A-01, group: bed, label: Ladder (living area), step: S10,
     at: [deck_x0, ladder_y, froli_z], params: {length: ladder_length, lean_deg: ladder_lean_deg, dir: -1}}
  - {ref: "19", part: A-02, group: bed, label: Safety net (roof raised), step: S10,
     at: [0, net_y0, froli_z]}

  # ---------------------------------------------------------------- restraint
  - ref: "10"
    part: G-01
    group: restraint
    label: Condor chock
    step: S03
    copies:
      - {id: TU, at: [0, tuareg_y, 0], params: {face: x}}
      - {id: ST, at: [0, st_y, 0], params: {face: x}}
  - ref: "11"
    part: G-02
    group: restraint
    label: L-track row
    step: S03
    copies:
      - {id: front, at: [front_row_x, -half_width, -track_h], params: {length: interior_width, axis: y}}
      - {id: rear, at: [rear_row_x, -half_width, -track_h], params: {length: rear_row_y1 + half_width, axis: y}}
      - {id: stow, at: [stow_row_x0, stow_row_y, -track_h], params: {length: stow_row_x1 - stow_row_x0}}
  - ref: "12"
    part: G-03
    group: restraint
    label: Track fitting
    step: S11
    copies:
      - {id: TU-FR, at: [front_row_x, tuareg_y - tu_strap_dy, 0], params: {axis: y}}
      - {id: TU-FL, at: [front_row_x, tuareg_y + tu_strap_dy, 0], params: {axis: y}}
      - {id: TU-RR, at: [rear_row_x, tuareg_y - tu_strap_dy, 0], params: {axis: y}}
      - {id: TU-RL, at: [rear_row_x, tuareg_y + tu_strap_dy, 0], params: {axis: y}}
      - {id: TU-WR, at: [rear_row_x, tuareg_y - wheel_strap_dy, 0], params: {axis: y}}
      - {id: TU-WL, at: [rear_row_x, tuareg_y + wheel_strap_dy, 0], params: {axis: y}}
      - {id: ST-FR, at: [front_row_x, st_y - st_strap_dy, 0], params: {axis: y}}
      - {id: ST-FL, at: [front_row_x, st_y + st_strap_dy, 0], params: {axis: y}}
      - {id: ST-RR, at: [rear_row_x, st_y - st_strap_dy, 0], params: {axis: y}}
      - {id: ST-RL, at: [rear_row_x, st_y + st_strap_dy, 0], params: {axis: y}}
      - {id: ST-WR, at: [rear_row_x, st_y - wheel_strap_dy, 0], params: {axis: y}}
      - {id: ST-WL, at: [rear_row_x, st_y + wheel_strap_dy, 0], params: {axis: y}}
      - {id: GS-1, at: [fuel_x0 + 60, stow_row_y, 0]}
      - {id: GS-2, at: [fuel_x0 + fuel_l - 60, stow_row_y, 0]}
      - {id: GS-3, at: [gen_x0 + 60, stow_row_y, 0]}
      - {id: GS-4, at: [gen_x0 + gen_l - 60, stow_row_y, 0]}
  # Straps: from the bike tie-down point (05) to the top of its track fitting.
  # side +1 is the bike's left (module +Y). Wheel straps pass through the rear wheel round the rim.
  - ref: "13"
    part: G-05
    group: restraint
    label: Ratchet strap
    step: S11
    copies:
      - {id: TU-F+, strap: {bike: TU, point: handlebar_inboard, side: 1, anchor: [front_row_x, tuareg_y + tu_strap_dy, fitting_h]}}
      - {id: TU-F-, strap: {bike: TU, point: handlebar_inboard, side: -1, anchor: [front_row_x, tuareg_y - tu_strap_dy, fitting_h]}}
      - {id: TU-R+, strap: {bike: TU, point: pillion_peg_hangers, side: 1, anchor: [rear_row_x, tuareg_y + tu_strap_dy, fitting_h]}}
      - {id: TU-R-, strap: {bike: TU, point: pillion_peg_hangers, side: -1, anchor: [rear_row_x, tuareg_y - tu_strap_dy, fitting_h]}}
      - {id: TU-W, strap: {bike: TU, point: rear_wheel, anchors: [[rear_row_x, tuareg_y - wheel_strap_dy, fitting_h], [rear_row_x, tuareg_y + wheel_strap_dy, fitting_h]]}}
      - {id: ST-F+, strap: {bike: ST, point: handlebar_beside_risers, side: 1, anchor: [front_row_x, st_y + st_strap_dy, fitting_h]}}
      - {id: ST-F-, strap: {bike: ST, point: handlebar_beside_risers, side: -1, anchor: [front_row_x, st_y - st_strap_dy, fitting_h]}}
      - {id: ST-R+, strap: {bike: ST, point: pillion_peg_hangers, side: 1, anchor: [rear_row_x, st_y + st_strap_dy, fitting_h]}}
      - {id: ST-R-, strap: {bike: ST, point: pillion_peg_hangers, side: -1, anchor: [rear_row_x, st_y - st_strap_dy, fitting_h]}}
      - {id: ST-W, strap: {bike: ST, point: rear_wheel, anchors: [[rear_row_x, st_y - wheel_strap_dy, fitting_h], [rear_row_x, st_y + wheel_strap_dy, fitting_h]]}}
  - ref: "14"
    part: G-11
    group: restraint
    label: Winch on its quick-release plate (Tuareg bay)
    step: S09
    at: [0, tuareg_y, winch_z0]
    params: {face: x}
  - {ref: 14P, part: G-11-PLATE, group: restraint, label: Spare winch plate (Street Triple bay), step: S09,
     at: [0, st_y, winch_z0], params: {face: x}}
  - {ref: "20", part: G-10, group: restraint, label: Loading ramp (deployed), step: S11, display: loading_only,
     ramp: {centre_y: tuareg_y, sill_x: garage_length + wall_t, drop: ground_drop}}

  # ---------------------------------------------------------------- garage safety (positions are placeholders)
  - ref: "15"
    part: G-12
    group: safety
    label: Vent
    step: S09
    copies:
      - {id: low-road, at: [700, -half_width, 30], params: {facing: 1}}
      - {id: low-kerb, at: [400, half_width, 30], params: {facing: -1}}
      - {id: high-road, at: [1500, -half_width, 1300], params: {facing: 1}}
  - ref: "16"
    part: G-13
    group: safety
    label: Fume detector
    step: S09
    copies:
      - {id: sensor-A, at: [0, (tuareg_y + st_y) / 2, 100], params: {facing_x: 1}}
      - {id: sensor-B, at: [garage_length - 80, -half_width, 100], params: {facing_y: 1}}
      - {id: display, at: [1200, -half_width, 1560], params: {facing_y: 1, height: 67, width: 67}}
  - {ref: "17", part: G-14, group: safety, label: "Extinguisher by the rear door, on the gas locker", step: S09,
     at: [garage_length - 110, half_width - 160, locker_h]}

  # ---------------------------------------------------------------- context (no mass)
  - {ref: C1, part: CTX-FLOOR, group: context, label: Floor, step: S02, at: [body_x0, -half_width - wall_t, 0]}
  - {ref: C2, part: CTX-WALL-R, group: context, label: Road-side wall, step: S02, at: [body_x0, -half_width - wall_t, 0], params: {side: road}}
  - {ref: C3, part: CTX-WALL-K, group: context, label: Kerb-side wall with the gas locker hatch, step: S02, at: [body_x0, half_width, 0], params: {side: kerb}}
  - {ref: C8, part: CTX-WALL-B, group: context, label: Rear wall with the door opening, step: S02, at: [garage_length, -half_width - wall_t, 0], params: {side: rear}}
  - {ref: C4, part: CTX-DOOR, group: context, label: Rear garage door (closed), step: S11, display: closed_only, at: [garage_length, door_y0, 0]}
  - {ref: C9, part: CTX-HATCH, group: context, label: Gas locker hatch (closed), step: S11, at: [hatch_x0, half_width, hatch_z0]}
  - {ref: C5, part: CTX-CEIL, group: context, label: Ceiling plane (roof collapsed), step: S02, at: [-partition_t, -half_width, ceiling_z]}
  - {ref: C6, part: CTX-GROUND, group: context, label: Assumed ground, step: S11, display: loading_only,
     at: [garage_length + wall_t - 100, tuareg_y - 750, -ground_drop - 10]}
  - {ref: C7, part: CTX-FLOOR-LIV, group: context, label: Living-area floor (assumed at Z 0), step: S10,
     at: [living_floor_x0, -half_width - wall_t, -30]}
  - {ref: C10, part: CTX-RAMP, group: context, label: Ramp folded and stowed, step: S11, display: closed_only,
     at: [ramp_x0, ramp_y0, 0]}
  - {ref: C11, part: CTX-GEN, group: context, label: "Generator, strapped in the kerb strip", step: S11,
     at: [gen_x0, half_width - gen_w, 0]}
  - {ref: C12, part: CTX-FUEL, group: context, label: "Jerry cans, strapped in the kerb strip", step: S11,
     at: [fuel_x0, half_width - fuel_w, 0]}
  - ref: C13
    part: CTX-GAS
    group: context
    label: 9 kg gas cylinder in the locker
    step: S11
    copies:
      - {id: "1", at: [locker_x0 + 30, locker_y0 + 40, 20]}
      - {id: "2", at: [locker_x0 + 30 + cyl_d + 50, locker_y0 + 40, 20]}
  # Check-only: the rear door frame swept forward along the whole garage, for the roll-out check CLR-09
  - {ref: C14, part: CTX-SWEEP, group: context, label: Rear door frame swept along the garage, check_only: true,
     at: [0, -half_width, 0]}
