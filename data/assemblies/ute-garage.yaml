# Ute bike garage: the enclosed box on the LandCruiser 79 (UTE-GARAGE.md, research report 17).
# Module frame: origin on the floor top at the front wall's inner face, on the ute's centreline. X rearward towards
# the barn doors, Y to the road side, Z up. mm. The axes are the ute frame's (DIM-U1), so the module only moves:
# module X 0 sits at ute X module_x0 and Z 0 at the deck height deck_z (data/ute/ute.yaml reads both from here).
# The bikes stand side by side, noses against the front wall, and load through the barn doors at the back, as in the
# trailer's garage. Any number may be an expression over `params`.
id: ASM-UG
name: Ute bike garage
revision: B

params:
  # ---------------------------------------------------------------- placement on the ute (data/ute/ute.yaml)
  # The Ford Ranger Super Duty single cab chassis (data/ute/ute.yaml, Ford's BEMM of 03/2026 by page) since 23 Nov 2026,
  # in place of the LandCruiser 79 (revision B, in the git history)
  cab_back_x: 3270 - (2286 - 1020)  # back of the cab: Ford's 2,286 mm of frame behind it ends 1,020 mm behind the rear axle (BEMM pp. 24, 25)
  cab_gap: 30               # Ford: at least 28 mm between the cab and any body (BEMM p. 25)
  box_x0: cab_back_x + cab_gap      # outside front face of the box, ute X
  module_x0: box_x0 + front_t       # ute X of module X 0
  rear_axle_x: 3270         # ute X of the rear axle (the wheelbase)
  axle_m: rear_axle_x - module_x0   # module X of the rear axle
  frame_top_z: 740          # rear frame top at GVM with the rear axle at its rating (BEMM p. 128)
  frame_top_load: 810       # rear frame top while loading, bikes out and trailer off: about 1,700 kg on the rear axle,
                            # between Ford's 850 mm at kerb and 740 mm at 2,800 kg (est.)
  pad_h: 12                 # Ford's body mounting pads stand 12 mm over the rail top, the rearmost pair 6 mm (BEMM p. 128)
  mount_h: 45               # each mount between its pad and the subframe: the flexible mounts' cushions at station 1 and
                            # steel spacers at stations 2 to 4, so the subframe clears Ford's protrusions over the rails
  sub_h: 50                 # subframe depth: the runners and crossmembers stand 50 mm
  floor_t: 4                # 5052-H32 floor plate
  deck_z: frame_top_z + pad_h + mount_h + sub_h + floor_t   # floor top above the ground: 851 mm laden at GVM (estimate)
  sub_z0: -(floor_t + sub_h)        # subframe underside, module Z
  pad_z1: sub_z0 - mount_h          # top of Ford's pads at stations 1 to 3, module Z
  rail_y: 446               # frame rail centreline (BEMM p. 131, est. reading)
  rail_w: 70
  pad_y: 622                # Ford's pad holes 1,244 mm apart across the truck (BEMM p. 125, est. reading), the runners over them
  # ---------------------------------------------------------------- the wheels under the box (data/ute/ute.yaml)
  tyre_d: 842               # LT275/70R18
  tyre_w: 282
  tyre_slr: 393             # static loaded radius at GVM (estimate)
  tyre_slr_kerb: 412        # at kerb (estimate)
  frame_top_kerb: 850       # BEMM p. 128
  ford_g: 195               # Ford's wheelhouse envelope: the guard 195 mm over the tyre's top (BEMM p. 122, G, est.: at kerb)
  # Full bump, laden: Ford's guard height less its 30 mm clearance, carried from kerb to GVM on the frame: 74 mm (est.)
  rear_bump: tyre_slr_kerb + ford_g - tub_top_gap - frame_top_kerb + frame_top_z - tyre_slr
  wheel_y: 855              # half Ford's 1,710 mm rear track (BEMM p. 25)
  wheel_z: tyre_slr - deck_z        # module Z of the wheel centre at static
  tub_top_gap: 30           # Ford: 30 mm between the tyre and the guard, recommended (BEMM p. 122, L), over it, inside it,
  tub_in_gap: 30            # fore and aft and outside it
  tub_end_gap: 30
  tub_t: 3
  tub_x0: axle_m - tyre_d / 2 - tub_end_gap   # inner faces of the tub's front and rear walls
  tub_x1: axle_m + tyre_d / 2 + tub_end_gap
  tub_y0: wheel_y - tyre_w / 2 - tub_in_gap  # inner face of the tub's inboard wall
  tub_top: wheel_z + rear_bump + tyre_d / 2 + tub_top_gap + tub_t   # tub top surface above the floor
  # Rear tub flares (decision H19, report 26 fix A, now on Ford's track). The tyre's outer face is 996 mm out, 71 mm outside
  # the 1,850 mm body's skin. Over each rear tub the skin is cut away up to the top of the side wall's bottom rail, and a
  # folded 2.5 mm flare closes the opening 30 mm outside the tyre, 30 mm past each end of the tub.
  flare_out: wheel_y + tyre_w / 2 + tub_in_gap + skin_t - outside_w / 2   # 103.5 mm outside the skin
  flare_x0: tub_x0 - 30
  flare_x1: tub_x1 + 30
  flare_z1: tub_top + frame_s     # flare top, over the bottom rail that sits on the tub
  flare_w: outside_w + 2 * flare_out   # 2,057 mm over the flares, against UTE-09's 2,197 mm
  # The box's own mudflap behind each rear tyre (ADR 42/05), on its bracket under the outrigger behind the tub
  mudflap_x: 1725
  mudflap_w: 300
  mudflap_h: deck_z + sub_z0 - 230    # bottom edge about 230 mm above the ground (assumption)
  # ---------------------------------------------------------------- the box
  outside_w: 1850           # body outside width, UTE-09's body limit (decision H19). The flares reach flare_w
  outside_l: 2590           # report 17 section 6.2
  skin_t: 2.5               # 5052-H32 walls, front and doors
  roof_t: 1.6               # 5052-H32 1.6 mm roof skin (report 24's 2.0 mm, thinned 0.4 mm to keep the box under 440 kg)
  frame_s: 40               # SHS 40 x 40 x 3 frame
  frame_t: 3
  wall_t: skin_t + frame_s  # side and front walls: 42.5 mm
  front_t: wall_t
  half_width: outside_w / 2 - wall_t   # inner face of each side wall's frame: 882.5 mm
  interior_width: 2 * half_width
  leaf_s: 25                # door leaf frame, SHS 25 x 25 x 3
  leaf_t: leaf_s + skin_t   # 27.5 mm
  garage_length: outside_l - front_t - leaf_t   # front wall to the closed leaves' inner faces: 2,520 mm
  x_end: garage_length + leaf_t                 # outside rear face, module X
  ceiling_z: 1460           # underside of the roof bows and the door header (report 17)
  roof_z: ceiling_z + frame_s       # roof skin underside
  top_z: roof_z + roof_t            # roof top above the floor at the side walls: 1,502 mm
  roof_fall: 50                     # the bows fall 1:50 from a crown on the centreline to each side wall (UGF-01)
  roof_crown: half_width / roof_fall  # the crown stands 17.6 mm over the bows' ends, so the box is that much taller at the centre
  # posts along each side wall (X of each post's front face) and roof bows across
  post1_x: 560
  post2_x: 1200             # the kerb door's rear jamb, standing on the tub
  post3_x: tub_x1 + 10
  post4_x: 2000
  bow_x: [post1_x, post2_x, post3_x, post4_x]
  # ---------------------------------------------------------------- doors
  hinge_gap: 10             # between each leaf and its corner post, for the continuous hinge
  door_y0: -half_width + hinge_gap  # clear opening
  door_y1: half_width - hinge_gap
  door_h: ceiling_z
  leaf_gap: 5               # between the two leaves
  kd_x0: 0                  # kerb-side lift-up door: the front 1,200 mm of the wall, 300 to 1,300 mm up (report 17)
  kd_x1: 1200
  kd_z0: 300
  kd_z1: 1300
  # ---------------------------------------------------------------- bikes, side by side, noses forward
  bike_spacing: 760
  tu_reach: 490             # road-side reach of the Tuareg's panniers from its centreline (report 17 section 6.2)
  st_reach: 396             # kerb-side reach of the Street Triple from its centreline (report 17 section 6.2)
  tuareg_y: (bike_spacing + st_reach - tu_reach) / 2   # equal gaps to the two walls
  st_y: tuareg_y - bike_spacing
  front_tyre_x: 50          # chock nose allowance (measurements.yaml CHK-01)
  chock_rise: 25
  # ---------------------------------------------------------------- restraint
  front_row_x: 158.5       # the front L-track row 240 mm ahead of the Tuareg's front axle, as on the LandCruiser. Ford's first
                           # pads are under the front wall, so its steel crossmember reaches them through two steel stubs
  rear_row_x: mount4_x     # the rear row on the steel crossmember over Ford's rearmost pads, 960 mm behind the axle
  tu_strap_dy: 450
  st_strap_dy: 400
  wheel_strap_dy: 250
  track_w: 34.5
  track_h: 13.7
  fitting_h: 22
  winch_z0: 650
  # ---------------------------------------------------------------- subframe
  runner_w: 75              # aluminium RHS 75 x 50 x 3, laid flat over Ford's pads
  runner_y0: pad_y - runner_w / 2
  runner_y1: pad_y + runner_w / 2
  mount_l: 60               # each mount covers its pad, 60 x 50 mm (est., Ford: the mount covers the whole pad, BEMM p. 124)
  mount_w: 50
  stub_w: 75                # steel RHS 75 x 50 x 3.0 stubs at the front crossmember, over Ford's first pads
  stub_t: 3.0
  stub_x1: 375              # the stubs' rear end at the first aluminium crossmember, where the aluminium runners start (UGR-04)
  steel_w: 65               # galvanised C350L0 RHS 65 x 35 x 4.0, laid flat, under each L-track row (report 24)
  steel_h: 35
  steel_t: 4.0
  steel_fy: 350             # C350L0 yield, MPa (AS/NZS 1163), for the crossmember check UGR-03
  packer_t: 5.0             # 5052-H32 packer on the steel crossmember, under the track
  track_z: sub_z0 + steel_h + packer_t   # track underside: the 13.7 mm track's top ends 0.3 mm below the floor top
  strip_t: -floor_t - track_z            # aluminium strips either side of the track carry the floor plate: 10 mm
  strip_w: 15
  cm_w: 50                  # aluminium SHS 50 x 50 x 3 crossmembers and outriggers
  # inner crossmembers (centres): one at each pad station (Ford, BEMM p. 124) and at most 600 mm apart (p. 157), with the
  # two steel crossmembers under the track rows. Outriggers at most 600 mm apart, none over the wheels
  cm_x: [-15, 400, mount2_x, 1000, 1400, mount3_x, x_end - 25]
  out_x: [-15, 400, 1700, x_end - 25]
  # Ford's body mounting pads for the single cab, four pairs 768, 891 and 506 mm apart (BEMM p. 125), the first 60.5 mm
  # behind the cab, so the four sit centred on the frame behind it (est.). Flexible mounts at the first pair, rigid at the
  # other three (BEMM p. 124: an exceptionally rigid body, flexible at the forward pads only)
  mount1_x: cab_back_x + 60.5 - module_x0
  mount2_x: mount1_x + 768
  mount3_x: mount2_x + 891
  mount4_x: mount3_x + 506
  # ---------------------------------------------------------------- stowage
  ramp_fold_l: 1524         # Black Widow MF-12038 folded, standing on its edge across the back
  ramp_fold_t: 152
  ramp_fold_w: 965
  ramp_x0: garage_length - 8 - ramp_fold_t
  # Tool chests on the wheel tubs, beside each bike's middle. The outer front straps run through the front corners and
  # the rear straps through the back, so the tubs are the lowest free floor that is forward of the ramp.
  tool_x0: tub_x0 + 45
  tool_l: tub_x1 - tub_x0 - 90
  tool_w: 185               # road side, beside the Tuareg: on the tub top, 2.5 mm in from its inboard edge. Ford's 1,710 mm
                            # track puts the tubs 80 mm further out than the LandCruiser's, so the chests are narrower
  tool_wk: 185              # kerb side, the same
  tool_h: 200
  tool_z0: tub_top
  ground_drop: deck_z + frame_top_load - frame_top_z   # floor height above the ground while loading, bikes out (est.)

items:
  # ---------------------------------------------------------------- bikes (the trailer's bike models)
  # In the loading view the Tuareg is on the ramp, half way up on the winch's rope, and its straps are off (decision H27)
  - {ref: TU, part: BIKE-TU, group: bikes, label: Aprilia Tuareg 660 Rally, display: closed_only,
     bike: {centre_y: tuareg_y, front_tyre_x: front_tyre_x, front_rise: chock_rise}}
  - {ref: TU_RAMP, part: BIKE-TU, group: bikes, label: "Aprilia Tuareg 660 Rally, winched up the ramp", display: loading_only,
     bike: {centre_y: tuareg_y, on_ramp: 700, shows: TU}}
  - {ref: ST, part: BIKE-ST, group: bikes, label: Triumph Street Triple 765,
     bike: {centre_y: st_y, front_tyre_x: front_tyre_x, front_rise: chock_rise}}
  - {ref: TU-2263, part: BIKE-TU, group: bikes, label: "Tuareg with the photo-measured 2,263 mm length", check_only: true,
     bike: {centre_y: tuareg_y, front_tyre_x: front_tyre_x, front_rise: chock_rise, length: 2263}}
  - {ref: TU-1390, part: BIKE-TU, group: bikes, label: "Tuareg with the photo-measured 1,390 mm screen", check_only: true,
     bike: {centre_y: tuareg_y, front_tyre_x: front_tyre_x, front_rise: chock_rise, screen_top_z: 1390}}
  - {ref: TU-BAGS, part: BIKE-TU, group: bikes, label: "Tuareg's Mosko Moto panniers on their own", check_only: true,
     bike: {centre_y: tuareg_y, front_tyre_x: front_tyre_x, front_rise: chock_rise, luggage_only: true}}

  # ---------------------------------------------------------------- floor and wheel tubs
  - {ref: B1, part: U-FLOOR, group: body, label: "Floor plate, 4 mm",
     at: [-front_t + skin_t, -half_width - frame_s, -floor_t],
     params: {dx: outside_l - skin_t, dy: interior_width + 2 * frame_s, dz: floor_t, normal: z,
              cutouts: [[tub_x0 - tub_t + front_t - skin_t, tub_y0 - tub_t + half_width + frame_s, tub_x1 - tub_x0 + 2 * tub_t, half_width + frame_s - tub_y0 + tub_t],
                        [tub_x0 - tub_t + front_t - skin_t, 0, tub_x1 - tub_x0 + 2 * tub_t, half_width + frame_s - tub_y0 + tub_t],
                        [front_row_x - track_w / 2 + front_t - skin_t, frame_s, track_w, interior_width],
                        [rear_row_x - track_w / 2 + front_t - skin_t, frame_s, track_w, interior_width]]}}
  - ref: B2
    part: U-TUB
    group: body
    label: Wheel tub
    copies:
      - {id: R-top, at: [tub_x0 - tub_t, tub_y0 - tub_t, tub_top - tub_t], params: {dx: tub_x1 - tub_x0 + 2 * tub_t, dy: half_width + frame_s - tub_y0 + tub_t, dz: tub_t, normal: z}}
      - {id: R-in, at: [tub_x0 - tub_t, tub_y0 - tub_t, -floor_t], params: {dx: tub_x1 - tub_x0 + 2 * tub_t, dy: tub_t, dz: tub_top - tub_t + floor_t, normal: y}}
      - {id: R-front, at: [tub_x0 - tub_t, tub_y0, -floor_t], params: {dx: tub_t, dy: half_width + frame_s - tub_y0, dz: tub_top - tub_t + floor_t, normal: x}}
      - {id: R-rear, at: [tub_x1, tub_y0, -floor_t], params: {dx: tub_t, dy: half_width + frame_s - tub_y0, dz: tub_top - tub_t + floor_t, normal: x}}
      - {id: K-top, at: [tub_x0 - tub_t, -half_width - frame_s, tub_top - tub_t], params: {dx: tub_x1 - tub_x0 + 2 * tub_t, dy: half_width + frame_s - tub_y0 + tub_t, dz: tub_t, normal: z}}
      - {id: K-in, at: [tub_x0 - tub_t, -tub_y0, -floor_t], params: {dx: tub_x1 - tub_x0 + 2 * tub_t, dy: tub_t, dz: tub_top - tub_t + floor_t, normal: y}}
      - {id: K-front, at: [tub_x0 - tub_t, -half_width - frame_s, -floor_t], params: {dx: tub_t, dy: half_width + frame_s - tub_y0, dz: tub_top - tub_t + floor_t, normal: x}}
      - {id: K-rear, at: [tub_x1, -half_width - frame_s, -floor_t], params: {dx: tub_t, dy: half_width + frame_s - tub_y0, dz: tub_top - tub_t + floor_t, normal: x}}

  # ---------------------------------------------------------------- skins
  - ref: B3
    part: U-SKIN
    group: body
    label: Wall skin, 2.5 mm
    copies:
      - {id: road, at: [-front_t, half_width + frame_s, -floor_t], params: {dx: outside_l, dy: skin_t, dz: roof_z + floor_t, normal: y,
                                                                         cutouts: [[flare_x0 + front_t, 0, flare_x1 - flare_x0, flare_z1 + floor_t]]}}
      - {id: kerb, at: [-front_t, -half_width - wall_t, -floor_t], params: {dx: outside_l, dy: skin_t, dz: roof_z + floor_t, normal: y,
                                                                         cutouts: [[kd_x0 + front_t, kd_z0 + floor_t, kd_x1 - kd_x0, kd_z1 - kd_z0],
                                                                                   [flare_x0 + front_t, 0, flare_x1 - flare_x0, flare_z1 + floor_t]]}}
      - {id: front, at: [-front_t, -half_width - frame_s, -floor_t], params: {dx: skin_t, dy: interior_width + 2 * frame_s, dz: roof_z + floor_t, normal: x}}
  - ref: B7
    part: U-FLARE
    group: body
    label: Rear tub flare, 2.5 mm
    copies:
      - {id: R-out, at: [flare_x0, outside_w / 2 + flare_out - skin_t, -floor_t], params: {dx: flare_x1 - flare_x0, dy: skin_t, dz: flare_z1 + floor_t, normal: y}}
      - {id: R-top, at: [flare_x0, half_width + frame_s, flare_z1 - skin_t], params: {dx: flare_x1 - flare_x0, dy: flare_out, dz: skin_t, normal: z}}
      - {id: R-front, at: [flare_x0, half_width + frame_s, -floor_t], params: {dx: skin_t, dy: flare_out, dz: flare_z1 - skin_t + floor_t, normal: x}}
      - {id: R-rear, at: [flare_x1 - skin_t, half_width + frame_s, -floor_t], params: {dx: skin_t, dy: flare_out, dz: flare_z1 - skin_t + floor_t, normal: x}}
      - {id: K-out, at: [flare_x0, -outside_w / 2 - flare_out, -floor_t], params: {dx: flare_x1 - flare_x0, dy: skin_t, dz: flare_z1 + floor_t, normal: y}}
      - {id: K-top, at: [flare_x0, -outside_w / 2 - flare_out + skin_t, flare_z1 - skin_t], params: {dx: flare_x1 - flare_x0, dy: flare_out, dz: skin_t, normal: z}}
      - {id: K-front, at: [flare_x0, -outside_w / 2 - flare_out + skin_t, -floor_t], params: {dx: skin_t, dy: flare_out, dz: flare_z1 - skin_t + floor_t, normal: x}}
      - {id: K-rear, at: [flare_x1 - skin_t, -outside_w / 2 - flare_out + skin_t, -floor_t], params: {dx: skin_t, dy: flare_out, dz: flare_z1 - skin_t + floor_t, normal: x}}
  - {ref: B4, part: U-ROOF, group: body, label: "Roof skin, 1.6 mm",
     at: [-front_t, -outside_w / 2, roof_z], params: {dx: outside_l, dy: outside_w, dz: roof_t, normal: z, crown: roof_crown}}

  # ---------------------------------------------------------------- frame, SHS 40 x 40 x 3 (`at` is each tube's low corner)
  - ref: B5
    part: U-FRAME
    group: body
    label: Frame tube
    copies:
      # bottom rails along each side wall, raised over the wheel tubs
      - {id: R-bot-front, at: [-frame_s, half_width, 0], params: {dx: tub_x0 - tub_t + frame_s, dy: frame_s, dz: frame_s}}
      - {id: R-bot-tub, at: [tub_x0 - tub_t, half_width, tub_top], params: {dx: tub_x1 - tub_x0 + 2 * tub_t, dy: frame_s, dz: frame_s}}
      - {id: R-bot-rear, at: [tub_x1 + tub_t, half_width, 0], params: {dx: x_end - tub_x1 - tub_t, dy: frame_s, dz: frame_s}}
      - {id: K-bot-front, at: [-frame_s, -half_width - frame_s, 0], params: {dx: tub_x0 - tub_t + frame_s, dy: frame_s, dz: frame_s}}
      - {id: K-bot-tub, at: [tub_x0 - tub_t, -half_width - frame_s, tub_top], params: {dx: tub_x1 - tub_x0 + 2 * tub_t, dy: frame_s, dz: frame_s}}
      - {id: K-bot-rear, at: [tub_x1 + tub_t, -half_width - frame_s, 0], params: {dx: x_end - tub_x1 - tub_t, dy: frame_s, dz: frame_s}}
      # top rails along each side wall, under the roof skin
      - {id: R-top, at: [-frame_s, half_width, ceiling_z], params: {dx: x_end + frame_s, dy: frame_s, dz: frame_s}}
      - {id: K-top, at: [-frame_s, -half_width - frame_s, ceiling_z], params: {dx: x_end + frame_s, dy: frame_s, dz: frame_s}}
      # corner posts and the rear portal
      - {id: R-post-front, at: [-frame_s, half_width, frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - frame_s}}
      - {id: K-post-front, at: [-frame_s, -half_width - frame_s, frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - frame_s}}
      - {id: R-post-rear, at: [x_end - frame_s, half_width, frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - frame_s}}
      - {id: K-post-rear, at: [x_end - frame_s, -half_width - frame_s, frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - frame_s}}
      - {id: header, at: [x_end - frame_s, -half_width, ceiling_z], params: {dx: frame_s, dy: interior_width, dz: frame_s, crown: roof_crown}}
      # side wall posts. The one at 1,200 mm is the kerb door's rear jamb and stands on the tub
      - {id: R-post-1, at: [post1_x, half_width, frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - frame_s}}
      - {id: R-post-2, at: [post2_x, half_width, tub_top + frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - tub_top - frame_s}}
      - {id: R-post-3, at: [post3_x, half_width, frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - frame_s}}
      - {id: R-post-4, at: [post4_x, half_width, frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - frame_s}}
      - {id: K-post-1, at: [post1_x, -half_width - frame_s, frame_s], params: {dx: frame_s, dy: frame_s, dz: kd_z0 - 2 * frame_s}}
      - {id: K-post-1-up, at: [post1_x, -half_width - frame_s, kd_z1 + frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - kd_z1 - frame_s}}
      - {id: K-post-2, at: [post2_x, -half_width - frame_s, tub_top + frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - tub_top - frame_s}}
      - {id: K-post-3, at: [post3_x, -half_width - frame_s, frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - frame_s}}
      - {id: K-post-4, at: [post4_x, -half_width - frame_s, frame_s], params: {dx: frame_s, dy: frame_s, dz: ceiling_z - frame_s}}
      # kerb door frame: sill rail under the opening and head rail over it, front corner post to the jamb
      - {id: K-door-sill, at: [0, -half_width - frame_s, kd_z0 - frame_s], params: {dx: kd_x1, dy: frame_s, dz: frame_s}}
      - {id: K-door-head, at: [0, -half_width - frame_s, kd_z1], params: {dx: kd_x1, dy: frame_s, dz: frame_s}}
      # front wall: bottom rail, the two rails the winch plates bolt to, and the front roof bow
      - {id: F-bot, at: [-frame_s, -half_width, 0], params: {dx: frame_s, dy: interior_width, dz: frame_s}}
