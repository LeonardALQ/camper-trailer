# Leonard's figures for the whole project, AUD including GST (20 Nov 2026).
# The car build page compares its totals with car_build.budget_aud, and the home page's cost table reads every part
# from here and from the parts lists (cad/sitedata.py, project_costs). cad/tests/test_costs.py checks that
# data/vehicle/vehicle-parts.yaml and VEHICLE.md quote the same figures and that the cost table adds up.
truck:
  name: "Used Toyota LandCruiser VDJ79 single cab V8, built 01/2017 to 08/2022, about 400,000 km"
  purchase_aud: 50000
  basis: "Leonard's planning figure for buying the truck"
car_build:
  budget_aud: 75000
  basis: "Leonard's planning figure for the car build, without the truck, the bike box, the trailer or his own labour"
  parts_list: data/vehicle/vehicle-parts.yaml
bike_box:
  parts_list: data/ute/box-parts.yaml
  basis: "Every line of the box's parts list with its contingency. Owner-built leaves out the shop's fabrication labour"
# The trailer's row works itself out from its parts list: the lines of the mass schedule with their prices, and the
# stock, labour, installation, compliance and freight lines in data/trailer-parts.yaml (cad/trailer_costs.py).
trailer:
  parts_list: data/trailer-parts.yaml
  link: /trailer/#parts-list
  basis: "Every line of the trailer's parts list with its contingency, 10 % on listed prices and 20 % on rates and estimates. Owner-built leaves out the hired labour"
