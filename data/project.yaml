# Leonard's figures for the whole project, AUD including GST (20 Nov 2026).
# The car build page compares its totals with car_build.budget_aud, and the home page's cost table reads every part
# from here and from the parts lists (cad/sitedata.py, project_costs). cad/tests/test_costs.py checks that
# data/vehicle/vehicle-parts.yaml and VEHICLE.md quote the same figures and that the cost table adds up.
truck:
  name: "Ford Ranger Super Duty single cab chassis, 2025 or 2026, under about 20,000 km"
  purchase_aud: 92690
  basis: "The near-new listing of 23 Nov 2026, a 2025 truck with 13,343 km at AUD 89,990 (Drive listing 970470638), and NSW duty at AUD 3 per AUD 100, AUD 2,700 (research report 31). It replaces the LandCruiser's AUD 50,000"
car_build:
  budget_aud: 75000
  basis: "Leonard's planning figure for the car work, set for the LandCruiser build on 20 Nov 2026 and kept for the Super Duty's upgrades, without the truck, the bike box, the trailer or his own labour"
  parts_list: data/vehicle/vehicle-parts.yaml
bike_box:
  parts_list: data/ute/box-parts.yaml
  basis: "Every line of the box's parts list with its contingency. Leonard builds the box, so no labour is paid (decision H25)"
# The trailer's row works itself out from its parts list: the lines of the mass schedule with their prices, and the
# stock, installation, compliance and freight lines in data/trailer-parts.yaml (cad/trailer_costs.py).
trailer:
  parts_list: data/trailer-parts.yaml
  link: /trailer/#parts-list
  basis: "Every line of the trailer's parts list with its contingency, 10 % on listed prices and 20 % on rates and estimates. Leonard builds the trailer, so no labour is hired (decision H26)"
