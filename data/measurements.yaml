# Measured inputs. The owner fills these in as he measures (GitHub's web editor is fine). A commit on main is built
# and checked, and the site, with the plan re-solved from the new values, updates once the live branch moves to it.
#
# How to record a measurement: under the input's `measured`, set `v` to the value and `date` to the day you
# measured it, for example   measured: {v: 1182, date: 2026-12-02}
# Leave `v: null` until then. The build uses the measured value when there is one and the estimate otherwise.
#
# `thresholds` are the design rules that change the plan, with their source. The build applies them in
# cad/inputs.py, and the Measurements page shows what each one does with the value in use. A threshold is a
# design rule, not a check limit. Check limits stay in checks.yaml, data/ute/ute.yaml and data/ute/garage-checks.yaml.
#
# `range` is what the design accepts without a redesign, with its source in `src`. `min` or `max` is a number, null
# for no limit on that side (`src` says why), a list with one entry per value for an input with several values (in
# the order of `order`), or {ref: name} for a figure the build works out from the model (cad/trailer.py,
# measurement_refs). {ref: name, rel: 0.02} means within 2 % of that figure. The Measurements page shows the range
# beside an input box and colours what is typed in or out of it. A range is a guide for measuring, not a check limit.
# `stage` says when it is measured: buy (an answer from the seller or the maker, or a test when buying the truck), build (on the ute, the bikes or the
# parts, before or while building), weigh (at a weighbridge during the build) or trailer built. `covers` lists the
# build stages a weighbridge reading includes.
#
# Revision of 20 Nov 2026: the tow vehicle is the LandCruiser 79 (research report 16), so the Cayenne's inputs
# (CAR-01 to CAR-07) are gone. The bike, chock and pannier inputs now set the ute's bike box (UTE-GARAGE.md).
#
# `part` is the part of the project the input belongs to: car (the Ranger Super Duty and its stages, VEHICLE.md), box
# (the bike box, UTE-GARAGE.md) or trailer. The Measurements page filters by it, for example /measurements/?part=car.
#
# Revision of 20 Nov 2026, later: report 23's car build inputs (VEH-01 to VEH-27, group Car build) and report 24's bike box
# inputs (BOX-01 to BOX-19, group Bike box) are merged in, and report 23's UTE-01 replaces the earlier one.
#
# Revision of 23 Nov 2026: the tow vehicle is a near-new Ford Ranger Super Duty (H29, research report 31). VEH-01 to
# VEH-19 are its checks for VEHICLE.md's stages: the purchase in S0, the weighing as bought, the power stage S3's dyno,
# boost and temperatures, and the charging voltage of S2. VEH-20 to VEH-28 are its laden weighings and heights.
inputs:
  # ================================================================ the ute (report 16, data/ute/ute.yaml)
  - id: UTE-01
    group: Ute
    part: car
    title: Ute's towball pin height, laden, with the loaded trailer's ball load and the bikes aboard
    how: "Line CK03's visit. Ute loaded as for the trip, the loaded trailer coupled on level ground. Measure from the ground to the coupling point on the DO45-type tow pin in Ford's hitch. Choose the hitch's drop (TW08) from it, without modifying Ford's hitch (BEMM p. 34)."
    unit: mm
    estimate: {v: 440, src: "Decision log 12:10: 440 mm laden, plus or minus 20 mm, so the coupling stays inside VSB1's 460 mm"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [TW08 tongue drop, coupling height, DIM-03, UTE-13, JK-02]
    thresholds:
      - {at: 440, rule: "The trailer is designed level at this height: the coupling point Z follows the value and the drawbar drop below the rails re-solves", src: "VSB1 9.3.2: trailers should be designed to be level within the towball range"}
      - {at: [370, 440], rule: "Outside 370 to 440 mm the 20 mm tolerance no longer stays inside VSB1's 350 to 460 mm, so choose a tongue (TW08) with more or less drop", src: "VSB1 9.3.2 and report 08 section 5.3"}
    range: {min: 370, max: 440, src: "VSB1 9.3.2 (350 to 460 mm laden) less the plan's 20 mm tolerance each way (decision log 12:10)"}
  - id: UTE-02
    group: Ute
    part: car
    title: Ute's rear axle centre to the towball pin
    how: Hang a plumb line from the centre of a rear wheel hub and another from the pin's centre, mark both on the ground and measure between the marks.
    unit: mm
    estimate: {v: 1455, src: "Ranger Super Duty: the tow bar's receiver end 1,255 mm behind the rear axle (Ford's dealer sheet, 2026MY) and about 200 mm of hitch to the tow pin (rsd-plan line TW01, estimate). Was 1,300 mm for the LandCruiser's Hayman Reese 03186RW"}
    measured: {v: null, date: null}
    stage: build
    range: {min: {ref: ball_reach_min}, max: null, src: "JK-01 keeps the trailer's front parts 100 mm outside the bike box's sweep, and each 10 mm less reach adds about 10 mm to the box's overhang, so the minimum is the reach less JK-01's margin. No maximum: a longer reach only adds sweep clearance, and the rear axle check UTE-03 moves by about 8 kg per 100 mm at 250 kg on the ball"}
    affects: [ute rear axle load, bike box overhang behind the ball, JK-01, JK-02]
    thresholds:
      - {rule: "Sets the lever arm of the towball on the ute's axles (UTE-03, UTE-12) and how far the bike box overhangs the ball, so the jack-knife sweep re-solves. Each 10 mm less adds about 10 mm to the box's overhang", src: "Report 16 section 5, U2 model"}
  - id: UTE-03
    group: Ute
    part: trailer
    title: Towball load the trailer puts on the ute, from a towball scale
    how: Later, with the trailer built and fully loaded, level on firm ground. Put a towball scale under the coupling at the design height and read it.
    unit: kg
    estimate: {v: null, src: "Not measured until the trailer exists. The model's fully loaded towball is shown beside it"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {ref: towball_model, rel: 0.10, src: "Within 10 % of the model's fully loaded towball (TBS-01, the threshold below). Outside it the centre of gravity estimates are wrong"}
    affects: [TBS-01 check against the model]
    thresholds:
      - {at: 0.10, rule: "More than 10 % away from the model's fully loaded towball means the centre of gravity estimates are wrong: weigh the parts again before relying on the axle position", src: "Report 02 MASS-07 asks for differences over 2 % in mass to be explained. 10 % on the towball is this layout's rule"}

  # ================================================================ the car build (report 31, VEHICLE.md), group Car build
  # ================================================================ stage S0: the near-new truck before it is bought (lines BI01 and BI02)
  - id: VEH-01
    group: Car build
    part: car
    title: "Ford's service record complete: every scheduled service done at a Ford dealer, on time, 1 for yes, 0 for no"
    how: "Line BI01's visit. The Ford dealer reads the truck's service record against the schedule in its owner's manual, with the dates and odometer readings. Note any service done elsewhere, late or missing."
    unit: yes or no
    estimate: {v: 1, src: "Assumed complete for a 2025 truck with 13,343 km (est.)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [buy or walk away, Ford's warranty, S3 timing]
    thresholds:
      - {at: 0, rule: "A missing, late or outside service: get the dealer's written answer that Ford's warranty still stands, or walk away", src: "Ford's 7-year cover holds only for trucks serviced at Ford dealers (Ford specification sheet, 29 Oct 2026, report 31 sections 4 and 7)"}
    range: {min: 1, max: 1, src: "Ford specification sheet, 29 Oct 2026 (report 31 sections 4 and 7)"}
  - id: VEH-02
    group: Car build
    part: car
    title: Ford's new vehicle warranty left on the truck
    how: "Same visit. The dealer reads the warranty start date from Ford's system. Value is the years left on the day of purchase, to one decimal."
    unit: years
    estimate: {v: 3.1, src: "The listing found on 23 Nov 2026: about 3 years and 1 month of Ford's 5-year warranty left (report 31 section 4)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [S3 timing (H30)]
    thresholds:
      - {at: 0, rule: "The power stage S3 waits until this runs out or Leonard accepts the warranty risk, so it sets the stage's earliest date without the risk", src: "Decision H30: Ford does not pay for a failure an aftermarket part causes"}
    range: {min: 0, max: 7, src: "Ford's 5-year warranty, or 7 years for new and demonstrator trucks whose cover starts on or after 1 Sep 2026 and that are serviced only at Ford dealers (Ford specification sheet, 29 Oct 2026, report 31 section 7)"}
  - id: VEH-03
    group: Car build
    part: car
    title: Stored fault codes in Ford's diagnostic scan of every module
    how: "Same visit. The dealer scans every module with Ford's diagnostic tool, the engine, the 10-speed, the brakes and the trailer module included. Write each code and its module in a note."
    unit: codes
    estimate: {v: 0, src: "Assumed none (est.)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [buy or walk away]
    thresholds:
      - {at: 1, rule: "Any stored fault: the dealer finds and fixes it under warranty before the truck is bought, or walk away", src: "VEHICLE.md stage S0"}
    range: {min: 0, max: 0, src: "VEHICLE.md stage S0: the truck is bought with no fault stored"}
  - id: VEH-04
    group: Car build
    part: car
    title: "The engine and the 10-speed on Ford's own calibration, unmodified: 1 for yes, 0 for no"
    how: "Same scan. The dealer compares the engine and the 10-speed's calibration numbers with Ford's latest, and looks for a non-Ford flash and for aftermarket intake, exhaust or turbo parts."
    unit: yes or no
    estimate: {v: 1, src: "Assumed untuned (est.)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [buy or walk away, the stock dyno run (VEH-12)]
    thresholds:
      - {at: 0, rule: "A non-Ford flash or a modified engine: walk away", src: "VEHICLE.md stage S0"}
    range: {min: 1, max: 1, src: "VEHICLE.md stage S0"}
  - id: VEH-05
    group: Car build
    part: car
    title: DPF soot load from the scan, as a share of the load at which it regenerates
    how: "Same scan, warm engine, after the road test. Read the DPF's soot load and the load at which the engine starts a regeneration, and note the ash load and the AdBlue system's readings with them."
    unit: "%"
    estimate: {v: 30, src: "Assumed for a truck driven on the open road (est.). Ford publishes no soot figure"}
    measured: {v: null, date: null}
    stage: buy
    affects: [buy or walk away, the DPF]
    thresholds:
      - {at: 100, rule: "At or over the regeneration load with no regeneration running: the dealer checks the DPF, its pressure sensor and the injectors before the truck is bought", src: "A full filter regenerates on its own when driven (est.), so one that stays full has a fault"}
    range: {min: 0, max: 100, src: "The engine regenerates at the full load (est.)"}
  - id: VEH-06
    group: Car build
    part: car
    title: Mean distance between the last completed DPF regenerations
    how: "Same scan. Read the regeneration history, the odometer at each completed regeneration, and take the mean distance between the last five."
    unit: km
    estimate: {v: 500, src: "Assumed for a truck driven on the open road (est.). Ford publishes no interval"}
    measured: {v: null, date: null}
    stage: buy
    affects: [buy or walk away, the DPF]
    thresholds:
      - {at: 200, rule: "Under 200 km between regenerations: short trips, or an injector or sensor fault filling the filter. The dealer checks it before the truck is bought", src: "Assumed (est.)"}
    range: {min: 200, max: null, src: "Assumed (est.). No upper limit: a longer interval means less soot"}
  - id: VEH-07
    group: Car build
    part: car
    title: DPF regenerations started but not completed, in the history the scan holds
    how: Same scan. Count the regenerations the history shows as stopped before they finished.
    unit: regenerations
    estimate: {v: 1, src: "Assumed (est.): a stop in town can end one"}
    measured: {v: null, date: null}
    stage: buy
    affects: [buy or walk away, the DPF]
    thresholds:
      - {at: 3, rule: "Three or more: the truck has lived on short trips. Have the dealer run a service regeneration and read the soot load again (VEH-05) before buying", src: "Assumed (est.)"}
    range: {min: 0, max: 3, src: "Assumed (est.)"}
  - id: VEH-08
    group: Car build
    part: car
    title: "Maximum tow ball download, from the owner's manual or the label on Ford's 4.5 t hitch"
    how: "Line BI01's visit. Read the figure for the 4,500 kg braked rating from the truck's owner's manual, and the load printed on the hitch's label. Take the lower of the two."
    unit: kg
    estimate: {v: 450, src: "Decision H29 (est.): 10 % of the 4,500 kg braked rating, as the ordinary Ranger allows 350 kg at 3,500 kg. No Ford document read on 23 Nov 2026 gives it"}
    measured: {v: null, date: null}
    stage: buy
    affects: [UTE-05, MAS-03, H17's ceiling, the axle window]
    thresholds:
      - {at: 450, rule: "Under 450 kg: H17's ceiling becomes this figure less 30 kg (data/load_cases.yaml axle_window), so the axle re-solves and the towball checks read the new limit", src: "Decision H17 as amended 23 Nov 2026"}
    range: {min: {ref: towball_label_min}, max: null, src: "Min: the trailer's heaviest towball with growth plus the 30 kg H17 keeps in hand, so the axle stays where it is. No upper limit: the DO45 Plus's own 450 kg caps the window too"}
  - id: VEH-09
    group: Car build
    part: car
    title: Bore of the tow pin's hole in Ford's 4.5 t hitch
    how: "Line BI01's visit, hitch out of the receiver. Measure the hole across two diameters at right angles with a vernier and take the larger."
    unit: mm
    estimate: {v: 32, src: "Assumed to take a 1 1/4 in shank (est.), as Cruisemaster's DO45 Plus tow pin has (rsd-plan line TW01)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [TW01, TW02]
    thresholds:
      - {at: 32.5, rule: "Over 32.5 mm the pin's shank does not fit firmly: fit a 4.5 t tongue with a 32 mm hole and the drop the coupling height needs (TW02), and never drill or bush Ford's hitch", src: "Ford's body equipment mounting manual section 1.13: a shank fits the hitch hole firmly and the hitch is not drilled or modified"}
    range: {min: 31.8, max: 32.5, src: "Cruisemaster's 1 1/4 in (31.75 mm) shank and Ford's firm fit (BEMM section 1.13). The 0.75 mm of play is an estimate (est.)"}
  # ================================================================ stage S0: the truck as bought on a public weighbridge (line CK01)
  - id: VEH-10
    group: Car build
    part: car
    title: Front axle as bought, full tank, nobody aboard, no tray
    how: "Line CK01. Take the tray off if one is fitted, fill the tank, nobody aboard, and weigh each axle on a public weighbridge. Note what is fitted beyond Ford's standard equipment, the dual battery system for example, with its mass if listed."
    unit: kg
    estimate: {v: 1665, src: "Ute model line UT-01: Ford's minimum kerb weight of 2,518 kg (dealer sheet, 2026MY) less the 853 kg on the rear axle that Ford's centre of gravity table implies (est.)"}
    measured: {v: null, date: null}
    stage: weigh
    affects: [UT-01, UTE-02, UTE-07, Ford's centre of gravity window]
    thresholds:
      - {rule: "Enter the two axles' split in UT-01 (data/ute/ute.yaml) and rebuild: the front axle check, the rear axle check and Ford's centre of gravity window re-solve on the weighed truck", src: "Decision of 23 Nov 04:59 on the kerb mass on each axle: Ford publishes no split"}
    range: {min: 1625, max: 1705, src: "The model's split of Ford's 2,518 kg, plus or minus 40 kg for options and the split's estimate (est.)"}
  - id: VEH-11
    group: Car build
    part: car
    title: Rear axle as bought, full tank, nobody aboard, no tray
    how: Same weighing as VEH-10.
    unit: kg
    estimate: {v: 853, src: "Ute model line UT-01 (est.): the split Ford's centre of gravity table implies, its GVM row of 1,832 kg added at 3,350 mm holding with the rear axle at its 2,800 kg rating"}
    measured: {v: null, date: null}
    stage: weigh
    affects: [UT-01, UTE-03, UTE-05, the ball load]
    thresholds:
      - {rule: "Enter it in UT-01 and rebuild. Each kg more on the rear axle here is about 0.7 kg less of tow ball download before the rear axle reaches 2,800 kg (1.447 kg on the axle for each kg on the ball)", src: "The ute model (RSD-UTE, 23 Nov 2026): the rear axle carries 1.447 kg more for each kg on the ball"}
    range: {min: 813, max: 893, src: "The model's split, plus or minus 40 kg (est.)"}
  # ================================================================ stage S3: the power stage on one dyno, before and after (lines TL01 and TL02)
  - id: VEH-12
    group: Car build
    part: car
    title: Peak power at the wheels on the stock truck, before the power stage
    how: "Line TL01. The tuner's chassis dyno, Tow/Haul off, three runs, take the middle one. The certifier compares it with VEH-13 on the same dyno with the same operator, so keep the sheet."
    unit: kW at the wheels
    estimate: {v: 130, src: "Report 31: Ford's 154 kW at the crank (dealer sheet) at a wheel-to-crank ratio of about 0.845 through the 10-speed and full-time 4WD (est.)"}
    measured: {v: null, date: null}
    stage: build
    affects: [TL01, TL05, the stage's starting point]
    thresholds:
      - {at: 120, rule: "Under 120 kW at the wheels: find the fault (a boost leak, an injector, the DPF) with the dealer before the stage starts", src: "About 8 % under the estimate (est.)"}
    range: {min: 120, max: 140, src: "Report 31's 130 kW, plus or minus about 8 % for the dyno (est.)"}
  - id: VEH-13
    group: Car build
    part: car
    title: Peak power at the wheels after the PowerMax turbo, the intercooler and the calibration
    how: Same dyno and operator as VEH-12, the towing calibration active, three runs, the middle one.
    unit: kW at the wheels
    estimate: {v: 173, src: "Decision H30: about 205 kW at the crank, about 173 kW at the wheels (est.)"}
    measured: {v: null, date: null}
    stage: build
    affects: [TL05, H30]
    thresholds:
      - {at: 186, rule: "Over 186 kW at the wheels, about 220 kW at the crank, the PowerMax keeps only about 6 % of its flow in hand (est.). Hold 205 kW at the crank unless Leonard has taken the 250 hp option (VEHICLE.md), and never more than 186 kW at the wheels", src: "Report 31 section 8, VEHICLE.md's 250 hp option and decision H30"}
    range: {min: 165, max: 186, src: "H30's 205 kW at the crank less about 5 % (est.), and report 31's 220 kW at the crank, the most the PowerMax carries with a margin"}
  - id: VEH-14
    group: Car build
    part: car
    title: Boost under the tuner's target at full load, steady at 2,500 rpm, after the stage
    how: "Line TL02's OBD gauge or the tuner's log, on the dyno and on the first long towing grade. Value is the target less the boost read, in kPa."
    unit: kPa
    estimate: {v: 0, src: "On target (est.)"}
    measured: {v: null, date: null}
    stage: build
    affects: [TL01, VEH-15, VEH-16]
    thresholds:
      - {at: 15, rule: "More than 15 kPa under the target: look for a boost leak at the intercooler's joints before towing hard", src: "Assumed (est.). No Ford or Garrett boost figure for this engine was found"}
    range: {min: 0, max: 15, src: "Assumed (est.)"}
  - id: VEH-15
    group: Car build
    part: car
    title: Turbo shaft speed at full load on the longest towing grade, after the stage
    how: "Read Garrett's shaft speed sensor (PW03) on the OBD gauge (TL02) at the top of the longest grade with the loaded trailer."
    unit: krpm
    estimate: {v: 170, src: "The calibration keeps the turbo under Garrett's limit (decision H30), about 9 % under it (est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [PW01, PW03, the calibration]
    thresholds:
      - {at: 186.2, rule: "Over 186.2 krpm: stop towing hard and have the tuner pull boost", src: "Garrett PowerMax 930592-5001S, shaft speed limit 186.2 krpm (Garrett's catalogue, report 31 section 5)"}
    range: {min: 0, max: 186.2, src: "Garrett's catalogue (report 31 section 5)"}
  - id: VEH-16
    group: Car build
    part: car
    title: Exhaust temperature before the turbo, sustained full load towing, after the stage
    how: "Read the EGT on the OBD gauge (TL02) on the longest steep grade with the loaded trailer, air at 30 °C or more."
    unit: °C
    estimate: {v: 750, src: "Assumed under Ford's own EGT limits, which the calibration keeps (decision H30, est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [PW01, the calibration]
    thresholds:
      - {at: 830, rule: "Over 830 °C: lift off, and have the tuner lower the fuel at that load", src: "Garrett PowerMax 930592-5001S, ductile iron turbine housing rated to 830 °C (report 31 section 5)"}
    range: {min: 0, max: 830, src: "Garrett's turbine housing rating (report 31 section 5)"}
  # ================================================================ towing at stock power in S2, and again after S3 (line TL02)
  - id: VEH-17
    group: Car build
    part: car
    title: Coolant temperature on a long grade, towing the loaded trailer in heat
    how: "Log the coolant temperature with an OBD logger at the top of the longest grade of the first long tow, air at 30 °C or more, at stock power: the long tow S3 needs first. Repeat on the OBD gauge (TL02) after the stage."
    unit: °C
    estimate: {v: 100, src: "Assumed for a diesel towing near its rating in heat (est.). Ford publishes no figure"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [S3, the calibration]
    thresholds:
      - {at: 110, rule: "Over 110 °C for long: an airflow fault. Have the dealer check the cooling system before the stage, or the tuner the stage's fuelling after it", src: "Assumed (est.)"}
    range: {min: 85, max: 110, src: "Assumed (est.)"}
  - id: VEH-18
    group: Car build
    part: car
    title: The 10-speed's fluid temperature, same tow
    how: Log the transmission temperature at the same point as VEH-17, in Tow/Haul, and again on the OBD gauge (TL02) after the stage.
    unit: °C
    estimate: {v: 95, src: "Assumed (est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [TX01]
    thresholds:
      - {at: 110, rule: "Over 110 °C sustained: fit the larger transmission cooler (TX01) before the next long tow", src: "VEHICLE.md stage S3 and report 31 section 6 (est.)"}
    range: {min: 0, max: 110, src: "VEHICLE.md stage S3 and report 31 section 6 (est.)"}
  - id: VEH-19
    group: Car build
    part: car
    title: The truck's battery voltage with both trailer chargers running, first hot night tow
    how: "Line TC01's first long tow at night with the headlights, the air-conditioner and the fan on, air at 25 °C or more. Log the battery voltage with an OBD logger at highway speed and take the lowest steady reading."
    unit: V
    estimate: {v: 14.0, src: "Ford's 250 A alternator against the chargers' 62 A and the truck's own loads (est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [TC01, TC02]
    thresholds:
      - {at: 13.5, rule: "Two more chargers (TC02) go in only if the trailer ends travel days short and the voltage holds at 13.5 V or more", src: "VEHICLE.md stage S2"}
    range: {min: 13.5, max: null, src: "VEHICLE.md stage S2. No upper limit: the truck's own charging regulates it"}
  # ================================================================ stages S1 and S2: the laden truck on a public weighbridge (lines CK02 and CK03)
  - id: VEH-20
    group: Car build
    part: car
    title: Rear axle, laden ute towing the loaded trailer
    how: "Line CK03. Two people, both bikes, tools, full fuel, one spare, then the loaded trailer coupled. Weigh the ute's rear axle with the trailer's wheels off the plate."
    unit: kg
    estimate: {ref: ute_rear_towing, dp: 0, src: "Ute model case UC3 with growth (UTE-03): the bikes aboard, the trailer charging and the trailer's heaviest towball with growth, on the Ranger Super Duty"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [UTE-03 check, ball load]
    thresholds:
      - {at: 2800, rule: "Over 2,800 kg, Ford's rear axle rating: take mass off the box or the ball before towing", src: "Ford BEMM p. 33, the Super Duty's rear gross axle weight rating"}
    range: {min: 0, max: 2800, src: "Ford BEMM p. 33, 2,800 kg"}
  - id: VEH-21
    group: Car build
    part: car
    title: Front axle, laden ute with the bikes and no trailer
    how: Line CK03, the ute alone, loaded as VEH-20.
    unit: kg
    estimate: {ref: ute_front_bikes, dp: 0, src: "Ute model case UC2 with growth (UTE-02), on the Ranger Super Duty"}
    measured: {v: null, date: null}
    stage: weigh
    affects: [UTE-02 check]
    thresholds:
      - {at: 1900, rule: "Over 1,900 kg: move mass rearward off the front", src: "Ford BEMM p. 33, the front gross axle weight rating"}
    range: {min: 0, max: 1900, src: "Ford BEMM p. 33, 1,900 kg"}
  - id: VEH-22
    group: Car build
    part: car
    title: Centre of gravity of the box and its cargo along the ute, bikes aboard (Ford's window)
    how: "Weigh the bare truck's axles at stage S1 and the ute alone loaded as VEH-21. The box and its cargo weigh the difference less the two people, and their centre of gravity is 3,270 mm times the rear axle's gain, less the people's 70 kg share there, over that mass, behind the front axle."
    unit: mm
    estimate: {ref: ute_added_cog_x, dp: 0, src: "Ute model case UC2 with growth (UTE-07): the box, the bikes, the tools and the accessories, without the cab's occupants"}
    measured: {v: null, date: null}
    stage: weigh
    affects: [UTE-07 check]
    thresholds:
      - {at: 3270, rule: "Behind 3,270 mm: move the tools or the anchors' bag forward. Ford's window at the 966 kg the box and its cargo add", src: "Ford BEMM p. 32, interpolated between its 800 kg and GVM rows (est.)"}
    range: {min: 1965, max: 3270, src: "Ford BEMM p. 32: 1,965 mm at least, and 3,270 mm at 966 kg of added mass (est. interpolation)"}
  - id: VEH-23
    group: Car build
    part: car
    title: Laden ute mass towing, including the ball load (GVM check)
    how: From VEH-20's weighing, the ute's two axles added.
    unit: kg
    estimate: {ref: ute_gvm_towing, dp: 0, src: "Ute model case UC3 with growth (UTE-01): the bikes aboard, the trailer charging and the trailer's heaviest towball with growth"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [UTE-01 check]
    thresholds:
      - {at: 4500, rule: "Over 4,500 kg, Ford's GVM: unload before driving", src: "Ford BEMM p. 33"}
    range: {min: 0, max: 4500, src: "Ford BEMM p. 33, the Super Duty's 4,500 kg GVM"}
  - id: VEH-24
    group: Car build
    part: car
    title: Combination mass, laden ute plus loaded trailer (GCM check)
    how: Line CK03. The ute's axles and the trailer's axles weighed coupled, added.
    unit: kg
    estimate: {ref: combination, dp: 0, src: "Ute model case UC2 with growth plus the trailer fully loaded with growth (case TC2, MAS-10). The plan's limit sum is GCM-01's, the ute plus the trailer's plate (decision H20)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [GCM-01 check]
    thresholds:
      - {at: 8000, rule: "Over 8,000 kg: unload before driving", src: "Ford BEMM p. 33, the Super Duty's GCM"}
    range: {min: 0, max: 8000, src: "Ford BEMM p. 33, 8,000 kg, with no revision and no fallback"}
  # ================================================================ heights (the bought truck)
  - id: VEH-25
    group: Car build
    part: car
    title: Rear frame-rail top above the ground at the rear axle, at kerb, box off
    how: "Level floor, correct tyre pressures, nobody aboard, box off. Measure each rail top straight above the rear axle and average."
    unit: mm
    estimate: {v: 850, src: "Ford BEMM p. 128: 850 mm in the table's other column (est.: kerb), 740 mm at GVM with the rear axle at its rating"}
    measured: {v: null, date: null}
    stage: build
    affects: [box floor height 851 mm laden at GVM, box mounts, coupling height]
    thresholds:
      - {rule: "The mounts' height follows the measured value so the floor stays 111 mm over the rail top. Outside the range, re-check the floor and tub heights", src: "UTE-GARAGE.md section 4"}
    range: {min: 825, max: 875, src: "Ford's figure plus or minus about 25 mm (est.)"}
  - id: VEH-26
    group: Car build
    part: car
    title: Rear bump travel from GVM, axle to bump stop
    how: Unladen, measure from the axle's bump stop pad to the bump stop on each side, take the smaller, and take off the 110 mm the frame falls from kerb to GVM (Ford's 850 and 740 mm).
    unit: mm
    estimate: {v: 74, src: "Ford's wheelhouse envelope (BEMM p. 122): the guard 195 mm over the tyre's top, taken at kerb, less its 30 mm clearance, carried to GVM (est.)"}
    measured: {v: null, date: null}
    stage: build
    affects: [wheel tub height, box floor]
    thresholds:
      - {at: 104, rule: "Over 104 mm the tubs stand more than 100 mm above the floor and the lower floor no longer works", src: "Ute model: tubs 70 mm at 74 mm of travel. Report 17 section 6.4 limit of 100 mm (calculated)"}
    range: {min: 0, max: 104, src: "Ute model and report 17 (calculated)"}
  - id: VEH-27
    group: Car build
    part: car
    title: Rear frame-rail top above the ground at the rear axle, laden and towing
    how: "Line CK03, loaded as VEH-20 with the trailer coupled. Measure each rail top straight above the rear axle and average."
    unit: mm
    estimate: {v: 761, src: "Between Ford's 850 mm at kerb and 740 mm at the 2,800 kg rear axle rating (BEMM p. 128), in a straight line at UC3's 2,430 kg (est.). The model takes Ford's 740 mm, the lowest the frame sits laden"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [coupling height, box floor height]
    thresholds:
      - {rule: "Below 740 mm the rear axle is over its rating or the springs have sagged. Check VEH-20", src: "Ford BEMM p. 128"}
    range: {min: 740, max: 800, src: "Ford's 740 mm at the rear axle's rating to about 40 mm over the estimate (est.)"}
  - id: VEH-28
    group: Car build
    part: car
    title: Rear track, laden, tyre centre to tyre centre
    how: "The ute loaded to the trip mass (or 650 kg of ballast over the rear axle) on level ground. Mark the middle of each rear tyre's tread on the ground in front of and behind the tyre, measure across between the marks and average the two. Before the box's tubs and flares are finished."
    unit: mm
    estimate: {v: 1710, src: "Ford BEMM p. 25: the Super Duty's 1,710 mm track, front and rear"}
    measured: {v: null, date: null}
    stage: build
    affects: [wheel_y, wheel tubs, rear tub flares, UGW-02, UGW-03, UTE-09, UTE-11]
    thresholds:
      - {rule: "Build the tubs and flares to the measured track: wheel_y in data/assemblies/ute-garage.yaml is half of it, and UGW-02 and UGW-03 run again before the floor is finished", src: "Ford BEMM p. 122, UGW-02, UGW-03"}
    range: {min: 1690, max: 1730, src: "Ford's 1,710 mm plus or minus 20 mm (est.). Inside the range the tubs and flares are built to the measured track"}
  # ================================================================ wheel and supplier answers (reports 06 and 16)
  - id: WHL-01
    group: Wheel and suppliers
    part: trailer
    title: Load rating of the trailer's wheel, ROH Trak 2 16 x 7 ET 0, 5 x 150
    how: Read it from ROH's current table or the stamp on the wheel, and ask ROH whether it holds at the 80 psi of a load range E tyre.
    unit: kg
    estimate: {v: 1400, basis: maker, src: "ROH's fitment table for the Trak 2 16 x 7 ET 0 5 x 150 (report 16 section 4), the trailer's own wheel since the Super Duty's 8-stud 18 in wheels replaced the shared one. The maker's figure"}
    measured: {v: null, date: null}
    stage: buy
    range: {min: {ref: wheel_need}, max: null, src: "At least the trailer's per-wheel load in MAS-09, with the growth allowance. No maximum: a higher rating only adds margin"}
    affects: [MAS-09]
    thresholds:
      - {rule: "MAS-09 checks the rating against the per-wheel load MAS-06 uses: 1.2 times the axle group load with the growth allowance, over four wheels. Below it, choose a higher-rated wheel", src: "VSB1 Rev 6 axles and suspension, report 16"}
  - id: SUP-01
    group: Wheel and suppliers
    part: trailer
    title: Cruisemaster's GTM for the XT Air build
    how: Cruisemaster sets it in the design session. It has said it will design to VSB1's 120 % rule (18 Nov).
    unit: kg
    estimate: {v: 4050, src: "Cruisemaster air guide: 4,500 kg ATM XT Air tandem, 4,050 kg GTM (report 06)"}
    measured: {v: null, date: null}
    stage: buy
    range: {min: {ref: gtm_need}, max: null, src: "At least the larger of MAS-02's axle group load with growth and the axle group at the plated ATM with H2's 7.5 % on the ball, the load-sharing tandem's need (VSB1's 120 % rule applies only if the tandem does not share load, report 06). No maximum: a higher rating only adds margin"}
    affects: [MAS-02]
    thresholds:
      - {rule: "The axle group load in MAS-02 is checked against this rating. The load-sharing tandem at the ATM needs the ATM less the towball target, 3,700 kg at the 4,000 kg plate. Without load sharing VSB1's 120 % rule would need 1.2 times that, 4,440 kg, more than the XT Air's 4,050 kg", src: "Report 06, VSB1 Rev 6 axles and suspension, Cruisemaster CIS-006 rev 25"}
  - id: SUP-02
    group: Wheel and suppliers
    part: trailer
    title: Do Cruisemaster's ratings already include VSB1's 120 % rule? (1 for yes, 0 for no)
    how: Cruisemaster's written answer to report 06 open question 2.
    unit: yes or no
    estimate: {v: 0, src: "Not known. Taken as no, which is the safe side (report 06)"}
    measured: {v: 0, date: 2026-11-18, note: "Cruisemaster: it does not usually apply VSB1's rules, but will follow them in the design with the owner"}
    stage: buy
    range: {min: 0, max: 1, src: "Either answer works: MAS-02 checks 1.2 times the axle group load for no (0) and the axle group load itself for yes (1)"}
    affects: [MAS-02]
    thresholds:
      - {at: 0, rule: "No: MAS-02 checks 1.2 times the axle group load against the kit's GTM. Yes: it checks the axle group load itself", src: "VSB1 Rev 6 axles and suspension, report 06"}
  - id: SUP-04
    group: Wheel and suppliers
    part: trailer
    title: Cruisemaster's C/F for the ROH Trak 2 16 x 7 ET 0 wheel, from the rail's outside face to the hub face
    how: Cruisemaster sets it in the design session from the wheel's offset and the track.
    unit: mm
    estimate: {v: 190, src: "Report 18 section 3.4's C/F 190 with ET 0 gives the 1,655 mm track on the 1,275 mm rails (H22), 100 mm over the ute's front track"}
    measured: {v: null, date: null}
    stage: buy
    range: {min: {ref: cf_min}, max: 200, src: "Maximum: Cruisemaster's chart limits the effective C/F (C/F less ET 0) to 200 mm for the 4,500 kg XT Air tandem. Minimum: a smaller C/F moves the tyre towards the rail by the same amount, and FIT-05 keeps the tyre 50 mm from every chassis member, so the minimum is the C/F in use less FIT-05's margin"}
    affects: [track, chassis inputs]
    thresholds:
      - {rule: "The rail outer width stays 1,275 mm (H22), so the track follows: rail width + 2 x (C/F - ET). The tyre's inner sidewall sits C/F - ET - half the tyre width outside the rail, and report 06 asks for about 40 mm", src: "Report 06 sections 3 and 8, report 09 section 3"}
      - {at: 200, rule: "Cruisemaster's C/F chart marks every effective C/F (C/F - ET) above 200 mm as unacceptable for the 4,500 kg XT Air tandem. Above it the note flags the C/F, and a wider track needs a wider rail instead", src: "Cruisemaster C/F sheet, as read in report 09"}

  # ================================================================ the bikes and the chock, in the ute's bike box (UTE-GARAGE.md, report 05)
  - id: TU-01
    group: Bikes (ute bike box)
    part: box
    title: Tuareg width across the fairing side panels, about 1,010 mm off the floor and 380 mm behind the front axle
    how: Bike upright on its stand. Hold a straight board flat against each side panel at that height and spot, keep both boards parallel to the bike, and measure between them.
    unit: mm
    estimate: {v: 600, src: "Design estimate (DESIGN.md), 300 mm either side (range 280 to 350)"}
    measured: {v: 585, date: 2026-11-18, note: "Owner. Nothing else is at this spot, the crash bars sit much lower"}
    stage: build
    range: {min: null, max: 708, src: "Above 668 mm the build widens the bike spacing by the excess, and at 708 mm it reaches 780 mm, where the Street Triple's belly pan comes within 15 mm of the kerb-side tool chest (UGC-02) and the box layout needs redesigning. No minimum: a narrower bike only adds clearance"}
    affects: [side panel envelope, bike spacing, bike positions in the box, UGC-01, UGC-02]
    thresholds:
      - {at: 668, rule: "At or below 668 mm the 760 mm spacing holds: half-width 334 = 760 spacing - 396 Street Triple bar reach - 30 mm gap (UGC-01). Above it the spacing grows by about the excess half-width, and the build then sets the final spacing from the geometry: the smallest spacing at which UGC-01 measures 30 mm. Each bike moves out towards its wall by half the growth", src: "UTE-GARAGE.md (760 mm spacing, 30 mm limit), owner's 792 mm Street Triple width, addendum 1"}
      - {at: 780, rule: "The box is 1,850 mm wide outside at most, so it does not grow. Above a 780 mm spacing (about 708 mm across the side panels) the Street Triple's belly pan comes within 15 mm of the kerb-side tool chest, UGC-02 fails and the box layout has to be redesigned", src: "UTE-GARAGE.md, check UGC-02"}
  - id: TU-09
    group: Bikes (ute bike box)
    part: box
    title: Tuareg crash bars, top height
    how: Bike upright on level floor. Lay a straight board level across the highest point of the bars, front to back, and measure from the floor to its underside.
    unit: mm
    estimate: {v: 900, src: "Owner, 2026-11-18: much lower than the Street Triple's bar end at about 1,010 mm. 900 mm used until measured"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 970, src: "Up to 970 mm the Street Triple's bar end at about 1,000 mm passes over the crash bars. Above it the bars may meet the bar end (UGC-01). No minimum: lower bars only add clearance"}
    affects: [crash bar envelope, UGC-01]
    thresholds:
      - {at: 970, rule: "The Street Triple's right bar end sits at about 1,000 to 1,030 mm. If the bars top out at about 970 mm or lower (30 mm under it), the bar end passes over them and the side panels govern. Above it the bars may meet the bar end, and the build re-solves the spacing from the geometry", src: "Report 05 (Street Triple bars at 1,013 mm), UTE-GARAGE.md UGC-01"}
  - id: TU-02
    group: Bikes (ute bike box)
    part: box
    title: Tuareg overall length with the number plate hanger
    how: Bike upright. Stand a board square to the floor against the front tyre and another against the rear-most point of the plate or hanger, and measure between them.
    unit: mm
    estimate: {v: 2220, src: "Owner's figure. Aprilia's image suggests 2,263 mm or more (report 05)"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 2288, src: "Above 2,288 mm the number plate comes within 15 mm of the ramp stowed across the back of the box (UGC-04). No minimum: a shorter bike only adds clearance"}
    affects: [UGC-02, UGC-04]
    thresholds:
      - {at: 2288, rule: "Above about 2,288 mm the plate comes within 15 mm of the ramp stowed across the back of the box (UGC-04 measures 40.8 mm at 2,263 mm). The box length is set by the ute's rear overhang, so the bikes move forward only if the chock nose (CHK-01) measures shorter", src: "UTE-GARAGE.md UGC-02 and UGC-04"}
  - id: TU-03
    group: Bikes (ute bike box)
    part: box
    title: Tuareg screen top height, mirrors folded
    how: Bike upright on level floor. Lay a straight board across the top of the screen, level it, and measure from the floor to its underside.
    unit: mm
    estimate: {v: 1370, src: "Owner's figure. Aprilia's image gives about 1,390 mm"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 1420, src: "Above 1,420 mm the screen comes within 15 mm of the 1,460 mm roof bows and door header with the front wheel 25 mm up in the chock (UGC-02, UGC-05), and the walls must grow. No minimum"}
    affects: [UGC-02, UGC-05]
    thresholds:
      - {at: 1420, rule: "The box is 1,460 mm high inside to the roof bows and the door header. With the front wheel 25 mm up in the chock, a screen or folded mirror above about 1,420 mm comes within 15 mm of them (UGC-02), and the walls must grow", src: "UTE-GARAGE.md"}
  - id: TU-04
    group: Bikes (ute bike box)
    part: box
    title: Tuareg folded mirror top height
    how: Fold the mirrors as for transport. Measure from the floor to the highest point of either mirror.
    unit: mm
    estimate: {v: 1365, src: "bikes.yaml estimate, kept below the screen"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 1420, src: "The folded mirrors follow the screen's rule: above 1,420 mm they come within 15 mm of the roof bows (UGC-02). No minimum"}
    affects: [UGC-02]
    thresholds:
      - {rule: "If the mirrors stand above the screen they set the height instead (TU-03 rule)", src: "UTE-GARAGE.md"}
  - id: TU-05
    group: Bikes (ute bike box)
    part: box
    title: Tuareg width over the panniers
    how: Bags on and packed as for the trip. Hold a board against the outside of each bag, parallel to the bike, and measure between the boards.
    unit: mm
    estimate: {v: 980, src: "Owner's measurement of about 970 to 980 mm"}
    measured: {v: 980, date: 2026-11-18, note: "Owner's measurement, 970 to 980 mm, reported on 18 Nov"}
    stage: build
    range: {min: null, max: 1049, src: "Above 1,049 mm the road-side bag comes within 15 mm of the barn door portal as the Tuareg rolls out (UGC-03). No minimum: narrower bags only add clearance"}
    affects: [pannier envelope, UGC-02, UGC-03, UGC-06]
    thresholds:
      - {at: 1049, rule: "Above about 1,049 mm the road-side bag comes within 15 mm of the barn door portal as the Tuareg rolls out (UGC-03 measures 49.5 mm at 980 mm). The Tuareg would have to move towards the kerb side", src: "UTE-GARAGE.md UGC-03"}
  - id: TU-06
    group: Bikes (ute bike box)
    part: box
    title: Tuareg pannier length, height and position
    how: Measure one bag's length along the bike and its height, and how far its front edge is behind the front axle and its bottom above the floor.
    unit: mm
    estimate: {v: [457, 508, 1300, 425], src: "Length and height from Mosko Moto's Backcountry 30L figures. Front edge 1,300 behind the front axle and bottom 425 off the floor are estimates"}
    measured: {v: null, date: null}
    stage: build
    range: {min: [null, null, 1260, 385], max: [497, 548, 1340, 465], src: "Estimate: UGC-05 measures 59.5 mm from the road-side bag to the nearest frame post (needs 15) and UGC-06 55.7 mm to the nearest strap (needs 0), so each figure may change by about 40 mm before a check fails (est.). Smaller bags only add clearance, so length and height have no minimum"}
    order: [length, height, front edge behind the front axle, bottom above the floor]
    affects: [pannier envelope, UGC-06]
    thresholds:
      - {rule: "The envelope follows the values and UGC-06 re-measures the gap to the straps", src: "UTE-GARAGE.md"}
  - id: TU-07
    group: Bikes (ute bike box)
    part: box
    title: Tuareg footpeg width, tip to tip
    how: Pegs down. Hold a board against the tip of each peg, parallel to the bike, and measure between them.
    unit: mm
    estimate: {v: 640, src: "bikes.yaml design estimate (320 mm each side)"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 689, src: "Estimate: UGC-02 measures 39.5 mm from the Tuareg to the road-side tool chest (needs 15), so each peg tip may reach about 24 mm further out (est.). The 730 mm rule for the two facing pegs allows more. No minimum"}
    affects: [bike spacing, UGC-01, UGC-02]
    thresholds:
      - {at: 730, rule: "The two bikes' facing pegs must stay 30 mm apart: half the Tuareg's width plus half the Street Triple's at most 730 mm (760 - 30). Above it the spacing grows by the excess, as in TU-01", src: "UTE-GARAGE.md UGC-01"}
  - id: ST-01
    group: Bikes (ute bike box)
    part: box
    title: Street Triple footpeg width, tip to tip
    how: As TU-07, on the Street Triple.
    unit: mm
    estimate: {v: 440, src: "bikes.yaml design estimate (220 mm each side)"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 461, src: "Estimate: UGC-02 measures 25.5 mm from the Street Triple to the kerb-side tool chest (needs 15), so each peg tip may reach about 10 mm further out (est.). The 730 mm rule for the two facing pegs allows more. No minimum"}
    affects: [bike spacing, UGC-01]
    thresholds:
      - {at: 730, rule: "With TU-07: half of each peg width added together at most 730 mm, or the spacing grows by the excess", src: "UTE-GARAGE.md UGC-01"}
  - id: CHK-01
    group: Bikes (ute bike box)
    part: box
    title: Condor chock nose depth, the box's front wall to the front tyre's leading edge
    how: Bolt a chock to a board against a wall, roll a front wheel into it, and measure from the wall to the front of the tyre.
    unit: mm
    estimate: {v: 50, src: "Design allowance (DESIGN.md), to be measured on a real chock"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 75, src: "Both bikes move back by the chock's depth, and UGC-04 measures 40.8 mm from the Tuareg's plate to the stowed ramp (needs 15), so the chock may be about 25 mm deeper than 50 mm. No minimum: a shallower chock moves the bikes away from the ramp"}
    affects: [bike position along the box, UGC-02, UGC-04]
    thresholds:
      - {rule: "The front tyre's leading edge sits this far behind the box's front wall, so both bikes move with it", src: "UTE-GARAGE.md"}

  # ================================================================ the bike box (report 24, UTE-GARAGE.md), group Bike box
  # ================================================================ before the build: the bought ute
  - id: BOX-01
    group: Bike box
    part: box
    title: Rear frame rail top above the ground, laden, at Ford's rearmost pads
    how: Tyres at road pressure, the ute loaded to the trip mass (both bikes and the tools, or 650 kg of ballast over the rear axle) on level ground. Measure from the ground to the top of each rail at the rearmost pad and average the two.
    unit: mm
    estimate: {v: 740, src: "Ford BEMM p. 128: 740 mm at GVM with the rear axle at its rating, the lowest the frame sits laden, which the model takes"}
    measured: {v: null, date: null}
    stage: build
    affects: [floor height, ramp angle, UGL-01, JK-02, coupling height]
    range: {min: 700, max: 850, src: "Ford's 740 mm at the rear axle's rating to 850 mm at kerb (BEMM p. 128). Below 700 mm the rear springs are overloaded (est.)"}
    thresholds:
      - {rule: "The floor stands 111 mm over the rail top, so the sill and the ramp's angle follow the measured value (UGL-01)", src: "UTE-GARAGE.md section 4"}
  - id: BOX-02
    group: Bike box
    part: box
    title: Rear tyre's top at full bump above the rail top
    how: "Box off, at kerb. Measure the rail top and the rear tyre's top above the ground over the axle, and the gap from the bump stop to its striker plus the bump stop's crush. The tyre's top at full bump is the tyre's top plus that travel, less the rail top."
    unit: mm
    estimate: {v: 148, src: "Ford's wheelhouse envelope (BEMM p. 122): the guard 195 mm over the tyre's top, taken at kerb, less its 30 mm clearance, with the 850 mm rail top at kerb (p. 128) and a 412 mm loaded radius (est.)"}
    measured: {v: null, date: null}
    stage: build
    affects: [tub height, UGD-01, UGW-01]
    range: {min: null, max: 178, src: "The tub top stands 30 mm and its 3 mm plate over this, and the floor 111 mm over the rail top, so the tubs reach UGD-01's 100 mm at 178 mm (calculated)"}
    thresholds:
      - {at: 178, rule: "Above this the tubs pass 100 mm above the floor: taller mounts, or Leonard accepts taller tubs and UGC-02 runs again", src: "Report 17 section 6.4, UGD-01"}
  - id: BOX-03
    group: Bike box
    part: box
    title: Rear tyre static loaded radius, laden
    how: Ute laden as BOX-01, tyres at the placard pressure. Measure from the ground to the centre of each rear hub and average.
    unit: mm
    estimate: {v: 393, src: "Estimate: the LT275/70R18's 421 mm radius less about 28 mm of deflection at 1,400 kg a tyre"}
    measured: {v: null, date: null}
    stage: build
    affects: [the model's laden ride height, the coupling height]
    range: {min: 370, max: 410, src: "Under-inflated or overloaded below 370 mm, unladen above 410 mm (est.)"}
    thresholds:
      - {rule: "The model's wheel centre follows the measured value. The tubs follow BOX-02", src: "UTE-GARAGE.md section 4"}
  - id: BOX-04
    group: Bike box
    part: box
    title: Ford's body mounting pad positions from the rear axle centre
    how: Plumb lines from the rear hub centre and from each pad's bolt hole, marked on the floor. Measure along the rail, minus ahead of the axle and plus behind it. Both sides. Note each pad's height over the rail top, and the faces of the rear parking sensors on Ford's Driver Assistance Technology bar from the axle and above the ground (UTE-GARAGE.md open point 12).
    unit: mm
    estimate: {v: [-1205.5, -437.5, 453.5, 959.5], src: "Ford BEMM p. 125: four stations 768, 891 and 506 mm apart, taken centred on the 2,286 mm of frame behind the cab, the first 60.5 mm behind it (est.)"}
    measured: {v: null, date: null}
    stage: build
    order: [station 1, station 2, station 3, station 4]
    affects: [subframe drawing CT-702, the rear track row, the steel stubs, UGR-01, UGR-04, UGM-01, the box's overhang past the parking sensors]
    range: {min: [-1230.5, -462.5, 428.5, 934.5], max: [-1180.5, -412.5, 478.5, 984.5], src: "Each station within 25 mm of the estimate. The rear L-track row sits on station 4 and report 03 holds anchor X within 50 mm, so half of that is kept for build tolerance (est.)"}
    thresholds:
      - {rule: "Any station more than 25 mm off: redraw the subframe, move the stubs and the rear track row and re-run UGR-01 and UGR-04", src: "Report 03 section 4"}
  - id: BOX-05
    group: Bike box
    part: box
    title: Ford's body mounting pad hole diameter
    how: Vernier on each bolt hole. Note the pad's size as well.
    unit: mm
    estimate: {v: 15, src: "An M14 clearance hole, Ford's recommended bolt (BEMM p. 124). Ford's figure on p. 125 labels 20, 26 and 20 mm round the hole (est. reading)"}
    measured: {v: null, date: null}
    stage: build
    affects: [bolt size BX-F01, mounts BX-U02 and BX-U03, UGM-01]
    range: {min: 12.5, max: 21, src: "A hole that takes Ford's minimum M12 or its recommended M14, with the 50 x 5 mm washers over it (est.)"}
    thresholds:
      - {rule: "A hole sized for M12 changes the bolt in BX-F01 to M12 10.9, Ford's minimum, and UGM-01 is run again with it", src: "UGM-01, BEMM p. 124"}
  - id: BOX-06
    group: Bike box
    part: box
    title: Ford's pads across the truck, hole centre to hole centre
    how: Straight edge and tape across the truck between each pair's bolt holes, at every station.
    unit: mm
    estimate: {v: 1244, src: "Ford BEMM p. 125: 1,244 mm, 1,248 mm at the rearmost pair (est. reading of the figure)"}
    measured: {v: null, date: null}
    stage: build
    affects: [runner positions, mounts, UGW-02, UGR-03]
    range: {min: 1224, max: 1264, src: "Plus or minus 20 mm (est.): the 75 mm runners still cover the 50 mm mounts, and the tubs keep Ford's 30 mm to the tyres (UGW-02)"}
    thresholds:
      - {rule: "Outside the range, move the runners over the measured pads and re-run UGW-02 and UGR-03", src: "UGW-02, UGR-03"}
  # ================================================================ the built box, before it goes on
  - id: BOX-07
    group: Bike box
    part: box
    title: Box mass empty, with its restraint, ramp, winch, security and tool chests, no tools
    how: Weigh the finished box on four platform scales under its mount points, or on a weighbridge on a trailer weighed empty first. Record the sum.
    unit: kg
    estimate: {ref: box_kg, dp: 1, src: "The model's box (build/ute/ute.json), equal to the data/ute/box-parts.yaml line sum, with the 1.6 mm roof"}
    measured: {v: null, date: null}
    stage: weigh
    affects: [every ute mass check, UGB-01, UTE-06, the rear axle]
    range: {min: 392, max: 440, src: "Max: UGB-01's 440 kg limit (report 17, data/ute/garage-checks.yaml). Min: 10 % under the list, below which a part is missing (est.)"}
    thresholds:
      - {at: 0.02, rule: "A difference over 2 % from the line sum is explained before the box is fitted", src: "Report 02 MASS-07"}
      - {at: 440, rule: "UGB-01 asks for less than report 17's 440 kg. The list is 1.8 kg under it with the 1.6 mm roof, the flares, the stubs and the mudflaps (UTE-GARAGE.md). Over it, take mass out of the box before it goes on the ute", src: "data/ute/garage-checks.yaml via cad/ute_garage.py"}
  - id: BOX-08
    group: Bike box
    part: box
    title: Box centre of gravity along the box and its height above the floor, empty
    how: "Along: from the four scale readings of BOX-07, the mass-weighted X of the front and rear pairs. Height: raise the front pair of mounts a known height (about 300 mm) on blocks, weigh again, and compute the height from the shift of load to the rear pair (tilt method)."
    unit: mm
    estimate: {v: [1260, 483], src: "Model line sum, build/ute/ute.json: X 1,260 mm from the front wall's inner face (67 mm behind the rear axle), 483 mm above the floor top"}
    measured: {v: null, date: null}
    stage: weigh
    order: [X from the front wall, height above the floor]
    affects: [ute axle loads, UTE-07, UTE-08, SSF, UGM-01]
    range: {min: [1160, 383], max: [1289, 488], src: "Min: 100 mm under the estimate (est.). Max: the box is 438 kg of the 966 kg of added mass with the bikes aboard, so 29 mm further back or 5 mm higher takes the added mass out of Ford's window, where UTE-07 has 13.2 mm and UTE-08 2.5 mm in hand (calculated). 100 mm along moves about 13 kg between the axles"}
    thresholds:
      - {rule: "The measured values replace the model's for the box lines and the ute checks run again", src: "Report 02 MASS-07"}
      - {rule: "Past the maximum the added mass leaves Ford's window (UTE-07, UTE-08): move mass in the box forward or lower and run the ute checks again before the box goes on", src: "Ford BEMM p. 32, UTE-07, UTE-08"}
  - id: BOX-09
    group: Bike box
    part: box
    title: Barn door meeting gap, closed and locked
    how: Feeler gauges at the top, middle and bottom of the meeting edge between the leaves. Check the hinge gaps at the corner posts at the same time, 9 to 11 mm.
    unit: mm
    estimate: {v: 5, src: "Model leaf_gap (data/assemblies/ute-garage.yaml)"}
    measured: {v: null, date: null}
    stage: build
    affects: [seal contact, cam bar keepers, dog bolts, UGC-03]
    range: {min: 3, max: 8, src: "The cam bar keepers and the edge seal work from 3 to 8 mm (est.)"}
    thresholds:
      - {rule: "Out of range: re-hang the leaf before the seals go on", src: "Build step 7"}
  - id: BOX-10
    group: Bike box
    part: box
    title: Kerb door gap all round, closed
    how: Feeler gauges at each corner and mid-side.
    unit: mm
    estimate: {v: 5, src: "Design (est.)"}
    measured: {v: null, date: null}
    stage: build
    affects: [seal contact, latch]
    range: {min: 3, max: 8, src: "As BOX-09 (est.)"}
    thresholds:
      - {rule: "Out of range: re-set the hinge and the strut brackets", src: "Build step 7"}
  - id: BOX-11
    group: Bike box
    part: box
    title: Door seal contact, paper test
    how: Close and lock each door on a strip of paper at every 300 mm round the seal. The strip must drag at every point. Count the points where it pulls out freely.
    unit: points
    estimate: {v: 0, src: "Design"}
    measured: {v: null, date: null}
    stage: build
    affects: [dust, water, positive pressure]
    range: {min: 0, max: 0, src: "Every point must drag, so the fan holds the box above outside pressure (report 17 section 2.4)"}
    thresholds:
      - {rule: "Any loose point: adjust the keeper or add seal before the water test (build step 11)", src: "Report 17 section 2.4"}
  # ================================================================ fitted on the ute
  - id: BOX-12
    group: Bike box
    part: box
    title: Cab back to the box front wall, at the roof
    how: Measure the gap at the cab's roof line and at its lower corners after the mounts are torqued.
    unit: mm
    estimate: {v: 30, src: "Model cab_gap (data/assemblies/ute-garage.yaml)"}
    measured: {v: null, date: null}
    stage: build
    affects: [UTE-15, rear overhang, box overhang behind the ball, JK-01]
    range: {min: 28, max: 60, src: "Min: Ford BEMM p. 25, at least 28 mm between the cab and the body (UTE-15). Max: each mm more adds 1 mm of overhang behind the ball, and JK-01's 100 mm allowance is for the unmeasured ball position (est.)"}
    thresholds:
      - {at: 28, rule: "Below 28 mm UTE-15 fails: move the box back on its mounts", src: "Ford BEMM p. 25"}
  - id: BOX-13
    group: Bike box
    part: box
    title: Static gap from each rear tyre's top to the tub roof above it, laden
    how: Ute laden as BOX-01, box fitted. Reach in from beside the wheel with a rule from the tyre's highest point to the tub's underside.
    unit: mm
    estimate: {v: 104, src: "74 mm of bump travel from GVM (est., UTE-GARAGE.md section 4) plus Ford's 30 mm at full bump (BEMM p. 122, UGW-01)"}
    measured: {v: null, date: null}
    stage: build
    affects: [UGW-01]
    range: {min: 104, max: null, src: "Min: the laden travel to full bump (the bump stop's gap plus its crush, as in BOX-02) plus Ford's 30 mm (BEMM p. 122, UGW-01). 104 mm with the estimated 74 mm of travel"}
    thresholds:
      - {rule: "Less than the travel plus 30 mm: the tyre comes inside Ford's 30 mm of the tub at full bump. Fit a taller bump stop or raise the tubs", src: "UGW-01, Ford BEMM p. 122"}
  - id: BOX-14
    group: Bike box
    part: box
    title: Clearance from the box's rear underside to the highest part of the coupled trailer within the box's sweep about the ball
    how: Ute laden and coupled to the loaded trailer on level ground. Measure from the underside of the box's rear crossmember straight down to the highest part of the coupling, handbrake, jockey wheel and its clamp, chains or drawbar box lid within 1,030 mm behind the ball (the box's corner sweep and JK-01's 100 mm).
    unit: mm
    estimate: {v: 174.5, src: "Model check JK-02: the jockey wheel's top, swung up for travel, 622 mm up, the highest part within 1,030 mm of the ball, under the box's underside at 797 mm"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [JK-01, JK-02]
    range: {min: 50, max: null, src: "Trailer check JK-02 (data/checks.yaml): everything inside the box's sweep stays 50 mm below its underside"}
    thresholds:
      - {at: 50, rule: "Below 50 mm: lower the part on the trailer's drawbar or move it outside the box's sweep (JK-01)", src: "JK-02"}
  - id: BOX-15
    group: Bike box
    part: box
    title: Sill height above the ground with the bikes out
    how: Ute unladen except the empty box and two people's mass in the cab (or the people in it), level ground. Measure from the ground to the top of the sill angle.
    unit: mm
    estimate: {v: 921, src: "UGL-01: the floor 111 mm over the rail top, which stands about 810 mm up with the bikes out and the trailer off, between Ford's 850 mm at kerb and 740 mm at the rear axle's rating (est., BEMM p. 128)"}
    measured: {v: null, date: null}
    stage: build
    affects: [ramp angle, UGL-01]
    range: {min: null, max: 1042, src: "3,048 mm x sin 20 degrees: report 03's limit for walking a bike up beside the ramp"}
    thresholds:
      - {at: 1042, rule: "Above this the ramp is steeper than 20 degrees: use a longer ramp or load on a slope", src: "Report 03 section 10"}
  # ================================================================ bikes in the box
  - id: BOX-16
    group: Bike box
    part: box
    title: Tuareg centreline from the ute's centreline, road side
    how: Snap a chalk line on the floor down the ute's centreline. Measure square from it to the centreline of the Tuareg's chock.
    unit: mm
    estimate: {v: 333, src: "Model tuareg_y (data/assemblies/ute-garage.yaml)"}
    measured: {v: null, date: null}
    stage: build
    affects: [UGC-01, UGC-02, UGC-03, strap anchors]
    range: {min: 292, max: 357, src: "Towards the kerb, UGC-01's 41.5 mm margin to the Street Triple. Towards the road, UGC-02's 24.5 mm margin to the road-side tool chest"}
    thresholds:
      - {rule: "Outside the range: move the chock adapter and its fittings before strapping", src: "UGC-01, UGC-02"}
  - id: BOX-17
    group: Bike box
    part: box
    title: Street Triple centreline from the ute's centreline, kerb side
    how: As BOX-16, to the Street Triple's chock.
    unit: mm
    estimate: {v: -427, src: "Model st_y"}
    measured: {v: null, date: null}
    stage: build
    affects: [UGC-01, UGC-02, strap anchors]
    range: {min: -437, max: -386, src: "Towards the kerb, UGC-02's 10.5 mm margin from the belly pan to the kerb tool chest. Towards the road, UGC-01's 41.5 mm margin"}
    thresholds:
      - {rule: "Outside the range: move the chock adapter. The kerb side is the tight one", src: "UGC-02"}
  - id: BOX-18
    group: Bike box
    part: box
    title: Track rows from the Tuareg's front axle, chocked
    how: Tuareg in its chock. Plumb from the front axle centre to the floor and measure along the box to the centre of each L-track row.
    unit: mm
    estimate: {v: [240, -1754.5], src: "UTE-GARAGE.md section 6: front row 240 mm ahead, rear row 1,754.5 mm behind the front axle, over Ford's rearmost pads"}
    measured: {v: null, date: null}
    stage: build
    order: [front row, rear row]
    affects: [strap angles, UGR-01]
    range: {min: [190, -1804.5], max: [290, -1704.5], src: "Each row within 50 mm of the estimate (report 03 section 4: hold anchor X within 50 mm)"}
    thresholds:
      - {rule: "More than 50 mm off: re-run UGR-01 with the measured rows", src: "Report 03 section 4"}
  - id: BOX-19
    group: Bike box
    part: box
    title: Fork compression under the front straps
    how: Mark each fork's stanchion at the seal with the bike chocked and the straps slack, tighten the front pair evenly and measure how far the mark moves.
    unit: mm
    estimate: {v: [80, 40], src: "Report 03 section 3: one third of travel, 240 mm (Tuareg) and 115 mm (Street Triple)"}
    measured: {v: null, date: null}
    stage: build
    order: [Tuareg, Street Triple]
    affects: [strap tension on corrugations]
    range: {min: [60, 30], max: [100, 50], src: "Tuareg 60 to 100 mm and Street Triple 30 to 50 mm, about a quarter to two fifths of the travel. Never bottomed (report 03 section 3)"}
    thresholds:
      - {rule: "Re-check after the first 10 to 20 km and after rough sections", src: "NTC light vehicle guide p. 8, report 03"}
  - id: BOX-20
    group: Bike box
    part: box
    title: Rear tyre's outer face to the flare's inner face, the smaller side
    how: "Box fitted, ute laden as BOX-01. On each side, measure square from the rear tyre's outer sidewall at its widest point to the inner face of the flare beside it, then jack the axle up to the bump stop and measure again. Record the smaller of the readings."
    unit: mm
    estimate: {v: 30, src: "Model check UGW-03: the flare's inner face 1,026 mm from the centreline, the tyre's outer face 996 mm on Ford's 1,710 mm rear track (BEMM p. 25)"}
    measured: {v: null, date: null}
    stage: build
    affects: [UGW-03, rear tub flares, UTE-09]
    thresholds:
      - {at: 30, rule: "Under 30 mm the tyre comes inside Ford's 30 mm of the flare at full bump: move the flare out, up to UTE-09's 2,197 mm over the flares, or fit wheels with more positive offset", src: "Ford BEMM p. 122, UGW-03"}
    range: {min: 30, max: null, src: "Min: Ford BEMM p. 122, 30 mm between the tyre and its guard (UGW-03). No upper limit here: a larger gap means a narrower track, which VEH-28 and the tubs' 30 mm inside the tyre (UGW-02) check"}
  # ================================================================ the trailer, later (report 02 MASS-07)
  - id: TW-01
    group: Trailer weighbridge
    part: trailer
    title: Weighed mass, chassis with running gear, drawbar and coupling
    how: Weigh the rolling chassis on a weighbridge at the end of B3, before the bearer strips and the floor go on, with the jockey wheel, safety chains, breakaway kit, corner steadies and mud flaps fitted. The stone guard and the air box go on later. Record the whole mass.
    unit: kg
    estimate: {v: null, src: "The model's sum for these lines is shown beside it"}
    measured: {v: null, date: null}
    stage: weigh
    range: {ref: model_TW-01, rel: 0.02, src: "Within 2 % of the model's mass for the parts on the scale by then (report 02 MASS-07). A bigger difference is explained before work continues"}
    covers: [B1, B2, B3]
    affects: [every mass check]
    thresholds:
      - {rule: "The weighed figure replaces the estimates for the parts already built: their masses scale to it and their growth allowance becomes 0 %", src: "Report 02 MASS-06 and MASS-07"}
      - {at: 0.02, rule: "A difference over 2 % from the model is explained before work continues", src: "Report 02 MASS-07"}
  - id: TW-02
    group: Trailer weighbridge
    part: trailer
    title: Weighed mass, with the body shell on
    how: Weigh again at the end of B5, once the bearer strips, tanks and guards, air box, floor, shower well, wet room tray, walls, roof, doors and windows are on. The solar panels go on in B7. Record the whole mass.
    unit: kg
    estimate: {v: null, src: "The model's sum is shown beside it"}
    measured: {v: null, date: null}
    stage: weigh
    range: {ref: model_TW-02, rel: 0.02, src: "Within 2 % of the model's mass for the parts on the scale by then (report 02 MASS-07). A bigger difference is explained before work continues"}
    covers: [B4, B5]
    affects: [every mass check]
    thresholds:
      - {rule: "The rise from TW-01 replaces the shell's estimates, as for TW-01", src: "Report 02 MASS-06 and MASS-07"}
  - id: TW-03
    group: Trailer weighbridge
    part: trailer
    title: Weighed mass, fitted out, tanks empty and no payload
    how: Weigh the finished trailer as built, with the tanks and the jerry cans empty. This is the tare on the plate.
    unit: kg
    estimate: {v: null, src: "The model's tare is shown beside it"}
    measured: {v: null, date: null}
    stage: weigh
    range: {ref: model_TW-03, rel: 0.02, src: "Within 2 % of the model's tare, the whole trailer as built (report 02 MASS-07). A bigger difference is explained before the plate is stamped"}
    covers: [B6, B7]
    affects: [every mass check, the plated tare]
    thresholds:
      - {rule: "The rise from TW-02 replaces the fit-out's estimates. The ticket goes in the NSW identity approval package (report 02, VIB 78)", src: "Report 02 MASS-07 and MASS-08"}
  # ================================================================ the trailer, fully loaded and tested once built (TRAILER.md, build order B8)
  - id: TW-04
    group: Trailer weighbridge
    part: trailer
    title: Weighed mass, fully loaded for travel with 385 L of water, the fuel and the gear
    how: "Load the trailer as for a trip: 385 L of fresh water, the heater's diesel, the jerry cans, the gear and the food, with the grey tank empty. Weigh the whole trailer on a weighbridge, uncoupled on its jockey wheel, or coupled with only the trailer on the scale and the drawbar at its design height."
    unit: kg
    estimate: {v: null, src: "The model's TC2 mass without growth is shown beside it"}
    measured: {v: null, date: null}
    stage: weigh
    range: {ref: model_TC2, rel: 0.03, src: "Within 3 % of the model's TC2. A bigger difference means the estimates or the load are wrong, so weigh the parts again"}
    affects: [MAS-01, the travel water limit, GCM-01]
    thresholds:
      - {at: 3900, rule: "Over 3,900 kg, tow with less water until it is under, because H2 keeps the fully loaded trailer 100 kg under the plate", src: "Decision H2 as amended 23 Nov 2026, H13, H21"}
      - {at: 4000, rule: "Over 4,000 kg the trailer is over its plate: unload before it moves", src: "The plated ATM"}
  - id: TW-05
    group: Trailer weighbridge
    part: trailer
    title: Axle group load, fully loaded, coupled to the ute at the design ball height
    how: "With TW-04's load, couple to the ute on level ground and stand only the trailer's four wheels on the weighbridge, with the ute off it. The reading is the axle group's load. TW-04 less this reading is the towball, which UTE-03 measures directly."
    unit: kg
    estimate: {v: null, src: "The model's TC2 axle group load without growth is shown beside it"}
    measured: {v: null, date: null}
    stage: weigh
    range: {ref: axle_TC2, rel: 0.03, src: "Within 3 % of the model's TC2 axle group load"}
    affects: [MAS-02, MAS-06, MAS-09, the towball]
    thresholds:
      - {at: 4050, rule: "Over 4,050 kg the axle group passes the XT build's rating, which the load-sharing tandem carries without VSB1's 120 % factor: take load off", src: "MAS-02, Cruisemaster's 4,050 kg build in its load-sharing configuration and VSB1"}
  - id: TR-01
    group: Trailer tests
    part: trailer
    title: Centre of gravity height at tare, by the axle-lift method
    how: "Tanks empty, no gear. Weigh the axle group with the trailer level, then again with the drawbar raised a measured height, and work the height out from the change in load and the axle-to-ball distance. The engineer can run the test and the sum."
    unit: mm
    estimate: {v: null, src: "The model's tare centre of gravity height without growth is shown beside it"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {ref: cog_z_TC1, rel: 0.05, src: "Within 5 % of the model's tare. 5 % higher lowers the static stability factor from 0.58 to about 0.55"}
    affects: [the static stability factor, the frame and body loads]
    thresholds:
      - {rule: "A higher centre of gravity lowers the static stability factor, half the track less the lateral offset over the height: stow the heavy gear low and near the axle", src: "NHTSA's static stability factor, TRAILER.md"}
  - id: TR-02
    group: Trailer tests
    part: trailer
    title: Fresh water the tanks hold, from empty to full through a water meter
    how: "Drain both fresh tanks through the pump until it runs dry, then fill through a garden water meter until the breather overflows. Record the meter's reading."
    unit: L
    estimate: {v: 385, src: "The fresh tanks' 389.3 L net (cad/trailer.py tank_nets, I2-40, with their front corners notched round the hinge gussets and their sides pocketed round the XT kit's airbags, their top brackets and the shocks, I2-97) less about 1.5 L a tank left under the pump's dip tube in the rear tank's sump and the balance hose's in the front tank's (est.), water the test from a dry pump cannot count"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: null, max: null, src: "Aim: report 21's 400 L. On its table, 41 L a day and 44 L a wash, a week with two washes needs 375 L and a week with three 419 L, so the estimate's 385 L is about 6.4 days of water with three washes a week, and a week with two washes with 10 L to spare. No limit either way: water_full_l, the water the design carries, follows the reading with the 3 L under the pickups added back, in H21's 5 L steps down, so a reading of 382 L or more keeps 385 L and one under it takes the design to 380 L. The travel limit (H13) caps what rides"}
    affects: [the days of water off-grid]
    thresholds:
      - {at: 375, rule: "Under 375 L even a week with two washes, at report 21's 41 L a day and 44 L a wash, needs a fill before it ends: plan the fills, or wash less often", src: "Report 21 section 10.1's table: 7 days of 41 L and two washes of 44 L"}
      - {at: 359, rule: "Under 359 L a week with three washes needs its fill on the sixth day, a day earlier than with the estimate's 385 L, at the week's 59.9 L a day: plan the fills, or wash less often", src: "Report 21 section 10.1's table: 7 days of 41 L and three washes of 44 L, 419 L"}
  - id: TR-03
    group: Trailer tests
    part: trailer
    title: Grey water the grey tank holds, from empty to full
    how: "With the outlet valve shut, run measured water into the shower drain until the tank's level sender reads full or the vent overflows."
    unit: L
    estimate: {v: 130, src: "Report 21 section 10, UF-08"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 125, max: null, src: "Min: 72 h with one wash makes 125 L (report 21 section 10.1). No upper limit"}
    affects: [the hours between grey emptying, TC7, TC8]
  - id: TR-04
    group: Trailer tests
    part: trailer
    title: Battery capacity, from full to the BMS's cut-off
    how: "Charge the bank to full and let it rest an hour. Turn off the sun and the chargers, run a steady load of about 1 kW through the inverter until the Lynx Smart BMS NG stops it, and read the energy taken from the Cerbo GX's battery monitor."
    unit: kWh
    estimate: {v: 25.6, src: "Five Victron Lithium NG 51.2 V 100 Ah modules, 5.12 kWh each (maker)"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 22.6, max: null, src: "Min: the 22.6 kWh nominal that H3's governing check needs, the all-electric hot day for 24 h (research/models/20/energy.out). No upper limit"}
    affects: [H3, the autonomy on the design hot day]
    thresholds:
      - {at: 22.6, rule: "Under 22.6 kWh the bank no longer runs a design hot day for 24 h: claim the warranty, or add a sixth module", src: "Decision H3, report 20"}
  - id: TR-05
    group: Trailer tests
    part: trailer
    title: Cabin pressure, parked, with only the filtered top-up fan running at 15 m³/h
    how: "Doors, windows and the hood shut, every other fan off, on a calm day. Read the 0 to 125 Pa gauge (VE-06) after 10 minutes."
    unit: Pa
    estimate: {v: 3, src: "Report 19 section 4: about +3 Pa at a leakage area of 30 cm² (est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 1.5, max: null, src: "Min: 1.5 Pa means about 42 cm² of leakage, the pressure falling with the square of the leakage area (est.). Below it dust gets in when the wind blows"}
    affects: [dust inside, the air leakage]
    thresholds:
      - {at: 1.5, rule: "Under 1.5 Pa, find and seal the leaks with a smoke pencil before the fit-out hides them", src: "Report 19 section 4 (est.)"}
  - id: TR-06
    group: Trailer tests
    part: trailer
    title: Cabin pressure in dust mode, with the RESPA-CF2 on and the other fans off
    how: "As TR-05, with the RESPA-CF2 on and the top-up fan, the e2 pairs and the extract off. Read the gauge parked, then while towing on a dusty road."
    unit: Pa
    estimate: {v: 20, src: "Report 19 section 4"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 20, max: null, src: "Min: report 19 holds the cabin at least 20 Pa above the rear wake in dust, the band ISO 23875 uses for pressurised cabins"}
    affects: [dust inside while towing]
  - id: TR-07
    group: Trailer tests
    part: trailer
    title: Fresh-air flow, both e2 pairs on the day setting
    how: "Hold a flow hood over each fan's inner cover in turn while it blows in, and add the four readings, halved, because each fan blows in half the time."
    unit: m³/h
    estimate: {v: 60, src: "Report 19 section 3: 30 m³/h a pair by day"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 54, max: null, src: "Min: 90 % of the design flow (est.). The design holds CO2 near 900 ppm for two people with the top-up fan"}
    affects: [CO2 and humidity inside]
  - id: TR-08
    group: Trailer tests
    part: trailer
    title: Fresh water used by one 20 min DauerShower shower
    how: "Read the fresh tanks' gauge, or fit a water meter in the shower's feed, before and after a 20 min shower."
    unit: L
    estimate: {v: 5, src: "DauerShower 2.0, maker"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: null, max: 8, src: "Max: at 8 L the water budget rises to 47 L a day and 385 L lasts about 8.2 days without laundry (est.). No lower limit"}
    affects: [the water budget]
  - id: TR-09
    group: Trailer tests
    part: trailer
    title: Bed platform's underside above the floor, day position
    how: "Raise the bed to its day stop with the travel locks in, and measure from the floor to the platform's underside at the desk's front edge."
    unit: mm
    estimate: {v: 1600, src: "BED-01 in the model"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 1600, max: null, src: "Min: decision H1, so a seated adult clears it"}
    affects: [H1, the desk]
  - id: TR-10
    group: Trailer tests
    part: trailer
    title: Mattress top above the floor, night position
    how: "Lower the bed to its night stop and measure from the floor to the top of the mattress at its middle."
    unit: mm
    estimate: {v: 1044, src: "BED-01 in the model"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 950, max: 1050, src: "Decision H1. The ceiling then leaves at least 900 mm above the mattress"}
    affects: [H1, getting into bed]
  - id: TR-11
    group: Trailer tests
    part: trailer
    title: Overall width across the body, the awning and the hoods, laden
    how: "Load the trailer as for TW-04 and stand it level on flat ground. Drop a plumb line from the outermost point on each side, the entry door's handle on the kerb side and the hoods and window frames on the road side, mark the ground and measure between the marks. Leave out the side marker lamps."
    unit: mm
    estimate: {v: 2470, src: "DIM-01 in the model"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: null, max: 2500, src: "ADR 43/04 clause 6.2.6.1 and VSB1 section 5.2: at most 2,500 mm, side-mounted lamps and reflectors left out"}
    affects: [DIM-01, DIM-05, registration]
    thresholds:
      - {at: 2490, rule: "Over 2,490 mm, find the part that stands out and fit a lower one before the HVAIS inspection, because the design keeps 10 mm in hand (DIM-05)", src: "DIM-05"}
  - id: TR-12
    group: Trailer tests
    part: trailer
    title: "The TSC coupled to the truck's own brake controller at its commissioning: Ford's display shows the trailer with no fault, the TSC wakes green at a gain of 3, and a manual application reaches the magnets, 1 for yes, 0 for no"
    how: "After the TSC is configured, couple the trailer to the truck with both leads plugged in and the SB50 live, and set the gain of Ford's integrated controller to 3. With the ignition on, check that Ford's display shows the trailer connected with no trailer brake fault. Press the brake pedal for more than 2 seconds: the TSC's lamp must turn green. Then hold the controller's manual lever with the truck parked and feel at each drum that its magnet pulls in (Bosch's verification start-up, Y265K30237 v4.0 page 10). Record 1 only if all three pass."
    unit: yes or no
    estimate: {v: 1, src: "Bosch's user manual lists Ford's integrated controller at High Confidence, the rating it gives the integrated controllers it has not tested, where the aftermarket ones it tested read Yes (F005EP0085.01 page 18). Assumed to pass (est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 1, max: 1, src: "Bosch's user manual page 18: an end user whose controller the guideline does not verify is responsible for verifying compatibility, and the installation guideline page 10 asks for a gain of 3 or more so that the controller's signal at standstill passes the TSC's wake-up threshold"}
    affects: [the trailer's brakes with the TSC, the external simulated load (the fallback outside the total)]
    thresholds:
      - {at: 0, rule: "A fault on Ford's display, no green lamp at a gain of 3, or a magnet that does not pull in: do not tow. Have a Bosch dealer fit and enable the TSC's external simulated load (the fallback in the parts list, outside the total) and repeat the test until all three pass", src: "Bosch F005EP0085.01 page 18 and Y265K30237 v4.0 page 10"}
  - id: TR-13
    group: Trailer tests
    part: trailer
    title: "The lowest point of each lead between the vehicles on the coupled truck at full lock over a ramp, the least reading"
    how: "Stand the truck's rear wheels on a pair of ramps 300 mm high (est.) and couple the trailer to it at its laden coupling height, moving the trailer on its jockey wheel until it stands at its tightest angle to the truck, as at full lock, both leads plugged in, each clamped on the leads' bracket and strapped at its mark to the seat on its sprung arm. The ramps stand the truck 5.3 degrees nose down and the trailer 5.5 degrees nose up (est., from the truck's 3,270 mm wheelbase and its ball 1,455 mm behind the rear axle, with the trailer's axle group about 4.5 m behind the ball), and each keeps its own attitude as the trailer swings round. Measure from the ground to the underside of each lead at its lowest point and to the underside of the coupling's body directly under the pin, and record the lead's reading less the coupling's, plus 380 mm, the coupling's underside at the design's 440 mm ball (DIM-04), because the ramps lift the coupling about 430 mm off the ground. Repeat at the tightest angle the other way. Record the least of the readings in mm, and note which lead and where along it."
    unit: mm
    estimate: {v: 439.2, src: "DIM-08's model on the ramps, read as the test reads it, with the laden ball at 440 mm, each vehicle at its own attitude and each lead hung under true gravity, every 5 degrees of lock and every whole degree near the least (cad/routes.py on_ramps, I2-91, est.): the 12-pin lead K-13 at the full lock that swings the plugs behind the pin, in its span from the plug up to its seat, 15 mm under its plug with the arm on its top stop. The SB50's lead K-14 reads 452.0 mm, at its plug, whose height the truck's own pitch sets at every lock. DIM-08's own figure, 374.4 mm, is K-14's plug turned 70 degrees with the truck 20 degrees nose down relative to the trailer and the ball at UTE-13's low 420 mm, which would need ramps about 560 mm high"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 200, max: null, src: "DIM-06's 200 mm, the running clearance of a vehicle built for off-road use, which DIM-08 holds the leads to"}
    affects: [DIM-08, the leads' sprung arms and their springs, the leads' cut lengths]
    thresholds:
      - {at: 250, rule: "Under 250 mm, see where along the lead the lowest point is. At the plug, the truck's socket stands lower than the model's, so note it against DIM-08. Along the span, check that the arm swings freely to both stops and that the lead is strapped at its mark, at the seat's top with the arm 15 degrees below level, then measure again. If it is still under, fit the arm a stronger spring, because the model leaves out the leads' stiffness and the springs' spread (est.)", src: "DIM-08"}
      - {at: 200, rule: "Under 200 mm, do not tow off the road until the arm and its spring are fixed, because a lead that hangs that low can snag and pull out its plug", src: "DIM-06 and DIM-08"}
