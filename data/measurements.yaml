# Measured inputs. The owner fills these in as he measures (GitHub's web editor is fine). A commit on main is built
# and checked, and the site, with the plan re-solved from the new values, updates once the live branch moves to it.
#
# How to record a measurement: under the input's `measured`, set `v` to the value and `date` to the day you
# measured it, for example   measured: {v: 1182, date: 2026-12-02}
# Leave `v: null` until then. The build uses the measured value when there is one and the estimate otherwise.
#
# `thresholds` are the design rules that change the plan, with their source. The build applies them in
# cad/inputs.py, and the Measurements page shows what each one does with the value in use. A threshold is a
# design rule, not a check limit. Check limits stay in checks.yaml, data/ute/ute.yaml and data/ute/garage-checks.yaml.
#
# `range` is what the design accepts without a redesign, with its source in `src`. `min` or `max` is a number, null
# for no limit on that side (`src` says why), a list with one entry per value for an input with several values (in
# the order of `order`), or {ref: name} for a figure the build works out from the model (cad/trailer.py,
# measurement_refs). {ref: name, rel: 0.02} means within 2 % of that figure. The Measurements page shows the range
# beside an input box and colours what is typed in or out of it. A range is a guide for measuring, not a check limit.
# `stage` says when it is measured: buy (an answer from the seller or the maker, or a test when buying the truck), build (on the ute, the bikes or the
# parts, before or while building), weigh (at a weighbridge during the build) or trailer built. `covers` lists the
# build stages a weighbridge reading includes.
#
# Revision of 20 Nov 2026: the tow vehicle is the LandCruiser 79 (research report 16), so the Cayenne's inputs
# (CAR-01 to CAR-07) are gone. The bike, chock and pannier inputs now set the ute's bike box (UTE-GARAGE.md).
#
# `part` is the part of the project the input belongs to: car (the LandCruiser 79 car build, VEHICLE.md), box (the bike
# box, UTE-GARAGE.md) or trailer. The Measurements page filters by it, for example /measurements/?part=car.
#
# Revision of 20 Nov 2026, later: report 23's car build inputs (VEH-01 to VEH-27, group Car build) and report 24's bike box
# inputs (BOX-01 to BOX-19, group Bike box) are merged in, and report 23's UTE-01 replaces the earlier one. Their design
# values come from the model with the 180 L tank, the trailer charging and the 1.6 mm box roof.
inputs:
  # ================================================================ the ute (report 16, data/ute/ute.yaml)
  - id: UTE-01
    group: Ute
    part: car
    title: Ute's towball pin height, laden, with the loaded trailer's ball load and the bikes aboard
    how: "Line CK03's visit. Ute loaded as for the trip, the loaded trailer coupled on level ground. Measure from the ground to the centre of the DO35 pin hole. Choose the tongue drop (TW08) from it."
    unit: mm
    estimate: {v: 440, src: "Decision log 12:10: 440 mm laden, plus or minus 20 mm, so the coupling stays inside VSB1's 460 mm"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [TW08 tongue drop, coupling height, DIM-03, UTE-13, JK-02]
    thresholds:
      - {at: 440, rule: "The trailer is designed level at this height: the coupling point Z follows the value and the drawbar drop below the rails re-solves", src: "VSB1 9.3.2: trailers should be designed to be level within the towball range"}
      - {at: [370, 440], rule: "Outside 370 to 440 mm the 20 mm tolerance no longer stays inside VSB1's 350 to 460 mm, so choose a tongue (TW08) with more or less drop", src: "VSB1 9.3.2 and report 08 section 5.3"}
    range: {min: 370, max: 440, src: "VSB1 9.3.2 (350 to 460 mm laden) less the plan's 20 mm tolerance each way (decision log 12:10)"}
  - id: UTE-02
    group: Ute
    part: car
    title: Ute's rear axle centre to the towball pin
    how: Hang a plumb line from the centre of a rear wheel hub and another from the pin's centre, mark both on the ground and measure between the marks.
    unit: mm
    estimate: {v: 1300, src: "Report 16 and the decision log 12:45 UTC: 1,300 mm for the Hayman Reese 03186RW with its tongue (estimate)"}
    measured: {v: null, date: null}
    stage: build
    range: {min: {ref: ball_reach_min}, max: null, src: "JK-01 keeps the trailer's front parts 100 mm outside the bike box's sweep, and each 10 mm less reach adds about 10 mm to the box's overhang, so the minimum is the reach less JK-01's margin. No maximum: a longer reach only adds sweep clearance, and the rear axle check UTE-03 moves by about 8 kg per 100 mm at 250 kg on the ball"}
    affects: [ute rear axle load, bike box overhang behind the ball, JK-01, JK-02]
    thresholds:
      - {rule: "Sets the lever arm of the towball on the ute's axles (UTE-03, UTE-12) and how far the bike box overhangs the ball, so the jack-knife sweep re-solves. Each 10 mm less adds about 10 mm to the box's overhang", src: "Report 16 section 5, U2 model"}
  - id: UTE-03
    group: Ute
    part: trailer
    title: Towball load the trailer puts on the ute, from a towball scale
    how: Later, with the trailer built and fully loaded, level on firm ground. Put a towball scale under the coupling at the design height and read it.
    unit: kg
    estimate: {v: null, src: "Not measured until the trailer exists. The model's fully loaded towball is shown beside it"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {ref: towball_model, rel: 0.10, src: "Within 10 % of the model's fully loaded towball (TBS-01, the threshold below). Outside it the centre of gravity estimates are wrong"}
    affects: [TBS-01 check against the model]
    thresholds:
      - {at: 0.10, rule: "More than 10 % away from the model's fully loaded towball means the centre of gravity estimates are wrong: weigh the parts again before relying on the axle position", src: "Report 02 MASS-07 asks for differences over 2 % in mass to be explained. 10 % on the towball is this layout's rule"}

  # ================================================================ the car build (report 23, VEHICLE.md), group Car build
  # ================================================================ engine and driveline health, stage S0 (the branch switch)
  - id: VEH-01
    group: Car build
    part: car
    title: Compression spread across the eight cylinders, warm engine, cranking
    how: "Diesel workshop, line BI01. Warm engine, injection disabled, all eight glow plugs out, a diesel compression gauge on each cylinder at the same cranking speed. Write all eight readings in kPa in a note. Value is (highest less lowest) divided by highest, in %."
    unit: "%"
    estimate: {v: 5, src: "Assumed for a sound 400,000 km engine (est.). No Toyota figure for the 1VD-FTV was found"}
    measured: {v: null, date: null}
    stage: buy
    affects: [branch A or B, stage S2 timing]
    thresholds:
      - {at: 10, rule: "Over 10 %, or one cylinder clearly low, take branch A: rebuild in S2 straight after S1", src: "Diesel cylinders within about 10 % of each other are treated as healthy (https://www.apexinds.com/blog/commercial-diesel-cylinder-compression-testing-procedure-guide.html)"}
    range: {min: 0, max: 10, src: "Apex Industries diesel compression guide (link above)"}
  - id: VEH-02
    group: Car build
    part: car
    title: Leak-down, worst cylinder
    how: "Same visit. Each cylinder at top dead centre on compression, crank locked, tester calibrated and set to 100 psi. Listen at the oil filler (rings), intake (inlet valve), exhaust (exhaust valve) and coolant tank (head gasket). Write all eight results and the leak path in a note."
    unit: "%"
    estimate: {v: 10, src: "Assumed (est.)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [branch A or B]
    thresholds:
      - {at: 20, rule: "Over 20 % on any cylinder, or bubbles in the coolant tank, take branch A", src: "Shop guidance treats up to about 20 % as acceptable (https://blog.nationwideheavytruckparts.com/blog/diesel-leak-down-test)"}
    range: {min: 0, max: 20, src: "Nationwide Heavy Truck Parts leak-down guide (link above)"}
  - id: VEH-03
    group: Car build
    part: car
    title: Blow-by at the oil filler, hot, 2,000 rpm, no load
    how: "Same visit. Blow-by flow meter on the oil filler with the breather outlet blocked, engine at working temperature. Hold 2,000 rpm for 30 s and read the flow. This is also the baseline for later checks."
    unit: L/min
    estimate: {v: 50, src: "Report 23 estimate (est.): about 1 % of the intake flow at 2,000 rpm (4.5 L x 1,000 intake cycles a minute, 4,500 L/min). No Toyota figure was found"}
    measured: {v: null, date: null}
    stage: buy
    affects: [branch A or B]
    thresholds:
      - {at: 100, rule: "Over 100 L/min, or the filler cap lifting off at idle, take branch A", src: "Twice the estimate (est.)"}
    range: {min: 0, max: 100, src: "Report 23 estimate (est.)"}
  - id: VEH-04
    group: Car build
    part: car
    title: Injector back-leak, largest deviation of one injector from the mean of eight
    how: "Same visit. Return-flow kit on the injector leak-off connections, warm idle, 2 min. Write each injector's volume in mL in a note. Read the eight injector correction values and any stored injector faults by scan tool and note them too."
    unit: "%"
    estimate: {v: 15, src: "Assumed (est.)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [branch A or B, FS01, cut CUT1]
    thresholds:
      - {at: 25, rule: "Over 25 %, or a stored injector fault, take branch A, because worn injectors wash the bores. Cut CUT1 is then off", src: "Report 23 estimate (est.). No Denso or Toyota limit for this test was found, so a Denso specialist's bench test overrides it"}
    range: {min: 0, max: 25, src: "Report 23 estimate (est.)"}
  - id: VEH-05
    group: Car build
    part: car
    title: Oil analysis, silicon (dust in the oil)
    how: "Hot sample taken mid-drain from the engine as bought, before any oil change, sent to an oil lab with the BI01 kit. Note iron, chromium, aluminium, copper, lead, sodium, potassium and soot as well."
    unit: ppm
    estimate: {v: 10, src: "Assumed (est.)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [branch A or B, ID01]
    thresholds:
      - {at: 20, rule: "Over 20 ppm means dust got past the air filter seal. Inspect the intake. If iron and chromium are high too, take branch A", src: "Silicon should sit low, and any rise with iron and chromium points to an air filter seal failure (https://heavyvehicleinspection.com/blog/post/diesel-engine-oil-analysis-reading-results). The 20 ppm figure is an estimate (est.)"}
    range: {min: 0, max: 20, src: "Heavy Vehicle Inspection guide (link above) and report 23 estimate"}
  - id: VEH-06
    group: Car build
    part: car
    title: Oil analysis, fuel dilution
    how: Same sample as VEH-05.
    unit: "%"
    estimate: {v: 1, src: "Assumed (est.)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [branch A or B, FS01]
    thresholds:
      - {at: 2, rule: "2 to 4 %: re-sample after 1,000 km and read the regeneration history", src: "Under 2 % is acceptable, 2 to 4 % is watched (Heavy Vehicle Inspection guide, VEH-05)"}
      - {at: 4, rule: "Over 4 %: an injector or regeneration fault. Take branch A, so the new injectors come forward", src: "Over 4 % is a fault signature (same source)"}
    range: {min: 0, max: 4, src: "Heavy Vehicle Inspection guide (VEH-05)"}
  - id: VEH-07
    group: Car build
    part: car
    title: "Oil analysis, glycol (coolant in the oil): 1 for found, 0 for none"
    how: Same sample as VEH-05. Glycol test, plus sodium and potassium against the lab's limits.
    unit: yes or no
    estimate: {v: 0, src: "Assumed none (est.)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [branch A or B, EN22, EN21]
    thresholds:
      - {at: 1, rule: "Any glycol: stop driving, pressure-test the cooling system, the oil cooler (EN22) and the head gaskets, then take branch A", src: "Glycol in the oil corrodes bearings fast (Heavy Vehicle Inspection guide, VEH-05)"}
    range: {min: 0, max: 0, src: "Heavy Vehicle Inspection guide (VEH-05)"}
  - id: VEH-08
    group: Car build
    part: car
    title: "DPF flow test after the off-car clean: 1 for pass, 0 for fail"
    how: "Before removing the DPF, read its differential pressure, soot and ash values and the regeneration history by scan tool and note them. After the specialist's clean (line ID02), record the flow test result."
    unit: pass or fail
    estimate: {v: 1, src: "Assumed pass (est.)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [ID03, TL04, TL05]
    thresholds:
      - {at: 0, rule: "Fail (cracked, melted or flow not restored): buy a new DPF (ID03) before the emissions test", src: "The specialist replaces a filter only when it is cracked or melted (line ID02, https://dpfcleaningservices.com.au/)"}
    range: {min: 1, max: 1, src: "Line ID02"}
  - id: VEH-09
    group: Car build
    part: car
    title: "Clutch and gearbox check: 1 for pass, 0 for fail"
    how: "Warm, on a quiet road, fifth gear at 60 km/h, full throttle: engine speed must not rise faster than road speed. Then shift through every gear up and down, listening for synchro crunch and bearing whine. Note the gearbox oil's colour and any metal on the drain plug."
    unit: pass or fail
    estimate: {v: 1, src: "Assumed pass (est.)"}
    measured: {v: null, date: null}
    stage: buy
    affects: [branch A or B, CG01, CG09]
    thresholds:
      - {at: 0, rule: "Slip, crunch or whine: take branch A, because the clutch and gearbox come out with the engine in S2", src: "Plan rule (report 23): the gearbox is removed only once"}
    range: {min: 1, max: 1, src: "Plan rule (report 23)"}
  # ================================================================ power, stage S6 (same dyno, same day)
  - id: VEH-10
    group: Car build
    part: car
    title: Peak power at the wheels before the tune, finished hardware on the factory calibration
    how: "Chassis dyno, three runs in fourth gear, take the middle run. Same dyno, operator and day as VEH-11. Keep the sheet for the certifier."
    unit: rwkW
    estimate: {v: 110, src: "GTurbo booklet page 15: stock VDJ79 100 to 120 rwkW (https://cdn.shopify.com/s/files/1/0823/4241/2531/files/1VD-FTV-VDJ70-Booklet-v1_4c.pdf)"}
    measured: {v: null, date: null}
    stage: build
    affects: [TL01, TL05]
    thresholds:
      - {at: 96, rule: "Under 96 rwkW: find the fault (boost leak, injector, DPF) before the tuner starts", src: "Report 14's published stock range, 96 to 120 rwkW"}
    range: {min: 96, max: 120, src: "Report 14 and the GTurbo booklet"}
  - id: VEH-11
    group: Car build
    part: car
    title: Peak power at the wheels after the tune
    how: Same dyno and day as VEH-10, with the towing map active.
    unit: rwkW
    estimate: {v: 177, src: "Plan: 230 to 250 kW at the crank, about 170 to 185 rwkW at report 14's 74 % crank to wheels (decision log 20:15)"}
    measured: {v: null, date: null}
    stage: build
    affects: [TL05, the 224 kW minimum]
    thresholds:
      - {at: 166, rule: "Under 166 rwkW (224 kW at the crank) the build misses its minimum. The tuner checks boost and fuelling. Never raise the EGT limit to reach it", src: "Leonard's 300 hp minimum (decision log 20:15)"}
    range: {min: 166, max: 185, src: "Decision log 20:15 and report 14 section 3.9"}
  - id: VEH-12
    group: Car build
    part: car
    title: Boost at full load, steady, 2,500 rpm, after the tune
    how: Read the boost gauge (TL02) or the tuner's log on the dyno and on a long towing grade.
    unit: psi
    estimate: {v: 24, src: "GTurbo booklet page 15: VD-G333 design target 24 psi, efficient from 16 to 33 psi"}
    measured: {v: null, date: null}
    stage: build
    affects: [TL01, EGT]
    thresholds:
      - {at: 18, rule: "Under 18 psi at full load: look for a boost leak or a vane fault before towing hard", src: "Report 23 estimate (est.)"}
      - {at: 24, rule: "Over 24 psi steady: ask the tuner to hold the design target", src: "GTurbo design target"}
    range: {min: 18, max: 24, src: "GTurbo booklet page 15 and report 23 estimate"}
  - id: VEH-13
    group: Car build
    part: car
    title: Exhaust temperature before the turbo, sustained full load while towing
    how: "Read the EGT gauge (TL02, probe in the manifold before the turbo) on the longest steep grade with the loaded trailer, after the tune."
    unit: °C
    estimate: {v: 650, src: "Plan tune setting: fuel pulled from 650 °C (report 14)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [TL01]
    thresholds:
      - {at: 700, rule: "Over 700 °C: lift off and have the tuner lower the fuel limit", src: "Plan tune setting: never more than 700 °C (report 14)"}
    range: {min: 0, max: 700, src: "Report 14 tune settings"}
  # ================================================================ towing temperatures, stage S5 at stock power, repeated after S6
  - id: VEH-14
    group: Car build
    part: car
    title: Coolant temperature on a long grade, towing the loaded trailer in heat
    how: "Read the water temperature gauge (TL02) at the top of the longest grade of the first long tow, air at 30 °C or more. Repeat after the tune."
    unit: °C
    estimate: {v: 100, src: "Report 14: 90 to 104 °C towing (general diesel figures, not 1VD data)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [EN14, TX04, fan kit]
    thresholds:
      - {at: 107, rule: "Over 107 °C for long means an airflow problem: check the intercooler's effect and add GTurbo's AUD 1,895 fan kit (report 14)", src: "Report 14"}
    range: {min: 85, max: 104, src: "Report 14"}
  - id: VEH-15
    group: Car build
    part: car
    title: Engine oil temperature, same tow
    how: Read the oil temperature gauge (TL03) at the same point as VEH-14.
    unit: °C
    estimate: {v: 110, src: "Report 14: 99 to 116 °C towing"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [EN22, oil cooling]
    thresholds:
      - {at: 121, rule: "Over 121 °C sustained: review oil cooling before the next long tow", src: "Report 14"}
    range: {min: 90, max: 116, src: "Report 14 (90 °C lower bound est.)"}
  - id: VEH-16
    group: Car build
    part: car
    title: Gearbox oil temperature, same tow
    how: Read the gearbox sender (CG11) at the same point as VEH-14. Repeat after the tune.
    unit: °C
    estimate: {v: 95, src: "Report 23 estimate (est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [gearbox cooler, CG09]
    thresholds:
      - {at: 110, rule: "Over 110 °C sustained: fit a gearbox oil cooler before the next long tow", src: "Report 23 estimate (est.). No Toyota limit for the H152F was found, and report 15 plans no cooler until the senders show one is needed"}
    range: {min: 0, max: 110, src: "Report 23 estimate (est.)"}
  - id: VEH-17
    group: Car build
    part: car
    title: Rear diff oil temperature, same tow
    how: Read the rear diff sender (CG11) at the same point as VEH-14.
    unit: °C
    estimate: {v: 100, src: "Report 23 estimate (est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [rear diff, ball load]
    thresholds:
      - {at: 120, rule: "Over 120 °C sustained: check the diff oil and backlash (DL10) and consider a diff cooler", src: "Report 23 estimate (est.). No Toyota limit was found"}
    range: {min: 0, max: 120, src: "Report 23 estimate (est.)"}
  # ================================================================ weights on a public weighbridge (stages S0 and S5)
  - id: VEH-18
    group: Car build
    part: car
    title: Front axle of the bare cab chassis, from the as-bought weighing
    how: "Line CK01. Full fuel, nobody aboard, weigh each axle. Subtract the tray, bar, winch and other fitted parts by their weighed or listed masses, split by their positions."
    unit: kg
    estimate: {v: 1280, src: "Ute model line UT-01: GXL cab chassis 2,202.5 kg kerb, 922.5 kg on the rear axle (Toyota BBGJ1007, mid-range)"}
    measured: {v: null, date: null}
    stage: weigh
    affects: [UT-01, the S3 gate sum, front axle checks]
    thresholds:
      - {rule: "Replaces UT-01's front share. The gate sum and the ute checks re-solve", src: "Report 16, decision log 12:45"}
    range: {min: 1240, max: 1320, src: "Toyota BBGJ1007 GXL range: kerb 2,175 to 2,230 kg, rear axle 910 to 935 kg"}
  - id: VEH-19
    group: Car build
    part: car
    title: Rear axle of the bare cab chassis, from the as-bought weighing
    how: Same weighing as VEH-18.
    unit: kg
    estimate: {v: 922.5, src: "Ute model line UT-01 (Toyota BBGJ1007, mid-range)"}
    measured: {v: null, date: null}
    stage: weigh
    affects: [UT-01, the S3 gate sum, UTE-03]
    thresholds:
      - {rule: "Replaces UT-01's rear share. Each extra kg on the rear axle here is a kg less for the ball load at the gate", src: "Report 16"}
    range: {min: 910, max: 935, src: "Toyota BBGJ1007 GXL range"}
  - id: VEH-20
    group: Car build
    part: car
    title: Rear axle, laden ute towing the loaded trailer
    how: "Line CK03. Two people, both bikes, tools, full fuel, one spare, then the loaded trailer coupled. Weigh the ute's rear axle with the trailer's wheels off the plate."
    unit: kg
    estimate: {v: 2586, src: "Ute model case UC3 with growth: the bikes aboard, the 180 L tank, the trailer charging and the trailer's heaviest towball with growth, 316.9 kg (decision H17)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [UTE-03 check, kit choice, ball load]
    thresholds:
      - {at: 2800, rule: "Over 2,800 kg, the Elite's plate: take mass off the box, tray or ball before towing. If cut CUT7 put the Platinum on, the limit is its 2,550 kg", src: "Decision H18: the Elite plated at twice the ROH wheel's 1,400 kg"}
    range: {min: 0, max: 2800, src: "Decision H18, the Elite's 2,800 kg plate (2,550 kg on the Platinum, cut CUT7)"}
  - id: VEH-21
    group: Car build
    part: car
    title: Front axle, laden ute with the bikes and no trailer
    how: Line CK03, the ute alone, loaded as VEH-20.
    unit: kg
    estimate: {v: 1480, src: "Ute model case UC2 with growth, with the 180 L tank and the trailer charging"}
    measured: {v: null, date: null}
    stage: weigh
    affects: [UTE-02 check]
    thresholds:
      - {at: 1650, rule: "Over 1,650 kg: move mass rearward off the front", src: "Lovells TOYKIT080-GVM front axle rating"}
    range: {min: 0, max: 1650, src: "Lovells sheet, Oct 2026"}
  - id: VEH-22
    group: Car build
    part: car
    title: Front axle share of the ute's mass, towing
    how: From VEH-20's weighing, front axle divided by the ute's total.
    unit: "%"
    estimate: {v: 34.3, src: "Ute model case UC3 with growth, 1,350 kg of 3,937 kg: the bikes aboard, the 180 L tank, the trailer charging and the trailer's heaviest towball with growth, 316.9 kg (decision H17)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [UTE-07 check]
    thresholds:
      - {at: 20, rule: "Under 20 %: the steering and braking share is too small. Cut the ball load", src: "Toyota BBGJ1007 section 1-2"}
    range: {min: 20, max: 100, src: "Toyota BBGJ1007 section 1-2"}
  - id: VEH-23
    group: Car build
    part: car
    title: Laden ute mass towing, including the ball load (GVM check)
    how: From VEH-20's weighing, the ute's two axles added.
    unit: kg
    estimate: {v: 3937, src: "Ute model case UC3 with growth: the bikes aboard, the 180 L tank, the trailer charging and the trailer's heaviest towball with growth, 316.9 kg (decision H17)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [UTE-01 check]
    thresholds:
      - {at: 4450, rule: "Over 4,450 kg, the Elite's plated GVM: unload before driving. 4,200 kg if cut CUT7 put the Platinum on", src: "Decision H18: the Elite plated at 1,650 + 2,800 kg"}
    range: {min: 0, max: 4450, src: "Decision H18, the Elite plated at 4,450 kg (4,200 kg on the Platinum, cut CUT7)"}
  - id: VEH-24
    group: Car build
    part: car
    title: Combination mass, laden ute plus loaded trailer (GCM check)
    how: Line CK03. The ute's axles and the trailer's axles weighed coupled, added.
    unit: kg
    estimate: {v: 7017, src: "Ute model case UC2 with growth (3,619.9 kg) plus the trailer fully loaded with growth (3,397.2 kg, case TC2, MAS-10)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [GV06, decision H2 water limit]
    thresholds:
      - {at: 6900, rule: "If the GCM revision was refused: over 6,900 kg, drain water (about 1 kg a litre) until under. At the design figures the trailer then tows with at most 232 L", src: "Decisions H2 and H13 (recomputed for H17), Toyota's 6,900 kg GCM"}
      - {at: 7400, rule: "Over 7,400 kg: unload before driving", src: "Lovells GCM revision (GV06)"}
    range: {min: 0, max: 7400, src: "Lovells sheet, Oct 2026 (6,900 kg without GV06)"}
  # ================================================================ heights (stages S1, S4 and S5)
  - id: VEH-25
    group: Car build
    part: car
    title: Rear frame-rail top above the ground at the rear axle, unladen, after the GVM kit
    how: "Level floor, correct tyre pressures, nobody aboard, box off. Measure each rail top straight above the rear axle and average."
    unit: mm
    estimate: {v: 774, src: "Ute model parameter frame_top_z (UTE-GARAGE.md)"}
    measured: {v: null, date: null}
    stage: build
    affects: [box floor height 834 mm, box subframe, coupling height]
    thresholds:
      - {rule: "The box subframe packing follows the measured value so the floor stays at 834 mm. Outside the range, re-check the floor and tub heights", src: "Report 17 section 6.4"}
    range: {min: 750, max: 800, src: "Report 23 estimate (est.), the model value plus or minus about 25 mm"}
  - id: VEH-26
    group: Car build
    part: car
    title: Rear bump travel, axle to bump stop, after the GVM kit
    how: Unladen, measure from the axle's bump stop pad to the bump stop on each side and take the larger.
    unit: mm
    estimate: {v: 110, src: "Report 17: Lovells kit, estimated"}
    measured: {v: null, date: null}
    stage: build
    affects: [wheel tub height, box floor]
    thresholds:
      - {at: 123, rule: "Over 123 mm the tubs stand more than 100 mm above the floor and the lower floor no longer works", src: "Ute model: tubs 86.5 mm at 110 mm of travel. Report 17 section 6.4 limit of 100 mm (calculated)"}
    range: {min: 0, max: 123, src: "Ute model and report 17 (calculated)"}
  - id: VEH-27
    group: Car build
    part: car
    title: Ride height change from the GVM kit, wheel centre to guard, unladen, largest corner
    how: "Measure all four corners before the kit (stage S1) and after it (stage S4), same tyres and pressures."
    unit: mm
    estimate: {v: 50, src: "Assumed (est.). Lovells publishes no lift figure for the 79 kit"}
    measured: {v: null, date: null}
    stage: build
    affects: [GV03, coupling height, steering geometry]
    thresholds:
      - {at: 50, rule: "Over 50 mm needs certification (item 13). Ask the LC5 certifier to include it in GV03", src: "VSI 06 Rev 4 item 13"}
    range: {min: 0, max: 50, src: "VSI 06 Rev 4 item 13"}
  - id: VEH-28
    group: Car build
    part: car
    title: Rear track on the Elite's housing, laden, tyre centre to tyre centre
    how: "Stage S4, the Elite fitted and the ute loaded to the trip mass (or 650 kg of ballast over the rear axle) on level ground. Mark the middle of each rear tyre's tread on the ground in front of and behind the tyre, measure across between the marks and average the two. Before the box's tubs and flares are finished."
    unit: mm
    estimate: {v: 1555, src: "Report 26: Lovells' housing brings the rear in line with the front, Toyota's 1,555 mm on ET 0 wheels (estimate). Toyota's factory rear track is 1,460 mm"}
    measured: {v: null, date: null}
    stage: build
    affects: [wheel_y, wheel tubs, rear tub flares, UGW-02, UGW-03, UTE-09, UTE-11]
    thresholds:
      - {rule: "Build the tubs and flares to the measured track: wheel_y in data/assemblies/ute-garage.yaml is half of it, and UGW-02 and UGW-03 run again before the floor is finished", src: "Toyota BBGJ1007 p. 28, UGW-02, UGW-03"}
      - {at: 1577, rule: "Above 1,577 mm the flares, with Toyota's 30 mm outside the tyre, pass UTE-09's 1,910 mm: a wheel with more positive offset, or a higher floor (report 26 fix B)", src: "UTE-09, decision H19"}
    range: {min: 1460, max: 1577, src: "Max: the flares stay inside UTE-09's 1,910 mm with 30 mm outside the tyre (942.5 mm inner face at 1,555 mm, 11 mm more each side at 1,577 mm). Min: Toyota's factory 1,460 mm rear track (BBGJ1007). Inside the range the tubs and flares are built to the measured track"}
  # ================================================================ wheel and supplier answers (reports 06 and 16)
  - id: WHL-01
    group: Wheel and suppliers
    part: trailer
    title: Load rating of the shared wheel, ROH Trak 2 16 x 7 ET 0, 5 x 150
    how: Read it from ROH's current table or the stamp on the wheel, and ask ROH whether it holds at the 80 psi of a load range E tyre.
    unit: kg
    estimate: {v: 1400, src: "ROH's fitment table for the Trak 2 16 x 7 ET 0 5 x 150 (report 16 section 4), the wheel the ute and the trailer share"}
    measured: {v: null, date: null}
    stage: buy
    range: {min: {ref: wheel_need}, max: null, src: "At least the larger of the trailer's per-wheel load in MAS-09 and the ute's rear wheel load in UTE-12, both with the growth allowance. No maximum: a higher rating only adds margin"}
    affects: [MAS-09, UTE-12]
    thresholds:
      - {rule: "MAS-09 checks the rating against the per-wheel load MAS-06 uses: 1.2 times the axle group load with the growth allowance, over four wheels. Below it, choose a higher-rated wheel", src: "VSB1 Rev 6 axles and suspension, report 16"}
  - id: SUP-01
    group: Wheel and suppliers
    part: trailer
    title: Cruisemaster's GTM for the XT Air build
    how: Cruisemaster sets it in the design session. It has said it will design to VSB1's 120 % rule (18 Nov).
    unit: kg
    estimate: {v: 4050, src: "Cruisemaster air guide: 4,500 kg ATM XT Air tandem, 4,050 kg GTM (report 06)"}
    measured: {v: null, date: null}
    stage: buy
    range: {min: {ref: gtm_need}, max: null, src: "At least the larger of MAS-02's 1.2 times the axle group load with growth and VSB1's 120 % rule at the plated ATM (report 06). No maximum: a higher rating only adds margin"}
    affects: [MAS-02]
    thresholds:
      - {rule: "The axle group load in MAS-02 is checked against this rating. VSB1's 120 % rule at the ATM needs 1.2 x (ATM less the towball target), worked out from the current values", src: "Report 06, VSB1 Rev 6 axles and suspension"}
  - id: SUP-02
    group: Wheel and suppliers
    part: trailer
    title: Do Cruisemaster's ratings already include VSB1's 120 % rule? (1 for yes, 0 for no)
    how: Cruisemaster's written answer to report 06 open question 2.
    unit: yes or no
    estimate: {v: 0, src: "Not known. Taken as no, which is the safe side (report 06)"}
    measured: {v: 0, date: 2026-11-18, note: "Cruisemaster: it does not usually apply VSB1's rules, but will follow them in the design with the owner"}
    stage: buy
    range: {min: 0, max: 1, src: "Either answer works: MAS-02 checks 1.2 times the axle group load for no (0) and the axle group load itself for yes (1)"}
    affects: [MAS-02]
    thresholds:
      - {at: 0, rule: "No: MAS-02 checks 1.2 times the axle group load against the kit's GTM. Yes: it checks the axle group load itself", src: "VSB1 Rev 6 axles and suspension, report 06"}
  - id: SUP-04
    group: Wheel and suppliers
    part: trailer
    title: Cruisemaster's C/F for the ROH Trak 2 16 x 7 ET 0 wheel, from the rail's outside face to the hub face
    how: Cruisemaster sets it in the design session from the wheel's offset and the track.
    unit: mm
    estimate: {v: 190, src: "Report 18 section 3.4: C/F 190 with ET 0 gives a 1,555 mm track on the 1,175 mm rail, the ute's front track"}
    measured: {v: null, date: null}
    stage: buy
    range: {min: {ref: cf_min}, max: 200, src: "Maximum: Cruisemaster's chart limits the effective C/F (C/F less ET 0) to 200 mm for the 4,500 kg XT Air tandem. Minimum: a smaller C/F moves the tyre towards the rail by the same amount, and FIT-05 keeps the tyre 50 mm from every chassis member, so the minimum is the C/F in use less FIT-05's margin"}
    affects: [track, chassis inputs]
    thresholds:
      - {rule: "The rail outer width stays 1,175 mm, so the track follows: rail width + 2 x (C/F - ET). The tyre's inner sidewall sits C/F - ET - half the tyre width outside the rail, and report 06 asks for about 40 mm", src: "Report 06 sections 3 and 8, report 09 section 3"}
      - {at: 200, rule: "Cruisemaster's C/F chart marks every effective C/F (C/F - ET) above 200 mm as unacceptable for the 4,500 kg XT Air tandem. Above it the note flags the C/F, and a wider track needs a wider rail instead", src: "Cruisemaster C/F sheet, as read in report 09"}

  # ================================================================ the bikes and the chock, in the ute's bike box (UTE-GARAGE.md, report 05)
  - id: TU-01
    group: Bikes (ute bike box)
    part: box
    title: Tuareg width across the fairing side panels, about 1,010 mm off the floor and 380 mm behind the front axle
    how: Bike upright on its stand. Hold a straight board flat against each side panel at that height and spot, keep both boards parallel to the bike, and measure between them.
    unit: mm
    estimate: {v: 600, src: "Design estimate (DESIGN.md), 300 mm either side (range 280 to 350)"}
    measured: {v: 585, date: 2026-11-18, note: "Owner. Nothing else is at this spot, the crash bars sit much lower"}
    stage: build
    range: {min: null, max: 708, src: "Above 668 mm the build widens the bike spacing by the excess, and at 708 mm it reaches 780 mm, where the Street Triple's belly pan comes within 15 mm of the kerb-side tool chest (UGC-02) and the box layout needs redesigning. No minimum: a narrower bike only adds clearance"}
    affects: [side panel envelope, bike spacing, bike positions in the box, UGC-01, UGC-02]
    thresholds:
      - {at: 668, rule: "At or below 668 mm the 760 mm spacing holds: half-width 334 = 760 spacing - 396 Street Triple bar reach - 30 mm gap (UGC-01). Above it the spacing grows by about the excess half-width, and the build then sets the final spacing from the geometry: the smallest spacing at which UGC-01 measures 30 mm. Each bike moves out towards its wall by half the growth", src: "UTE-GARAGE.md (760 mm spacing, 30 mm limit), owner's 792 mm Street Triple width, addendum 1"}
      - {at: 780, rule: "The box is 1,850 mm wide outside at most, so it does not grow. Above a 780 mm spacing (about 708 mm across the side panels) the Street Triple's belly pan comes within 15 mm of the kerb-side tool chest, UGC-02 fails and the box layout has to be redesigned", src: "UTE-GARAGE.md, check UGC-02"}
  - id: TU-09
    group: Bikes (ute bike box)
    part: box
    title: Tuareg crash bars, top height
    how: Bike upright on level floor. Lay a straight board level across the highest point of the bars, front to back, and measure from the floor to its underside.
    unit: mm
    estimate: {v: 900, src: "Owner, 2026-11-18: much lower than the Street Triple's bar end at about 1,010 mm. 900 mm used until measured"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 970, src: "Up to 970 mm the Street Triple's bar end at about 1,000 mm passes over the crash bars. Above it the bars may meet the bar end (UGC-01). No minimum: lower bars only add clearance"}
    affects: [crash bar envelope, UGC-01]
    thresholds:
      - {at: 970, rule: "The Street Triple's right bar end sits at about 1,000 to 1,030 mm. If the bars top out at about 970 mm or lower (30 mm under it), the bar end passes over them and the side panels govern. Above it the bars may meet the bar end, and the build re-solves the spacing from the geometry", src: "Report 05 (Street Triple bars at 1,013 mm), UTE-GARAGE.md UGC-01"}
  - id: TU-02
    group: Bikes (ute bike box)
    part: box
    title: Tuareg overall length with the number plate hanger
    how: Bike upright. Stand a board square to the floor against the front tyre and another against the rear-most point of the plate or hanger, and measure between them.
    unit: mm
    estimate: {v: 2220, src: "Owner's figure. Aprilia's image suggests 2,263 mm or more (report 05)"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 2288, src: "Above 2,288 mm the number plate comes within 15 mm of the ramp stowed across the back of the box (UGC-04). No minimum: a shorter bike only adds clearance"}
    affects: [UGC-02, UGC-04]
    thresholds:
      - {at: 2288, rule: "Above about 2,288 mm the plate comes within 15 mm of the ramp stowed across the back of the box (UGC-04 measures 40.8 mm at 2,263 mm). The box length is set by the ute's rear overhang, so the bikes move forward only if the chock nose (CHK-01) measures shorter", src: "UTE-GARAGE.md UGC-02 and UGC-04"}
  - id: TU-03
    group: Bikes (ute bike box)
    part: box
    title: Tuareg screen top height, mirrors folded
    how: Bike upright on level floor. Lay a straight board across the top of the screen, level it, and measure from the floor to its underside.
    unit: mm
    estimate: {v: 1370, src: "Owner's figure. Aprilia's image gives about 1,390 mm"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 1420, src: "Above 1,420 mm the screen comes within 15 mm of the 1,460 mm roof bows and door header with the front wheel 25 mm up in the chock (UGC-02, UGC-05), and the walls must grow. No minimum"}
    affects: [UGC-02, UGC-05]
    thresholds:
      - {at: 1420, rule: "The box is 1,460 mm high inside to the roof bows and the door header. With the front wheel 25 mm up in the chock, a screen or folded mirror above about 1,420 mm comes within 15 mm of them (UGC-02), and the walls must grow", src: "UTE-GARAGE.md"}
  - id: TU-04
    group: Bikes (ute bike box)
    part: box
    title: Tuareg folded mirror top height
    how: Fold the mirrors as for transport. Measure from the floor to the highest point of either mirror.
    unit: mm
    estimate: {v: 1365, src: "bikes.yaml estimate, kept below the screen"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 1420, src: "The folded mirrors follow the screen's rule: above 1,420 mm they come within 15 mm of the roof bows (UGC-02). No minimum"}
    affects: [UGC-02]
    thresholds:
      - {rule: "If the mirrors stand above the screen they set the height instead (TU-03 rule)", src: "UTE-GARAGE.md"}
  - id: TU-05
    group: Bikes (ute bike box)
    part: box
    title: Tuareg width over the panniers
    how: Bags on and packed as for the trip. Hold a board against the outside of each bag, parallel to the bike, and measure between the boards.
    unit: mm
    estimate: {v: 980, src: "Owner's measurement of about 970 to 980 mm"}
    measured: {v: 980, date: 2026-11-18, note: "Owner's measurement, 970 to 980 mm, reported on 18 Nov"}
    stage: build
    range: {min: null, max: 1049, src: "Above 1,049 mm the road-side bag comes within 15 mm of the barn door portal as the Tuareg rolls out (UGC-03). No minimum: narrower bags only add clearance"}
    affects: [pannier envelope, UGC-02, UGC-03, UGC-06]
    thresholds:
      - {at: 1049, rule: "Above about 1,049 mm the road-side bag comes within 15 mm of the barn door portal as the Tuareg rolls out (UGC-03 measures 49.5 mm at 980 mm). The Tuareg would have to move towards the kerb side", src: "UTE-GARAGE.md UGC-03"}
  - id: TU-06
    group: Bikes (ute bike box)
    part: box
    title: Tuareg pannier length, height and position
    how: Measure one bag's length along the bike and its height, and how far its front edge is behind the front axle and its bottom above the floor.
    unit: mm
    estimate: {v: [457, 508, 1300, 425], src: "Length and height from Mosko Moto's Backcountry 30L figures. Front edge 1,300 behind the front axle and bottom 425 off the floor are estimates"}
    measured: {v: null, date: null}
    stage: build
    range: {min: [null, null, 1260, 385], max: [497, 548, 1340, 465], src: "Estimate: UGC-05 measures 59.5 mm from the road-side bag to the nearest frame post (needs 15) and UGC-06 55.7 mm to the nearest strap (needs 0), so each figure may change by about 40 mm before a check fails (est.). Smaller bags only add clearance, so length and height have no minimum"}
    order: [length, height, front edge behind the front axle, bottom above the floor]
    affects: [pannier envelope, UGC-06]
    thresholds:
      - {rule: "The envelope follows the values and UGC-06 re-measures the gap to the straps", src: "UTE-GARAGE.md"}
  - id: TU-07
    group: Bikes (ute bike box)
    part: box
    title: Tuareg footpeg width, tip to tip
    how: Pegs down. Hold a board against the tip of each peg, parallel to the bike, and measure between them.
    unit: mm
    estimate: {v: 640, src: "bikes.yaml design estimate (320 mm each side)"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 689, src: "Estimate: UGC-02 measures 39.5 mm from the Tuareg to the road-side tool chest (needs 15), so each peg tip may reach about 24 mm further out (est.). The 730 mm rule for the two facing pegs allows more. No minimum"}
    affects: [bike spacing, UGC-01, UGC-02]
    thresholds:
      - {at: 730, rule: "The two bikes' facing pegs must stay 30 mm apart: half the Tuareg's width plus half the Street Triple's at most 730 mm (760 - 30). Above it the spacing grows by the excess, as in TU-01", src: "UTE-GARAGE.md UGC-01"}
  - id: ST-01
    group: Bikes (ute bike box)
    part: box
    title: Street Triple footpeg width, tip to tip
    how: As TU-07, on the Street Triple.
    unit: mm
    estimate: {v: 440, src: "bikes.yaml design estimate (220 mm each side)"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 461, src: "Estimate: UGC-02 measures 25.5 mm from the Street Triple to the kerb-side tool chest (needs 15), so each peg tip may reach about 10 mm further out (est.). The 730 mm rule for the two facing pegs allows more. No minimum"}
    affects: [bike spacing, UGC-01]
    thresholds:
      - {at: 730, rule: "With TU-07: half of each peg width added together at most 730 mm, or the spacing grows by the excess", src: "UTE-GARAGE.md UGC-01"}
  - id: CHK-01
    group: Bikes (ute bike box)
    part: box
    title: Condor chock nose depth, the box's front wall to the front tyre's leading edge
    how: Bolt a chock to a board against a wall, roll a front wheel into it, and measure from the wall to the front of the tyre.
    unit: mm
    estimate: {v: 50, src: "Design allowance (DESIGN.md), to be measured on a real chock"}
    measured: {v: null, date: null}
    stage: build
    range: {min: null, max: 75, src: "Both bikes move back by the chock's depth, and UGC-04 measures 40.8 mm from the Tuareg's plate to the stowed ramp (needs 15), so the chock may be about 25 mm deeper than 50 mm. No minimum: a shallower chock moves the bikes away from the ramp"}
    affects: [bike position along the box, UGC-02, UGC-04]
    thresholds:
      - {rule: "The front tyre's leading edge sits this far behind the box's front wall, so both bikes move with it", src: "UTE-GARAGE.md"}

  # ================================================================ the bike box (report 24, UTE-GARAGE.md), group Bike box
  # ================================================================ before the build: the bought ute
  - id: BOX-01
    group: Bike box
    part: box
    title: Rear frame rail top above the ground, laden, at the last deck mount
    how: Ute with its GVM kit, tyres at road pressure, loaded to the trip mass (both bikes and the tools, or 650 kg of ballast over the rear axle) on level ground. Measure from the ground to the top of each rail at the last deck mount bracket and average the two.
    unit: mm
    estimate: {v: 774, src: "UTE-GARAGE.md assumption 6: Toyota's 724 mm (BBGJ1007 pp. 55 and 62) plus about 50 mm of Lovells lift (estimate)"}
    measured: {v: null, date: null}
    stage: build
    affects: [floor height, tub height, ramp angle, UGD-01, UGW-01, UGL-01, JK-02]
    range: {min: 760.5, max: 952, src: "Below 760.5 mm the floor drops 13.5 mm and the tubs pass 100 mm (UGD-01 measures 86.5 mm). Above 952 mm the empty sill passes 1,042 mm and the 3,048 mm ramp passes 20 degrees (report 03)"}
    thresholds:
      - {at: 760.5, rule: "Below this the wheel tubs stand more than 100 mm above the floor and the box goes to the flat deck at about 1,080 mm (report 17 section 6.4)", src: "UTE-GARAGE.md, UGD-01"}
  - id: BOX-02
    group: Bike box
    part: box
    title: Rear wheel travel from laden ride height to the bump stop, compressed
    how: Box off. Ute laden as BOX-01. Measure the gap from the bump stop to its striker on the axle, then add the bump stop's crush (its height less its fully compressed height, from the Lovells kit sheet or by test).
    unit: mm
    estimate: {v: 110, src: "UTE-GARAGE.md assumption 7, report 17 section 3.3 (estimate)"}
    measured: {v: null, date: null}
    stage: build
    affects: [tub height, UGD-01, UGW-01]
    range: {min: null, max: 123.5, src: "Each extra mm raises the tub top 1 mm. 86.5 mm tubs reach the 100 mm limit at 123.5 mm of travel (UGD-01)"}
    thresholds:
      - {at: 123.5, rule: "Above this the tubs pass 100 mm above the floor: flat deck, or Leonard accepts taller tubs and UGC-02 runs again", src: "Report 17 section 3.3, UGD-01"}
  - id: BOX-03
    group: Bike box
    part: box
    title: Rear tyre static loaded radius, laden
    how: Ute laden as BOX-01, tyres at the placard pressure. Measure from the ground to the centre of each rear hub and average.
    unit: mm
    estimate: {v: 380, src: "UTE-GARAGE.md assumption 5 (estimate, about 22 mm deflection on the 805 mm tyre)"}
    measured: {v: null, date: null}
    stage: build
    affects: [tub height, UGD-01]
    range: {min: 360, max: 393.5, src: "Each mm above 380 raises the tyre 1 mm against the fixed floor, so the tubs reach 100 mm at 393.5 mm. Below 360 mm the tyre is under-inflated or overloaded (est.)"}
    thresholds:
      - {at: 393.5, rule: "The tubs pass 100 mm. Treat as BOX-02", src: "UGD-01"}
  - id: BOX-04
    group: Bike box
    part: box
    title: Deck mount bracket positions from the rear axle centre
    how: Plumb lines from the rear hub centre and from each bracket's bolt hole, marked on the floor. Measure along the rail, minus ahead of the axle and plus behind it. Both rails.
    unit: mm
    estimate: {v: [-879, -490, 123, 490, 755, 1025], src: "Toyota BBGJ1007, report 17 section 1.4"}
    measured: {v: null, date: null}
    stage: build
    order: [station 1, station 2, station 3, station 4, station 5, station 6]
    affects: [subframe drawing CT-702, track rows, strap geometry, UGR-01, UGM-01]
    range: {min: [-904, -515, 98, 465, 730, 1000], max: [-854, -465, 148, 515, 780, 1050], src: "Each station within 25 mm of the estimate. The L-track rows sit on stations 1 and 6 and report 03 holds anchor X within 50 mm, so half of that is kept for build tolerance (est.)"}
    thresholds:
      - {rule: "Any station more than 25 mm off: redraw the subframe and re-run UGR-01 with the new track rows", src: "Report 03 section 4"}
  - id: BOX-05
    group: Bike box
    part: box
    title: Deck mount bracket hole diameter
    how: Vernier on each bolt hole. Note the flange width from the rail's outer face to its edge as well (about 60 mm expected).
    unit: mm
    estimate: {v: 13, src: "UTE-GARAGE.md assumption 9: an M12 clearance hole in a flange about 60 mm out from the rail (estimate)"}
    measured: {v: null, date: null}
    stage: build
    affects: [bolt size BX-F01, mount plates BX-U02, UGM-01]
    range: {min: 12.5, max: 14.5, src: "A hole that takes an M12 bolt with normal to coarse clearance (est.)"}
    thresholds:
      - {rule: "A hole sized for M10 or M14 changes the bolt in BX-F01 and the engineer re-checks UGM-01", src: "UGM-01"}
  - id: BOX-06
    group: Bike box
    part: box
    title: Frame rail width over the outsides, at stations 1 and 6
    how: Straight edges against the outer faces of both rails, measured square across.
    unit: mm
    estimate: {v: 1046, src: "UTE-GARAGE.md assumption 4 (estimate from the frame drawing)"}
    measured: {v: null, date: null}
    stage: build
    affects: [runner positions, mount plates, UGW-02]
    range: {min: 1036, max: 1056, src: "Plus or minus 10 mm (est.): the 75 mm runners still bear on the 60 mm rail tops, and the mount angles keep their 5 mm to the tub walls, which the tyres set (UGW-02)"}
    thresholds:
      - {rule: "Outside the range, move the runners to the measured rails, re-draw the mount angles and re-run UGW-02", src: "UGW-02"}
  # ================================================================ the built box, before it goes on
  - id: BOX-07
    group: Bike box
    part: box
    title: Box mass empty, with its restraint, ramp, winch, security and tool chests, no tools
    how: Weigh the finished box on four platform scales under its mount points, or on a weighbridge on a trailer weighed empty first. Record the sum.
    unit: kg
    estimate: {v: 436.1, src: "data/ute/box-parts.yaml line sum, equal to the model's box (build/ute/ute.json), with the 1.6 mm roof"}
    measured: {v: null, date: null}
    stage: weigh
    affects: [every ute mass check, UGB-01, UTE-06, the rear axle]
    range: {min: 392, max: 440, src: "Max: UGB-01's 440 kg limit (report 17, data/ute/garage-checks.yaml). Min: 10 % under the list, below which a part is missing (est.)"}
    thresholds:
      - {at: 0.02, rule: "A difference over 2 % from the line sum is explained before the box is fitted", src: "Report 02 MASS-07"}
      - {at: 440, rule: "UGB-01 asks for less than report 17's 440 kg. The list is 3.9 kg under it with the 1.6 mm roof (UTE-GARAGE.md). Over it, take mass out of the box before it goes on the ute", src: "data/ute/garage-checks.yaml via cad/ute_garage.py"}
  - id: BOX-08
    group: Bike box
    part: box
    title: Box centre of gravity along the box and its height above the floor, empty
    how: "Along: from the four scale readings of BOX-07, the mass-weighted X of the front and rear pairs. Height: raise the front pair of mounts a known height (about 300 mm) on blocks, weigh again, and compute the height from the shift of load to the rear pair (tilt method)."
    unit: mm
    estimate: {v: [1262, 487], src: "Model line sum, build/ute/ute.json: X 1,262 mm from the front wall's inner face (225 mm behind the rear axle), 487 mm above the floor top"}
    measured: {v: null, date: null}
    stage: weigh
    order: [X from the front wall, height above the floor]
    affects: [ute axle loads, SSF, UGM-01]
    range: {min: [1162, 387], max: [1362, 587], src: "Each value within 100 mm of the estimate. 100 mm along moves about 14 kg between the axles. The unladen 1,000 mm limit (Toyota) has about 1.4 m in hand (est.)"}
    thresholds:
      - {rule: "The measured values replace the model's for the box lines and the ute checks run again", src: "Report 02 MASS-07"}
  - id: BOX-09
    group: Bike box
    part: box
    title: Barn door meeting gap, closed and locked
    how: Feeler gauges at the top, middle and bottom of the meeting edge between the leaves. Check the hinge gaps at the corner posts at the same time, 9 to 11 mm.
    unit: mm
    estimate: {v: 5, src: "Model leaf_gap (data/assemblies/ute-garage.yaml)"}
    measured: {v: null, date: null}
    stage: build
    affects: [seal contact, cam bar keepers, dog bolts, UGC-03]
    range: {min: 3, max: 8, src: "The cam bar keepers and the edge seal work from 3 to 8 mm (est.)"}
    thresholds:
      - {rule: "Out of range: re-hang the leaf before the seals go on", src: "Build step 7"}
  - id: BOX-10
    group: Bike box
    part: box
    title: Kerb door gap all round, closed
    how: Feeler gauges at each corner and mid-side.
    unit: mm
    estimate: {v: 5, src: "Design (est.)"}
    measured: {v: null, date: null}
    stage: build
    affects: [seal contact, latch]
    range: {min: 3, max: 8, src: "As BOX-09 (est.)"}
    thresholds:
      - {rule: "Out of range: re-set the hinge and the strut brackets", src: "Build step 7"}
  - id: BOX-11
    group: Bike box
    part: box
    title: Door seal contact, paper test
    how: Close and lock each door on a strip of paper at every 300 mm round the seal. The strip must drag at every point. Count the points where it pulls out freely.
    unit: points
    estimate: {v: 0, src: "Design"}
    measured: {v: null, date: null}
    stage: build
    affects: [dust, water, positive pressure]
    range: {min: 0, max: 0, src: "Every point must drag, so the fan holds the box above outside pressure (report 17 section 2.4)"}
    thresholds:
      - {rule: "Any loose point: adjust the keeper or add seal before the water test (build step 11)", src: "Report 17 section 2.4"}
  # ================================================================ fitted on the ute
  - id: BOX-12
    group: Bike box
    part: box
    title: Cab back to the box front wall, at the roof
    how: Measure the gap at the cab's roof line and at its lower corners after the mounts are torqued.
    unit: mm
    estimate: {v: 40, src: "Model cab_gap (data/assemblies/ute-garage.yaml)"}
    measured: {v: null, date: null}
    stage: build
    affects: [UTE-15, rear overhang, box overhang behind the ball, JK-01]
    range: {min: 39, max: 60, src: "Min: Toyota BBGJ1007 (UTE-15). Max: each mm more adds 1 mm of overhang behind the ball, and JK-01's 100 mm allowance is for the unmeasured ball position (est.)"}
    thresholds:
      - {at: 39, rule: "Below 39 mm UTE-15 fails: move the box back on its mounts", src: "Toyota BBGJ1007"}
  - id: BOX-13
    group: Bike box
    part: box
    title: Static gap from each rear tyre's top to the tub roof above it, laden
    how: Ute laden as BOX-01, box fitted. Reach in from beside the wheel with a rule from the tyre's highest point to the tub's underside.
    unit: mm
    estimate: {v: 135, src: "Bump travel 110 mm plus Toyota's 25 mm at full bump (UGW-01)"}
    measured: {v: null, date: null}
    stage: build
    affects: [UGW-01]
    range: {min: 135, max: null, src: "Min: BOX-02's measured travel plus 25 mm (Toyota BBGJ1007 p. 28). 135 mm with the estimated travel"}
    thresholds:
      - {rule: "Less than the travel plus 25 mm: the tyre can strike the tub at full bump. Fit a taller bump stop or raise the tubs", src: "UGW-01"}
  - id: BOX-14
    group: Bike box
    part: box
    title: Clearance from the box's rear underside to the highest part of the coupled trailer within 600 mm of the ball
    how: Ute laden and coupled to the loaded trailer on level ground. Measure from the underside of the box's rear crossmember straight down to the highest part of the coupling, handbrake, jockey wheel clamp, chains or drawbar box lid within 600 mm behind the ball.
    unit: mm
    estimate: {v: 130, src: "Box underside about 780 mm up, coupling and handbrake tops about 650 mm (est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    affects: [JK-01, JK-02]
    range: {min: 50, max: null, src: "Trailer check JK-02 (data/checks.yaml): everything inside the box's sweep stays 50 mm below its underside"}
    thresholds:
      - {at: 50, rule: "Below 50 mm: lower the part on the trailer's drawbar or move it outside the box's sweep (JK-01)", src: "JK-02"}
  - id: BOX-15
    group: Bike box
    part: box
    title: Sill height above the ground with the bikes out
    how: Ute unladen except the empty box and two people's mass in the cab (or the people in it), level ground. Measure from the ground to the top of the sill angle.
    unit: mm
    estimate: {v: 864, src: "UTE-GARAGE.md: the laden floor at 834 mm rises about 30 mm with the bikes out (report 17)"}
    measured: {v: null, date: null}
    stage: build
    affects: [ramp angle, UGL-01]
    range: {min: null, max: 1042, src: "3,048 mm x sin 20 degrees: report 03's limit for walking a bike up beside the ramp"}
    thresholds:
      - {at: 1042, rule: "Above this the ramp is steeper than 20 degrees: use a longer ramp or load on a slope", src: "Report 03 section 10"}
  # ================================================================ bikes in the box
  - id: BOX-16
    group: Bike box
    part: box
    title: Tuareg centreline from the ute's centreline, road side
    how: Snap a chalk line on the floor down the ute's centreline. Measure square from it to the centreline of the Tuareg's chock.
    unit: mm
    estimate: {v: 333, src: "Model tuareg_y (data/assemblies/ute-garage.yaml)"}
    measured: {v: null, date: null}
    stage: build
    affects: [UGC-01, UGC-02, UGC-03, strap anchors]
    range: {min: 292, max: 357, src: "Towards the kerb, UGC-01's 41.5 mm margin to the Street Triple. Towards the road, UGC-02's 24.5 mm margin to the road-side tool chest"}
    thresholds:
      - {rule: "Outside the range: move the chock adapter and its fittings before strapping", src: "UGC-01, UGC-02"}
  - id: BOX-17
    group: Bike box
    part: box
    title: Street Triple centreline from the ute's centreline, kerb side
    how: As BOX-16, to the Street Triple's chock.
    unit: mm
    estimate: {v: -427, src: "Model st_y"}
    measured: {v: null, date: null}
    stage: build
    affects: [UGC-01, UGC-02, strap anchors]
    range: {min: -437, max: -386, src: "Towards the kerb, UGC-02's 10.5 mm margin from the belly pan to the kerb tool chest. Towards the road, UGC-01's 41.5 mm margin"}
    thresholds:
      - {rule: "Outside the range: move the chock adapter. The kerb side is the tight one", src: "UGC-02"}
  - id: BOX-18
    group: Bike box
    part: box
    title: Track rows from the Tuareg's front axle, chocked
    how: Tuareg in its chock. Plumb from the front axle centre to the floor and measure along the box to the centre of each L-track row.
    unit: mm
    estimate: {v: [240, -1665], src: "UTE-GARAGE.md section 4: front row 240 mm ahead, rear row 1,665 mm behind the front axle"}
    measured: {v: null, date: null}
    stage: build
    order: [front row, rear row]
    affects: [strap angles, UGR-01]
    range: {min: [190, -1715], max: [290, -1615], src: "Each row within 50 mm of the estimate (report 03 section 4: hold anchor X within 50 mm)"}
    thresholds:
      - {rule: "More than 50 mm off: re-run UGR-01 with the measured rows", src: "Report 03 section 4"}
  - id: BOX-19
    group: Bike box
    part: box
    title: Fork compression under the front straps
    how: Mark each fork's stanchion at the seal with the bike chocked and the straps slack, tighten the front pair evenly and measure how far the mark moves.
    unit: mm
    estimate: {v: [80, 40], src: "Report 03 section 3: one third of travel, 240 mm (Tuareg) and 115 mm (Street Triple)"}
    measured: {v: null, date: null}
    stage: build
    order: [Tuareg, Street Triple]
    affects: [strap tension on corrugations]
    range: {min: [60, 30], max: [100, 50], src: "Tuareg 60 to 100 mm and Street Triple 30 to 50 mm, about a quarter to two fifths of the travel. Never bottomed (report 03 section 3)"}
    thresholds:
      - {rule: "Re-check after the first 10 to 20 km and after rough sections", src: "NTC light vehicle guide p. 8, report 03"}
  - id: BOX-20
    group: Bike box
    part: box
    title: Rear tyre's outer face to the flare's inner face, the smaller side
    how: "Box fitted, ute laden as BOX-01. On each side, measure square from the rear tyre's outer sidewall at its widest point to the inner face of the flare beside it, then jack the axle up to the bump stop and measure again. Record the smaller of the readings."
    unit: mm
    estimate: {v: 31, src: "Model check UGW-03: the flare's inner face 942.5 mm from the centreline, the tyre's outer face 911.5 mm on the Elite's 1,555 mm rear track (decision H19)"}
    measured: {v: null, date: null}
    stage: build
    affects: [UGW-03, rear tub flares, UTE-09]
    thresholds:
      - {at: 30, rule: "Under 30 mm the tyre can rub the flare at full bump: move the flare out, up to UTE-09's 1,910 mm, or fit wheels with more positive offset", src: "Toyota BBGJ1007 p. 28, UGW-03"}
    range: {min: 30, max: null, src: "Min: Toyota BBGJ1007 p. 28, 30 mm outside the tyre (UGW-03). No upper limit here: a larger gap means a narrower track, which VEH-28 and the tubs' 40 mm inside the tyre (UGW-02) check"}
  # ================================================================ the trailer, later (report 02 MASS-07)
  - id: TW-01
    group: Trailer weighbridge
    part: trailer
    title: Weighed mass, chassis with running gear, drawbar and coupling
    how: Weigh the rolling chassis on a weighbridge before the body goes on, with the jockey wheel, safety chains and breakaway kit fitted. Record the whole mass.
    unit: kg
    estimate: {v: null, src: "The model's sum for these lines is shown beside it"}
    measured: {v: null, date: null}
    stage: weigh
    range: {ref: model_TW-01, rel: 0.02, src: "Within 2 % of the model's mass for the parts on the scale by then (report 02 MASS-07). A bigger difference is explained before work continues"}
    covers: [chassis, running_gear, drawbar_structure, drawbar]
    affects: [every mass check]
    thresholds:
      - {rule: "The weighed figure replaces the estimates for the parts already built: their masses scale to it and their growth allowance becomes 0 %", src: "Report 02 MASS-06 and MASS-07"}
      - {at: 0.02, rule: "A difference over 2 % from the model is explained before work continues", src: "Report 02 MASS-07"}
  - id: TW-02
    group: Trailer weighbridge
    part: trailer
    title: Weighed mass, with the body shell on
    how: Weigh again once the floor, walls, roof, doors, windows and solar panels are on. Record the whole mass.
    unit: kg
    estimate: {v: null, src: "The model's sum is shown beside it"}
    measured: {v: null, date: null}
    stage: weigh
    range: {ref: model_TW-02, rel: 0.02, src: "Within 2 % of the model's mass for the parts on the scale by then (report 02 MASS-07). A bigger difference is explained before work continues"}
    covers: [body, roof]
    affects: [every mass check]
    thresholds:
      - {rule: "The rise from TW-01 replaces the shell's estimates, as for TW-01", src: "Report 02 MASS-06 and MASS-07"}
  - id: TW-03
    group: Trailer weighbridge
    part: trailer
    title: Weighed mass, fitted out, tanks empty and no payload
    how: Weigh the finished trailer as built, with the tanks and the jerry cans empty. This is the tare on the plate.
    unit: kg
    estimate: {v: null, src: "The model's tare is shown beside it"}
    measured: {v: null, date: null}
    stage: weigh
    range: {ref: model_TW-03, rel: 0.02, src: "Within 2 % of the model's tare, the whole trailer as built (report 02 MASS-07). A bigger difference is explained before the plate is stamped"}
    covers: [underfloor, electrical, hvac, wet_room, living, bed, stowage, spare]
    affects: [every mass check, the plated tare]
    thresholds:
      - {rule: "The rise from TW-02 replaces the fit-out's estimates. The ticket goes in the NSW identity approval package (report 02, VIB 78)", src: "Report 02 MASS-07 and MASS-08"}
  # ================================================================ the trailer, fully loaded and tested once built (TRAILER.md, build order B8)
  - id: TW-04
    group: Trailer weighbridge
    part: trailer
    title: Weighed mass, fully loaded for travel with 350 L of water, the fuel and the gear
    how: "Load the trailer as for a trip: 350 L of fresh water, the heater's diesel, the jerry cans, the gear and the food, with the grey tank empty. Weigh the whole trailer on a weighbridge, uncoupled on its jockey wheel, or coupled with only the trailer on the scale and the drawbar at its design height."
    unit: kg
    estimate: {v: null, src: "The model's TC2 mass without growth is shown beside it"}
    measured: {v: null, date: null}
    stage: weigh
    range: {ref: model_TC2, rel: 0.03, src: "Within 3 % of the model's TC2. A bigger difference means the estimates or the load are wrong, so weigh the parts again"}
    affects: [MAS-01, the travel water limit, GCM-01]
    thresholds:
      - {at: 3400, rule: "Over 3,400 kg, tow with less water until it is under, because H2 keeps the fully loaded trailer 100 kg under the plate", src: "Decision H2, H13"}
      - {at: 3500, rule: "Over 3,500 kg the trailer is over its plate: unload before it moves", src: "The plated ATM"}
  - id: TW-05
    group: Trailer weighbridge
    part: trailer
    title: Axle group load, fully loaded, coupled to the ute at the design ball height
    how: "With TW-04's load, couple to the ute on level ground and stand only the trailer's four wheels on the weighbridge, with the ute off it. The reading is the axle group's load. TW-04 less this reading is the towball, which UTE-03 measures directly."
    unit: kg
    estimate: {v: null, src: "The model's TC2 axle group load without growth is shown beside it"}
    measured: {v: null, date: null}
    stage: weigh
    range: {ref: axle_TC2, rel: 0.03, src: "Within 3 % of the model's TC2 axle group load"}
    affects: [MAS-02, MAS-06, MAS-09, the towball]
    thresholds:
      - {at: 3375, rule: "Over 3,375 kg the axle group passes the XT build's 4,050 kg under VSB1's 120 % rule: take load off", src: "MAS-02, Cruisemaster's 4,050 kg build and VSB1"}
  - id: TR-01
    group: Trailer tests
    part: trailer
    title: Centre of gravity height at tare, by the axle-lift method
    how: "Tanks empty, no gear. Weigh the axle group with the trailer level, then again with the drawbar raised a measured height, and work the height out from the change in load and the axle-to-ball distance. The engineer can run the test and the sum."
    unit: mm
    estimate: {v: null, src: "The model's tare centre of gravity height without growth is shown beside it"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {ref: cog_z_TC1, rel: 0.05, src: "Within 5 % of the model's tare. 5 % higher lowers the static stability factor from 0.58 to about 0.55"}
    affects: [the static stability factor, the frame and body loads]
    thresholds:
      - {rule: "A higher centre of gravity lowers the static stability factor, half the track less the lateral offset over the height: stow the heavy gear low and near the axle", src: "NHTSA's static stability factor, TRAILER.md"}
  - id: TR-02
    group: Trailer tests
    part: trailer
    title: Fresh water the tanks hold, from empty to full through a water meter
    how: "Drain both fresh tanks through the pump until it runs dry, then fill through a garden water meter until the breather overflows. Record the meter's reading."
    unit: L
    estimate: {v: 420, src: "Report 21 section 10 and the model's two tanks (est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 400, max: null, src: "Min: report 21 keeps 400 L, which covers 7 days with three washes. No upper limit: the travel limit (H13) caps what rides"}
    affects: [the days of water off-grid]
    thresholds:
      - {at: 400, rule: "Under 400 L a week with three washes needs a refill on the sixth day: plan the fills, or add laundry days less often", src: "Report 21 section 10.1"}
  - id: TR-03
    group: Trailer tests
    part: trailer
    title: Grey water the grey tank holds, from empty to full
    how: "With the outlet valve shut, run measured water into the shower drain until the tank's level sender reads full or the vent overflows."
    unit: L
    estimate: {v: 130, src: "Report 21 section 10, UF-08"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 125, max: null, src: "Min: 72 h with one wash makes 125 L (report 21 section 10.1). No upper limit"}
    affects: [the hours between grey emptying, TC7, TC8]
  - id: TR-04
    group: Trailer tests
    part: trailer
    title: Battery capacity, from full to the BMS's cut-off
    how: "Charge the bank to full and let it rest an hour. Turn off the sun and the chargers, run a steady load of about 1 kW through the inverter until the Lynx Smart BMS NG stops it, and read the energy taken from the Cerbo GX's battery monitor."
    unit: kWh
    estimate: {v: 25.6, src: "Five Victron Lithium NG 51.2 V 100 Ah modules, 5.12 kWh each (maker)"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 22.6, max: null, src: "Min: the 22.6 kWh nominal that H3's governing check needs, the all-electric hot day for 24 h (research/models/20/energy.out). No upper limit"}
    affects: [H3, the autonomy on the design hot day]
    thresholds:
      - {at: 22.6, rule: "Under 22.6 kWh the bank no longer runs a design hot day for 24 h: claim the warranty, or add a sixth module", src: "Decision H3, report 20"}
  - id: TR-05
    group: Trailer tests
    part: trailer
    title: Cabin pressure, parked, with only the filtered top-up fan running at 15 m³/h
    how: "Doors, windows and the hood shut, every other fan off, on a calm day. Read the 0 to 125 Pa gauge (VE-06) after 10 minutes."
    unit: Pa
    estimate: {v: 3, src: "Report 19 section 4: about +3 Pa at a leakage area of 30 cm² (est.)"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 1.5, max: null, src: "Min: 1.5 Pa means about 42 cm² of leakage, the pressure falling with the square of the leakage area (est.). Below it dust gets in when the wind blows"}
    affects: [dust inside, the air leakage]
    thresholds:
      - {at: 1.5, rule: "Under 1.5 Pa, find and seal the leaks with a smoke pencil before the fit-out hides them", src: "Report 19 section 4 (est.)"}
  - id: TR-06
    group: Trailer tests
    part: trailer
    title: Cabin pressure in dust mode, with the RESPA-CF2 on and the other fans off
    how: "As TR-05, with the RESPA-CF2 on and the top-up fan, the e2 pairs and the extract off. Read the gauge parked, then while towing on a dusty road."
    unit: Pa
    estimate: {v: 20, src: "Report 19 section 4"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 20, max: null, src: "Min: report 19 holds the cabin at least 20 Pa above the rear wake in dust, the band ISO 23875 uses for pressurised cabins"}
    affects: [dust inside while towing]
  - id: TR-07
    group: Trailer tests
    part: trailer
    title: Fresh-air flow, both e2 pairs on the day setting
    how: "Hold a flow hood over each fan's inner cover in turn while it blows in, and add the four readings, halved, because each fan blows in half the time."
    unit: m³/h
    estimate: {v: 60, src: "Report 19 section 3: 30 m³/h a pair by day"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 54, max: null, src: "Min: 90 % of the design flow (est.). The design holds CO2 near 900 ppm for two people with the top-up fan"}
    affects: [CO2 and humidity inside]
  - id: TR-08
    group: Trailer tests
    part: trailer
    title: Fresh water used by one 20 min DauerShower shower
    how: "Read the fresh tanks' gauge, or fit a water meter in the shower's feed, before and after a 20 min shower."
    unit: L
    estimate: {v: 5, src: "DauerShower 2.0, maker"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: null, max: 8, src: "Max: at 8 L the water budget rises to 47 L a day and 350 L lasts about 7.4 days (est.). No lower limit"}
    affects: [the water budget]
  - id: TR-09
    group: Trailer tests
    part: trailer
    title: Bed platform's underside above the floor, day position
    how: "Raise the bed to its day stop with the travel locks in, and measure from the floor to the platform's underside at the desk's front edge."
    unit: mm
    estimate: {v: 1600, src: "BED-01 in the model"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 1600, max: null, src: "Min: decision H1, so a seated adult clears it"}
    affects: [H1, the desk]
  - id: TR-10
    group: Trailer tests
    part: trailer
    title: Mattress top above the floor, night position
    how: "Lower the bed to its night stop and measure from the floor to the top of the mattress at its middle."
    unit: mm
    estimate: {v: 1044, src: "BED-01 in the model"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: 950, max: 1050, src: "Decision H1. The ceiling then leaves at least 900 mm above the mattress"}
    affects: [H1, getting into bed]
  - id: TR-11
    group: Trailer tests
    part: trailer
    title: Overall width across the body, the awning and the hoods, laden
    how: "Load the trailer as for TW-04 and stand it level on flat ground. Drop a plumb line from the outermost point on each side, the entry door's handle on the kerb side and the hoods and window frames on the road side, mark the ground and measure between the marks. Leave out the side marker lamps."
    unit: mm
    estimate: {v: 2470, src: "DIM-01 in the model"}
    measured: {v: null, date: null}
    stage: trailer built
    range: {min: null, max: 2500, src: "ADR 43/04 clause 6.2.6.1 and VSB1 section 5.2: at most 2,500 mm, side-mounted lamps and reflectors left out"}
    affects: [DIM-01, DIM-05, registration]
    thresholds:
      - {at: 2490, rule: "Over 2,490 mm, find the part that stands out and fit a lower one before the HVAIS inspection, because the design keeps 10 mm in hand (DIM-05)", src: "DIM-05"}
