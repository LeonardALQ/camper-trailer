# Parts and jobs list for the Ford Ranger Super Duty (VEHICLE.md, research report 31), 23 Nov 2026. It replaces the
# LandCruiser VDJ79 build list of decision H24, whose lines are summed under removed and kept whole in the git history.
# Truck: a near-new Ranger Super Duty single cab chassis, bought (data/project.yaml), rated by Ford at 4,500 kg GVM,
# 1,900 kg front and 2,800 kg rear axle, 4,500 kg braked towing and 8,000 kg GCM. It carries the bike box (H25) and
# tows the trailer, plated at 4,000 kg from 23 Nov 2026 on a DO45-type coupling. Power stage: about 205 kW and 650 Nm
# at the crank (est.), certified, with the DPF, SCR and EGR untouched.
# The site's Car build page renders the three lists and the totals from this file (cad/sitedata.py), and
# cad/tests/test_costs.py checks that the totals below and VEHICLE.md match the lines.
# status, the list a line is on:
#   build     what the truck needs: the purchase inspection, the towing kit, the trailer charging, the mirrors, radio,
#             recovery kit and compressor, and the power stage with its certificate. Priced and counted, with one
#             allowance.
#   check     bought only if a check, a test or a certifier calls for it. Not counted, and no allowance. check says
#             what to look at, checked_at the stage it is looked at, pass_mark the pass mark, and price_aud the price
#             if it fails.
#   optional  extras the plan does not need. Not counted.
# why: the one-line reason the line is on its list.
# priority: P1 legal, safe and able to tow, or protecting the truck. P2 the power stage. P3 optional or comfort.
# stage: the stage that buys and fits the line, or for a check line the stage it is fitted in if it fails.
# depends_on: line or stage ids that must come first. checked: the date the price was read from its listing.
# price_aud: AUD including GST, the line total (qty x unit_aud where qty is given). price_basis: listing or estimate.

stages:
  - {id: S0, name: "Buy, inspect and weigh", can_do: "Drives and tows within Ford's ratings at stock power, once the towing kit is on", work: "Choose the truck, inspect it at a Ford dealer, search the PPSR, buy it, weigh it as bought, take off a tray if one is fitted", labour: "Ford dealer, weighbridge", downtime: "None"}
  - {id: S1, name: "Box, towing kit, mirrors and touring gear", can_do: "Carries both bikes in the box and tows the 4,000 kg trailer within Ford's ratings at stock power", work: "Fit the box on Ford's body mounts, the DO45-type tow pin, the towing mirrors, the UHF radio, the compressor and the recovery kit, set up the trailer's profile, weigh laden", labour: "None, Leonard fits them. Weighbridge", downtime: "1 to 2 weeks while the box goes on (est.)"}
  - {id: S2, name: "Trailer charging", can_do: "Tows the loaded trailer and charges its 48 V battery while driving", work: "Fit the two 12/48 V chargers and the 48 V feed to the tow bar, log the voltage on the first hot night tow, weigh coupled", labour: "Auto electrician, weighbridge", downtime: "1 day"}
  - {id: S3, name: "Power stage and its certificate", can_do: "Tows at about 205 kW and 650 Nm at the crank (est.), certified", work: "Garrett PowerMax turbo and intercooler, the engine and 10-speed calibration on a dyno, the interim NSW emissions test and the LC4 certificate", labour: "Tuner with a chassis dyno, emissions test, LC4 certifier. Leonard fits the turbo and intercooler", downtime: "1 to 2 weeks (est.)"}

items:
  # Purchase inspection and weighing (system purchase)
  - {id: BI01, name: "Pre-purchase inspection at a Ford dealer: a scan with Ford's diagnostic tool for stored faults, the software level and any non-Ford flash, the DPF and AdBlue data, the frame, body mounts and tow bar for damage, and a road test", part_number: null, supplier: "Ford dealer", price_aud: 450, price_basis: estimate, link: null, status: build, system: purchase, source: "research report 31, the purchase", note: "About 2.5 h at about AUD 180 an hour (est.)", priority: P1, why: "Finds a damaged, tuned or faulty truck before money changes hands.", stage: S0, depends_on: []}
  - {id: BI02, name: "PPSR search for money owing, a write-off record or a theft record", part_number: null, supplier: "Personal Property Securities Register", price_aud: 2, price_basis: estimate, link: "https://www.ppsr.gov.au/", status: build, system: purchase, source: "research report 31, the purchase", note: "The register's search fee, not read this pass (est.)", priority: P1, why: "Proves the seller can sell the truck and it has no write-off record.", stage: S0, depends_on: []}
  - {id: CK01, name: "Public weighbridge, each axle, the truck as bought with a full tank", part_number: null, supplier: "Public weighbridge", price_aud: 30, price_basis: estimate, link: null, status: build, system: freight_weighing, source: "plan, the weighing rule of report 16", note: "AUD 30 a visit (est.). Ford publishes no kerb weight on each axle", priority: P1, why: "Real axle loads replace the estimates the box and the trailer's towball start from.", stage: S0, depends_on: [BI01]}

  # Towing kit and trailer charging (system towing)
  - {id: TW01, name: "Truck half of the trailer's DO45-type coupling: Cruisemaster's Tow Pin DO45Plus kit, 1 1/4 in (32 mm) shank, in Ford's standard 4.5 t hitch in the factory tow bar's receiver. plate4t confirms the coupling", part_number: "Tow Pin - DO45Plus Kit (1 1/4 in, 32 mm shank)", supplier: Cruisemaster, price_aud: 125, price_basis: listing, link: "https://cruisemaster.com.au/tow-pin-do45plus/", status: build, system: towing, source: "research report 31, the conductor's change of 23 Nov 2026 (the trailer plated at 4,000 kg)", note: "Cruisemaster's shop lists the kit at AUD 125, read 23 Nov 2026. The pin takes the place of a ball, so Ford's 70 mm ball is not bought. Ford's BEMM (03/2026) section 1.13: a shank must fit the hitch hole firmly, and the hitch must not be drilled or modified. If the trailer's coupling line already includes the pin, this line goes. 9.5 kg with the hitch (est.)", priority: P1, why: "Towing gear: the truck half of the 4,000 kg trailer's coupling, in the 4.5 t hitch Ford supplies with the truck.", stage: S1, depends_on: [S0], checked: "2026-11-23"}
  - {id: TW02, name: "A 4.5 t rated tongue with a 32 mm hole and the drop the laden coupling height needs, in place of Ford's hitch", part_number: null, supplier: "Hayman Reese or Cruisemaster stockist", price_aud: 350, price_basis: estimate, link: "https://cruisemaster.com.au/shop/do45", status: check, system: towing, source: "research report 31", priority: P1, why: "Bought only if Ford's hitch cannot take the pin firmly or puts the coupling at the wrong height.", check: "The pin's shank in Ford's 4.5 t hitch hole, and the coupling height with the truck laden and the trailer level", pass_mark: "No play in the hole (BEMM section 1.13) and the height inside the coupling's range (plate4t)", checked_at: S1, stage: S1, depends_on: [TW01]}
  - {id: TC01, name: "Trailer charging: two Victron Orion-Tr Smart 12/48-8 isolated chargers on Ford's 250 A alternator, in a vented cover in the bike box front, fed from the spare stud on Ford's power distribution block through a 100 A fuse and grounded at a Ford ground point, fitted", part_number: "Victron Orion-Tr Smart 12/48-8 (two), ANL 100 A holder and fuse, 2 B&S cable, 4-way MIDI holder with two 50 A fuses", supplier: "Solar4RVs, auto electrician", price_aud: 1611.70, price_basis: estimate, link: "https://www.solar4rvs.com.au/products/victron-12v-to-48v-orion-tr-8a-380w-isolated-charger", status: build, system: towing, source: "research/20-electrical.md (report 20), research report 31", note: "AUD 841.70 of listings (chargers 651.90, fuses and holders 54.60, cables 135.20, Solar4RVs, 20 Nov 2026) and AUD 770 estimated (mounting plate and cover 60, lugs and clips 60, auto electrician 5 h at AUD 130 an hour, TW06 included). 8.4 kg. 720 W, 3.6 kWh on a 5 h drive, about 62 A at 13 V. Ford's BEMM section 4.2: loads go to the vehicle ground, not the battery negative, because of the battery sensor, and high loads need a cut-off at 12.7 V, which the chargers' engine-off detection gives. The alternator gives 145 A at idle and 250 A from 2,500 rpm (BEMM 4.2.4)", priority: P1, why: "Keeps the trailer's battery, which also feeds its breakaway brakes, charged on travel days.", stage: S2, depends_on: [S1], checked: "2026-11-20"}
  - {id: TW06, name: "48 V charging feed to the tow bar: two inline MIDI holders with 23 A fuses on the chargers' outputs, 7 m of 4 B&S twin cable (20.27 mm2), a grey Anderson SB120 with 4 AWG contacts on a bracket at the tow bar, its dust cover, clips", part_number: "Exotronic MIDI in-line holder, 23 A MIDI fuse, 4 B&S twin, Anderson SB120 grey with 4 AWG contacts (The 12 Volt Shop CONH1204)", supplier: Solar4RVs, price_aud: 253.60, price_basis: listing, link: "https://www.solar4rvs.com.au/products/4b-s-20-29mm-twin-core-automotive-cable-per-metre", status: build, system: towing, source: "research/20-electrical.md (report 20), review finding I2-15", note: "Holders and fuses 21.60 read 20 Nov 2026 and the cable 175.00 at 25.00 a metre read 22 Nov 2026, Solar4RVs listings, the grey SB120 with its two 4 AWG contacts 22.00 (The 12 Volt Shop, https://www.12volt.com.au/sb120-anderson-120a-grey-connector-4awg-contacts, read 22 Nov 2026), its bracket and dust cover 15 (est.) and clips 20 (est.). The drop is worked on 21.2 mm2 at 2.12 mV/A.m (data/routes.yaml): 0.47 V, 1.0 % at 48 V at TC02's 32 A, so with the trailer half D-14 the feed holds 2 % (SVC-06). 4.2 kg (est.). The run on the Super Duty is shorter than 7 m (est.), and the length stays until the box's route is drawn. The grey housing does not mate with red 12 V plugs", priority: P1, why: "Carries the chargers' 48 V output to the trailer plug, sized for TC02's 32 A because the cable is the part that is hard to change later.", stage: S2, depends_on: [TC01], checked: "2026-11-22"}
  - {id: TC02, name: "Charging upgrade: two more Orion-Tr Smart 12/48-8 chargers, a 150 A ANL fuse in place of the 100 A, two 50 A MIDI fuses and 2 h of fitting", part_number: "Victron Orion-Tr Smart 12/48-8 (two)", supplier: "Solar4RVs, auto electrician", price_aud: 927.60, price_basis: estimate, link: "https://www.solar4rvs.com.au/products/victron-12v-to-48v-orion-tr-8a-380w-isolated-charger", status: check, system: towing, source: "research/20-electrical.md (report 20), research report 31", note: "Chargers 651.90 and fuses 15.70 (Solar4RVs listings, 20 Nov 2026), fitting 260 (est.). Charging doubles to 1,440 W, 7.2 kWh on a 5 h drive, drawing about 130 A. Ford's 250 A alternator needs no upgrade, unlike the LandCruiser's. The cables TC01 and TW06 fit are sized for it", priority: P3, why: "Bought only if the trailer ends travel days short of charge and the truck's voltage holds with two chargers.", check: "The truck's battery voltage with both chargers running on the first hot night tow, and the trailer battery's charge at the end of travel days", pass_mark: "Buy only if the trailer ends travel days short and the voltage stays at or above 13.5 V with two chargers", checked_at: S2, stage: S2, depends_on: [TC01]}

  # Mirrors, radio, compressor and recovery (system touring)
  - {id: TM01, name: "Clearview Next Gen towing mirrors, pair, raw finish, with heating, camera, power fold, blind spot monitor, outside temperature sensor and indicators, self-fitted", part_number: "CVNGFDRE22HVFSTJEX", supplier: ARB, price_aud: 1750, price_basis: listing, link: "https://www.arb.com.au/product/cvngfdre22hvfstjex-towing-mirrors-replacement-next-gen-raw-unpainted-heat-camera-power-fold-blind-spot-monitor-outside-air-temp-sensor-indicators-cat-6-electric-adjustment", status: build, system: touring, source: "research report 31", note: "ARB's listing, AUD 1,750, read 23 Nov 2026. Listed for the Next Gen Ranger and Everest. Assumed to fit the Super Duty, which shares their cab and doors. Confirm by VIN. 4.0 kg over the factory pair (est.)", priority: P1, why: "A legal view past the 2,400 mm trailer, wider than the truck's 2,197 mm mirror span, keeping the 360-degree camera and blind spot monitor.", stage: S1, depends_on: [S0], checked: "2026-11-23"}
  - {id: UH01, name: "UHF CB radio, 5 W, with an antenna on the front bar and its cable, self-fitted", part_number: null, supplier: "4WD or electronics store", price_aud: 650, price_basis: estimate, link: null, status: build, system: touring, source: "research report 31", note: "1.5 kg (est.)", priority: P1, why: "Talks to road trains and other travellers on remote roads, often out of mobile coverage.", stage: S1, depends_on: [S0]}
  - {id: AC01, name: "Portable 12 V air compressor rated past 65 psi, with a deflator", part_number: null, supplier: "ARB or 4WD store", price_aud: 450, price_basis: estimate, link: "https://www.ford.com.au/news/trucks-and-vans/ranger/super-duty/payload/", status: build, system: touring, source: "Ford's Super Duty payload guide, research report 31", note: "Ford's payload guide: at GVM the rear tyres need 65 psi, which some service station pumps cannot reach, so Ford suggests a portable compressor. About 7 kg in the box (est.), inside the tools allowance", priority: P1, why: "Sets the rear tyres to the 65 psi Ford asks for near GVM, and airs them down and back up off road.", stage: S1, depends_on: [S0]}
  - {id: RK01, name: "Recovery kit: 8 t snatch strap, two soft shackles, a tree trunk protector and a pair of recovery boards, carried in the box", part_number: null, supplier: "4WD store", price_aud: 500, price_basis: estimate, link: null, status: build, system: touring, source: "research report 31", note: "About 12 kg (est.), inside the box's 60 kg tools allowance", priority: P1, why: "Self-recovery off sealed roads, where the lockers alone may not free a loaded truck.", stage: S1, depends_on: [S0]}
  - {id: CK02, name: "Public weighbridge, each axle, the laden truck with the box, both bikes, tools and two people", part_number: null, supplier: "Public weighbridge", price_aud: 30, price_basis: estimate, link: null, status: build, system: freight_weighing, source: "plan, the weighing rule of report 16", note: "AUD 30 a visit (est.)", priority: P1, why: "Proves the GVM and both axles with the box and bikes aboard.", stage: S1, depends_on: [TW01]}
  - {id: CK03, name: "Public weighbridge, each axle, the laden truck alone and then coupled to the loaded trailer", part_number: null, supplier: "Public weighbridge", price_aud: 30, price_basis: estimate, link: null, status: build, system: freight_weighing, source: "plan, the weighing rule of report 16", note: "AUD 30 a visit (est.)", priority: P1, why: "Proves the axles, the GVM and the 8,000 kg GCM with the trailer coupled.", stage: S2, depends_on: [CK02]}
  - {id: BF01, name: "Ford dealer calibration of the rear camera, 360-degree view, parking aid and onboard scales after the box is fitted, if the check after fitting finds a fault", part_number: null, supplier: "Ford dealer", price_aud: 300, price_basis: estimate, link: null, status: check, system: touring, source: "Ford's BEMM (03/2026) sections 4.3 to 4.5", priority: P1, why: "Bought only if the box upsets the driver assistance sensors, which the BEMM says must stay at their factory places.", check: "The rear camera's image and guidelines, the 360-degree view, reverse brake assist, the blind spot monitor and the onboard scales, with the box on", pass_mark: "No warnings, and the onboard scales within Ford's 100 kg of the weighed payload", checked_at: S1, stage: S1, depends_on: [CK02]}

  # Turbo and intercooler (system power)
  - {id: PW01, name: "Garrett PowerMax direct-fit turbo for the 2022+ Ranger 3.0 V6 diesel, with its calibrated electric actuator, self-fitted", part_number: "930592-5001S (replaces MB3Q-6K682-AB)", supplier: "HD Automotive, Brisbane, authorised Garrett distributor", price_aud: 3300, price_basis: estimate, link: "https://www.garrettmotion.com/racing-and-performance/performance-catalog/turbo/2022-ford-ranger-3-0l-v6-diesel/", status: build, system: power, source: "research report 31 section 5", note: "No Australian price published (23 Nov 2026). Estimated from Falcon Turbos' hybrid for the same engine, GBP 1,560 with VAT, AUD 3,089, and Garrett's PowerMax for the older 3.2 L Ranger at about AUD 2,557. 27 % more compressor flow than Ford's turbo, ball bearing, turbine housing rated to 830 °C, shaft limit 186.2 krpm. Keep Ford's turbo for a return to stock", priority: P2, why: "The turbo for the power stage: Garrett, Ford's own turbo maker, with flow in hand at about 205 kW.", stage: S3, depends_on: [S2]}
  - {id: PW02, name: "Garrett PowerMax intercooler for the 2022+ Ranger and Everest 3.0 diesel, self-fitted", part_number: "Garrett PowerMax intercooler, 2022+ Ranger 3.0 diesel", supplier: "HD Automotive, Brisbane", price_aud: 1900, price_basis: estimate, link: "https://www.garrettmotion.com/racing-and-performance/performance-catalog/intercoolers/2022-ford-ranger-everest-3-0l-2-0l-diesel-2022-ranger-bronco-3-0l-gasoline/", status: build, system: power, source: "research report 31 section 5", note: "No Australian price published (est.). An intercooler that keeps the emission controls needs no certificate of its own (VSI 06 Rev 4 item 5)", priority: P2, why: "Cooler intake air under sustained towing at the higher power, which keeps EGT and soot down.", stage: S3, depends_on: [PW01]}
  - {id: PW03, name: "Turbo swap parts: gaskets, bolts, oil and coolant, and Garrett's shaft speed sensor", part_number: "Garrett 781328-0004 speed sensor", supplier: "HD Automotive, Ford dealer", price_aud: 450, price_basis: estimate, link: null, status: build, system: power, source: "research report 31", note: "Gaskets, bolts and fluids 200 and the sensor 250 (both est.)", priority: P2, why: "The parts for Leonard's turbo swap, and the sensor that proves on the dyno that the turbo stays under its speed limit.", stage: S3, depends_on: [PW01]}

  # Calibration, gauge, emissions test and certificate (system tune_legal)
  - {id: TL01, name: "Custom calibration of the engine and the 10-speed on a chassis dyno, with stock and tuned runs on the same dyno and the factory files kept", part_number: null, supplier: "Diesel tuner with a chassis dyno, for example Diesel Tuning Brisbane or Diesel Tuning Australia", price_aud: 2800, price_basis: estimate, link: "https://dieseltuningbrisbane.com.au/vehicle/ford-ranger-3-0-v6-2022-2025/", status: build, system: tune_legal, source: "research report 31 sections 5 and 8", note: "No price published (est.). Target about 205 kW at the crank, torque at most 650 Nm in high range and Ford's 600 Nm in low range, first and reverse, Ford's EGT limits, the DPF, SCR and EGR untouched", priority: P2, why: "The calibration that makes the power, with the 10-speed's shifts and torque limits set to match.", stage: S3, depends_on: [PW02, PW03]}
  - {id: TL02, name: "OBD gauge for EGT, boost, the 10-speed's temperature and coolant temperature", part_number: null, supplier: "Auto electrical or 4WD store", price_aud: 350, price_basis: estimate, link: null, status: build, system: tune_legal, source: "research report 31", note: "Reads Ford's own sensors, so nothing is drilled", priority: P2, why: "Shows the temperatures the calibration must hold on a long tow, so the driver backs off before heat does damage.", stage: S3, depends_on: [S2]}
  - {id: TL04, name: "Emissions test to the Interim NSW Vehicle Emissions Test Procedure for Modified and Individually Constructed Vehicles (May 2023)", part_number: null, supplier: "TfNSW emission testing facility or a NATA facility", price_aud: 500, price_basis: estimate, link: "https://www.nsw.gov.au/sites/default/files/noindex/2026-03/vsi-06-light-vehicle-modification-july-2026.pdf", status: build, system: tune_legal, source: "VSI 06 Rev 4 item 5 note, research report 31 section 7", note: "Report 14 read the 2013 VSI 06 as a free TfNSW test, and Rev 4 names no fee, so AUD 500 is assumed (est.)", priority: P2, why: "The emissions evidence VSI 06 Rev 4 accepts in place of testing to the standard.", stage: S3, depends_on: [TL01]}
  - {id: TL05, name: "VSCCS certificate for the engine modification (VSB 14 code LA4) from an LC4 certifier, with its noise test", part_number: null, supplier: "LC4 licensed certifier", price_aud: 2000, price_basis: estimate, link: "https://nsw.gov.au/sites/default/files/2025-01/vsccs-bulletin-01-licensed-certifiers.pdf", status: build, system: tune_legal, source: "VSI 06 Rev 4 items 2 and 6, report 14 section 4.2", note: "Certifiers publish no fees (est., report 14). The written evidence list comes first, before the parts are bought", priority: P2, why: "Every tune of this truck needs a certificate in NSW (VSI 06 Rev 4 item 6), and this one also raises power over 20 % (item 2).", stage: S3, depends_on: [TL04]}
  - {id: TL07, name: "Laboratory emissions test to the standard the truck was built to, if the certifier asks for one", part_number: null, supplier: "NATA laboratory", price_aud: 10000, price_basis: estimate, link: null, status: check, system: tune_legal, source: "report 14, research report 31 section 7", priority: P2, why: "Bought only if the LC4 certifier will not take the interim NSW procedure for a heavy-duty Euro VI calibration.", check: "The LC4 certifier's written evidence list", pass_mark: "The list accepts the interim NSW procedure (TL04)", checked_at: S3, stage: S3, depends_on: [TL01]}
  - {id: TX01, name: "Larger cooler for the 10-speed, fitted, if it runs hot on a tow after the power stage", part_number: null, supplier: "Transmission or 4WD workshop", price_aud: 900, price_basis: estimate, link: null, status: check, system: power, source: "research report 31 section 6", priority: P2, why: "Bought only if the 10-speed runs hot at the higher power.", check: "The 10-speed's temperature on the OBD gauge (TL02) on a long tow up a grade", pass_mark: "At most 110 °C sustained (est.)", checked_at: S3, stage: S3, depends_on: [TL02]}

  # Optional extras (not counted)
  - {id: OP01, name: "Super Duty compatible steel bull bar with a winch mount and a 12 V winch, only if Leonard wants a winch", part_number: null, supplier: "Ford dealer (ARB Ford Licensed Accessories)", price_aud: 5000, price_basis: estimate, link: "https://tddashboard.s3.ap-southeast-2.amazonaws.com/1786437442-ford-ranger-super-duty-brochure.pdf", status: optional, system: protection, source: "Ford's Super Duty accessories brochure, research report 31", note: "The BEMM supports only Super Duty compatible bars and asks for the camera calibration after fitting one. The factory frame-mounted steel bar stays otherwise", priority: P3, why: "A winch for solo recovery, which the plan does not need with the lockers and the recovery kit.", stage: S1, depends_on: [S0]}
  - {id: OP02, name: "Ford heavy-duty rock sliders", part_number: null, supplier: "Ford dealer", price_aud: 1500, price_basis: estimate, link: null, status: optional, system: protection, source: "Ford's dealer specification sheet, factory options", note: "A factory option on a new truck. About 25 kg (est.)", priority: P3, why: "Protects the sills on rocky tracks, which the trailer's routes rarely need.", stage: S1, depends_on: [S0]}
  - {id: OP03, name: "LED driving lights, pair, on the front bar", part_number: null, supplier: "4WD store", price_aud: 900, price_basis: estimate, link: null, status: optional, system: protection, source: "research report 31", note: "About 5 kg (est.)", priority: P3, why: "Longer reach at night, on top of the LED headlamps and fog lamps the truck has.", stage: S1, depends_on: [S0]}
  - {id: PW04, name: "Freight on the turbo and intercooler from Brisbane", part_number: null, supplier: "HD Automotive", price_aud: 120, price_basis: estimate, link: null, status: build, system: freight_weighing, source: "plan", note: "Est.", priority: P2, why: "Freight on the power stage's parts.", stage: S3, depends_on: []}

# The LandCruiser VDJ79 lists this file held until 22 Nov 2026 (decision H24), replaced by the Super Duty (research
# report 31). Each list is one row here, and every line is in the git history. Not counted anywhere.
removed:
  - {name: "LandCruiser build: engine rebuild, injectors, clutch, turbo, intercooler, exhaust, tune and certificate, the Lovells Elite GVM kit and GCM revision, wheels and tyres, towing gear and trailer charging", price_aud: 67703, source: "VEHICLE.md and this file to 22 Nov 2026", reason: "The Super Duty comes with Ford's 4,500 kg GVM, 8,000 kg GCM, 4.5 t tow bar, trailer brake controller and a new engine, so none of the rebuild or the kits is needed (report 31)"}
  - {name: "LandCruiser build allowance, 10 % of listed prices and 20 % of estimates", price_aud: 10074, source: "VEHICLE.md to 22 Nov 2026", reason: "Went with the build it covered"}
  - {name: "LandCruiser purchase check list, if every line failed", price_aud: 53956, source: "VEHICLE.md to 22 Nov 2026", reason: "A 400,000 km truck's wear items. A near-new truck under Ford's warranty has none due"}
  - {name: "LandCruiser optional extras: lockers, bar and winch, X-Bar, 180 L tank and others", price_aud: 12070, source: "VEHICLE.md to 22 Nov 2026", reason: "The Super Duty has lockers, a steel front bar and a 130 L tank from Ford, and the rest are listed again only where the Super Duty would use them"}

# Cuts that keep it reliable. Each applies only if its condition holds. A cut saves its line and that line's
# share of the allowance.
cuts:
  - {id: CUT1, name: "Tune on Ford's turbo to about 184 kW, the ordinary Ranger's rating, keeping the PowerMax intercooler", replaces: PW01, saving_aud: 3300, risk: "Low for the engine, as Ford rates it at 184 kW in the ordinary Ranger. About 155 kW at the wheels, 208 hp (est.), in place of about 173 kW. Still needs the certificate (VSI 06 Rev 4 item 6)", source: "research report 31 section 8"}

# Outside the vehicle work. The box has its own priced parts list, so its total is not typed here.
bike_box: {parts_list: "data/ute/box-parts.yaml", doc: UTE-GARAGE.md, note: "Leonard builds the box, so it has one total, worked out from its parts list. It is not certified (decision H25)"}

# Totals, AUD rounded to the dollar, worked out from the lines on 23 Nov 2026. They match VEHICLE.md
# (cad/tests/test_costs.py checks both). build_budget is Leonard's planning figure for the car work (data/project.yaml).
# allowance_pct is the build's one allowance, by price basis. The check list carries none and is not a total.
totals_aud:
  build_budget: 75000
  allowance_pct: {listing: 10, estimate: 20}
  build_by_system: {purchase: 452, freight_weighing: 210, towing: 1990, touring: 3350, power: 5650, tune_legal: 5650}
  build: 17302
  build_listed: 2129
  build_estimated: 15174
  contingency_allowance: 3248
  build_plus_contingency: 20550
