  - {id: ID03, name: "New DPF, only if the filter is cracked or melted", part_number: "by VIN", supplier: "Toyota dealer or DPF specialist", price_aud: 5000, price_basis: estimate, link: "https://dpfcleaningservices.com.au/", status: check, system: intake_dpf, source: "plan, because level A's emissions evidence needs a working DPF (decision log 12:45)", note: "Midpoint of the AUD 3,000 to 7,000 fitted that the same specialist quotes for a new DPF. Not carried in the contingency allowance", priority: P1, why: "Bought only if the clean finds the filter cracked or melted.", check: "The specialist's inspection and flow test at the clean (ID02), after the S0 scan-tool data (VEH-08)", pass_mark: "Passes the flow test with no cracked or melted cells", checked_at: S6, stage: S6, depends_on: [ID02]}

