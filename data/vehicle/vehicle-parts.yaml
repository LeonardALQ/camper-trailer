  # GVM kit, GCM revision, fitting and certification (system gvm). The kit is confirmed at the gate, stage S3
  - {id: GV01, name: "Lovells 4,200 kg Platinum GVM upgrade kit, single cab 2017 to 2022", part_number: TOYKIT080-GVM, supplier: "Lovells, through an authorised fitter (for example Fulcrum Suspensions)", price_aud: 5620, price_basis: estimate, link: "https://fulcrumsuspensions.com.au/search/product/gvm-btc-upgrade-kits/lovells-gvm-btc-upgrade-kits-for-2017-toyota-land-cruiser-79-series/brand-LOVELLS", status: build, system: gvm, source: "report 16", note: "Price from a 2024 Fulcrum preorder listing (stock due 28/07/24), seen in a search result. Axles 1,650 and 2,550 kg. Coils, leaf packs, remote-reservoir shocks, urethane bushes, U-bolts, greasable shackles and pins, mudflaps, indicators, placard. Re-checked 20 Nov 2026: Fulcrum's page blocks automated reads and no other listing was found, so the estimate stands. Lovells' Oct 2026 ratings sheet confirms 4,200 kg GVM, 7,400 kg GCM and 1,650 and 2,550 kg axles (https://www.lovellscampbellfield.com.au/_files/ugd/a7ab81_cd324b9c9e354c4da0d3ab9103620a6d.pdf). With GV05 required (decision H17), this line and GV02 are the Platinum's share of the Elite's AUD 19,975 fitted price", priority: P1, why: "The GVM kit: the Platinum's share of the Elite's fitted price.", stage: S4, depends_on: [S3, WT02, SS05], checked: "2026-11-20"}
  - {id: GV02, name: "Fitting by a Lovells authorised fitter", part_number: null, supplier: "Lovells authorised fitter", price_aud: 1500, price_basis: estimate, link: "https://www.powercurve.com.au/lovells-gvm-upgrade-sunshine-coast/toyota-landcruiser-lc79-series-gvm/", status: build, system: gvm, source: "report 16", priority: P1, why: "Lovells lets only its authorised fitters fit the kit for state compliance.", stage: S4, depends_on: [GV01]}
  - {id: GV03, name: "NSW VSCCS certification of the GVM kit, the GCM revision and, if fitted, the 180 L tank in one LC5 inspection, after registration", part_number: null, supplier: "Lovells-endorsed VSCCS certifier, category LC5", price_aud: 1500, price_basis: estimate, link: "https://70seriesstore.com/blogs/information/what-is-the-79-series-towing-gcm", status: build, system: gvm, source: "report 16, scope from the decision log (12:45)", note: "Within the AUD 1,000 to 2,500 range quoted for the GVM. One inspection covers the kit, the GCM revision (GV06), the ride height (item 13) and, if it is fitted, the optional 180 L tank (FT01, item 50). Leonard builds the bike box and its winch himself and does not certify them (decision H25). The certifier also plates the Elite at a 4,450 kg GVM and a 2,800 kg rear axle, twice the ROH wheel's 1,400 kg, the derate Lovells offers on its 4,200 kg kit, at no extra cost (decision H18, assumption)", priority: P1, why: "Makes the GVM kit and the GCM revision legal (VSI 06 Rev 4 item 51).", stage: S4, depends_on: [GV02, GV04, TW01]}
  - {id: GV04, name: "Wheel alignment and LSPV reset, with the kit and the bike box fitted", part_number: null, supplier: "Alignment or brake shop with Toyota gauge set 09709-29018", price_aud: 250, price_basis: estimate, link: "https://myfleet.toyota.com.au/customer/userfiles/LC70BBG.pdf", status: build, system: gvm, source: "report 16", note: "Covers the steering and front bush work of step 8 and Toyota's rule that the LSPV is readjusted once a body is complete, so report 15's separate alignment and a second LSPV check are dropped", priority: P1, why: "Resets the rear brake balance for the new axle load and aligns the wheels after the kit.", stage: S4, depends_on: [GV02]}
  - {id: GV05, name: "Lovells 4,495 kg Elite in place of GV01 and GV02, net extra", part_number: null, supplier: Lovells, price_aud: 12855, price_basis: listing, link: "https://unsealed4x4.com.au/lovells-elite-series-79-series-gvm-upgrade/", status: build, system: gvm, source: "report 16, decision H17", note: "AUD 19,975 fitted, so GV01 and GV02 are the Platinum's share of that price. GVM 4,495 kg, axles 1,650 and 2,850 kg, GCM 7,400 kg (report 16 section 2.3). Lovells-built wide-track rear housing to match the front track, chrome-moly axles, exchange diff, brake upgrade. Required from 21 Nov 2026 (decision H17): the trailer's heaviest towball with growth is 317 kg, and on the model with growth the Platinum's 2,550 kg rear axle would carry about 2,575 kg. Cut CUT7 returns to the Platinum on the S3 weighing. Its front and rear brake kits, booster and handbrake kit replace BR01 to BR04 (report 26). Plated at a 4,450 kg GVM and a 2,800 kg rear axle, twice the ROH wheel's 1,400 kg, in GV03 (decision H18). Its housing gives a 1,555 mm rear track (est.), so the box's rear tub flares reach 1,890 mm (decision H19) and Lovells' two mudflaps move out 47.5 mm with the tyres", priority: P1, why: "The Elite kit the home trailer's towball needs (decision H17).", stage: S4, depends_on: [S3]}
  - {id: GV06, name: "Lovells 7,400 kg GCM revision, certified after registration with the GVM kit in the same LC5 inspection", part_number: null, supplier: "Lovells-endorsed VSCCS certifier, category LC5", price_aud: 1750, price_basis: estimate, link: "https://70seriesstore.com/blogs/information/what-is-the-79-series-towing-gcm", status: build, system: gvm, source: "plan (report 23), decision H2", note: "Lovells rates the 4,200 kg kit at 7,400 kg GCM with 3,500 kg braked towing and warns the revision may not be available after registration in every state (Lovells sheet, Oct 2026). Report 16 gives the 4,495 kg Elite (GV05) the same 7,400 kg GCM. NSW lists GCM re-rating as certifiable (VSI 06 Rev 4 item 51). Price is the midpoint of the AUD 1,000 to 2,500 that 70 Series Store gives for post-registration GCM engineering. Conditions: tyres of load index 117 and speed M or better, a 3,500 kg and 350 kg towbar, braked towing stays 3,500 kg. If refused, the trailer is plated at 6,900 kg less the ute with growth and tows with less water, so the combination stays within 6,900 kg (decision H20, the trailer's CT-003)", priority: P1, why: "Raises the GCM to 7,400 kg, which the loaded ute and the 3,500 kg trailer need together.", stage: S4, depends_on: [GV03], checked: "2026-11-20"}

