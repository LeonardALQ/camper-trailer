# Merged parts and jobs list for the LandCruiser 79 vehicle plan (VEHICLE.md), 20 Nov 2026.
# Truck: VDJ79 single cab built 01/2017 to 08/2022 (DPF engine). Power level B: about 230 to 250 kW
# at the crank, at least 224 kW (300 hp), from the start (decision log 20:15).
# Merges engine-parts.yaml (report 14, DPF variant), driveline-parts.yaml (report 15)
# and ute-parts.yaml (report 16). The "removed" list shows what the merge dropped or moved.
# Revised 20 Nov 2026 after an independent review of the plan and the decision
# log entries of 12:10 and 12:45. Lines this plan adds: TL05, ID02, ID03, FR01, CK01, BW01, BW02.
# price_aud: AUD including GST, the line total (qty x unit_aud where qty is given).
# price_basis: listing (read from a supplier or regulator page) or estimate.
# status: required, contingency (only if the inspection or a test calls for it) or optional.
# Net-extra lines replace a required line and carry only the difference.
# source: the report the line comes from. "plan" marks a line or price this plan adds.
# Totals at the end are rounded to the dollar and match VEHICLE.md.

