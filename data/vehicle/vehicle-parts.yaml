  - {id: TX01, name: "GTurbo VD-G333 Titan turbo, journal bearing, stainless actuator", part_number: "T T VD-G333T (web SKU), T T 1VD-FTV S2.5B (booklet)", supplier: GTurbo, price_aud: 4290, price_basis: listing, link: "https://gturbo.com.au/products/toyota-landcruiser-vd-g333-titan", status: required, system: turbo_exhaust, source: "report 14", note: "Web listing read 20 Nov 2026. Booklet pages 13 to 15", priority: P2, why: "Moves the air for 224 kW and more at a lower exhaust temperature than the factory turbo.", stage: S6, depends_on: [S2, EN14], checked: "2026-11-20"}
