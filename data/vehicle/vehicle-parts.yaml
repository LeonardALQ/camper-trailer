  - {id: WT04, name: "Toyota genuine 16 x 7 ET 0 alloy wheels on all ten wheels (the ute, the trailer and both spares) in place of the ROH Trak 2, net extra, only if the LC5 certifier refuses the 2,800 kg plate or the Elite's front caliper fouls the steel wheel", part_number: "by VIN", supplier: "Toyota dealer", qty: 10, unit_aud: 320, price_aud: 3200, price_basis: estimate, link: null, status: check, system: wheels_tyres, source: "Report 26, the Elite kit's wheels and brakes research of 21 Nov 2026, decision H18", note: "Ten alloys at about AUD 550 new against ten Trak 2 at AUD 230 (both est.). Used sets list at about AUD 316 a wheel. Alloy-wheel nuts at 131 Nm, and the trailer's LC5 studs are ordered for the alloy's thicker mounting pad. About 0.5 kg more a wheel (est.)", priority: P1, why: "Bought only if the certifier refuses the 2,800 kg plate or the Elite's caliper fouls the steel wheel.", check: "Lovells' written word at S0 that its certifier plates the Elite at 2,800 kg on the ROH wheels, then the dry fit of a Trak 2 at S4", pass_mark: "Confirmed in writing, and 3 mm or more from the caliper (est.)", checked_at: S0, stage: S4, depends_on: [GV05]}

