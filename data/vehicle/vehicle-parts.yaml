# Parts and jobs list for the LandCruiser 79 car build (VEHICLE.md), sorted into three lists by decision H24 on
# 22 Nov 2026 (research report 27). Truck: VDJ79 single cab built 01/2017 to 08/2022 (DPF engine). Power level B: about
# 230 to 250 kW at the crank, never below 224 kW (300 hp). Trailer plated at 3,500 kg with Lovells' 7,400 kg GCM (H2).
# The site's Car build page renders the three lists and the totals from this file (cad/sitedata.py), and
# cad/tests/test_costs.py checks that the totals below and VEHICLE.md match the lines.
# status, the list a line is on:
#   build     the upgrades and what makes them legal and able to tow. Priced and counted, with one allowance.
#   check     the purchase check list: wear and age items that may still be good or already replaced, and every line
#             bought only if a test, an inspection or a certifier calls for it. Not counted, and no allowance. check
#             says what to look at, checked_at the stage it is looked at, pass the pass mark where one exists, and
#             price_aud the price if it fails.
#   optional  extras the plan does not need. Not counted.
# why: the one-line reason the line is on its list.
# priority: P1 legal, safe and able to tow, or protecting the truck. P2 the 224 kW minimum. P3 optional or comfort.
# stage: the stage that buys and fits the line, or for a check line the stage it is fitted in if it fails.
# depends_on: line or stage ids that must come first. checked: the date the price was re-checked against its listing.
# price_aud: AUD including GST, the line total (qty x unit_aud where qty is given). price_basis: listing or estimate.
# Net-extra lines replace another line and carry only the difference.
# Earlier history: report 23 (20 Nov 2026), and decisions H17 and H18 (21 Nov 2026): the Elite kit (GV05), its 4,450 kg
# GVM and 2,800 kg rear axle plate for the shared 1,400 kg ROH wheels (GV03, WT01), Toyota's alloys as the fallback
# (WT04), and the Elite's own brakes in place of BR01 to BR04. Lines that left the list are under removed, with the reason.

stages:
  - {id: S0, name: "Buy, inspect and baseline", can_do: "Daily driver as bought", order_a: 0, order_b: 0, work: "Buy, run the purchase check list and the baseline tests, weigh, engage certifiers", labour: "Diesel workshop, weighbridge", downtime: "1 day"}
  - {id: S1, name: "Refresh what the inspection found", can_do: "Reliable daily driver at stock power. Tows only within Toyota's 3,400 kg GVM and 6,900 kg GCM, on a rated factory bar if fitted", order_a: 1, order_b: 1, work: "Replace only what the S0 check list failed", labour: "Whatever the failed lines need, for example a driveline shop", downtime: "None to 3 weeks, by what fails"}
  - {id: S2, name: "Engine rebuild with the clutch", can_do: "As after S1, on a rebuilt engine once the 1,000 km run-in is done", order_a: 2, order_b: 5, work: "Factory-spec engine rebuild, NPC clutch on the truck's own H152F, new radiator, sealed airbox and pre-filter", labour: "Machine shop", downtime: "6 to 10 weeks, then a 1,000 km run-in"}
  - {id: S3, name: "Decision gate: box body built and weighed, kit confirmed", can_do: "Unchanged, the box body is built off the ute", order_a: 3, order_b: 2, work: "Gate: build and weigh the box body, confirm the kit", labour: "None, Leonard builds and weighs the box body", downtime: "None"}
  - {id: S4, name: "GVM kit, GCM revision, towing gear and one LC5 inspection", can_do: "Carries both bikes in the box at stock power and, once certified, tows up to 3,500 kg within the 7,400 kg GCM", order_a: 4, order_b: 3, work: "Wheels, tyres, front bushes, the Elite GVM kit with its own brakes, the box fitted, towing gear, one LC5 inspection with the GCM revision and the 2,800 kg plate", labour: "Lovells fitter, tyre shop, alignment, certifier", downtime: "2 to 3 weeks"}
  - {id: S5, name: "Trailer integration", can_do: "Tows the loaded trailer at stock power with charging, proven on the weighbridge", order_a: 5, order_b: 4, work: "Gauges, trailer charging, tongue, final weighing", labour: "Weighbridge, auto electrician", downtime: "1 week"}
  - {id: S6, name: "Power: turbo, intercooler, exhaust, injectors, then the tune and its certificate", can_do: "Tows the trailer with the box at level B, at least 224 kW", order_a: 6, order_b: 6, work: "Turbo, intercooler, exhaust, the Pro 100 injectors and the DPF clean, then the tune and its certificate", labour: "GTurbo (injectors), DPF specialist, tuner, emissions test, LC4 certifier", downtime: "2 to 4 weeks"}

