  - {id: TC01, name: "Trailer charging: two Victron Orion-Tr Smart 12/48-8 isolated chargers on the stock alternator, in a vented cover in the bike box front, with their 12 V wiring and fuses, fitted", part_number: "Victron Orion-Tr Smart 12/48-8 (two), ANL 100 A holder and fuse, 2 B&S cable, 4-way MIDI holder with two 50 A fuses", supplier: "Solar4RVs, auto electrician", price_aud: 1611.70, price_basis: estimate, link: "https://www.solar4rvs.com.au/products/victron-12v-to-48v-orion-tr-8a-380w-isolated-charger", status: required, system: towing, source: "research-20-electrical.md (R20), car build lines TC01 and TW06", note: "AUD 841.70 of listings (chargers 651.90, fuses and holders 54.60, cables 135.20, Solar4RVs, 20 Nov 2026) and AUD 770 estimated (mounting plate and cover 60, lugs and clips 60, auto electrician 5 h at AUD 130 an hour, TW06 included). 8.4 kg. 720 W, 3.6 kWh on a 5 h drive, about 62 A from the ute at 13 V. Replaces the AUD 3,500 placeholder", priority: P1, why: "Keeps the trailer's batteries, which also feed its breakaway brakes, charged on travel days.", stage: S5, depends_on: [RF04, S4], checked: "2026-11-20"}
  - {id: TC02, name: "Charging upgrade: Jaylec BKS-240LC 240 A alternator in place of the factory type, two more Orion-Tr Smart 12/48-8, a 150 A ANL fuse, two 50 A MIDI fuses and 2 h of fitting", part_number: "Jaylec BKS-240LC, Victron Orion-Tr Smart 12/48-8 (two)", supplier: "Marks 4WD, Solar4RVs, auto electrician", price_aud: 1722.60, price_basis: estimate, link: "https://www.marks4wd.com/engine/alternators/", status: optional, system: towing, source: "research-20-electrical.md (R20), upgrade path", note: "Alternator 795 (Marks 4WD, AUD 722.73 before GST, 20 Nov 2026), chargers 651.90, fuses 15.70 (listings), fitting 260 (est.). Charging doubles to 1,440 W, 7.2 kWh on a 5 h drive, drawing about 130 A from an alternator that gives 218 A hot. The cables TC01 and TW06 fit are sized for it. Confirm the fit against the VIN. Replaces RF14", priority: P3, why: "Doubles the charge a travel day puts into the trailer, if the voltage log shows the stock alternator cannot carry two chargers or travel days need more than about 3.6 kWh.", stage: S5, depends_on: [TC01]}

