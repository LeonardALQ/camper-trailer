# Cuts that keep it reliable. Each applies only if the old part passes its test.
cuts:
  - {id: CUT1, name: "Test and reuse the eight piezo injectors", replaces: FS01, job: {name: "Injector test and service by a Denso diesel specialist, eight", supplier: "Denso diesel specialist", price_aud: 1600, price_basis: estimate, source: "report 14"}, saving_aud: 7656, risk: "A worn injector can fail early on the fresh engine. If any fails the test, buy the new set. At level B the factory injectors run near their flow limit, so a tested set has less margin than a new one. Report 14's price is for the earlier solenoid injectors"}
  - {id: CUT2, name: "Bench-test and reuse the supply pump", replaces: FS03, saving_aud: 1480, risk: "A worn pump sheds metal through the injectors and back to the tank. Test assumed in CUT1's job", source: "report 14"}
  - {id: CUT4, name: "Measure and reuse the oil pump", replaces: EN03, saving_aud: 700, risk: "Low, if it measures within spec", source: "report 14"}
  - {id: CUT5, name: "Rebuild the truck's own H152F gearbox", replaces: CG09, job: {name: "Marks 4WD gearbox rebuild kit GBK9 (AUD 840.88) and a genuine input shaft seal, HD Automotive R000028 (AUD 16.50)", part_number: "GBK9, R000028", supplier: "Marks 4WD, HD Automotive", price_aud: 857.38, price_basis: listing, link: "https://www.marks4wd.com/driveline/gearbox/", source: "report 15"}, saving_aud: 2982.62, risk: "The best case. Fit of GBK9 to the H152F is not confirmed, as its title names the LandCruiser 70, 75, 100 and 105 Series five-speed from 1998. Worn second-to-third synchros can need hubs, sleeves or gears beyond the kit. Reuses 400,000 km shafts and gears under about 850 Nm"}
  - {id: CUT6, name: "Keep a factory towbar rated 3,500 kg and 350 kg, if fitted", replaces: TW01, saving_aud: 1160, risk: "Low, if the rating plate reads 3,500 kg and 350 kg and the mounts and receiver show no cracks", source: "decision log, report 16"}
  - {id: CUT7, name: "Return to the Lovells 4,200 kg Platinum kit (GV01 and GV02 without the Elite)", replaces: GV05, saving_aud: 12855, risk: "Taken only if the S3 weighing leaves at least 30 kg under the Platinum's 2,550 kg rear axle at the trailer's weighed towball (decision H17). The model forecasts about 99 kg under on base masses (the trailer's MAS-14) but about 24 kg over with growth, so only weighed figures can justify it. The Platinum keeps the factory rear housing, axles and diff under the 3,500 kg trailer, and an Elite bought after a fitted Platinum loses the Platinum's cost", source: "decision H17"}

