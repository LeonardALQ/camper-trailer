# Parts and jobs list for the LandCruiser 79 car build (car/VEHICLE.md), revised by R23 on 20 Nov 2026.
# Truck: VDJ79 single cab built 01/2017 to 08/2022 (DPF engine). Power level B: about 230 to 250 kW at the
# crank, never below 224 kW (300 hp). Trailer plated at 3,500 kg with Lovells' 7,400 kg GCM (decision H2).
# Built from the earlier data/vehicle/vehicle-parts.yaml. Existing fields are unchanged except where a line's note says so.
# The site's Car build page renders every line and the totals from this file (cad/sitedata.py), and
# cad/tests/test_costs.py checks that the totals below and VEHICLE.md match the lines.
# New fields on every line:
#   priority: P1 needed for the ute to be safe, legal and reliable when towing the 3,500 kg trailer with the box,
#             or to protect a 400,000 km truck. P2 needed for the 224 kW minimum. P3 optional, comfort or a cost cut.
#   why: the failure the line prevents or what it enables, in one sentence.
#   stage: the stage that buys and fits it (see stages). depends_on: line or stage ids that must come first.
#   checked: the date the price was re-checked against the listing, where it was.
# price_aud: AUD including GST, the line total (qty x unit_aud where qty is given).
# price_basis: listing (read from a supplier or regulator page) or estimate.
# status: required, contingency (only if a test calls for it) or optional.
# Net-extra lines replace a required line and carry only the difference.
# Lines added by R23: BI01, GV06, TW08, TC01, FR02, FR03, CK03. FR01 and CK01 are split by stage.
# CG11 is now required. EN14 is re-priced from its listing.
# Conductor's rulings, 20 Nov 2026: TC01 and TW06 are R20's (the trailer's electrical research), replacing the AUD 3,500
# placeholder. TC02 is R20's upgrade and replaces RF14. FT01 is required. GV03 is the one LC5 inspection for the kit,
# the GCM revision, the box, the winch and the tank, so the box's parts list has no inspection line.
# Decision H17, 21 Nov 2026: GV05, the Lovells Elite kit, is required, and cut CUT7 returns to the Platinum if the S3
# weighing leaves at least 30 kg under its 2,550 kg rear axle at the trailer's weighed towball.

stages:
  - {id: S0, name: "Buy and baseline", can_do: "Daily driver as bought", order_a: 0, order_b: 0, work: "Buy, baseline tests, weigh, engage certifiers", labour: "Diesel workshop, weighbridge", downtime: "1 day"}
  - {id: S1, name: "Refresh and protect at stock power", can_do: "Reliable daily driver at stock power. Tows only within Toyota's 3,400 kg GVM and 6,900 kg GCM, on a rated factory bar if fitted", order_a: 1, order_b: 1, work: "Driveline and chassis refresh, sealed airbox, DPF clean, new cooling, gauges", labour: "Tailshafts, DPF clean, air conditioning", downtime: "2 to 3 weeks"}
  - {id: S2, name: "Engine rebuild with the clutch and new gearbox", can_do: "As after S1, on a rebuilt engine once the 1,000 km run-in is done", order_a: 2, order_b: 5, work: "Factory-spec engine rebuild, new injectors and pump, NPC clutch, new H152F", labour: "Machine shop", downtime: "6 to 10 weeks, then a 1,000 km run-in"}
  - {id: S3, name: "Decision gate: box body built and weighed, kit confirmed", can_do: "Unchanged, the box body is built off the ute", order_a: 3, order_b: 2, work: "Gate: build and weigh the box body, confirm the kit", labour: "Box engineer (box budget)", downtime: "None"}
  - {id: S4, name: "GVM kit, GCM revision, box, towing gear and one LC5 inspection", can_do: "Carries both bikes in the box at stock power and, once certified, tows up to 3,500 kg within the 7,400 kg GCM", order_a: 4, order_b: 3, work: "Brakes, wheels, tyres, steering, Elite GVM kit, 180 L tank, box, towing gear, one LC5 inspection with the GCM revision", labour: "Lovells fitter, tyre shop, alignment, certifier", downtime: "2 to 3 weeks"}
  - {id: S5, name: "Trailer integration", can_do: "Tows the loaded trailer at stock power with charging, proven on the weighbridge", order_a: 5, order_b: 4, work: "Trailer charging, tongue, final weighing", labour: "Weighbridge, auto electrician", downtime: "1 week"}
  - {id: S6, name: "Power: turbo, intercooler, exhaust, then the tune and its certificate", can_do: "Tows the trailer with the box at level B, at least 224 kW", order_a: 6, order_b: 6, work: "Turbo, intercooler, exhaust, then the tune and its certificate", labour: "Tuner, emissions test, LC4 certifier", downtime: "2 to 4 weeks"}

items:
  # Engine rebuild, cooling and baseline tests (system engine)
  - {id: EN01, name: "NVP engine rebuild kit, 1VD-FTV 70 Series, with the DPF engine's genuine gasket set", part_number: "NVP kit, sizes ordered after machining. DPF engine gasket set by VIN", supplier: "GTurbo (North Vic Parts)", price_aud: 2471, price_basis: estimate, link: "https://gturbo.com.au/products/nvp-engine-rebuild-kit-toyota-1vd-ftv-70-series", status: required, system: engine, source: "report 14, priced as an estimate for the DPF engine (decision log 12:45)", note: "Listed at AUD 2,470.68 for pre-DPF engines with the injectors inside the rocker cover only. Assumed the same parts and price with the DPF engine's genuine gasket set, ordered by VIN. Pistons, rings, both main seals, grade 5 head gaskets, bearings, thrust washers, TTY head bolts. Re-checked 20 Nov 2026: still AUD 2,470.68 and still listed for pre-DPF engines only", priority: P1, why: "New pistons, rings, bearings and grade 5 head gaskets restore a 400,000 km engine before it is asked for about 850 Nm.", stage: S2, depends_on: [EN07, EN10, EN11], checked: "2026-11-20"}
  - {id: EN02, name: "Timing set: chains, tensioners, guides, genuine", part_number: "13506-51020, 13540-51020, 13559-51010, 13561-51020 (confirm by VIN)", supplier: "Toyota dealer", price_aud: 900, price_basis: estimate, link: "https://tr.aliexpress.com/w/wholesale-1vd-ftv.html", status: required, system: engine, source: "report 14", priority: P1, why: "A stretched chain or worn tensioner at 400,000 km can jump a tooth and destroy the engine.", stage: S2, depends_on: [S0]}
  - {id: EN03, name: "Oil pump, genuine", part_number: "by VIN", supplier: "Toyota dealer", price_aud: 700, price_basis: estimate, link: "https://gturbo.com.au/products/1vd-ftv-5-0l-stroker", status: required, system: engine, source: "report 14", note: "Cut CUT4 reuses it if it measures within spec", priority: P1, why: "A worn oil pump starves the new bearings and the turbo of oil pressure.", stage: S2, depends_on: [S0]}
  - {id: EN04, name: "Glow plugs, set of eight, genuine", part_number: "by VIN", supplier: "Toyota dealer", price_aud: 400, price_basis: estimate, link: null, status: required, system: engine, source: "report 14", priority: P1, why: "The compression test takes the old glow plugs out, so new ones go back in, and tired plugs cause hard cold starts and white smoke.", stage: S0, depends_on: [BI01]}
  - {id: EN05, name: "Engine mounts, pair, genuine", part_number: "by VIN", supplier: "Toyota dealer", price_aud: 350, price_basis: estimate, link: null, status: required, system: engine, source: "report 14", priority: P1, why: "Mounts sag and crack at this age and let the engine move into hoses and the fan shroud under 850 Nm.", stage: S2, depends_on: [S0]}
  - {id: EN06, name: "Machine shop: hot tank clean and crack test, block", part_number: null, supplier: "Local machine shop", price_aud: 250, price_basis: estimate, link: "https://dieselworks.com.au/services/", status: required, system: engine, source: "report 14", priority: P1, why: "Finds a cracked block before money goes into machining and parts.", stage: S2, depends_on: [S0]}
  - {id: EN07, name: "Machine shop: bore and hone eight cylinders with a torque plate", part_number: null, supplier: "Local machine shop", price_aud: 650, price_basis: estimate, link: "https://dieselworks.com.au/services/", status: required, system: engine, source: "report 14", priority: P1, why: "Round, straight bores let the new rings seal, which keeps blow-by and oil use low.", stage: S2, depends_on: [EN06]}
  - {id: EN08, name: "Machine shop: deck both banks", part_number: null, supplier: "Local machine shop", price_aud: 300, price_basis: estimate, link: "https://dieselworks.com.au/services/", status: required, system: engine, source: "report 14", priority: P1, why: "Flat decks let the head gaskets seal at level B cylinder pressures.", stage: S2, depends_on: [EN06]}
  - {id: EN09, name: "Machine shop: line hone the main bores", part_number: null, supplier: "Local machine shop", price_aud: 400, price_basis: estimate, link: null, status: required, system: engine, source: "report 14", priority: P1, why: "Straight main bores stop the new main bearings wearing unevenly.", stage: S2, depends_on: [EN06]}
  - {id: EN10, name: "Machine shop: crankshaft crack test, measure, grind or polish", part_number: null, supplier: "Local machine shop", price_aud: 400, price_basis: estimate, link: "https://dieselworks.com.au/services/", status: required, system: engine, source: "report 14", priority: P1, why: "Finds a cracked crank and sets the bearing size the kit is ordered in.", stage: S2, depends_on: [EN06]}
  - {id: EN11, name: "Machine shop: conrods checked, big ends resized, new small-end bushes", part_number: null, supplier: "Local machine shop", price_aud: 400, price_basis: estimate, link: null, status: required, system: engine, source: "report 14", priority: P1, why: "Round big ends and new small-end bushes stop a bearing spinning or knocking.", stage: S2, depends_on: [EN06]}
  - {id: EN12, name: "Machine shop: two cylinder heads, crack and pressure test, resurface, seats, valves", part_number: null, supplier: "Local machine shop", price_aud: 1400, price_basis: estimate, link: "https://dieselworks.com.au/services/", status: required, system: engine, source: "report 14", priority: P1, why: "Crack-free, flat heads with sealing valves hold compression and the head gaskets at higher boost.", stage: S2, depends_on: [S0]}
  - {id: EN13, name: "Machine shop: allowance for worn valve guides, valves and seals", part_number: null, supplier: "Local machine shop", price_aud: 400, price_basis: estimate, link: null, status: required, system: engine, source: "report 14", priority: P1, why: "Covers the guides, valves and seals a 400,000 km head usually needs.", stage: S2, depends_on: [EN12]}
  - {id: EN14, name: "Radiator, Toyota LandCruiser VDJ 2007 to 2025", part_number: "Natrad listing", supplier: Natrad, price_aud: 1756.90, price_basis: listing, link: "https://natrad.com.au/product/toyota-landcruiser-2007-2025-vdj-radiator-3/", status: required, system: engine, source: "report 14", note: "Read 20 Nov 2026 from the page's price data, AUD 1,756.90. Level B needs a new radiator (report 14 section 3.9), so the radiator cut is gone", priority: P1, why: "A part-blocked core overheats on long grades with the trailer behind, and level B is accepted for towing only with a new radiator.", stage: S1, depends_on: [S0], checked: "2026-11-20"}
  - {id: EN15, name: "Water pump, genuine", part_number: "by VIN", supplier: "Toyota dealer", price_aud: 450, price_basis: estimate, link: null, status: required, system: engine, source: "report 14", priority: P1, why: "A failed water pump bearing or seal overheats the engine far from help.", stage: S1, depends_on: [S0]}
