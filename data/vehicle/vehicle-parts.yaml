  - {id: TX03, name: "Turbo intake pipe, new genuine", part_number: "by VIN", supplier: "Toyota dealer", price_aud: 250, price_basis: estimate, link: "https://cdn.shopify.com/s/files/1/0823/4241/2531/files/1VD-FTV-VDJ70-Booklet-v1_4c.pdf", status: required, system: turbo_exhaust, source: "report 14", note: "The plastic pipe softens with breather oil (booklet page 26)", priority: P1, why: "The plastic pipe softens with breather oil and can split, which lets dust into the turbo.", stage: S1, depends_on: [ID01]}
  - {id: TX04, name: "PDI front-mount intercooler kit, twin throttle, DPF, no radar bracket", part_number: "A IC AA T3F-2.1", supplier: "GTurbo (PDI)", price_aud: 2200, price_basis: listing, link: "https://gturbo.com.au/products/landcruiser-vdj-76-78-79-series-front-mount-intercooler-kits", status: required, system: turbo_exhaust, source: "report 14", note: "Keeps both throttles and the EGR feed. A 2017 to 08/2022 truck has no emergency braking radar, so the AUD 2,300 radar version is not needed", priority: P2, why: "Cools the charge air, so power rises without raising exhaust temperature.", stage: S6, depends_on: [EN14], checked: "2026-11-20"}
  - {id: TX05, name: "Manta 3 inch DPF-back exhaust, stainless, quiet, single cab", part_number: SSMKTY0123, supplier: "GTurbo (Manta)", price_aud: 1480, price_basis: listing, link: "https://gturbo.com.au/products/vdj79-v8-4-5l-td-dpf-single-cab-ute-oct-2016-to-current-turbo-back-dpf-back-exhaust", status: required, system: turbo_exhaust, source: "report 14", note: "Keeps the DPF. Keep the factory rear crossover pipe", priority: P2, why: "Cuts back-pressure behind the DPF and keeps the DPF, so it needs no certificate.", stage: S6, depends_on: [ID02], checked: "2026-11-20"}

  # Tune, gauges and engine paperwork (system tune_legal)
  - {id: TL01, name: "Custom ECU tune, level B, with the stock and tuned dyno runs", part_number: null, supplier: "GTurbo, HP-F or a local tuner", price_aud: 2500, price_basis: estimate, link: "https://cdn.shopify.com/s/files/1/0823/4241/2531/files/1VD-FTV-VDJ70-Booklet-v1_4c.pdf", status: required, system: tune_legal, source: "report 14", note: "Peak power about 230 to 250 kW at the crank and at least 224 kW (300 hp), about 850 Nm, towing map, EGT fuel limit, 450 to 500 Nm cap in low range, first and reverse, EGR and DPF functions untouched. Report 14's level B tune price. Re-checked 20 Nov 2026: no published tune price found, estimate stands. The pre-tune run is on the finished hardware with the factory calibration, the same day as the tuned run", priority: P2, why: "Delivers at least 224 kW with the low-range torque cap and the EGT limit that protect the engine and driveline.", stage: S6, depends_on: [S2, TX01, TX04, TX05, TL02], checked: "2026-11-20"}
  - {id: TL02, name: "Autometer boost, EGT and water temperature gauge kit", part_number: "Autometer combo kit", supplier: GTurbo, price_aud: 990, price_basis: listing, link: "https://gturbo.com.au/products/autometer-boost-egt-water-temp-combo-kit", status: required, system: tune_legal, source: "report 14", note: "EGT probe in the manifold before the turbo", priority: P1, why: "Shows boost, exhaust and coolant temperature, so the driver backs off before heat does damage.", stage: S1, depends_on: [S0], checked: "2026-11-20"}
