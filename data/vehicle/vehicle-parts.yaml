  - {id: GV02, name: "Fitting by a Lovells authorised fitter", part_number: null, supplier: "Lovells authorised fitter", price_aud: 1500, price_basis: estimate, link: "https://www.powercurve.com.au/lovells-gvm-upgrade-sunshine-coast/toyota-landcruiser-lc79-series-gvm/", status: required, system: gvm, source: "report 16", priority: P1, why: "Lovells lets only its authorised fitters fit the kit for state compliance.", stage: S4, depends_on: [GV01]}
  - {id: GV03, name: "NSW VSCCS certification of the GVM kit, the GCM revision, the bike box, its winch and the 180 L tank in one LC5 inspection, after registration", part_number: null, supplier: "Lovells-endorsed VSCCS certifier, category LC5", price_aud: 1500, price_basis: estimate, link: "https://70seriesstore.com/blogs/information/what-is-the-79-series-towing-gcm", status: required, system: gvm, source: "report 16, scope from the decision log (12:45)", note: "Within the AUD 1,000 to 2,500 range quoted for the GVM. One inspection covers the kit, the GCM revision (GV06), the bike box and its mountings, the winch and the 180 L tank (FT01), so the box's parts list has no inspection line (conductor's ruling, 20 Nov 2026). VSI 06 Rev 4 items 51 (GVM and GCM), 35 (the winch may count as a powered loading device), 27 and 34 (the body and its mounts) and 50 (the tank)", priority: P1, why: "Makes the GVM kit, the box and its winch legal in one inspection (VSI 06 Rev 4 items 51, 27, 34 and 35).", stage: S4, depends_on: [GV02, GV04, TW01]}
  - {id: GV04, name: "Wheel alignment and LSPV reset, with the kit and the bike box fitted", part_number: null, supplier: "Alignment or brake shop with Toyota gauge set 09709-29018", price_aud: 250, price_basis: estimate, link: "https://jdmfsm.info/Auto/Japan/Toyota/Land%20Cruiser/70%20Series%20(1984-2007)/2017%207x%20series%20Body%20Builder's%20Manual.pdf", status: required, system: gvm, source: "report 16", note: "Covers the steering and front bush work of step 8 and Toyota's rule that the LSPV is readjusted once a body is complete, so report 15's separate alignment and a second LSPV check are dropped", priority: P1, why: "Resets rear brake balance for the new rear axle load and aligns the wheels after the kit and the steering work.", stage: S4, depends_on: [GV02]}
  - {id: GV05, name: "Lovells 4,495 kg Elite in place of GV01 and GV02, net extra", part_number: null, supplier: Lovells, price_aud: 12855, price_basis: listing, link: "https://unsealed4x4.com.au/lovells-elite-series-79-series-gvm-upgrade/", status: required, system: gvm, source: "report 16, decision H17", note: "AUD 19,975 fitted, so GV01 and GV02 are the Platinum's share of that price. GVM 4,495 kg, axles 1,650 and 2,850 kg, GCM 7,400 kg (report 16 section 2.3). Lovells-built wide-track rear housing to match the front track, chrome-moly axles, exchange diff, brake upgrade. Required from 21 Nov 2026 (decision H17): the trailer's heaviest towball with growth is 317 kg, and on the model with growth the Platinum's 2,550 kg rear axle would carry about 2,574 kg. Cut CUT7 returns to the Platinum on the S3 weighing. Check what its brake upgrade includes before buying BR01 to BR05", priority: P1, why: "The home trailer's towball and the 180 L tank leave the Platinum's rear axle no margin.", stage: S4, depends_on: [S3]}
  - {id: GV06, name: "Lovells 7,400 kg GCM revision, certified after registration with the GVM kit in the same LC5 inspection", part_number: null, supplier: "Lovells-endorsed VSCCS certifier, category LC5", price_aud: 1750, price_basis: estimate, link: "https://70seriesstore.com/blogs/information/what-is-the-79-series-towing-gcm", status: required, system: gvm, source: "plan (R23), decision H2", note: "Lovells rates the 4,200 kg kit at 7,400 kg GCM with 3,500 kg braked towing and warns the revision may not be available after registration in every state (Lovells sheet, Oct 2026). Report 16 gives the 4,495 kg Elite (GV05) the same 7,400 kg GCM. NSW lists GCM re-rating as certifiable (VSI 06 Rev 4 item 51). Price is the midpoint of the AUD 1,000 to 2,500 that 70 Series Store gives for post-registration GCM engineering. Conditions: tyres of load index 117 and speed M or better, a 3,500 kg and 350 kg towbar, braked towing stays 3,500 kg. If refused, decision H13's water limit, at most 233 L in travel (recomputed for H17), and a trailer plate at or below 3,300 kg keep the combination within 6,900 kg", priority: P1, why: "Raises the GCM to 7,400 kg, which the loaded ute and the 3,500 kg trailer need together.", stage: S4, depends_on: [GV03], checked: "2026-11-20"}

