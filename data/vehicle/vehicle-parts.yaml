  - {id: TL04, name: "TfNSW emissions test", part_number: null, supplier: "Transport for NSW", price_aud: 0, price_basis: estimate, link: "https://www.rms.nsw.gov.au/documents/roads/safety-rules/standards/vsi-06-light-vehicle-modifications.pdf", status: build, system: tune_legal, source: "report 14", note: "Assumed free. VSI 06 Rev 3 (linked) said free at Botany or Penrith. Rev 4 still names TfNSW testing but gives no fee. Book it only with a clean DPF (ID02) and no stored fault codes", priority: P2, why: "The tune's certificate needs emissions evidence taken with a working DPF.", stage: S6, depends_on: [ID02, TL01]}
  - {id: TL05, name: "VSCCS certificate for the power, the high-flow injectors and the ECU reflash, category LC4 certifier, including the noise test", part_number: null, supplier: "VSCCS licensed certifier (Bulletin 1)", price_aud: 2000, price_basis: estimate, link: "https://www.nsw.gov.au/sites/default/files/noindex/2026-03/vsi-06-light-vehicle-modification-july-2026.pdf", status: build, system: tune_legal, source: "plan (VSI 06 Rev 4 item 6), price from report 14", note: "Item 6's example that needs a certificate is flashing the engine management system, altering vehicle emissions output unless approved by the vehicle manufacturer. Item 5 lists non-original fuel injection equipment, item 49 fuel system changes and item 2 a power rise of more than 20 %, so the same certificate covers the Pro 100 injectors, assumed at no extra cost, on the TfNSW test of the finished truck (TL04), which VSCCS Bulletin 2 accepts as a modified vehicle's ADR 79/04 evidence. The certifier may also ask for evidence that the driveline takes about 850 Nm", priority: P2, why: "VSI 06 Rev 4 items 2, 5, 6 and 49 need a certificate for the power, the injectors and the reflash, so the tune is not legal without it.", stage: S6, depends_on: [TL01, TL04]}
