  # Fuel system and injectors (system fuel_system), DPF engine
  - {id: FS01, name: "GTurbo Pro 100 high-flow service of the truck's own eight piezo injectors, DPF engine", part_number: "F I 1VDFTV S2-1", supplier: "GTurbo (Balcatta WA)", price_aud: 4890, price_basis: listing, link: "https://gturbo.com.au/products/toyota-1vd-ftv-dpf-injector-service-and-upgrade-exchange-service", status: build, system: fuel_system, source: "research report 27, decision H24", note: "Read 22 Nov 2026. GTurbo fits its +100 % nozzles for DPF engines to the truck's own injectors and flow-matches the set, 2 to 5 business days, with a 12-month warranty on the nozzles. Fitted at S6 with the tune, because the factory calibration cannot run them (assumption from GTurbo's booklet p. 24). GTurbo's new high-flowed set is AUD 10,890 (research report 27). The Pro 100 is non-original fuel injection equipment (VSI 06 item 5), which report 14 judged makes laboratory emissions evidence likely, so it carries the risk of TL07's AUD 10,000 (est.) laboratory test. Assumed: the LC4 certifier accepts the TfNSW test of the finished truck (TL04). If its written evidence list at S0 asks for a laboratory test, the build drops FS01 and FS07 (AUD 5,080) and runs level B on the tested factory injectors", priority: P2, why: "The upgraded injectors Leonard asked for: fuel margin at level B on the truck's own tested injectors (research report 27).", stage: S6, depends_on: [FS04, FS06, S2], checked: "2026-11-22"}
  - {id: FS02, name: "Injector fitting kit (seals, washers, seats), DPF engine, for the refit after the rebuild", part_number: "GTurbo DPF fitting kit", supplier: GTurbo, price_aud: 190, price_basis: listing, link: "https://cdn.shopify.com/s/files/1/0823/4241/2531/files/1VD-FTV-VDJ70-Booklet-v1_4c.pdf", status: build, system: fuel_system, source: "report 14", note: "Booklet page 25", priority: P1, why: "The seals and seats the injectors need when they go back in after the rebuild.", stage: S2, depends_on: [FS01]}
  - {id: FS07, name: "Injector fitting kit (seals, washers, seats), DPF engine, for the Pro 100 injectors", part_number: "GTurbo DPF fitting kit", supplier: GTurbo, price_aud: 190, price_basis: listing, link: "https://cdn.shopify.com/s/files/1/0823/4241/2531/files/1VD-FTV-VDJ70-Booklet-v1_4c.pdf", status: build, system: fuel_system, source: "report 14, research report 27", note: "Booklet page 25. The seals are single use, so FS02 is for the refit after the rebuild and this kit for the upgraded injectors", priority: P2, why: "The seals and seats the upgraded injectors need when they go in at S6.", stage: S6, depends_on: [FS01]}
  - {id: FS03, name: "Supply pump, Denso HP4, new, DPF engine", part_number: "294050-0560", supplier: GTurbo, price_aud: 1480, price_basis: listing, link: "https://gturbo.com.au/products/1vd-ftv-injector-pump-dpf-294050-0560", status: check, system: fuel_system, source: "report 14", note: "A pump that fails its test sheds metal into the injectors, so the tank and lines are flushed when it is replaced", priority: P1, why: "GTurbo runs its high-flow injectors on the factory pump type (research report 27), so the pump is replaced only if it is worn (was cut CUT2).", check: "Rail pressure against its target at idle and full load by scan tool, stored codes, and the old filter element for metal", pass_mark: "Rail pressure follows its target, no rail pressure codes (P0087, P0088, P0093) and no metal in the filter", checked_at: S0, stage: S1, depends_on: [RF09], checked: "2026-11-20"}
  - {id: FS04, name: "Pre-filter and water separator, 30 micron", part_number: "Direction Plus PreLine PL625DPK", supplier: "Direction Plus via Filters Plus", price_aud: 432, price_basis: estimate, link: "https://www.filtersplus.co/product/pl625dpk/", status: build, system: fuel_system, source: "report 14", note: "Listed price of the similar FM618DPK kit, as the PL625DPK page would not load", priority: P1, why: "Part of the fuel supply the upgraded injectors need: it stops water and dirt before the pump and injectors.", stage: S2, depends_on: [S0]}
  - {id: FS05, name: "Factory fuel filter element, genuine", part_number: "23390-51070 (confirm by VIN)", supplier: "eBay listing", price_aud: 40, price_basis: listing, link: "https://www.ebay.com.au/p/16026541355", status: build, system: fuel_system, source: "report 14", priority: P1, why: "Part of the fuel supply the injectors need: a fresh element after the rebuild.", stage: S2, depends_on: [FS04]}
  - {id: FS06, name: "Genuine new piezo injector, DPF engine, each, in place of one that fails its S0 test", part_number: "by VIN", supplier: GTurbo, qty: 1, unit_aud: 1157, price_aud: 1157, price_basis: estimate, link: "https://gturbo.com.au/products/toyota-1vd-ftv-dpf-injectors", status: check, system: fuel_system, source: "report 14, research report 27", note: "An eighth of GTurbo's new set of eight, listed at AUD 9,256 on 22 Nov 2026 (est. for one). The price is one injector's. A new injector is fitted for the run-in at S2 and goes to GTurbo with the others at S6 (FS01)", priority: P1, why: "The truck's own injectors carry on and get the Pro 100 service, so only one that fails its test is replaced.", check: "Back-leak and the ECU's injector correction values (BI01, VEH-04), and fuel in the oil sample (VEH-06). One injector is bought for each one that fails", pass_mark: "Every injector within 25 % of the mean, and fuel dilution at most 4 %", checked_at: S0, stage: S2, depends_on: [BI01]}

  # Sealed airbox and DPF service (system intake_dpf)
  - {id: ID01, name: "GTurbo high-flow airbox, sealed, takes the factory filter, VDJ76, 78 and 79", part_number: "A AB GT VDJ79", supplier: GTurbo, price_aud: 1495, price_basis: listing, link: "https://gturbo.com.au/products/gturbo-high-flow-airbox-vdj76-79", status: build, system: intake_dpf, source: "report 14 (P07), required because dust past the factory seal would wear the fresh engine (decision log 12:45)", note: "Read 20 Nov 2026. Stops dust passing the factory airbox seal into the rebuilt engine and turbo. Keeps the emission controls, so no certificate (VSI 06 Rev 4 item 5). Fit before the first start", priority: P1, why: "Dust past the factory airbox seal is a common 1VD fault (Unsealed 4X4), and it would wear the rebuilt engine and the new turbo.", stage: S2, depends_on: [S0], checked: "2026-11-20"}
