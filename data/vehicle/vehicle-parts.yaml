  - {id: TW06, name: "48 V charging feed to the towbar: two inline MIDI holders with 23 A fuses on the chargers' outputs, 7 m of 4 B&S twin cable (20.27 mm2), a grey Anderson SB50 in a flush-mount panel, clips", part_number: "Exotronic MIDI in-line holder, 23 A MIDI fuse, 4 B&S twin, flush-mount 50 A Anderson panel", supplier: Solar4RVs, price_aud: 228.60, price_basis: listing, link: "https://www.solar4rvs.com.au/products/4b-s-20-29mm-twin-core-automotive-cable-per-metre", status: build, system: towing, source: "research/20-electrical.md (report 20), car build lines TC01 and TW06, review finding I2-15", note: "Holders and fuses 21.60 and the Anderson panel 12.00 read 20 Nov 2026, the cable 175.00 at 25.00 a metre read 22 Nov 2026, all Solar4RVs listings, and clips 20 (est.). The listing gives 20.27 mm2 a core, and the drop is worked on 21.2 mm2 at 2.12 mV/A.m (data/routes.yaml): 0.47 V, 1.0 % at 48 V, at TC02's 32 A, so with the trailer half D-14 on the same cable the feed holds 2 % from the chargers to the Lynx (SVC-06). 4.1 kg (est.), 3.5 kg of cable at the routes data's 0.501 kg a metre for the twin and 0.6 kg of holders, fuses and the panel. The grey housing does not mate with red 12 V plugs", priority: P1, why: "Trailer charging: carries the chargers' 48 V output to the trailer plug. Both halves of the feed are sized now for TC02's 32 A, as report 20 sizes them, because the cable is the part that is hard to change later: 4 B&S on each half holds 2 % end to end, where 6 B&S gave 3.1 %.", stage: S5, depends_on: [TC01], checked: "2026-11-22"}
