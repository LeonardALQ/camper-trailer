  - {id: EN17, name: "Fan clutch (viscous coupling), genuine", part_number: "by VIN", supplier: "Toyota dealer", price_aud: 450, price_basis: estimate, link: null, status: required, system: engine, source: "report 14", priority: P1, why: "A slipping fan clutch loses airflow at towing speeds, where the engine needs it most.", stage: S1, depends_on: [S0]}
  - {id: EN18, name: "Hose set: radiator, heater and bypass, genuine", part_number: "by VIN", supplier: "Toyota dealer", price_aud: 400, price_basis: estimate, link: null, status: required, system: engine, source: "report 14", priority: P1, why: "Old hoses split under heat and pressure when towing.", stage: S1, depends_on: [S0]}
  - {id: EN19, name: "Coolant, Toyota long life, about 20 L", part_number: "by VIN", supplier: "Toyota dealer", price_aud: 150, price_basis: estimate, link: null, status: required, system: engine, source: "report 14", priority: P1, why: "Fresh coolant protects the new pump, radiator and head gaskets from corrosion.", stage: S1, depends_on: [EN14, EN15, EN18]}
  - {id: EN20, name: "Engine oil, filters, form-in-place sealant, assembly lube", part_number: null, supplier: "Toyota dealer, parts store", price_aud: 400, price_basis: estimate, link: null, status: required, system: engine, source: "report 14", note: "Refit the oil filter housing support pole at every change", priority: P1, why: "Fresh oil, filters and assembly lube protect the new bearings at first start.", stage: S2, depends_on: [EN01]}
  - {id: EN21, name: "Head gaskets in other grades, if measured piston protrusion calls for them", part_number: "RH 11115-51030-A0 to -E0, LH by VIN", supplier: "Toyota dealer", price_aud: 400, price_basis: estimate, link: "https://parts.lexus.com/products/product/cylinder-head-gasket-right-hand-1111551030a0", status: contingency, system: engine, source: "report 14", note: "0 to 400", priority: P1, why: "Measured piston protrusion sets the head gasket grade, and the wrong grade blows the gasket.", stage: S2, depends_on: [EN01]}
  - {id: EN22, name: "Engine oil cooler, if it fails a pressure test", part_number: "by VIN", supplier: "Toyota dealer", price_aud: 500, price_basis: estimate, link: null, status: contingency, system: engine, source: "report 14", priority: P1, why: "A leaking oil cooler mixes oil and coolant and ruins the new bearings.", stage: S2, depends_on: [S0]}
  - {id: EN23, name: "Brake vacuum pump, if oil passes it", part_number: "by VIN", supplier: "Toyota dealer", price_aud: 600, price_basis: estimate, link: null, status: contingency, system: engine, source: "report 14", note: "Report 14 open question 11, not in its total", priority: P1, why: "A vacuum pump that passes oil weakens the brake booster and fills the intake with oil.", stage: S2, depends_on: [S0]}
  - {id: EN24, name: "Balance the rotating assembly", part_number: null, supplier: "Local machine shop", price_aud: 400, price_basis: estimate, link: null, status: optional, system: engine, source: "report 14", priority: P3, why: "Balancing lowers vibration, but a stock-spec rebuild runs smoothly without it.", stage: S2, depends_on: [EN10, EN11]}
  - {id: BI01, name: "Baseline tests before spending: compression and leak-down on all eight cylinders, blow-by, injector back-leak, oil analysis, DPF and fault data by scan tool, clutch slip test", part_number: null, supplier: "Diesel workshop with a Toyota-capable scan tool (outsourced)", price_aud: 900, price_basis: estimate, link: null, status: required, system: engine, source: "plan (R23), the baseline inspection the stage plan starts from", note: "About 5 h of workshop time at about AUD 160 an hour plus an oil analysis kit of about AUD 80 (both est.). The glow plugs come out for the compression test, so EN04's new set goes in here", priority: P1, why: "Compression, leak-down, blow-by, injector back-leak, an oil sample and the DPF data decide whether the engine is rebuilt now or at the power stage.", stage: S0, depends_on: [], checked: "2026-11-20"}

  # Fuel system (system fuel_system), DPF engine
  - {id: FS01, name: "Injectors, eight, genuine new piezo, DPF engine", part_number: "GTurbo DPF piezo set", supplier: GTurbo, price_aud: 9256, price_basis: listing, link: "https://gturbo.com.au/products/toyota-1vd-ftv-dpf-injectors", status: required, system: fuel_system, source: "report 14", note: "Cut CUT1 tests and reuses the old set", priority: P1, why: "Worn injectors wash fuel onto the new bores and misfire, and at level B the old set runs near its flow limit.", stage: S2, depends_on: [BI01, FS04, RF09], checked: "2026-11-20"}
  - {id: FS02, name: "Injector fitting kit (seals, washers, seats), DPF engine", part_number: "GTurbo DPF fitting kit", supplier: GTurbo, price_aud: 190, price_basis: listing, link: "https://cdn.shopify.com/s/files/1/0823/4241/2531/files/1VD-FTV-VDJ70-Booklet-v1_4c.pdf", status: required, system: fuel_system, source: "report 14", note: "Booklet page 25", priority: P1, why: "New seals and seats stop compression gas and diesel leaking past the injectors.", stage: S2, depends_on: [FS01]}
  - {id: FS03, name: "Supply pump, Denso HP4, new, DPF engine", part_number: "294050-0560", supplier: GTurbo, price_aud: 1480, price_basis: listing, link: "https://gturbo.com.au/products/1vd-ftv-injector-pump-dpf-294050-0560", status: required, system: fuel_system, source: "report 14", note: "Cut CUT2 reuses the old pump after a bench test", priority: P1, why: "A worn supply pump sheds metal into the new injectors.", stage: S2, depends_on: [RF09], checked: "2026-11-20"}
  - {id: FS04, name: "Pre-filter and water separator, 30 micron", part_number: "Direction Plus PreLine PL625DPK", supplier: "Direction Plus via Filters Plus", price_aud: 432, price_basis: estimate, link: "https://www.filtersplus.co/product/pl625dpk/", status: required, system: fuel_system, source: "report 14", note: "Listed price of the similar FM618DPK kit, as the PL625DPK page would not load", priority: P1, why: "Catches water and dirt before they reach the pump and injectors.", stage: S1, depends_on: [S0]}
  - {id: FS05, name: "Factory fuel filter element, genuine", part_number: "23390-51070 (confirm by VIN)", supplier: "eBay listing", price_aud: 40, price_basis: listing, link: "https://www.ebay.com.au/p/16026541355", status: required, system: fuel_system, source: "report 14", priority: P1, why: "A fresh element protects the new pump and injectors from the first start.", stage: S2, depends_on: [FS04]}

  # Sealed airbox and DPF service (system intake_dpf)
  - {id: ID01, name: "GTurbo high-flow airbox, sealed, takes the factory filter, VDJ76, 78 and 79", part_number: "A AB GT VDJ79", supplier: GTurbo, price_aud: 1495, price_basis: listing, link: "https://gturbo.com.au/products/gturbo-high-flow-airbox-vdj76-79", status: required, system: intake_dpf, source: "report 14 (P07), required because dust past the factory seal would wear the fresh engine (decision log 12:45)", note: "Read 20 Nov 2026. Stops dust passing the factory airbox seal into the rebuilt engine and turbo. Keeps the emission controls, so no certificate (VSI 06 Rev 4 item 5). Fit before the first start", priority: P1, why: "Stops dust passing the factory airbox seal and wearing the rings, bores and turbo.", stage: S1, depends_on: [S0], checked: "2026-11-20"}
  - {id: ID02, name: "DPF inspection, off-car clean and flow test", part_number: null, supplier: "DPF cleaning specialist (outsourced), for example DPF Cleaning Services, Mascot NSW", price_aud: 600, price_basis: estimate, link: "https://dpfcleaningservices.com.au/", status: required, system: intake_dpf, source: "plan, because level A's emissions evidence needs a working DPF (decision log 12:45)", note: "The specialist quotes from about AUD 500 and takes filters by post. Leonard removes and refits the filter. A clean DPF is a condition of the emissions test (TL04)", priority: P1, why: "Removes the ash that regeneration cannot burn and proves the DPF works, which the emissions test needs.", stage: S1, depends_on: [BI01]}
  - {id: ID03, name: "New DPF, only if the filter is cracked or melted", part_number: "by VIN", supplier: "Toyota dealer or DPF specialist", price_aud: 5000, price_basis: estimate, link: "https://dpfcleaningservices.com.au/", status: contingency, system: intake_dpf, source: "plan, because level A's emissions evidence needs a working DPF (decision log 12:45)", note: "Midpoint of the AUD 3,000 to 7,000 fitted that the same specialist quotes for a new DPF. Not carried in the contingency allowance", priority: P1, why: "Replaces a cracked or melted DPF, without which the ute fails emissions and drops into limp mode.", stage: S1, depends_on: [ID02]}

