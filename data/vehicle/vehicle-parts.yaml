# Cuts that keep it reliable. Each applies only if its condition holds. A cut saves its line and that line's
# share of the allowance.
cuts:
  - {id: CUT6, name: "Keep a factory towbar rated 3,500 kg and 350 kg, if fitted", replaces: TW01, saving_aud: 1160, risk: "Low, if the rating plate reads 3,500 kg and 350 kg and the mounts and receiver show no cracks", source: "decision log, report 16"}
  - {id: CUT7, name: "Return to the Lovells 4,200 kg Platinum kit (GV01 and GV02 without the Elite)", replaces: GV05, saving_aud: 12855, risk: "Taken only if the S3 weighing leaves at least 30 kg under the Platinum's 2,550 kg rear axle at the trailer's weighed towball (decision H17). The model forecasts about 99 kg under on base masses (the trailer's MAS-14) but about 24 kg over with growth, so only weighed figures can justify it. The Platinum keeps the factory rear housing, axles and diff under the 3,500 kg trailer, and an Elite bought after a fitted Platinum loses the Platinum's cost", source: "decision H17"}

