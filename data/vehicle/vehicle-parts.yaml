  - {id: TL01, name: "Custom ECU tune, level B, with the stock and tuned dyno runs", part_number: null, supplier: "GTurbo, HP-F or a local tuner", price_aud: 2500, price_basis: estimate, link: "https://cdn.shopify.com/s/files/1/0823/4241/2531/files/1VD-FTV-VDJ70-Booklet-v1_4c.pdf", status: build, system: tune_legal, source: "report 14", note: "Peak power about 230 to 250 kW at the crank and at least 224 kW (300 hp), about 850 Nm, towing map, EGT fuel limit, 450 to 500 Nm cap in low range, first and reverse, EGR and DPF functions untouched. Report 14's level B tune price. Re-checked 20 Nov 2026: no published tune price found, estimate stands. The pre-tune run is on the finished turbo, intercooler and exhaust with the factory calibration, on the same dyno as the tuned run, before the injectors go to GTurbo (FS01)", priority: P2, why: "Delivers level B, at least 224 kW, with the low-range torque cap and the EGT limit, calibrated for the Pro 100 injectors.", stage: S6, depends_on: [S2, TX01, TX04, TX05, TL02], checked: "2026-11-20"}
