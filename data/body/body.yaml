# Body design data (BODY.md), from research report 12 (research/12-body-design.md) and the panel and product tables
# beside it (research/12-body-panels.yaml, research/12-body-products.yaml). Units: mm, MPa, N, kg.
# cad/body.py reads this file for the planning-level panel, insert, joint, mount, end wall and twist checks.
# Revision C, 21 Nov 2026: the home trailer (TRAILER.md). 4,420 mm long with a fixed roof 2,000 mm inside and
# rounded front edges (H1a, H12), a wet room door in the rear wall (H4), the lift bed's rails on the side walls (H1)
# and four windows (H15). Revision B was the LandCruiser 79 body (report 18, layout 1).

# ---------------------------------------------------------------- panels (report 12 section 2)
# E and G are the skin's in-plane tensile and shear moduli. The core's shear modulus Gc and strengths are the
# maker's. ult is the skin's ultimate tensile strength used for the stress criterion (half of it is allowed).
panels:
  floor:
    name: "Floor, 30 mm: two 2.0 mm woven roving polyester skins (48 % glass) on 26 mm Divinycell H80 PVC"
    t: 30
    skins: [2.0, 2.0]
    E: 14000          # assumption, below AZoM's 16 GPa (report 12 section 2)
    G: 3000           # woven roving in-plane shear modulus (assumption, about E / 4.7 for a 0/90 laminate)
    ult: 200          # assumption, below AZoM's 280 MPa
    core: {name: Divinycell H80, c: 26, Gc: 27, shear: 1.15, compression: 1.4}
    kg_m2: 8.92
  wall:
    name: "Side and rear walls, 35 mm: two 1.5 mm gelcoat GRP skins (Optiplan Polydet) on 32 mm XPS"
    t: 35
    skins: [1.5, 1.5]
    E: 6500           # Polydet data sheet
    G: 2500           # E / 2(1 + 0.3), chopped-strand GRP taken as isotropic (assumption)
    ult: 77           # Polydet data sheet
    core: {name: XPS, c: 32, Gc: 8, shear: 0.25, compression: 0.30}
    kg_m2: 6.0
    # Aluminium members laid upright in the side-wall cores, floor joiner to roof joiner, bonded to the inner skin only:
    # the wall stiffeners (BD-18), the entry door's jamb members (BD-19) and the lift-bed hardpoints (LB-06). The panel
    # maker routs a channel `depth` deep into the XPS from the inner face and bonds the member into it as the inner skin
    # goes on, so `break` of XPS stays between the member and the outer skin and no metal crosses the core (BDY-22). With
    # the tower's sides and the partition they bound every side-wall bay at no more than `pitch`, the 1,067 mm between
    # the bed's rail pairs. A member on one skin bends about its own centroid, so only its own EI adds to the
    # sandwich's (the composite term through the core is left out, conservative). The wind deflection (BDY-10) takes
    # it smeared over that pitch. The skin stress (BDY-06) leaves it out, and BDY-06 checks the member's own share at
    # the ultimate wind. I is about the axis along the wall, for the 19 mm depth through it (sharp corners). F3-01: at
    # ISO 13788's Rsi of 0.25 the surface over a member needs 13 mm of XPS behind it, so the member is 19 mm deep, and
    # 110 mm wide so the hardpoints stand 27 mm off W1's and W2's cut-outs (FIT-07). No Australian stockist lists a
    # 6060-T5 RHS under 25 mm deep this stiff (InfraBuild's range goes from 40 x 20 x 2.0 to its 25 mm deep sections), so
    # the section is made to order (BD-18's price). F4-01: each member stands on a rigid PVC bearing block `block_mm` wide
    # across its depth, which carries the bed's load down to the floor joiner's base, with XPS in the rest of the channel.
    # The block raises the member's foot `foot_clear_mm` above the floor joiner's inner leg (`joiners` below), so no leg
    # overlaps the member. At its head the member stops `end_gap_mm` under the wall's top insert strip. BDY-22 takes both
    # joiners at the outside air, a bound. A rigid PVC pad `head_pad_mm` wide fills the gap at the head. Block and pad each
    # take the member's wind shear into its joiner through a spigot in the member's hollow end (BDY-25). G is 6060's shear
    # modulus, for the plate model's member torsion (BDY-24)
    stiffener: {name: "RHS 110 x 19 x 3.5 6060-T5 aluminium on the inner skin", E: 69000, G: 26000, I: 48042, depth: 19, width: 110, wall: 3.5,
                break: 13, fy: 110, pitch: 1067, kg_m: 2.306, end_gap_mm: 10, block_mm: 20, head_pad_mm: 10, foot_clear_mm: 20,
                src: "https://www.infrabuild.com/steel/products/aluminium/aluminium-rhs-rectangular-box-section/"}
  front_wall:
    name: "Front wall, 35 mm: 2.0 mm outer and 1.5 mm inner Polydet skins on 31.5 mm XPS, against stones"
    t: 35
    skins: [2.0, 1.5]
    E: 6000
    G: 2300
    ult: 77
    core: {name: XPS, c: 31.5, Gc: 8, shear: 0.25, compression: 0.30}
    kg_m2: 6.7
  roof:
    name: "Fixed roof, 40 mm: 2.0 mm top and 1.5 mm bottom Polydet skins on 36.5 mm XPS of about 36 kg/m3, bonded to the walls"
    t: 40
    skins: [2.0, 1.5]
    E: 6000
    G: 2300
    ult: 77
    core: {name: XPS 36, c: 36.5, Gc: 8, shear: 0.25, compression: 0.40}
    kg_m2: 7.0

# ---------------------------------------------------------------- criteria (report 12 section 3)
criteria:
  skin_factor: 0.5             # skin stress at most half the ultimate (ISO 12215-5)
  core_factor: 0.5             # core shear at most half its strength (assumption)
  wrinkling_factor: 0.5        # compressive skin stress at most half the wrinkling stress (assumption)
  bearing_factor: 0.5          # bearing at most half the core's compressive strength (assumption)
  insert_factor: 0.5           # working load at most half the rated load
  ultimate_factor: 1.5         # breaking-load cases: a factor of at least 1.5 on ultimate (assumption)
  floor_span_ratio: 200        # floor deflection at 1 g under a point load (assumption, the engineer sets it)
  roof_span_ratio: 150
  wall_span_ratio: 100         # under the serviceability wind: report 12's planning limit (section 3), the engineer sets it
  metal_factor: 1.5            # an aluminium stiffener at its yield over 1.5 at the ultimate wind (assumption, as LC3)

# ---------------------------------------------------------------- point and patch loads (report 12 section 3)
# The bike wheels, the chock bases, the L-track anchors and the generator left the body with the garage (UTE-GARAGE.md
# and the drawbar box), so a person's foot governs the floor now (report 18 open question 13).
loads:
  foot: {kg: 100, patch: [100, 150], note: "A person on one foot in the living area"}
  floor_edge_kg_m2: 160        # floor and its contents beside the raisers, between outriggers
  bed_kg: 264                  # the lift bed at night: 64 kg moving (report 21 section 1.4) and two sleepers of 100 kg
  bed_travel_kg: 64            # the moving bed alone, as it travels at the day stop
  bed_static_rating_kg: 272    # Lippert HappiJac, static (manual ccd-0002668, research report 21)
  bed_moving_rating_kg: 204    # Lippert HappiJac, while it moves (the same manual)
  bed_night_factor: 1.5        # sleepers moving on the bed at night (assumption, a person kneeling or sitting down)
  bed_rails: 4                 # HappiJac rails, two on each side wall
  rail_screws: 8               # 1/4 in self-tapping screws per rail through the inner skin into its hardpoint's 3 mm wall (est., about 200 mm pitch)
  rail_screw_rated_n: 3000     # shear on one screw in 3 mm 6060-T5 (est.: bearing about 2.5 fu d t = 7.6 kN characteristic)
  rail_screw_mm: 16            # 1/4 in self-drilling screw, length under the head: the rail's web, the inner skin, the bond and the
                               # member's front wall, 9 mm, and a drill point of about 6 mm, so the point stops in the member's hollow (F4-10)
  rail_web_mm: 2.5             # the HappiJac rail's web under the screw head (est.)
  uplift_40ms_n: 5060          # report 12's 6,300 N on 13.2 m2 at 110 km/h into a 36 km/h headwind, scaled to the 10.6 m2 roof

# ---------------------------------------------------------------- the split's outdoor unit on the rear wall (BDY-21)
# The cradle (AC-03) hangs the outdoor unit (AC-02) high on the rear wall's road half. Two stays (AC-04) run from the
# cradle's wall-side corners down the wall to brackets on the rear crossmember, so the chassis carries the vertical load
# and the wall's skin none of it. The wall's bolts hold the cradle to the wall: in tension against the unit's
# overturning moment (its centre of gravity stands off the wall) and any pull away from it, in shear against the
# sideways load. The accelerations are the chassis cases' (CHASSIS.md): 3 g down, 0.8 g braking taken both ways, and
# 0.5 g sideways, all at once.
cradle:
  lines: [AC-02, AC-03]
  bolts: 4                       # two rows of two through the rear wall's HD PVC insert strip
  bolt: "M8 stainless through-bolt on an 80 x 80 x 3 aluminium backing pad"
  row_lever_mm: 520              # top bolt row to the cradle's bottom bearing pad on the wall (est.)
  column_spacing_mm: 700         # between the two bolt columns, across the trailer (est.)
  pad_side_mm: 80                # backing pad side, for the pull-through (the mounts' spreader rule, skin 60 MPa, insert 6 MPa)
  shear_rated_n: 6000            # one M8 bearing on the insert strip and the 1.5 mm skin (est.)
  stays: {n: 2, name: "RHS 40 x 20 x 3 6060-T5 aluminium", E: 69000, I_min: 18892, A: 324, L: 1450, fy: 110, buckling_factor: 3.0}
  accel: {down_g: 3.0, along_g: 0.8, side_g: 0.5}

# ---------------------------------------------------------------- wind on the parked trailer (BDY-06, BDY-10, STB-04)
# AS/NZS 1170.2, in place of report 12's 0.5 kPa, which cited no standard. Decision H23: the walls are serviceable in
# region B, the non-cyclonic Queensland coast (Brisbane included) where Leonard will camp, and so in region A too.
# Terrain category 2 (open country) at the wall's height, no shielding, flat ground, any direction
# (M_d = M_s = M_t = 1). Net pressure 0.6 V^2 (Cp,e - Cp,i) Pa, with C_dyn and the K factors at 1.0: the side wall's
# 8.8 m2 is under Table 5.4's 10 m2, and its 2 m span is far larger than the local pressure zones. Strength is checked at
# BDY-19's 40 m/s, or by H23 at STB-04's highest overturning speed with a box's Cf where that is higher, rounded up to
# 0.1 m/s: cad/trailer.py strength_wind works it out from the layout, so the walls follow the trailer's masses (40.9 m/s
# before the 4,000 kg plate, F3-08, then 41.9 m/s, 42.02 m/s with the 6 mm rear crossmembers, and 42.3 m/s with the hinge
# cheeks and the rear bay's panel, for 42.4 m/s, and under 42.3 m/s with both cheeks at every hinge and 395 L of water, for
# 42.3 m/s, and just over 42.4 m/s with the fresh tanks on their bearers, for 42.5 m/s, at most 42.4 m/s with the XT hinge
# crossmembers RHS 150 x 100 x 6 and 370 L of water, for 42.4 m/s, and just over 42.4 m/s again with 375 L, for 42.5 m/s).
# Strapped down on its tie-downs (STB-05) the trailer stands in region B's 500-year gust, so BDY-06 and BDY-25 also give
# the walls at that gust (F4-07). The operating rule in TRAILER.md and on CT-003 keeps it out of winds near that speed and
# out of the cyclonic regions C and D in the cyclone season.
wind:
  V_s: 39            # m/s, serviceability: region B's 25-year regional wind V_25 (Table 3.1), for the wall's deflection
  Mzcat: 0.91        # Table 4.1, terrain category 2 at 3 m or less
  V_u_min: 40        # m/s, ultimate for strength: BDY-19's 40 m/s, the least the walls are checked at. H23 raises it to STB-04's highest overturning speed (cad/trailer.py strength_wind)
  cpe: 0.7           # Table 5.2(A), windward wall
  cpi: -0.3          # Table 5.1(A), all walls equally permeable: -0.3 or 0.0, the more severe with the windward wall
  region: B
  src: "AS/NZS 1170.2 Table 3.1 regional wind speeds as reproduced at https://docs.hexagonppm.com/r/ja-JP/PV-Elite-Help/25/603588 (V_R = 106 - 92 R^-0.1 for region B, 67 - 41 R^-0.1 for region A)"

# ---------------------------------------------------------------- cold surfaces over the wall members (BDY-22)
# Research report 19's design cold night: -5 C outside, 20 C inside, the e2 pairs' humidity boost holding the dew point at
# 6 C or lower, and inside surfaces kept 4 K above it (the rule report 19 applies to the bare joiners). cad/body.py solves
# the steady two-dimensional conduction through the wall at one member: outer skin, XPS, the member with still air in its
# hollow, inner skin. F3-01: the surfaces take ISO 13788's Rsi of 0.25 m2K/W for condensation and mould on opaque
# elements, which allows for corners, furniture and curtains, and the heat loss figure ISO 6946's 0.13. Half the strip is
# modelled, from the member's centreline to `strip_mm` away, where the wall is one-dimensional again. Along the member
# its ends lose heat to the floor and roof joiners (F3-05, F4-01): the member is a fin, and the joiner is taken at the
# outside air, a bound. Beside W1 and W2 the side insert and the window stand next to the hardpoint (F4-02), and the
# pair of members behind the bed stands 16.5 mm apart (F4-04), so both are modelled too.
thermal:
  t_out: -5
  t_in: 20
  dew_point: 6
  margin_k: 4
  rsi: 0.25          # m2K/W, inside surface for surface condensation and mould (ISO 13788:2012 clause 4.4.1)
  rsi_heat: 0.13     # m2K/W, inside surface for the heat loss figure, horizontal heat flow (ISO 6946 Table 7)
  rse: 0.04          # m2K/W, outside surface
  k: {grp: 0.30, xps: 0.035, aluminium: 200, air: 0.15, pvc: 0.16, h200: 0.044, ms: 0.30, foam: 0.035}   # W/mK
  insert: h200       # the side inserts at W1 and W2
  strip_k: pvc       # the doors' and windows' 70 mm HD PVC insert strips, taken as rigid PVC, a bound
  window_u: 2.8      # W/m2K, an S4's double acrylic with its frame (est., report 19 section 1)
  door_u: 1.6        # W/m2K, a door leaf (est., report 19 section 1)
  bond_mm: 1.5       # MS polymer between a joiner's leg and the inner skin, for a leg that overlaps a member (est.)
  strip_mm: 300
  cell_mm: 0.5
  bare_panels_w_k: 36.8   # report 19 section 1: the bare panels, before its 20 % for bridges
  bridges_w_k: 7.3        # report 19 section 1: the joiners, the mount bolts and the insert strips
  members: [BD-18, BD-19, BD-20, LB-06]
  # On the generators e2 fans C and D (low on the front wall, facing the generators) stop, and fans A and B on the side
  # walls run on as a pair with the RESPA-CF2, the RESPA holding the cabin above outside through its MERV 16 and carbon
  # filters. Report 19's moisture model (research/models/19/loads.py condensation_check: the evening hour's 200 g/h,
  # outside air at 90 % of saturation, the e2's 20 % moisture recovery on its share of the flow) gives that mode's
  # dew point, and BDY-22 holds against it as well as against the normal 6 C
  # where the generators stand (F5-04): ahead of the drawbar or behind the trailer e2 fans A and B run on as a pair with
  # the RESPA-CF2. Off the kerb side fans A and B stop and the RESPA-CF2 runs alone. Never off the road side, where the
  # RESPA-CF2 and the top-up fan draw their air
  generator_mode: {e2_m3h: 22.5, respa_m3h: 150, moisture_g_h: 200, w_out_factor: 0.9, eps_lat: 0.20,
                   positions: {ahead: [e2, respa], behind: [e2, respa], kerb: [respa]}}
  src:
    iso13788: "ISO 13788:2012 clause 4.4.1, Rsi 0.25 m2K/W for surface condensation and mould on opaque elements: https://cdn.standards.iteh.ai/samples/51615/261e3f395b8a425983c1eb1a5f05d3ca/ISO-13788-2012.pdf"
    pvc: "Rigid PVC at about 0.16 W/mK (est.)"
    h200: "Divinycell H200 PVC foam, 0.305 Btu in/(ft2 h F), 0.044 W/mK (EN 12667), and 653 psi, 4.5 MPa, minimum compressive strength: https://diab-media.azureedge.net/clwjnze4/diab-divinycell-h-may-2026-rev26-imp.pdf"
    ms: "MS polymer adhesive about 0.30 W/mK (est.)"
    foam: "Closed-cell foam, polyethylene or EPDM, about 0.035 W/mK (est.)"
    films: "ISO 6946 surface resistances for a wall, Rsi 0.13 and Rse 0.04 m2K/W, as BRE's BR 443 (2019) gives them: https://www.cibse.org/media/wzrjrf3l/conventions-for-u-value-calculations.pdf"
    xps: "XPS 0.035 W/mK, a little above the 0.034 W/mK Kingspan gives its best XPS boards, for the thin layer behind the member (est., report 19 used 0.031): https://www.insulation.kingspan.com/gb/en/products/insulation-boards/roof-insulation-boards/kingspan-greenguard-gg500"
    grp: "GRP skins 0.30 W/mK, report 19 section 1 (est.)"
    aluminium: "6060-T5 200 W/mK, below the 209 W/mK in Aalco's 6060-T5 data sheet: https://www.aalco.co.uk/datasheets/Aluminium-Alloy6060-T5--Extrusions_144.ashx"
    air: "Still air in the member's 19 mm hollow, 0.15 W/mK effective (est.). The aluminium round it carries nearly all the heat, so the figure barely matters"

# ---------------------------------------------------------------- the awning on the roof's kerb edge (BDY-11, BDY-23)
# The Fiamma F80s 400 (BD-13) sits on five 4 mm aluminium angle brackets along its case. Each bracket bolts through the
# roof's kerb-edge insert strip with two Panelok APLB-1024 bolts and APLN-1016 T-nuts, whose grip, 38.1 to
# 54.3 mm, takes the 40 mm roof, the 4 mm bracket and a 2 mm EPDM pad under it, 46 mm in all (F3-06: the APLN-1010's
# 37.5 to 44.4 mm left 0.4 mm). Nylon shoulder washers and Duralac on the shanks keep the zinc-plated steel bolts off the
# aluminium bracket and the roof's skin. Rivtec rates every Panelok at 14 kN shear
# and 20 kN tension, from tests in various panels, and Rivetlab sells them in Australia. BDY-11 allows half of it, then
# a pull test in the real roof (LR-09). Fiamma tells owners to close the awning in wind and to peg its legs, but gives no
# speed. The operating rule closes it before gusts reach `close_kmh`, Beaufort force 5, and the fixing is checked at
# `check_kmh`, the top of force 7, for a gust that comes before it is closed.
awning:
  line: BD-13
  bolt: "Panelok APLB-1024 with an APLN-1016 T-nut on a 2 mm EPDM pad"
  brackets: 5
  bolts_per_bracket: 2
  bolt_pitch_mm: 90            # the bracket's two bolts across the roof, inboard and outboard (est.)
  canopy_lever_mm: 120         # where the canopy leaves the case, outboard of the inner bolt (est.)
  cog_lever_mm: 75             # the case's centre of gravity outboard of the inner bolt (est.)
  rated_tension_n: 20000
  rated_shear_n: 14000
  canopy_m2: 9.7               # 3,880 x 2,500 mm (BD-13)
  cpn: 1.5                     # net pressure coefficient on the open canopy, up or down (est.)
  close_kmh: 40                # the operating rule: closed before gusts reach 40 km/h
  check_kmh: 60                # the fixing check: a 60 km/h gust with the canopy open and the legs pegged
  extension_mm: 2500           # Fiamma's F80s 400 extension (BD-13)
  canopy_drop_mm: 40           # the canopy leaves the case 40 mm above the roof's top skin (est.)
  leg_max_mm: 2686             # the 370 to 450 leg 98667-04 at full reach (est., below)
  leg_head_mm: 40              # the leg's top fitting to the lead bar's underside (est.)
  pitch_deg: 10                # the canopy's fall from the case to the lead bar on level ground, set by the legs
  src:
    panelok: "https://rivtec.co.nz/content/AP-Panelok-Lockbolts-Steel.pdf"
    supply: "https://rivetlab.com/collections/panelok"
    beaufort: "Force 5, fresh breeze, 17 to 21 knots, and force 7, near gale, 28 to 33 knots: https://weather.metoffice.gov.uk/guides/coast-and-sea/beaufort-scale"
    leg: "The F80s 370 to 450 leg is 98667-04 (https://nomadicsupply.com/fiamma-f65s-f80s-370-450-awning-right-side-support-leg-98667-04a/), the same part as on the F80L 450 to 600 for large motorhomes (https://www.fritz-berger.de/artikel/fiamma-stuetzfuss-rechts-fuer-f65s-f65l-f80s-f80l-fiamma-artikelnummer-98667-04a-285759). Its length is not published. It ships in the same 63 in carton as the 320's leg 98667-03, which extends to 105.75 in, 2,686 mm (https://nomadicsupply.com/fiamma-f80s-320-awning-replacement-right-side-support-leg-98667-03a/), so that figure is taken"

# ---------------------------------------------------------------- the body box for the twist (report 12 section 4)
# The fixed roof is bonded into a roof-to-wall joiner, so the body is one closed cell (report 18 section 2). The lower
# bound neglects the roof joint, as report 12 did for the latched lid.
twist:
  roof_joint_factor: 1.0       # the bonded roof acts with the walls (upper bound)
  bond_shear_strength: 1.5     # MS polymer in shear, MPa (Sikaflex-552 class, assumption)
  bond_tension_strength: 2.0   # MS polymer in tension, MPa (assumption)
  bond_width: 30               # bond width in each joiner leg

# ---------------------------------------------------------------- body mounts (report 12 section 4)
mounts:
  fastener: "Lindapter Hollo-Bolt HB10-3, hot-dip galvanised, grip 41 to 60 mm"
  swl_tension_n: 8500          # Lindapter safe working load, factor 5 on ultimate, S275 hollow section
  swl_shear_n: 10000
  hole: 18                     # clearance hole for HB10
  collar: 28                   # bearing diameter of the flared sleeve on the inside of the wall (estimate)
  face_b: 50                   # raiser and outrigger top face width
  face_t: 3
  fy: 450
  per_station: 4               # one into each raiser, one into each outrigger tip
  design: nut_plate            # the M12 nut-plate fixing below is the design (CH-P14 is in the chassis). The HB10 is reported for comparison
  outrigger_tip_y: 1140
  source: "https://www.abbots-uk.com/files/ww/lindapter-type-hb-datasheet.pdf"
  # Fallback (report 12 open question 5), used because the HB10 does not pass under LC5a and LC5b: an M12 8.8 hot-dip
  # galvanised bolt into a 10 mm nut plate welded inside the raiser or the outrigger tip before galvanising (CH-P14),
  # with a bonded 100 x 100 x 3 mm aluminium spreader on the floor and a GRP crush tube through it.
  fallback:
    name: "M12 8.8 HDG bolt into a 10 mm nut plate welded inside the raiser or outrigger tip (CH-P14)"
    As: 84.3
    fu: 830
    bolt_factor: 3.0            # working load at most a third of the bolt's ultimate tension (ARTSA's static factor)
    plate: {l: 80, w: 44, t: 10, fy: 350, span: 44}   # spans between the RHS webs inside the 50 mm face
    weld: {leg: 4, length: 160, fuw: 490}             # two 80 mm fillets
    spreader: {side: 100, skin_shear: 60, insert_shear: 6}   # punching round the spreader: floor top skin and the HD PVC insert (assumptions)

# ---------------------------------------------------------------- the end walls as the box's diaphragms (report 12 section 5)
# The rear wall carries the wet room door, the rinse box, the relief valve and the extract fan. It closes the box's rear
# end and racks in shear under the twist the floor bolts put into the box's rear half. cad/body.py takes its shear width
# as the wall less the openings at the worst height (the door, the rinse box and the relief valve together).
end_wall:
  from_openings: true

# ---------------------------------------------------------------- openings (report 12 sections 5 and 7, report 18 section 4.1)
# Side walls: x is measured along the trailer from the body front (X = body_x0 + x), z from the floor surface. The front
# and rear walls: y across from the centreline (positive to the road side). Sizes are the cut-outs. The
# two doors follow the layout's blocks (BD-07, BD-15). `line` names the mass schedule line that carries the part. Glands of 60 mm or less (fill, PV, refrigerant lines, the
# outlet box G3, the battery vents through the floor) are not openings. G2's 310 x 120 mm box of inlets is larger, so
# cad/body.py counts it as an opening from data/services.yaml (F4-05).
# `proj` is how far a side-wall opening's frame, sash, hood or handle stands proud of the wall's outer skin, mm, for the
# overall width (DIM-01, DIM-05, `width` below). The S4 figure is the maker's drawing. The others are estimates.
openings:
  # kerb side, front to rear
  - {id: OP-01, wall: kerb, line: WN-01, name: "Window W1, Dometic S4 900 x 600 over the bed, the second way out", x: 379, z: 960, w: 902, h: 599, proj: 21}
  - {id: OP-02, wall: kerb, line: BD-07, name: "Entry door, Aussie Traveller DC 1,750 x 622, 90 mm top radius", x: 1640, z: 0, w: 625, h: 1753, from: BD-07, proj: 40}
  - {id: OP-03, wall: kerb, line: VE-01A, name: "LUNOS e2 fan A, high over the dryer", x: 2880, z: 1500, w: 162, h: 162, proj: 30}
  - {id: OP-04, wall: kerb, line: BD-17, name: "Thetford cassette service door 2680584", x: 3660, z: 150, w: 450, h: 290, proj: 15}
  # road side, front to rear
  - {id: OP-05, wall: road, line: WN-02, name: "Window W2, Dometic S4 900 x 450 over the bed", x: 379, z: 960, w: 902, h: 448, proj: 21}
