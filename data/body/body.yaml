# ---------------------------------------------------------------- overall width (DIM-01, DIM-05)
# ADR 43/04 clause 6.2.6.1 caps a trailer's overall width at 2,500 mm, and VSB1 section 5.2 says the same. The ADR
# definition (Definitions and Vehicle Categories, amendment 7) measures across the body including wheel guards and
# excludes rear vision mirrors, signalling devices and side-mounted lamps and reflectors. VSB1 5.2's note counts
# mudguards, side-mounted spare wheels, racks and awnings and excludes lamps required for compliance. So the side
# marker lamps and their reflectors (SM-01) are left out, and every frame, sash, hood, cowl, handle and box on a side
# wall counts. The design stays at or under `design_max_mm`, so the build tolerance cannot take it over 2,500 mm.
width:
  design_max_mm: 2490
  joiner_proj: 3               # the floor and roof-to-wall joiners wrap the panel edges, about 3 mm proud of the skin (est.)
  excluded: "side marker lamps with their reflectors (SM-01)"
  sources:
    adr: "https://www.legislation.gov.au/F2006L01430/2025-01-30/2025-01-30/text/original/pdf"
    definition: "https://www.legislation.gov.au/F2014L00032/asmade/2014-01-06/text/original/pdf"
    vsb1: "https://vehiclecompliance.net/wp-content/uploads/2023/10/VSB1-Trailers-with-an-aggregate-trailer.pdf"
  # where each opening's `proj` comes from
  proj_src:
    S4: "Dometic Seitz S4 technical drawing (DOK 1004/070101): the closed sash stands 11 to 21 mm proud of the wall, the larger figure taken. https://www.motorhomefun.co.uk/forum/attachments/02_s4-window-pdf.400320/"
    door: "Estimate: the DC door's outer frame and handle, at most the 40 mm that UN R26 allows a door handle, the guide report 12 takes for ADR 92/00 clause 5.1"
    hood: "Estimate: a low hood, cowl or louvre, 30 mm proud. Ask for that depth or less when buying"
    service_door: "Estimate: the Thetford door's frame and lock"

# ---------------------------------------------------------------- the floor round its cut-outs (BDY-26, review I2-27)
# Every cut-out over 60 mm in the floor (data/services.yaml `cutouts`, the services' list: the transit frames G9, G15 and
# G20) has a high-density insert laid into the core round it by the floor maker (TRAILER.md open point 11), wide enough
# for the frame's 8 mm rim and its screws (est.). The skins and the insert at the cut-out's edge carry Kirsch's 3.0, the
# factor of a round hole in a plate, a lower bound for a rectangular cut-out with its corners radiused, which the frame
# bonded into it and its insert stiffen (est.), and the H80 beyond the insert the same field fallen off as Kirsch's
# solution falls, the cut-out taken as a hole of half its mean side. Where a cut-out takes a raiser's bearer strip away,
# the floor bridges the gap along the raiser, a foot at its middle, and bears on the insert at the gap's ends.
cutouts:
  insert: {name: "Divinycell H200", width: 30, shear: 3.20, compression: 4.50,
           src: "Diab Divinycell H datasheet rev 26, May 2026: 464 psi shear and 653 psi compression, the minimum values"}
  kt: 3.0
  corner_r: 10                 # (est.) every cut-out's corners radiused 10 mm, and each frame's outer corners to suit

rules:
  between_mm: 300              # full-height wall between neighbouring openings (assumption, report 12 section 5)
  edge_mm: 150                 # from an opening to a panel edge or corner
  rear_corner_mm: 300          # no opening within 300 mm of the rear corners (report 12 section 5)
  gland_mm: 60                 # a gland larger than this is an opening (G2's 310 x 120 mm box, F4-05)

# ---------------------------------------------------------------- the joiners at the wall members' ends (BDY-22, F4-01)
# The floor joiner wraps the wall's foot: its base under the bottom edge, its outer leg up the outer skin and its inner
# leg up the inner skin with a flange over the floor, 32 mm up and 2 mm thick (CT-202 detail A, est.). The roof joiner's
# inner leg runs down the inner skin over the wall's 25 mm top insert strip (detail C, est.). Every joiner's inside face
# is covered with closed-cell foam under the lining and the skirting (report 19's rule for the corner and roof joiners,
# extended to the floor joiner and taken at ISO 13788's Rsi, F4-01).
joiners:
  floor: {inner_leg_mm: 34, outer_leg_mm: 40, t_mm: 2}
  roof: {inner_leg_mm: 16, t_mm: 2}
  top_strip_mm: 25
  cover: {t_mm: 15, k: foam}

# ---------------------------------------------------------------- the side walls as plates (BDY-24, BDY-25, F4-04)
plate: {step_mm: 20, corner_mm: 50}   # the core's shear is read 50 mm or more from a cut-out's corner, where a re-entrant corner concentrates it
# the members' rigid PVC bearing blocks and head pads (est.): uPVC about 3 GPa, 1.1 GPa in shear and 35 MPa shear strength
blocks: {E: 3000, G: 1100, shear_mpa: 35}

# ---------------------------------------------------------------- wall members against the openings (FIT-07, F3-02)
# Each member stands at least `clear_mm` from every cut-out, gland and insert strip on its wall, so the panel maker can
# rout its channel with XPS between. The doors' and windows' cut-outs carry `strip_mm` insert strips round them. The
# exception, F4-02: W1 and W2 sit between the bed's hardpoints, 27 to 28 mm from each, and a Dometic S4's outer and inner
# frames screw to each other through the cut-out and clamp the panel. So each of their sides takes a bonded Divinycell
# H200 insert that fills the core from the cut-out to the hardpoint, in the hardpoint's own routed channel: the clamp
# bears on a solid edge, as at every other opening, and no thin fin of XPS is left to rout. The members, the kitchen
# tower's sides, the partition and the end walls keep every side-wall bay within the members' pitch.
members_rule:
  members: [BD-18, BD-19, BD-20]
  clear_mm: 25
  strip_mm: 70
  strip_lines: [WN-, BD-07, BD-15, BD-17]
  side_inserts: {openings: [OP-01, OP-05], min_mm: 20}
  # F5-03: members closer than clear_mm share one routed channel with an H200 fill bonded between them, so no thin fin
  # of XPS is left to rout. BD-20 stands 16.5 mm behind the bed's rear kerb-side hardpoint
  shared_channels: [[BD-20, LB-04.4]]
  bounds: [LA-11T, WR-03]
  hardpoints_at: LB-04
  # horizontal fixing strips, each stopped clear_mm short of every member it meets: the lockers over the washer and
  # dryer, and the bench's and the tower's backs on the road wall (CT-104). The members' heads stop end_gap_mm under the
  # wall's top insert strip
  strips:
    - {block: LA-11L, name: "the lockers' insert strip"}
    - {block: LA-11B, name: "the bench's insert strip"}
    - {block: LA-11T, name: "the tower's insert strip"}
