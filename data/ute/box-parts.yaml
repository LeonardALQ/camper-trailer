  subframe_mounts: Steel anchor crossmembers, mounts and their isolation
  fasteners_sealants: Bolts, rivet nuts, isolation, sealant
  doors: Hinges, locking gear, latches, struts, seals
  security: Padlocks, disc locks, anchors, tracker and alarm
  restraint: Chocks, track, fittings, straps, loops, pads
  loading: Ramp, winch and its power, freight for imported items
  services: Ventilation, fume detection, light, power, lamps, extinguisher
  finish: Floor coating and roof coating
  tools: Tool chests on the wheel tubs
  welding: Leonard's welding gas, filler, tungsten and abrasives, the laboratory tests of his weld coupons and the gauges for the proof load on Ford's pads
