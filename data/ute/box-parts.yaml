# Bike box parts list (report 24, 20 Nov 2026, UTE-GARAGE.md revision C, revision D of 21 Nov 2026: the rear tub flares,
# decision H19, and revision F of 23 Nov 2026: the box on the Ford Ranger Super Duty's body mounting pads in place of the
# LandCruiser VDJ79's deck mount brackets). The enclosed welded aluminium box on the Super Duty's frame.
# Decision H25, 22 Nov 2026: Leonard builds the box himself and it is not certified, so the shop labour (was BX-X01) and
# the engineer's review (was BX-E01) are gone and the box has one total. The design checks stay. The welding group
# (BX-W01 to BX-W08, 22 Nov 2026) prices what the shop's line used to cover and the box's own proof: Leonard's gas,
# filler, tungsten and abrasives, the laboratory tests of his weld coupons and the gauges for the proof load on Ford's pads.
# The ute-garage page renders it (cad/sitedata.py), and cad/tests/test_box_parts.py checks that the lines add up to the
# totals below and to the model's box mass (UGB-01).
# One entry per line. mass.kg is the mass the line adds to the fitted box, not the mass of stock bought. model_part
# names the part in data/ute/parts that carries that mass in the model. Lines whose mass sits in another line say so
# in mass.src.
# Prices: AUD including GST. Foreign prices converted at 1 USD = 1.55 AUD, 1 GBP = 1.98 AUD, plus 10 % GST on
# import, and marked converted. UK prices are taken ex VAT (listing / 1.20) before conversion.
# Basis: listing (a published price), estimate (est., basis in the note), converted (foreign listing).
# 6061-T6 extrusion prices are estimates: All Aluminium (Melbourne) stocks the sizes only in 6060-T5, so its listing
# is raised 25 % for the structural alloy (assumption, to be replaced by a Capral or Ullrich quote).
schema_version: 1
