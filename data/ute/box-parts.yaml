# Bike box parts list (report 24, 20 Nov 2026, UTE-GARAGE.md revision C, and revision D of 21 Nov 2026: the rear tub flares
# for the Elite's 1,555 mm rear track, decision H19). The enclosed welded aluminium box on the LandCruiser VDJ79's frame.
# The ute-garage page renders it (cad/sitedata.py), and cad/tests/test_box_parts.py checks that the lines add up to the
# totals below and to the model's box mass (UGB-01).
# One entry per line. mass.kg is the mass the line adds to the fitted box, not the mass of stock bought. model_part
# names the part in data/ute/parts that carries that mass in the model. Lines whose mass sits in another line say so
# in mass.src.
# Prices: AUD including GST. Foreign prices converted at 1 USD = 1.55 AUD, 1 GBP = 1.98 AUD, plus 10 % GST on
# import, and marked converted. UK prices are taken ex VAT (listing / 1.20) before conversion.
# Basis: listing (a published price), estimate (est., basis in the note), converted (foreign listing).
# 6061-T6 extrusion prices are estimates: All Aluminium (Melbourne) stocks the sizes only in 6060-T5, so its listing
# is raised 25 % for the structural alloy (assumption, to be replaced by a Capral or Ullrich quote).
schema_version: 1
currency: AUD
date_checked: 2026-11-20
fx: {USD: 1.55, GBP: 1.98, EUR: 1.68, gst_on_imports: 0.10}
groups:
  materials: Sheet, plate and extrusions, cut and welded by the fabricator
  subframe_mounts: Steel anchor crossmembers, mounts and their isolation
  fasteners_sealants: Bolts, rivet nuts, isolation, sealant
  doors: Hinges, locking gear, latches, struts, seals
  security: Padlocks, disc locks, anchors, tracker and alarm
  restraint: Chocks, track, fittings, straps, loops, pads
  loading: Ramp, winch and its power, freight for imported items
  services: Ventilation, fume detection, light, power, lamps, extinguisher
  finish: Floor coating and roof coating
  tools: Tool chests on the wheel tubs
  fabrication: Shop labour
  compliance: Engineering review. The LC5 inspection is counted once, in the car build's GV03 (data/vehicle/vehicle-parts.yaml)
