# Checks for the ute's bike garage (UTE-GARAGE.md), measured on the B-rep model of data/assemblies/ute-garage.yaml.
# The clearance limits are DESIGN.md's (the trailer garage's CLR-03, CLR-04 and CLR-09) and Toyota's wheel house
# clearances (BBGJ1007 p. 28). Limits are never changed to make a check pass. cad/ute_garage.py adds the deck mount
# loads and the ramp angle, which are computed rather than measured.
checks:
  - id: UGF-01
    title: Roof skin between the bows holds highway suction and drains on its 1:50 fall, and carries no step or kneeling
    type: roof
    roof:
      speed_kmh: 110      # highway speed, still air
      cp: 1.5             # suction behind the 380 mm step over the cab's roof (est., the review's 1.0 to 1.5, the larger)
      E_mpa: 70300        # 5052
      fy_haz_mpa: 65      # welded 5052-H32 at O temper (UTE-GARAGE.md section 3), at the bow's weld
      fy_mpa: 160         # 5052-H32 parent metal, for the knee's yield-line load
      fall: 50            # the bows fall 1:50 from the crown to each side
      water_kpa: 0.1      # a 10 mm film of standing water
      knee_kn: 1.1        # a person kneeling: AS/NZS 1170.1's concentrated load on roof cladding
      # F3-04: at every bow behind the first the skin is rivet-bonded with no welds, so no heat reaches the bead: a
      # Sikaflex-252 bead and sealed blind rivets through it. The rivets alone are checked for the skin's membrane tension
      # in shear and the suction's pull in tension, at half their rating, as if the bead had let go
      bond: {name: Sikaflex-252, lap_shear_mpa: 2.5, width_mm: 15, factor: 0.5,
             src: "Sika's product data sheet, tensile lap-shear strength 2.5 MPa (ISO 4587): https://industry.sika.com/content/dam/dms/us01/o/sikaflex-252.pdf",
             pretreat: "the 5052 abraded with a very fine pad, cleaned, then Sika Aktivator-100, Sika's pre-treatment for aluminium (AlMg3 and similar) under 1-part polyurethanes: https://aus.sika.com/dam/dms/au01/2/Pre-treatment_Chart_1C_PU_2020.pdf"}
      rivets: {name: "4.8 mm sealed (closed-end) domed blind rivets, AlMg5 body and A2 stainless mandrel", pitch_mm: 75, tensile_n: 3070, shear_n: 2230,
               factor: 0.5, bearing_fu_mpa: 215,
               src: "JC Fasteners E8D35G, dome head closed end, Al-Mg 5 body, AISI 304 mandrel, 4.8 mm: shear 2,230 N, tensile 3,070 N: https://www.jcfasteners.com/wp-content/uploads/Blind-Rivet-Closed-DH-E8D35G-AL-SS.pdf"}
    severity: fail
    inputs: []
    why: "The 1.6 mm roof skin is welded continuously along the front edge, the first bow and its butt joints, and rivet-bonded along every other bow: a Sikaflex-252 bead on 5052 pre-treated to Sika's chart, with sealed blind rivets (aluminium body, stainless mandrel) through it at 75 mm and no welds there, so no heat reaches the bead (F3-04). Between the bows it works as a held strip: highway suction drums it and membrane tension carries most of the load to the bows, where the welded bow has softened the sheet and the bead takes the tension in shear. The bead is checked at half its lap-shear strength, as BDY-19 checks the trailer's bonded roof, and the rivets alone at half their rating as if it had let go. With the bows' 1:50 fall, water runs off before it can pond. A kneeling person, 1.1 kN on roof cladding in AS/NZS 1170.1, would dent the sheet, so the roof carries no step and no kneeling, on a label on the roof (BX-C03), on CT-701 and in UTE-GARAGE.md. Hail dents any gauge"
  - id: UGC-01
    title: Tuareg to Street Triple, anywhere
    type: clearance
    a: [TU]
    b: [ST]
    min_gap_mm: 30
    severity: fail
    inputs: [TU-01, TU-05, TU-07, ST-01]
    why: The trailer's CLR-03. The bikes stand side by side at the trailer's spacing, so the same pairs govern.
  - id: UGC-02
    title: Each bike to the walls, roof, wheel tubs, closed doors and everything stowed in the box
    type: clearance
    each: [TU, ST]
    b: [B2, B3, B5, B6, D1, D3, D4, "14", 14P, R1, V2, V3, V5, K2, K3, T1, T2]
    min_gap_mm: 15
    severity: fail
    inputs: [TU-05, TU-07, ST-01, CHK-01]
    why: The trailer's CLR-04. Bars, pegs, panniers, belly pans and tyres must not touch the walls, the roof bows, the tubs, the closed barn doors and kerb door, the winch, the stowed ramp, the extinguisher, the tool chests, the trailer's ground anchors or the chain anchors.
  - id: UGC-03
    title: Each bike rolled straight back clears the barn door opening
    type: clearance
    each: [TU, ST]
    b: [C5]
    min_gap_mm: 15
    severity: fail
    inputs: [TU-01, TU-03, TU-05, ST-01]
    why: The trailer's CLR-09. Each bike unloads backwards through the barn doors, so it must pass the portal round the opening. Going down the ramp the bike pitches nose-up about its front tyre, which only lowers the parts behind the front axle.
  - id: UGC-04
    title: Tuareg with the photo-measured 2,263 mm length to the stowed ramp and the closed leaves
    type: clearance
    a: [TU-2263]
    b: [R1, D1]
    min_gap_mm: 15
    severity: report
    inputs: [CHK-01]
    why: Reported, as the trailer's CLR-06b. Aprilia's image shows the plate hanger further back than the owner's 2,220 mm.
  - id: UGC-05
    title: Tuareg with the photo-measured 1,390 mm screen to the roof bows and the header
    type: clearance
    a: [TU-1390]
    b: [B5, B6]
    min_gap_mm: 15
    severity: report
    inputs: [TU-03, TU-04]
    why: Reported. The model uses the owner's 1,370 mm height.
  - id: UGC-06
    title: Tuareg's panniers to the straps and track fittings
    type: clearance
    a: [TU-BAGS]
    b: ["12", "13"]
    min_gap_mm: 0
    severity: report
    inputs: [TU-05, TU-06]
    why: As the trailer's CLR-08. A strap must not pass through a bag. No limit is set, so the gap is reported.
  - id: UGW-01
    title: Rear tyres at full bump to the wheel tubs, the flares and the floor structure
    type: clearance
    each: [C4R, C4K]
    b: [B1, B2, B5, B7, S1, S2, S4, S5, S6]
    min_gap_mm: 25
    severity: fail
    inputs: []
    why: Toyota BBGJ1007 p. 28 asks for 25 mm above the tyre at full bump. The tyre sweep runs from static up 110 mm of bump travel (estimate), so this also covers the tub ends and the outriggers either side.
  - id: UGW-02
    title: Rear tyres to the inboard wall of each tub, the runners and the mounts
    type: clearance
    each: [C4R, C4K]
    b: [B2.R-in, B2.K-in, S1, S7, S8]
    min_gap_mm: 40
    severity: fail
    inputs: []
    why: Toyota BBGJ1007 p. 28 asks for 40 mm inside the tyre.
  - id: UGW-03
    title: Rear tyres to the side wall skins and the rear tub flares
    type: clearance
    each: [C4R, C4K]
    b: [B3.road, B3.kerb, B7]
    min_gap_mm: 30
    severity: fail
    inputs: [VEH-28, BOX-20]
    why: Toyota BBGJ1007 p. 28 asks for 30 mm outside the tyre. The Elite's 1,555 mm rear track puts the tyre 11 mm from the 1,850 mm body's skin, so the side wall over each rear tub is a flare 20 mm further out (decision H19).
  - id: UGR-01
    title: Worst strap load within the strap's 500 kg lashing capacity, report 03's load cases
    type: restraint
    restraint: {factor: 2.0, share: 0.6, lc_kg: 500, cases: {forward_g: 0.8, rearward_g: 0.5, lateral_g: 0.5, up_g: 1.0},
                cg_z: {TU: 700, ST: 600}}
    severity: fail
    inputs: []
    why: The trailer's RES-01 method, which report 17 keeps for the ute. The NHVR's 2025 Load Restraint Guide keeps the 2018 performance standards, multiplied here by report 03's off-road factor of 2, with 1.0 g upward. Each anchor withstands its strap's breaking load, about 9.8 kN for LC 500 kg (UGR-02, UGR-03).
  - id: UGK-01
    title: The load path from the track to Toyota's brackets touches without overlap, and the box sits on the subframe
    type: contact
    pairs:
      - [10.TU, B1]
      - [10.ST, B1]
      - [11.front, S3.front]
      - [11.rear, S3.rear]
      - [S3.front, S2.front]
      - [S3.rear, S2.rear]
      - [S2.front, S7.1R]
      - [S2.front, S7.1K]
      - [S2.rear, S8.6R]
      - [S2.rear, S8.6K]
      - [S7.1R, C1.1R]
      - [S8.6K, C1.6K]
      - [S1.R-mid, S7.2R]
      - [S1.K-mid, S8.5K]
      - [B1, S4.1]
      - [B1, S9.front-a]
      - [B1, S9.rear-b]
      - [S9.front-a, S3.front]
      - [S9.rear-b, S3.rear]
      - [T1.road, B2.R-top]
      - [T1.kerb, B2.K-top]
      - [S1.R-mid, C2.R]
      - [S2.front, C2.K]
    tolerance_mm: 0.01
    severity: fail
    inputs: []
    why: The anchors must reach steel (UTE-GARAGE.md). Each L-track row sits on its packer on a steel crossmember, which bolts through its mounts to Toyota's brackets, and parts that carry load must touch their supports with no overlap.
