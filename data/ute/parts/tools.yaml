# Tools, stowed low in the box: a chest on each wheel tub, beside each bike's middle and ahead of the bikes' rear
# straps. The outer front straps run through the box's front corners, so the chests cannot go there.
group: ute-tools
parts:
  U-TOOLBOX:
    name: Tool chests
    material: "Aluminium sheet, 1.6 mm"
    product: 1.6 mm aluminium chest with a lid, bolted to the wheel tub, 780 mm long and 200 mm high
    maker: Owner made or to choose
    qty: 2
    unit: each
    mass: {basis: declared, unit_kg: 5.0, maturity: estimate, source: "About 0.9 m2 of 1.6 mm aluminium at 4.3 kg/m2 plus hinges and a latch (estimate)"}
    size: 780 x 270 x 200 mm on the road side (42 L) and 780 x 220 x 200 mm on the kerb side (34 L). The road-side chest lost 30 mm when the tubs moved out with the Elite's rear track
    notes: The kerb-side chest sits under the kerb door's sill, so it is reached through that door with the bikes in. The road-side chest is reached with the Tuareg out.
    geometry: {generator: box, params: {}}
    color: "#6c5ce7"
  U-TOOLS:
    name: Tools and recovery gear
    product: The owner's tools, spares and recovery gear
    maker: Owner
    qty: 1
    unit: set
    mass: {basis: declared, total_kg: 60, maturity: estimate, source: "Report 17 open question 5: 60 kg (estimate)"}
    payload: true
    notes: Carried in the two chests. 60 kg in 76 L is dense, so bulky recovery gear may need the space beside the ramp. Weigh and measure the real kit.
    cog: {at: ["tool_x0 + tool_l / 2", "((half_width - 10 - tool_w / 2) * tool_w - (half_width - 10 - tool_wk / 2) * tool_wk) / (tool_w + tool_wk)", "tool_z0 + tool_h / 2"],
          basis: "Volume-weighted centre of the two chests"}
  U-TIEDOWN:
    name: Trailer tie-down straps
    product: Four 50 mm ratchet straps, lashing capacity 2,500 kg
    maker: To choose
    qty: 1
    unit: set
    mass: {basis: declared, total_kg: 6.4, maturity: estimate, source: "About 1.6 kg a strap (estimate). Priced with the trailer's lashing points, CH-B02"}
    payload: true
    notes: For the parked trailer when strong gusts are forecast (STB-05). They ride in the chests while towing and stay with the trailer, with the ground anchors, whenever the ute is unhitched for more than a day.
    cog: {at: ["tool_x0 + tool_l / 2", "((half_width - 10 - tool_w / 2) * tool_w - (half_width - 10 - tool_wk / 2) * tool_wk) / (tool_w + tool_wk)", "tool_z0 + tool_h / 2"],
          basis: "In the two chests, as U-TOOLS"}
  U-ANCHORS:
    name: Trailer ground anchors
    product: "Four Tie Down Engineering 59099 ground anchors (model M607, 3/4 in rod, 60 in, one 7 in helix), four Tie Down 59286 stabilizer plates, 17-1/2 x 13-1/2 in, Tie Down's 59200 Soil Test Probe Kit (the probe, a torque wrench and its adapter, the kit's case left at home) and a 900 mm turning bar, in a bag with two 25 mm ratchet straps to lash it down"
    maker: Tie Down Engineering
    qty: 1
    unit: set
    mass: {basis: declared, total_kg: 38.6, maturity: estimate, source: "The 59099 about 4.0 kg each from its rod's steel and the 30 in model's 4.79 lb listed weight, the 59286 plate about 3.4 kg each from 12 gauge steel, the probe kit about 4.5 kg, the bar 3.5 kg and the bag with its straps 1.0 kg (estimates). Priced with the trailer's lashing points, CH-B02"}
    payload: true
    notes: STB-05 checks them at their listed working load as installed with their plates (F5-01). Too long for the chests, so they ride in their bag, about 1,760 x 345 x 230 mm (est.), on the box floor between the bikes, the anchors staggered along it so that no rod passes a neighbour's helix, the plates flat in its base and the probe and the torque wrench out of the kit's 65 in case, which stays home. Two 25 mm ratchet straps of LC 250 kg (est.) lash the bag to the L-track either side, and it is loaded last through the rear doors (T2, F5-05, F6-03). They stay with the trailer, with the straps, whenever the ute is unhitched for more than a day.
    geometry: {generator: box, params: {}}
    color: "#636e72"
