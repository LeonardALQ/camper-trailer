# Ute garage context parts: what the box sits on and the solids the checks measure against. No BOM mass.
group: ute-context
parts:
  U-LEAF-OPEN:
    name: Barn door leaf, folded open against the side wall
    kind: context
    notes: Loading view only. The leaf's mass is U-LEAF.
    geometry: {generator: box, params: {}}
    color: "#c8d6e5"
    alpha: 0.6
  U-BRACKET:
    name: Ford body mounting pad on its bracket (envelope)
    kind: context
    notes: "Part of the Super Duty's cab chassis: four pairs on the single cab, 768, 891 and 506 mm apart, the pads' holes 1,244 mm apart across the truck (1,248 mm at the rear pair) and their tops 12 mm over the rail top (6 mm at the rear pair) (BEMM pp. 125 and 128, est. reading of the figures). Taken as a bracket from the rail's outer face out to the pad. Measure on the truck (BOX-04)."
    geometry: {generator: box, params: {}}
    color: "#1c2833"
  U-GROUND:
    name: Assumed ground for loading
    kind: context
    geometry: {generator: box, params: {dx: 3600, dy: 1500, dz: 10}}
    color: "#a3b18a"
    alpha: 0.5
  U-TYRE-SWEEP:
    name: Rear tyre from static to full bump (check only)
    kind: context
    notes: The LT275/70R18 tyre's 842 x 282 mm envelope from its static position laden at GVM up 74 mm of bump travel (est., from Ford's wheelhouse envelope, data/assemblies/ute-garage.yaml rear_bump).
    geometry: {generator: tyre_sweep, params: {radius: 421, width: 282, rise: 74}}
    color: "#ff0000"
    alpha: 0.2
  U-SWEEP:
    name: Barn door opening swept along the box (check only)
    kind: context
    notes: A bike rolled straight back clears the portal if it clears this solid.
    geometry: {generator: sweep, params: {}}
    color: "#ff0000"
    alpha: 0.2
