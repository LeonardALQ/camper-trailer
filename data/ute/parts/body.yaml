# Ute garage body (UTE-GARAGE.md, report 17 sections 2.5 and 6): a one-piece welded aluminium box, TIG-welded 5052-H32
# skins on a 6061-T6 SHS frame. Masses at 2.68 g/cm3 for 5052 sheet and 2.70 g/cm3 for 6061 tube, so the per-area and
# per-length figures are calculated and the model measures the area and length of every body.
group: ute-body
parts:
  U-FLOOR:
    name: Floor plate
    material: "5052-H32 aluminium sheet, 4.0 mm, with the U-POL Raptor coating on top"
    product: 5052-H32 marine sheet, 4.0 mm, with cut-outs for the wheel tubs and the two L-track rows
    maker: All Aluminium (stock)
    part_no: Marine sheet 5052-H32 4.0 mm (MAT-03)
    qty: 4.0
    unit: m2
    mass: {basis: per_area, kg_per_m2: 10.72, maturity: calculated, source: "4.0 mm at 2.68 g/cm3. All Aluminium lists 30.9 kg per 2,400 x 1,200 mm sheet (report 17, MAT-03)"}
    size: 2,587.5 x 1,845 mm less the cut-outs
    notes: Welded to the wall frames and the tubs, and bolted down to the subframe through sealed holes. Coated with U-POL Raptor.
    geometry: {generator: panel, params: {}}
    color: "#9aa5ab"
  U-TUB:
    name: Wheel tubs
    material: "5052-H32 aluminium sheet, 3.0 mm"
    product: 5052-H32 sheet, 3.0 mm, folded and welded into the floor
    maker: Owner made
    qty: 0.9
    unit: m2
    mass: {basis: per_area, kg_per_m2: 8.04, maturity: calculated, source: "3.0 mm at 2.68 g/cm3"}
    size: 871 x 322 mm each, top 86.5 mm above the floor, 47.5 mm further out on the Elite's rear track
    rating: 25 mm over the tyre at full bump, 40 mm inside it and 30 mm fore and aft (Toyota BBGJ1007 p. 28)
    notes: The tub top carries the side wall's bottom rail and the post at 1,200 mm.
    geometry: {generator: panel, params: {}}
    color: "#7f8c8d"
  U-SKIN:
    name: Wall and front skins
    material: "5052-H32 aluminium sheet, 2.5 mm"
    product: 5052-H32 marine sheet, 2.5 mm
    maker: All Aluminium (stock)
    part_no: Marine sheet 5052-H32 2.5 mm (MAT-02)
    qty: 9.6
    unit: m2
    mass: {basis: per_area, kg_per_m2: 6.70, maturity: calculated, source: "2.5 mm at 2.68 g/cm3. All Aluminium lists 19.3 kg per sheet (MAT-02)"}
    size: Sides 2,590 x 1,504 mm, front 1,845 x 1,504 mm
    notes: TIG-welded to the frame. The kerb-side skin has the 1,200 x 1,000 mm opening for the lift-up door, and each side skin a 925 x 130.5 mm notch over the rear tub for the flare (U-FLARE).
    geometry: {generator: panel, params: {}}
    color: "#dfe6e9"
    alpha: 0.35
  U-FLARE:
    name: Rear tub flares
    material: "5052-H32 aluminium sheet, 2.5 mm"
    product: 5052-H32 marine sheet, 2.5 mm, folded into a channel over each rear tub and welded into a notch in the side wall skin
    maker: Fabricator
    part_no: Marine sheet 5052-H32 2.5 mm (MAT-02)
    qty: 0.29
    unit: m2
    mass: {basis: per_area, kg_per_m2: 6.70, maturity: calculated, source: "2.5 mm at 2.68 g/cm3, as U-SKIN"}
    size: 925 mm long, 20 mm out from the skin, 130.5 mm high from the floor's underside, each side
    rating: "Toyota BBGJ1007 p. 28: 30 mm outside the tyre (UGW-03). The box is 1,890 mm over the flares against UTE-09's 1,910 mm (decision H19)"
    notes: "The Elite's 1,555 mm rear track puts each rear tyre's outer face 911.5 mm out, 11 mm from the 1,850 mm body's skin. Over each tub the skin is cut away up to the top of the side wall's bottom rail, and the flare closes the opening 20 mm further out, so the tyre keeps 31 mm (report 26 fix A)"
    geometry: {generator: panel, params: {}}
    color: "#dfe6e9"
    alpha: 0.35
  U-ROOF:
    name: Roof skin
    material: "5052-H32 aluminium sheet, 1.6 mm"
    product: 5052-H32 marine sheet, 1.6 mm
    maker: All Aluminium (stock)
    part_no: Aluminium Marine Sheet 5052 H32 1.6mm 1200x2400
    qty: 4.8
    unit: m2
    mass: {basis: per_area, kg_per_m2: 4.29, maturity: calculated, source: "1.6 mm at 2.68 g/cm3"}
    size: 2,590 x 1,850 mm
    notes: "Not a load-carrying roof. Nothing is carried on it. 1.6 mm in place of revision C's 2.0 mm saves 5.1 kg, so the box stays under UGB-01's 440 kg. UGF-01 checks it, with the bows at most 640 mm apart"
    geometry: {generator: panel, params: {}}
    color: "#dfe6e9"
    alpha: 0.25
  U-FRAME:
    name: Body frame
    material: "6061-T6 aluminium square tube, 40 x 40 x 3"
    product: 6061-T6 square tube 40 x 40 x 3
    maker: All Aluminium (stock)
    part_no: Square tube 40 x 40 x 3 (MAT-04)
    qty: 40
    unit: m
    mass: {basis: per_length, kg_per_m: 1.20, maturity: calculated, source: "444 mm2 at 2.70 g/cm3. All Aluminium lists 7.8 kg per 6.5 m (MAT-04)"}
    size: Posts, rails, roof bows and the rear portal
    notes: The welds are sized to the softened strength next to each weld (report 17 section 2.5).
    geometry: {generator: tube, params: {wall: 3}}
    color: "#b2bec3"
  U-SEALANT:
    name: Seam and fastener sealant, roof bow adhesive
    material: "Sikaflex-291 polyurethane sealant, Sikaflex-252 polyurethane adhesive"
    product: Sikaflex-291 on stitched seams, floor penetrations and fasteners through the skin, and Sikaflex-252 along the roof bows
    maker: Sika
    qty: 1
    unit: set
    mass: {basis: declared, total_kg: 2.3, maturity: estimate, source: "With BX-F11's 0.3 kg of roof bow rivets (F3-04). Report 24 (data/ute/box-parts.yaml BX-F09) 1.5 kg and the roof bows' bead (BX-F10) 0.5 kg, estimates"}
    cog: {at: [1260, 0, 730], basis: "Spread over the seams, estimate"}
  U-ROOF-COAT:
    name: Roof top coating
    material: "White two-pack coating"
    product: White two-pack topcoat on the roof's top face
    maker: Product to choose
    qty: 1
    unit: set
    mass: {basis: declared, total_kg: 0.5, maturity: estimate, source: "Report 24 (BX-C02), estimate"}
    cog: {at: [1260, 0, top_z], basis: "On the roof, estimate"}
