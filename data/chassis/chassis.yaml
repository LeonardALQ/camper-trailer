# Chassis and drawbar design (CHASSIS.md), planning level, from research report 11 (research/11-chassis-design.md).
# Positions are in the project datum DIM-01: X rearward from the ball, Y positive to the road side, Z up from the ground,
# mm. Any number may be an expression over the trailer layout's parameters (assemblies/trailer.yaml, solved axle_x
# included) and the parameters here. cad/chassis.py builds the members, joints and fittings from this file, and
# cad/chassis_fea.py analyses them. Sections come from data/chassis/sections.yaml (report 11's table).
id: ASM-CH
name: Chassis and drawbar
revision: AA    # AA, 27 Nov 2026: the twin hinge crossmembers, two RHS 150 x 50 x 6 seam welded (CHS-20), the
                # webs under the hinge bars' fillets at their own stretch (xt_hinges `web`), the runs' and the cheeks' roots
                # in fatigue (FAT-26, FAT-27), the bars welded by 6 mm fillets in three 120 mm runs a side by the round's
                # fatigue rule, each tyre's side force within its grip and a held wheel at five headings in LC8a, and the
                # recovery limits found again at 40, 15 and 15 kN (CHASSIS.md revision AE, the conductor's working defaults).
                # Z, 27 Nov 2026: CHS-18 read in every case the hinge joint carries, VSB1's rig cases beside it and CHS-19,
                # the hinge crossmembers' bottom wall under the bars' front fillets from its plate model on its soft bound
                # (xt_hinges `bar` `wall`, cad/wall_plate.py) with FAT-25 at the fillets' toes, the coupling a pull point in
                # LC8a, and stronger joints studied (CHASSIS.md revision AD, the conductor's ruling of 27 Nov 2026).
                # Y, 27 Nov 2026: each weld run of the elastic hinge bars held at its welds' own stiffness and read on its own
                # (CHS-18), the cheeks' and fillers' flare bevels made by GMAW (CHS-14), the grey tank on bearers of its own
                # UF-08B bolted through the XT rear shock and rear crossmembers, which carry it and its grey water in the
                # frame model (CHS-17), and the recovery limits found again by their rule (I2-121 to I2-123).
                # X, 27 Nov 2026: each front hinge cheek welded to a filler CH-P18 under its crossmember's front half, which the
                # hinge bar's front face meets (xt_hinges `filler`), each cheek read at its own joint and share (CHS-14), the
                # hinge bars' weld runs read (CHS-18) and the bars and their plates reported (CHS-19), and the recovery limits
                # found again with every wheel free (LC8a `free_n`), one wheel held and an axle held (I2-118, I2-119).
                # W, 26 Nov 2026: both XT hinge crossmembers RHS 150 x 100 x 6, each with its rear face where it stood and 50 mm
                # wider forward, the hinge bars Cruisemaster's 50 mm flush with their rear faces, each front cheek run on under
                # its crossmember to its bar, and the three recovery limits found again by their rule (I2-93, I2-114).
                # V, 26 Nov 2026: a recovery limit with one wheel held fast (LC8a `held_wheel_n`), by the held-axle limit's rule
                # on the hinge bars' three models (I2-93, I2-114).
                # U, 26 Nov 2026: every check read on the hinge bars rigid and elastic at their own section, the elastic bar
                # with each weld run over its length and its arm on free and on stiff bushes, the worst governing (I2-114).
                # T, 26 Nov 2026: the XT arms as sheet 2 draws them, the fresh tanks on bearers of their own bolted
                # through the XT crossmembers (CHS-17), the holes within a diameter of one another along their member read on
                # one net section, a hinge crossmember's holes within or between the weld runs read on the safe side, and the
                # bearers' and the front guard's hangers' bolt holes read by the hole checks (I2-109 to I2-113).
                # S, 26 Nov 2026: the shear panel's front corners cut in steps clear of the rear arms' pivot tubes and legs by
                # FIT-05's 50 mm over their travel (Chassis.arm_cuts), the wings' roots shortened to match.
                # R, 26 Nov 2026: the front shocks' support plates CH-P07 on the XT centre crossmember's front face, its front
                # corners drained and vented through the rails' inner webs, and the arms as Cruisemaster's sheet 4 draws them.
                # Q, 25 Nov 2026: the airbags and the hinge bars' weld runs where Cruisemaster's sheets draw them, the XT
                # centre crossmember RHS 150 x 50 x 6, the cheeks' steps read as plates, the droop line along each shock, the
                # front hinge's steps clear of the front airbags' brackets, the shock plates flush on their crossmember, the rear
                # bay's 8 mm panel cut round the rear airbags and shocks on 76 mm rail angles and M12 bolts, the jacking points
                # under the arms (CH-P06 and FAT-11 gone), and the XT centre's front gussets left out for the front shocks (I2-97,
                # I2-101, I2-102, FIT-08).
                # P, 25 Nov 2026: the shear panel's 4 mm HA250 sheet with radiused tongue roots and no stiffener, the
                # hinge gussets on stepped cheeks, the held-axle recovery limit (LC8a `held_axle_n`), the cheeks coped,
                # and the XT kit's parts between the rails (xt_arms `parts`, I2-93, I2-97 to I2-100).
                # O, 25 Nov 2026: LC8a with the trailer's weight and the arms' droop limits (xt_arms), the hinge cheeks pinned
                # at their fillets to the hinge bar with a flare-bevel corner weld, the gussets cut to bear, the shear panel's
                # pieces as angles, both front hinges' front cheeks and PB-2's rear ends 200 mm ahead of the front hinge
                # crossmember (plan_braces `rear_ahead`, I2-92 to I2-95).
                # N, 25 Nov 2026: LC8a reacted by the ground at the tyres, or with one wheel held fast (LC8a reaction), the XT
                # hinges tied to their crossmembers in the one frame model with two hinge cheeks each (CH-P16) and the gussets
                # either side (CH-P08), the hinge crossmembers RHS 150 x 50 x 4 and 5 with 8 mm fillets at the XT crossmembers'
                # ends (I2-88), and the rear tank's bay a 3 mm steel shear panel on welded angles (shear_panels, CH-P17, I2-87).
                # M, 25 Nov 2026: LC8a read at its 78.5 kN ultimate (CHS-08U), the tongues' pull at their holes, the XT rear shock
                # and rear crossmembers RHS 150 x 50 x 6 (station_sections, I2-87), the hinge path study (xt_hinges, CHS-12,
                # I2-88), every hole for galvanising placed by cad/chassis_dip.py alone, the apex end cut square and the
                # mitre drains from each web's mitre line (I2-89), and the sealed overlaps' vents (sealed_overlaps, I2-90).
                # L, 24 Nov 2026: every closed section of the frame drained at its low points and vented at its high points in
                # the rolled dip, read by CHS-11 (member_galvanising_holes, I2-84): the drawbar members drain at their mitres
                # and vent at their apex ends' top corners, their snipes left open, and every crossmember, outrigger, brace and
                # hinge gusset drains and vents at its closed ends, all read in CHS-09 and CHS-10.
                # K, 24 Nov 2026: the frame galvanised in one dip at Valmont Coatings Hexham, rolled 46 degrees across and
                # pitched drawbar end down (galvanising_dip, I2-79): each rail's front end drains in both webs and through a
                # 10 mm slot under its end plate, with no vent in the end plate's field (I2-80), the drawbar members drain at
                # their apex ends and vent at their snipes, and the drawbar's laps opened to 2.5 mm and stitch welded (FAT-21).
                # J, 24 Nov 2026: FAT-20 at IIW 424, an RHS's walls under 8 mm, FAT 45, and the root record CT-102 asks
                # for (I2-74), each rail's front end vented and drained for galvanising and its end plate's bottom edge held
                # clear of the drawbar member (I2-75).
                # I, 24 Nov 2026: FAT-20 on the end plates' welds' maximum principal stress range, their roots inspected by
                # videoscope so IIW 415 classes them at FAT 71 (I2-67), and the heel's fillets on their skewed T-joint, legs
                # 7 mm inboard and 10 mm outboard, throat 5.7 mm, the end plate with no vent (I2-72).
                # H, 24 Nov 2026: the root gusset's heel 3 mm inboard of the end plate's middle, the gusset's line from the member's
                # line at its toe, and FAT-20 on the heel's place and the pull's direction (I2-60).
                # G, 23 Nov 2026: the end plates' welds to the rails at full penetration from outside, over the raisers' bottom
                # walls, their bottom edges free, FAT-20 (I2-57).
                # F, 23 Nov 2026: FAT-07 at IIW 522, the rails' end plates CH-P15 under the root gusset's 8 mm heel fillets, and
                # the body front's splice, heel and end plate in FAT-17 to FAT-19 (I2-51).
                # E, 23 Nov 2026: the chains held at their lugs by grade 100 connecting links (I2-46), the drawbar members
                # RHS 150 x 50 x 6 and FAT-07 read at the root gusset's toe (I2-47).
                # D, 23 Nov 2026: every case at the 4,000 kg plate (H2 as amended), the DO45 coupling and its plate, grade T chains.
                # C, 21 Nov 2026: the home trailer. RHS 127 x 51 x 3.5 C350L0 raisers, outriggers and floor crossmembers (report 22),
                # the grey-bay floor crossmember over the grey tank in place of the battery bay, every case at the 3,500 kg plate

material:
  tube: "AS/NZS 1163 C450L0 RHS and SHS, Austube Mills C450PLUS bought black (fy 450 MPa, fu 500 MPa)"
  plate: "AS/NZS 3678 grade 350 (fy 350 MPa used for every plate thickness up to 20 mm, fu 450 MPa)"
  plate_fy: 350
  plate_fu: 450
  weld_fuw: 490                      # E49XX / W50X consumables
  weld_phi: 0.8                      # SP category fillet welds, AS/NZS 1554.1
  welding: "Every structural weld SP to AS/NZS 1554.1. Rail-to-raiser seams continuous, drawbar-to-rail seams stitched across a 2.5 mm gap. No weld across the width of a rail"
  protection: "Hot-dip galvanised after fabrication to AS/NZS 4680, vented and drained to report 02 WLD-05"
  E: 200000
  G: 80000
  density: 7850

# Coating mass inside and out, AS/NZS 4680 minimum averages for articles that are not centrifuged (report 11 section 1.4)
galvanising:
  - {t_max: 1.5, g_per_m2: 320}
  - {t_max: 3.0, g_per_m2: 390}
  - {t_max: 6.0, g_per_m2: 500}
  - {t_max: 99, g_per_m2: 600}

params:
  rail_y: rail_c                              # rail centreline from the trailer centreline
  raiser_top_z: rail_top_z + 127              # 127 x 51 x 3.5 raiser on the rail (revision C, report 22 open point 1)
  strip_t: floor_underside_z - raiser_top_z   # floor bearer strip up to the floor underside (20.5 mm)
  outrigger_root_y: rail_c + rail_w / 2       # the raiser's outer face
  outrigger_tip_y: half_bw                    # the body edge
  db_z: rail_underside_z - db_depth / 2       # drawbar member centroid, the members run under the rails
  db_end_x: body_x0 + db_tail                 # end of the drawbar overlap under the rails (X 2,820)
  db_box_x0: 1150                             # sealed drawbar box for the generator and the jerry cans, behind the stone guard
  db_box_l: 320                               # clear of the jockey bracket ahead and the spare wheel behind (TRAILER.md)
  brace_x: 900                                # drawbar cross brace
  plate_x: db_apex_x                          # coupling plate at the apex
  chain_lug_x: db_apex_x + 150                # chain lugs 150 mm behind the coupling plate
  jockey_x: 1000                              # jockey wheel clamp on the kerb-side member. In travel the jockey swings up to lie along
                                              # the drawbar, wheel forward, below the bike box's underside (JK-01, JK-02, DIM-04)
  front_recovery_x: body_x0 + 330             # front recovery lugs, outside the 300 mm root zone
  root_gusset_toe_x: body_x0 - 270            # the root gusset's toe, where its ground 160 mm radius comes down to the drawbar member's
                                              # top face (FAT-07, IIW 522), 80 mm behind the drawbar box. Its heel is on the rail's end
  root_gusset_toe_y: db_apex_y + (rail_c - db_apex_y) * (root_gusset_toe_x - db_apex_x) / (body_x0 - db_apex_x)   # on the member's line
  root_gusset_heel_y: rail_c - 3              # the heel's centre 3 mm inboard of the end plate's middle, where the two webs' welds
                                              # share the heel's pull (FAT-20, I2-60). The member's line meets the plate 5.6 mm inboard
  root_gusset_slope: (root_gusset_heel_y - root_gusset_toe_y) / 254   # the gusset's line in plan, toe to heel over its 254 mm
  steady_front_x: db_end_x + 180              # front corner steadies' brackets under the rails behind the drawbar overlap (I2-22),
                                              # 143 mm clear of its sniped end (FAT-08), in report 11's X 2,900 to 3,100
  steady_rear_x: 6070
  steady_rear_y: rail_c + 31.25               # the rear steadies 20 mm outboard of the rails' inner faces, clear of UF-09's hangers
  spare_post_y: 120                           # spare carrier posts 240 mm apart
  spare_post_top_z: spare_z + 175             # the posts reach 175 mm above the spare's hub, as before
  pivot_ahead: 23                             # report 11 section 5.1: hinge pivot 23 mm ahead of the hinge
  pivot_below: 99                             # crossmember's rear face and 99 mm below the rail underside
  arm_r: 456                                  # pivot to hub at ride: 441 mm along X, 116 mm down
  arm_drop: 116
  travel: 60
  arm_depth: 90                               # the XT arm's depth in its plane, pivot to hub (est., as the model draws it at the hub), for FIT-05's sweep
  max_element: 250                            # longest frame element
  hinge_gusset_l: 283                         # each hinge gusset CH-P08's axis from the crossmember's face to the rail's web (xt_hinges `gusset`), 14.1 mm less where it lands on its cheek

roles:
  rail: {section: RHS_150x50x4, name: "Main rail"}   # 4 mm since the 4,000 kg plate (revision D): LC8a reached 1.01 of yield at 3 mm
  raiser: {section: RHS_127x51x3p5, name: "Raiser on the rail, continuous fillet welds to the rail"}
  cm_xt: {section: RHS_150x50x3, name: "XT suspension crossmember, full rail height"}
  cm_end: {section: RHS_150x50x3, name: "Body end crossmember, full rail height"}
  cm_floor: {section: RHS_127x51x3p5, name: "Floor crossmember at raiser height, top flush with the raisers"}
  outrigger: {section: RHS_127x51x3p5, name: "Outrigger at raiser height, the raiser's section, top flush with the raiser, bottom at the rail top"}
  drawbar: {section: RHS_150x50x6, name: "Drawbar member, A-frame"}   # 6 mm since revision E: FAT-07 was at 0.96 of its CAFL at 5 mm
  brace: {section: RHS_75x50x3, name: "Drawbar cross brace"}
  spare_post: {section: SHS_50x50x2p5, name: "Spare wheel carrier post"}

# Crossmember stations come from the trailer layout (cad/trailer.py): their front faces are fixed by the body ends,
# the XT kit and the grey tank bay, and the pitch rule adds the intermediate ones. Each fixed station's role:
station_roles:
  front: cm_end
  diesel bay: cm_floor
  XT front hinge: cm_xt
  XT centre: cm_xt
  XT rear shock: cm_xt
  grey-bay: cm_floor                          # crosses the middle of the grey tank, above it
  rear: cm_end
  generated: cm_floor

# Stations whose crossmember needs more than its role's section. The XT rear shock crossmember carries the rear recovery
# points' sideways load (LC8a at 30 degrees) without the PB-3 braces the grey tank's bay cannot hold (revision C). Since
# revision M it and the rear crossmember are RHS 150 x 50 x 6, so the ladder's rear bays carry the 78.5 kN ultimate pull
# (CHS-08U, I2-87): at 4 mm and 3 mm their webs' holes read 1.14 and 1.19 of 0.85 fu there
station_sections:
  XT front hinge: RHS_150x50x6_TWIN    # revision W (I2-114): each hinge crossmember 100 mm wide along the trailer, its rear face where it stood, for the
  XT centre: RHS_150x50x6_TWIN         # couple the arm's two bushes put on the hinge bar across the trailer's line. 150 x 50 x 6 since revisions N and Q,
                                       # RHS 150 x 100 x 6 from revision W, and since 27 Nov 2026 two RHS 150 x 50 x 6 seam welded, the rear one where
                                       # Cruisemaster's stands, so both of each hinge bar's fillets stand over webs (fx37-twin, CHASSIS.md item 15)
  XT rear shock: RHS_150x50x6
  rear: RHS_150x50x6

# Plan bracing: an X of two diagonals at rail height in free bays between the rails, so the ladder frame carries
# sideways loads (LC8a recovery at 30 degrees) by truss action. The tanks fill the other bays. The rear bay's braces (PB-3)
# went with the battery bay: the grey tank fills it. Its 2 mm guard (UF-09) is not counted as a shear plate, so the XT rear shock
# crossmember is RHS 150 x 50 x 6 (station_sections) and carries the rear recovery pull (CHS-08A). Each diagonal runs
# from one rail's inner face to the other's, from the front crossmember's rear face to the rear one's front face, or
# where `rear_ahead` is given, to `rear_ahead` mm ahead of the rear crossmember's front face. PB-2's rear ends stand 200 mm
# ahead of the XT front hinge crossmember, so each tube's footprint on the rail's web stops about 29 mm ahead of that
# hinge's front cheek (CH-P16), and the frame model ties each end to the rail where it lands.
plan_braces:
  - {between: ["between front and diesel bay (1)", diesel bay], section: SHS_40x40x2p5}
  - {between: [diesel bay, XT front hinge], section: SHS_40x40x2p5, rear_ahead: 200}

# Welded and bolted fittings. Plates: length x width x thickness in mm, with a count. Bought parts carry a mass and its
# source. `at` is a position (X, Y, Z), `side_y` repeats the item on both sides at that Y magnitude, `rear_x` adds a
# rear pair, and `box` (X0, Y0, Z0, dX, dY, dZ) is an envelope the trailer layout's checks see (coupling, stone guard).
# The DB- items are the coupling and drawbar fittings (they replace the layout's DB-03 and DB-04 blocks). Bought
# fittings and the bearer strip carry a `price` in the form data/trailer-parts.yaml describes. The members, plates and
# the galvanising are priced there as stock bought for the whole frame.
fittings:
  - {id: CH-P01, name: "Coupling plate under the drawbar apex, flat both faces, 4 x M14 8.8 holes at the DO45's wider pattern", kind: plate, l: 300, w: 220, t: 12, qty: 1,
     at: [plate_x - 40, 0, rail_underside_z - db_depth], fat: null}
  - {id: CH-P02, plane: xz, name: "Chain lug, 10 mm plate on the drawbar member's outer side face, 14 mm hole for the chain's connecting link", kind: plate, l: 120, w: 100, t: 10, qty: 2,
     at: [chain_lug_x, 0, db_z - 60], side_y: "db_apex_y + (rail_c - db_apex_y) * (chain_lug_x - db_apex_x) / (body_x0 - db_apex_x) + rail_w / 2 + 5"}
  # CH-P03 stands on the drawbar member's top face, IIW 522 (FAT 90): its free edge a radius r over 150 mm down to an end
  # end_h high, at most twice its thickness and 25 mm, its fillets wrapped round that end and the toe ground there. It runs
  # l from its toe to its heel, w high there, on the rail's end plate CH-P15 (FAT-18). It meets the plate 19.9 degrees off
  # the plate's normal in plan, so its heel's fillets lie in a skewed T-joint (I2-72): the inboard one in the acute
  # dihedral angle of 70.1 degrees and the outboard one in the obtuse 109.9 degrees. heel_legs gives their legs, inboard
  # and outboard, so each throat is 5.7 mm (cad/chassis_fea.py heel_throats). Its
  # area is the radius's 5,124 mm2 from 10 to 140 mm high over 103.1 mm and 150.9 mm at the full 140 mm, 26,255 mm2, 0.738
  # of l x w. Its line in plan runs from the member's line at its toe to its heel's centre on CH-P15, root_gusset_heel_y,
  # 2.6 mm outboard of the member's line there and 3 mm inboard of the plate's middle (I2-60). Its `boxes` stand on the
  # A-frame member's top face along that line, as CT-102's detail C draws it: four axis-aligned boxes a side stepping
  # along it, the first 54 mm high where the radius rises from the 10 mm end
  - {id: CH-P03, plane: xz, name: "Drawbar root gusset, profiled with a ground 160 mm radius down to an end 10 mm high (FAT 90, IIW 522), its toe 270 mm ahead of the body front and its heel on the rail's end plate over the mitre", kind: plate, l: 254, w: 140, t: 10, qty: 2, area_factor: 0.738,
     r: 160, end_h: 10, wrapped: true, toe_ground: true, heel_legs: [7, 10],
     at: [root_gusset_toe_x + 127, 0, rail_underside_z + 60], side_y: "root_gusset_toe_y + root_gusset_slope * 127",
     boxes: [["root_gusset_toe_x + 0", "root_gusset_toe_y + root_gusset_slope * 0 - 5", rail_underside_z, 63.5, "root_gusset_slope * 63.5 + 10", 54],
             ["root_gusset_toe_x + 63.5", "root_gusset_toe_y + root_gusset_slope * 63.5 - 5", rail_underside_z, 63.5, "root_gusset_slope * 63.5 + 10", 140],
             ["root_gusset_toe_x + 127", "root_gusset_toe_y + root_gusset_slope * 127 - 5", rail_underside_z, 63.5, "root_gusset_slope * 63.5 + 10", 140],
             ["root_gusset_toe_x + 190.5", "root_gusset_toe_y + root_gusset_slope * 190.5 - 5", rail_underside_z, 63.5, "root_gusset_slope * 63.5 + 10", 140],
             ["root_gusset_toe_x + 0", "-(root_gusset_toe_y + root_gusset_slope * 63.5) - 5", rail_underside_z, 63.5, "root_gusset_slope * 63.5 + 10", 54],
             ["root_gusset_toe_x + 63.5", "-(root_gusset_toe_y + root_gusset_slope * 127) - 5", rail_underside_z, 63.5, "root_gusset_slope * 63.5 + 10", 140],
             ["root_gusset_toe_x + 127", "-(root_gusset_toe_y + root_gusset_slope * 190.5) - 5", rail_underside_z, 63.5, "root_gusset_slope * 63.5 + 10", 140],
             ["root_gusset_toe_x + 190.5", "-(root_gusset_toe_y + root_gusset_slope * 254) - 5", rail_underside_z, 63.5, "root_gusset_slope * 63.5 + 10", 140]]}
  # CH-P15 is flush with the rail's sides and stands 3.5 mm over its top, across the raiser's bottom wall (I2-57). Its
  # rear edges on the webs and the top are bevelled, so the webs, the top flange and the raiser's bottom wall are welded
  # to it with full penetration single bevel welds from outside, the plate behind each wall's end as the backing (IIW
  # 424, FAT-20), and each weld's root is viewed by videoscope before galvanising (I2-67, I2-74). Its bottom edge stands
  # `lift` over the rail's underside, unwelded, so the galvaniser's zinc runs under it and coats both faces, and the
  # rail's floor drains through the slot it leaves at the plate (the guide's gap of at least 2.5 mm, I2-75, and its least
  # hole of 10 mm, I2-79). The webs' welds end there, and the rail's bottom wall and corners end under it free. The inboard
  # web's weld is made from ahead of CM-01. It has no vent: the heel and its fillets
  # cover its face from 9.7 to 37.3 mm off its inboard edge over the heel's 140 mm, leaving 5.7 and 8.7 mm to the walls'
  # inner faces, so the rail's front end drains through its own holes in both webs (galvanising_holes)
  # Since revision K its bottom edge stands 14 mm over the rail's underside, so the slot over the rail's floor is 10 mm,
  # the guide's least hole (page 8), and drains each rail's low front corner in the rolled dip (galvanising_dip, I2-79)
  - {id: CH-P15, plane: yz, name: "Rail end plate, 16 mm, closing each rail's front end and the raiser's bottom wall over it, full penetration single bevel welds from outside to the rail's webs and top flange and that wall, their roots inspected by videoscope, the root gusset's heel welded to it, its bottom edge 14 mm over the rail's underside, a 10 mm slot over the floor", kind: plate, l: 50, w: 139.5, t: 16, qty: 2, lift: 14,
     at: [body_x0 - 8, 0, rail_underside_z + 14 + 69.75], side_y: rail_c}
  - {id: CH-P04, plane: xz, name: "Front recovery lug, 20 mm plate on the drawbar member's outer side face, 22 mm hole", kind: plate, l: 200, w: 120, t: 20, qty: 2,
     at: [front_recovery_x, 0, db_z - 30], side_y: "rail_c + rail_w / 2 + 10"}
  - {id: CH-P05, plane: xz, name: "Rear recovery tongue, 20 mm plate through a slot in the rear crossmember, 22 mm hole", kind: plate, l: 260, w: 120, t: 20, qty: 2,
     at: [body_x1 - 70, 0, rail_underside_z + 75], side_y: "rail_c - rail_w / 2 - 10"}
  # CH-P07 stands flush on the front face of each crossmember `stations` names (Chassis.shock_plates), `side_y` its middle from
  # the centreline, so each shock's bracket stands on its face (FX21-MRG found the rear brackets 0.9 mm into them, a
  # rounding of the plate's place against the member's rounded station)
  - {id: CH-P07, plane: yz, name: "Shock support plate, 5 mm, full height on the front faces of the XT centre and XT rear shock crossmembers", kind: plate, l: 300, w: 150, t: 5, qty: 4,
     poses: shock_plates, stations: [XT centre, XT rear shock], side_y: "rail_c - 200"}
  - {id: CH-P08, name: "Hinge crossmember gusset, SHS 50 x 50 x 3 at 45 degrees (TB 070), its ends cut at 45 degrees to bear on the crossmember's face and on the face of the hinge cheek beside it, welded all round, two behind each hinge crossmember", kind: tube, section: SHS_50x50x3, length: hinge_gusset_l, qty: 4,
     poses: hinge_gussets, fat: null}
