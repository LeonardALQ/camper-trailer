# Section table from research report 11 (research/11-chassis-design.md), copied unchanged from its companion file
# chassis-sections.yaml. cad/chassis.py reads it.
# Candidate steel sections for the camper trailer chassis (research report 11).
# Units: mm, kg/m, mm2, and the multipliers shown in each key name (e6 = 10^6, e3 = 10^3).
# Axes: x is the strong axis (bending in the plane of d), y the weak axis (bending in the plane of b).
# d = depth, b = width, t = wall, ro = outside corner radius used in the calculation.
# Zx, Zy = elastic section moduli. Sx, Sy = plastic section moduli. J = torsion constant. C = torsion modulus (J / (t + k/t)).
# Ze_x, Ze_y = AS 4100 effective section moduli for C450L0 from the published table (null where not read).
# compact_x, compact_y = AS 4100 class for C450L0 from the published table: C compact, N non-compact, S slender.
#
# Method. Hollow sections are computed from the AS/NZS 1163 nominal geometry with Australian Tube Mills' corner radii
# (ro = 2.0 t for t <= 3 mm and 2.5 t for t > 3 mm, inner radius ro - t), density 7,850 kg/m3, and the thin-wall torsion
# formulas Austube publishes (J = t^3 h / 3 + 2 k Ah, C = J / (t + k / t), k = 2 Ah t / h, h and Ah taken on the wall midline).
# Script: sect.py, reproduced in report 11 appendix A.
# Check. Every hollow section marked published_check was compared with the Austube Mills Design Capacity Tables for
# Structural Steel Hollow Sections (August 2013). The computed values match the published ones to the published
# rounding (3 significant figures) in every case checked, so the computed figures can be used for the sections that
# were not checked as well. The comparison is in each entry.
# Grades. RHS and SHS: AS/NZS 1163 C450L0 (fy 450 MPa, fu 500 MPa) is the recommendation, supplied as Austube Mills
# C450PLUS (black) or DuraGal C450PLUS (in-line galvanised to AS/NZS 4792, 100 g/m2 minimum average inside and outside).
# C350L0 (fy 350 MPa, fu 430 MPa) is Cruisemaster's minimum at the suspension (TB 070). Angles: see each entry.
#
source_tables: https://www.austubemills.com.au/wp-content/uploads/sites/9/2022/02/atm_dct_sshs_aug13_new-1.pdf
source_grades_c450plus: https://www.infrabuild.com/steel/products/duragal/duragal-galvanized-steel-rhs-and-shs-structur/
source_cruisemaster_tb070: https://cruisemaster.com.au/content/cis/TB%20070%20-%20Chassis%20Design%20Recommendations.pdf
grades:
  C450L0: {standard: AS/NZS 1163, fy_mpa: 450, fu_mpa: 500, note: "Austube C450PLUS is designed as C450L0 with the elongation of C350L0 (Austube DCT 2013, table notes)"}
  C350L0: {standard: AS/NZS 1163, fy_mpa: 350, fu_mpa: 430, note: "Cruisemaster TB 070 minimum for suspension areas"}
  300PLUS_hot_rolled_angle: {standard: AS/NZS 3679.1, fy_mpa: 320, fu_mpa: 440, note: "fy 320 MPa for thin flanges is from memory of InfraBuild's 300PLUS data, not checked in this research"}
