    qty: 1
    unit: each
    mass: {basis: declared, unit_kg: 7.0, maturity: estimate, source: "Estimate: about 2 m2 of 1.6 mm aluminium sheet (4.3 kg/m2) plus clamps and the regulator bracket", note: "The hatch is in the body (trailer layout)"}
