# Garage BOM lines (garage-bed/BOM.md, research/03). One entry per BOM line.
# mass.basis: declared (unit_kg x qty), per_length (kg_per_m x modelled length) or per_area (kg_per_m2 x modelled area).
# mass.maturity per MASS-06: spec, calculated or estimate.
group: garage
parts:
  G-01:
    name: Front wheel chock
    product: Condor SC-2000 Trailer-Only Chock, trailer adapter included
    maker: Condor
    part_no: 4101-0137
    qty: 2
    unit: each
    mass: {basis: declared, unit_kg: 11.8, maturity: spec, source: "https://loadall.com/products/condor-chock-sc-2000-trailer-only"}
    size: 229 W x 635 L x 381 H (178 folded). Tyres 14-22 in, 80-230 mm
    rating: Bikes to 3,000 lb
    links:
      maker: https://www.condor-lift.com/
      spec: https://loadall.com/products/condor-chock-sc-2000-trailer-only
      manual: https://cdn.shopify.com/s/files/1/0919/3501/5224/files/condor_trailer_only_chock_manual.pdf?v=1737134760
    stockist_au: null
    notes: Pins off its floor adapter. No Australian stockist found, so import from the US.
    removable: true
    geometry: {generator: condor_chock, params: {base_w: 229, base_l: 635, height: 381, cradle_rise: 25, nose_depth: 50}}
    color: "#e67e22"
