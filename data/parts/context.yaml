# Context parts: the body round the module and the stowed items whose masses the trailer layout carries
# (assemblies/trailer.yaml). They carry no BOM mass. The body's design comes later, so the thicknesses are
# assumptions for display and checks.
group: context
parts:
  CTX-FLOOR:
    name: Garage floor (body)
    product: Foam-core floor panel with routed L-track recesses
    kind: context
    notes: Thickness 30 mm assumed for display. The recesses are 34.5 x 13.7 to take the flush L-track.
    geometry: {generator: floor, params: {thickness: 30}}
    color: "#8c8c8c"
    alpha: 0.55
  CTX-WALL-R:
    name: Road-side wall (body)
    product: Side wall, 35 mm foam-core panel
    kind: context
    notes: Inner face at Y = +1,165.
    geometry: {generator: wall, params: {thickness: 35}}
    color: "#dfe6e9"
    alpha: 0.3
  CTX-WALL-K:
    name: Kerb-side wall with the gas locker hatch opening (body)
    product: Side wall, 35 mm foam-core panel, 700 x 630 hatch opening
    kind: context
    notes: Inner face at Y = -1,165. The opening is the gas locker's hatch, the locker's only access.
    geometry: {generator: wall, params: {thickness: 35, opening: true}}
    color: "#dfe6e9"
    alpha: 0.3
  CTX-WALL-B:
    name: Rear wall with the garage door opening (body)
    product: Rear wall, 35 mm foam-core panel, 1,910 x 1,440 door opening
    kind: context
    notes: Inner face at X = 2,330. Opening Y -785 to +1,125, Z 0 to 1,440. The header above the opening carries the deck's rear edge.
    geometry: {generator: wall, params: {thickness: 35}}
    color: "#dfe6e9"
    alpha: 0.3
  CTX-DOOR:
    name: Rear garage door, closed (body)
    product: Top-hinged door, product and structure to come with the body design
    kind: context
    notes: Modelled as a 35 mm panel filling the opening, inner face flush with the rear wall's inner face (X = 2,330).
    geometry: {generator: box, params: {dx: wall_t, dy: "door_y1 - door_y0", dz: door_h}}
    color: "#b2bec3"
    alpha: 0.35
  CTX-HATCH:
    name: Gas locker hatch, closed (body)
    product: Hatch in the kerb-side wall, with the locker's low vents (product to choose)
    kind: context
    notes: Fills the hatch opening, flush with the wall.
    geometry: {generator: box, params: {dx: "hatch_x1 - hatch_x0", dy: wall_t, dz: "hatch_z1 - hatch_z0"}}
    color: "#b2bec3"
    alpha: 0.5
  CTX-CEIL:
    name: Ceiling with the roof collapsed (body)
    product: Ceiling plane at Z = 1,800
    kind: context
    notes: Target 1,800 mm, hard limit 2,000 mm (DESIGN.md).
    geometry: {generator: box, params: {dx: "garage_length + partition_t", dy: interior_width, dz: 5}}
    color: "#ffffff"
    alpha: 0.15
  CTX-GROUND:
    name: Assumed ground for loading
    product: Ground plane 869 mm below the garage floor, the floor height from the trailer model
    kind: context
    notes: Shown in the loading view only.
    geometry: {generator: box, params: {dx: 3200, dy: 1500, dz: 10}}
    color: "#a3b18a"
    alpha: 0.5
  CTX-FLOOR-LIV:
    name: Living-area floor (body)
    product: Floor of the living area in front of partition A, level with the garage floor (Z 0)
    kind: context
    notes: The ladder reaches the living-area floor from the deck top (1,530 mm), so the floor is taken at Z 0. Thickness 30 mm for display. The ladder check CLR-07 lands on it.
    geometry: {generator: box, params: {dx: "-partition_t - living_floor_x0", dy: "interior_width + 2 * wall_t", dz: 30}}
    color: "#8c8c8c"
    alpha: 0.55
  CTX-RAMP:
    name: Loading ramp, folded and stowed (G-10)
    product: Black Widow MF-12038 folded to 1,524 x 152, standing on its edge
    kind: context
    notes: Slides out of the rear door first. Its mass is line G-10, placed here.
    geometry: {generator: box, params: {dx: ramp_fold_l, dy: ramp_fold_t, dz: ramp_fold_w}}
    color: "#2d3436"
    alpha: 0.8
  CTX-GEN:
    name: Generator envelope
    product: Petrol generator, 520 x 320 x 460 envelope (older block model)
    kind: context
    notes: Strapped to the kerb-strip track row. Its mass is in the trailer layout (GS-01).
    geometry: {generator: box, params: {dx: gen_l, dy: gen_w, dz: gen_h}}
    color: "#c0392b"
  CTX-FUEL:
    name: Jerry cans envelope
    product: Petrol and diesel jerry cans, 300 x 360 x 450 envelope (older block model)
    kind: context
    notes: Strapped to the kerb-strip track row. Their mass is in the trailer layout (GS-04).
    geometry: {generator: box, params: {dx: fuel_l, dy: fuel_w, dz: fuel_h}}
    color: "#e74c3c"
  CTX-GAS:
    name: 9 kg gas cylinder envelope
    product: 9 kg LPG cylinder, 320 x 320 x 500 envelope (older block model)
    kind: context
    notes: Clamped in the gas locker for 4 times its filled weight. Its mass is in the trailer layout (GS-02, GS-03).
    geometry: {generator: box, params: {dx: cyl_d, dy: cyl_d, dz: cyl_h}}
    color: "#ecf0f1"
  CTX-SWEEP:
    name: Rear door frame swept along the garage (check only)
    product: Everything outside the door opening, extended from partition A to the rear wall
    kind: context
    notes: A bike rolled straight back clears the door frame if it clears this solid (CLR-09).
    geometry: {generator: sweep, params: {}}
    color: "#ff0000"
    alpha: 0.2
