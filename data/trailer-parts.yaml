o bolts, six rivets and its strap about AUD 7 (est., I2-78, I2-91)"}
      - {item: "The TSC's fuse in the drawbar junction (I2-61): a 30 A MIDI fuse, a spare, and a single MIDI holder with its cover on M5 studs, between the SB50's positive and K-10", aud: 14.70, basis: listing, url: "https://www.solar4rvs.com.au/products/exotronic-midi-in-line-single-ami-ans-fuse-holder", date: 2026-11-20, note: "Solar4RVs, as report 20 priced them: the Exotronic single MIDI holder AUD 6.90 and a MIDI fuse AUD 3.90 (https://www.solar4rvs.com.au/products/exotronic-midi-ami-ans-fuse-30a). Bosch's guideline asks for a fuse of 40 A at most there (Y265K30237 v4.0, page 6)"}
