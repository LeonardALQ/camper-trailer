    price:
      - {item: "Welding procedure and welder qualification to AS/NZS 1554.1 on one test piece: Leonard welds a piece of at least 300 mm to the draft procedure for the chassis joints, examined visually and by macro and witnessed by a NATA-accredited test house, which qualifies the procedure and Leonard together (clause 4.12.2.3)", aud: 1000, basis: estimate, url: "https://www.technoweld.com.au/services/welder-qualification/", date: 2026-11-22, note: "No Australian price is published, and Technoweld quotes on request. About 4 h of a weld inspector's time at about AUD 150 an hour, the macro section and the certificate (est.). The Australian Steel Institute's guide lets a draft procedure be qualified on the welder's own test (https://www.steel.org.au/ASI/media/Australian-Steel-Institute/PDFs/Welder-qualification-journey.pdf)"}
      - {item: "A qualified welding supervisor and inspector, a day in visits: the procedure and the fit-up of the drawbar, coupling and suspension joints before welding, then a visual inspection of every weld, the roots of the rails' end plate welds by videoscope from inside the rails (FAT-20), and a penetrant test of the joints report 02's WLD-03 names before galvanising, with signed records for the engineer", aud: 1200, basis: estimate, url: "https://au.indeed.com/career/welding-inspector/salaries/Hunter-Valley-NSW", date: 2026-11-22, note: "8 h at about AUD 150 an hour (est.), the six end plate roots about half an hour of it with the inspector's own videoscope (est.). Indeed gives a welding inspector in the Hunter Valley AUD 121,900 a year, about AUD 62 an hour, and a consultancy charges about 2.4 times its staff pay (est.). The supervisor is qualified under AS/NZS 1554.1 clause 4.12.1"}
      - {item: "Two CRC Crick 110, 120 and 130 sets of cleaner, red penetrant and developer, for Leonard's own tests of the drawbar-to-rail welds, the coupling plate, the XT crossmembers and the chain lugs before the inspector's visit", aud: 143.68, basis: listing, converted_from: "EUR 42.76 a set including VAT", url: "https://www.soldufer.com/producto/kit-soldadura-110120130-crick-ref117073160338-crc/", date: 2026-11-22, note: "No Australian listing was found"}
    note: "Neither VSB1, AIS Notice 41, VIB 78 nor the concessional RAV entry asks for weld evidence (research report 27), so the registration alone needs none. The RAV entry's drawbar evidence is the engineer's calculation (CMP-03), and it assumes SP welds to AS/NZS 1554.1. Clause 1.7.2 of that standard, as WorkSafe WA's Mines Safety Bulletin 180 gives it, has every weld made in accordance with a qualified welding procedure, by a welder suitably qualified for it, under the supervision of a welding supervisor, and to the standard's other requirements. This line provides the procedure, the welder and the supervisor, so the engineer can accept the welds the calculation assumes. Report 02's WLD-03 asks for the penetrant tests, which Leonard runs first and the inspector repeats"
