# The trailer's priced parts list, AUD including GST. The trailer page renders it (cad/sitedata.py), the home page's
# cost table takes its trailer row from it, and cad/tests/test_trailer_parts.py checks it.
#
# Every line of the mass schedule carries its own price: the items of data/assemblies/trailer.yaml and the bought
# fittings of data/chassis/chassis.yaml, each in a `price` field. This file holds the rest. The stock bought for the
# chassis (steel by section, plate and galvanising) is shared by mass over the generated lines it `covers`. The other
# lines have no line in the mass schedule: installation, compliance, freight and consumables.
# Decision H26, 22 Nov 2026: Leonard builds the trailer himself, so the hired labour lines (were LAB-01 to LAB-08) are
# gone and the trailer has one total. What its NSW registration needs stays, with the weld evidence in CMP-14.
# cad/trailer_costs.py puts the three files together.
#
# A price is one of these, AUD including GST:
#   {aud: ...}        the line's total
#   {aud_each: ...}   each one's price, times the line's instances in the layout (the four tyres) or its qty here
#   a list of bought parts, each with an `item` and its own aud or aud_each
#   {aud: 0, included_in: <line>} when another line's price includes it
# Each gives its basis, url where there is one, the date it was checked, and converted_from for a foreign price.
# Basis: listing (a published price), quote (a published quote or price list), rate (a published rate applied to a
# quantity) or estimate (judgement, reasoning in the note). Foreign prices are converted at 1 USD = 1.55 AUD,
# 1 EUR = 1.68 AUD and 1 GBP = 1.98 AUD. European prices include their VAT, which stands in for the GST and any duty
# on import. US and UK prices before tax have 10 % GST added. The research behind the prices is in research reports
# 19 to 22 and 25. Payload, water and fuel carry no price.
schema_version: 1
currency: AUD
date_checked: 2026-11-21
fx: {USD: 1.55, EUR: 1.68, GBP: 1.98}
sources: [data/assemblies/trailer.yaml, data/chassis/chassis.yaml]
# groups for the lines here that have no system in the mass schedule. The others take their schedule group.
groups:
  installation: Licensed electrical work
  lamps: Lamps, reflectors and the number plate (ADR 13/00, VSB1 3.1)
  compliance: Engineering review, weld evidence, inspection and the first year's registration in NSW
  freight: Freight and consumables
totals:
  contingency_pct: {listing: 10, quote: 10, rate: 20, estimate: 20}
  contingency_why: >-
    No Australian trailer builder publishes the contingency it uses. Published guidance runs from 10 to 15 % for DIY
    camper trailers to 20 % for a one-off build that the owner manages, and 15 to 25 % for early estimates (research
    report 22 section 2.15). So a listed or quoted price carries 10 % and a rate or an estimate 20 %.
  labour_why: >-
    Leonard builds the trailer himself, so no labour is hired (decision H26). The licensed electrician, the
    refrigeration fitting in AC-03, the wheel alignment, the engineer's review and the weld evidence stay, because the
    law, the equipment or the registration needs them.
not_in_total:
  - {name: "Comprehensive caravan insurance, first year, agreed value AUD 130,000 (est.)", aud: 1560, basis: estimate, url: "https://www.canstar.com.au/car-insurance/caravan-insurance/", note: "About 1.2 % of the agreed value. Optional by law. A running cost, like the Starlink plan and the tracker's subscription"}
  - {name: "CTP insurance (green slip)", aud: 0, basis: listing, url: "https://www.nsw.gov.au/driving-boating-and-transport/vehicle-registration/how-to-register/registering-a-brand-new-vehicle", note: "Not required for a trailer"}
  - {name: "Leonard's own labour, about 333 h (est.)", aud: 0, basis: estimate, note: "The hours research report 22 gave for the hired lines that decision H26 removed: 70 h on the chassis and drawbar, 16 h on the running gear, 70 h on the shell, 19 h of small fabrications, 26 h of cabinetry, 12 h of fitting and 120 h of services. At its AUD 120 an hour they were AUD 39,960"}
  - {name: "Motor vehicle duty", aud: 0, basis: listing, url: "https://www.service.nsw.gov.au/guide/buying-a-vehicle", note: "NSW charges no duty on registering a caravan or camper trailer"}
