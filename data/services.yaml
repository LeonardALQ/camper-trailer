# The home trailer's services, for the drawings CT-601 to CT-621 (TRAILER.md revision J): the body's glands, the
# electrical cables and circuits (research report 20), the load-shedding order (decision of 20 Nov 2026 23:17)
# and the ventilation modes (report 19). The blocks themselves (the battery, board, tanks, fans and units) stay in
# data/assemblies/trailer.yaml, and the drawings take their positions from there.
# Positions are in DIM-01, mm. A gland of 60 mm or less is not an opening for the body's spacing rule
# (data/body/body.yaml). `src` is the source. `est` names what this file assumes, to confirm at fit-out.
id: SVC-TR
revision: A

# Glands through the walls, roof and floor. Side walls give X and the height Z, end walls Y and Z, roof and floor X and Y.
glands:
  # `proj` on a side-wall gland is how far it stands proud of the skin, mm, for the overall width (data/body/body.yaml `width`)
  - {id: G1, what: "Fresh water fill with a lockable cap, filled through the CR45 filter on the hose", at: kerb, x: 3040, z: 1125, d: 50, proj: 30, src: "TRAILER.md, Plumbing and water", est: "position under W1, moved from X 3,310 so BD-20 can stand between the bed's hardpoint and the door (F4-04), its hose through the floor beside it to the front tank, and the cap 30 mm proud"}
  - {id: G2, what: "Two 15 A appliance inlets, SHORE and GENERATOR, and the 12 V Anderson SB50 outlet, three flush units side by side in a 310 x 120 mm cut-out, IP56 with hinged covers", at: kerb, x: 4700, z: 1150, d: 60, w: 310, h: 120, proj: 30, src: "TRAILER.md, Electrical", est: "covers 30 mm proud. A surface box would stand about 60 mm and set the width. Larger than 60 mm, so it is an opening for BDY-18 and the plates of BDY-24 (F4-05)"}
  - {id: G3, what: "Outdoor 230 V double outlet (C10), flush-mounted IP56 with a hinged cover, under the awning", at: kerb, x: 4355, z: 1150, d: 60, proj: 30, src: "report 20 section 7", est: "position, and the cover 30 mm proud"}
  - {id: G4, what: "Two 6 mm2 PV strings into a conduit down the partition's kerb end", at: roof, x: 5100, y: -900, d: 25, src: "TRAILER.md, Electrical"}
  - {id: G5, what: "Split line set and the outdoor unit's 230 V feed (C8), behind the cradle", at: rear, y: 760, z: 2800, d: 60, src: "AC-02, AC-03", est: "position, moved to the road half with the outdoor unit"}
  - {id: G6, what: "Battery box vent from the bottom of the box, 20 mm bore with insect mesh", at: floor, x: 4300, y: -800, d: 20, src: "report 20 section 2, AS/NZS 3001.2 clause 5.4.12.2", est: "position"}
  - {id: G7, what: "Battery box vent ducted from the top of the box, 20 mm bore with insect mesh", at: floor, x: 4900, y: -800, d: 20, src: "report 20 section 2", est: "position"}
  - {id: G8, what: "Ute charging feed, 8 B&S twin from the drawbar Anderson SB50 along the kerb rail", at: floor, x: 5100, y: -700, d: 25, src: "TRAILER.md, Electrical"}
  - {id: G9, what: "Combi diesel line from the heater fuel tank UF-06 into the tower base", at: floor, x: 3520, y: 720, d: 20, src: "LA-03, UF-06", est: "position"}
  - {id: G10, what: "Sink, washer and dryer wastes through the wet room floor into the grey tank's top inlet", at: floor, x: 5260, y: 0, d: 50, src: "TRAILER.md, Plumbing and water"}
  - {id: G11, what: "Fresh tank feed to the pump in the sink cabinet", at: floor, x: 4960, y: 700, d: 25, src: "TRAILER.md, Plumbing and water", est: "position"}

electrical:
  # report 20 section 7, main cables and fuses. Lengths are along the routes on CT-602 (est.)
  cables:
    - {run: "Each battery module to the bank busbar", current: "100 A (1C)", fuse: "125 A MEGA", cable: "25 mm2", length: "under 1 m, sleeved"}
    - {run: "Bank busbar to the Lynx Smart BMS NG", current: "150 A, 260 A for 1 min", fuse: "Module fuses, BMS contactor", cable: "70 mm2", length: "1.0 m"}
    - {run: "Lynx Distributor to the MultiPlus-II", current: "144 A at 6 kW", fuse: "200 A MEGA", cable: "50 mm2", length: "2 m each way, 0.2 V drop"}
    - {run: "Each SmartSolar MPPT 150/35", current: "35 A", fuse: "40 A MIDI", cable: "10 mm2", length: "0.5 m"}
    - {run: "Each Orion-Tr converter input", current: "9 A", fuse: "15 A", cable: "4 mm2", length: "0.5 m"}
    - {run: "24 V converter pair to its fuse panel", current: "32 A", fuse: "40 A", cable: "10 mm2", length: "0.5 m"}
    - {run: "12 V converter pair to its fuse panel", current: "60 A", fuse: "80 A", cable: "16 mm2", length: "0.5 m"}
    - {run: "Ute charging feed, drawbar Anderson to the Lynx Distributor", current: "16 A, 32 A after TC02", fuse: "40 A", cable: "8 B&S twin", length: "about 6.5 m"}
    - {run: "Each PV string, two panels in series", current: "10.7 A (Isc)", fuse: "None, one string per controller", cable: "6 mm2 PV", length: "about 6 m"}
  # report 20 section 7, 230 V circuits. Every circuit has a 30 mA RCBO. `at` is the layout line it feeds
  circuits:
    - {id: C1, load: "Hob, Dometic CVI1525", amps: 10.0, rcbo: 16, control: "Current relay: above 4.5 A it opens K4, any current opens S1", at: LA-07A}
    - {id: C2, load: "Oven, Camec 053632", amps: 6.3, rcbo: 10, control: "Contactor K2. Its current relay opens K4 and S1", at: LA-13}
    - {id: C3, load: "Kitchen bench outlets, two double", amps: null, rcbo: 10, control: "Total power rule", at: LA-11B}
    - {id: C4, load: "DauerShower 2.0 heater", amps: 10.4, rcbo: 16, control: "Contactor K4. Its current relay opens S1", at: WR-09}
    - {id: C5, load: "Truma Combi D 6 E element", amps: 7.8, rcbo: 10, control: "Contactor S1", at: LA-03}
    - {id: C6, load: "Washer, Camec", amps: 1.2, rcbo: 10, control: "Contactor S1", at: LA-02}
    - {id: C7, load: "Dryer, Haier heat pump", amps: 4.3, rcbo: 10, control: "Contactor S1", at: LA-14}
    - {id: C8, load: "Split, outdoor unit feed", amps: 7.1, rcbo: 10, control: "Never shed", at: AC-02}
    - {id: C9, load: "Desk and living outlets, three double", amps: null, rcbo: 10, control: "Total power rule", at: LA-09}
    - {id: C10, load: "Outdoor double outlet, kerb side", amps: null, rcbo: 10, control: "Total power rule", at: G3}
  # Load shedding (decision of 20 Nov 2026 23:17): the shower heater is the load that sheds when the hob or the oven needs
  # the inverter, so cooking keeps priority and the oven's relay never opens for the shower.
  shedding:
    - {step: "1", sheds: "K4: C4, the DauerShower heater", when: "The hob draws more than about 4.5 A, or the oven runs", after: "The shower keeps running warm in its 12 V mode, topped up with 0.5 to 3 L/min of boiler water, and the Combi reheats on diesel"}
    - {step: "2", sheds: "S1: C5 Combi element, C6 washer, C7 dryer", when: "The hob, the oven or the shower heater runs", after: "The Combi heats on diesel. The washer and dryer wait"}
    - {step: "-", sheds: "C3, C9 and C10 outlets", when: "The total power rule on the Cerbo GX (Node-RED)", after: "The user's loads, warned on the GX Touch"}
    - {step: "Never", sheds: "C8, the split", when: "Never shed", after: "Cooling and heating stay on (H3)"}
  # report 20 section 7, DC buses
  bus_12v: "LUNOS e2 pairs, RA 15-60 and controller, range hood, CO2 sensor and pressure display, DauerShower pump and controls, Shurflo pump, UV purifier, transfer pump, Thetford flush, HappiJac bed, Combi D 6 E, XT Air compressor, alarms and tracker, breakaway charger, 10 A external outlet"
  bus_24v: "Fridge, freezer, lights, USB-C outlets, Starlink Mini, top-up fan, RESPA-CF2"
  # report 20 section 7, outlets and DC points by zone
  outlets:
    - {zone: "Kitchen", ac: "2 double on the bench. The hob and the oven on their own circuits", dc: "1 USB-C PD 65 W"}
    - {zone: "Desk under the bed", ac: "2 double, the monitor and a spare", dc: "2 USB-C PD 100 W for the laptops, 1 USB-A"}
    - {zone: "Bed, night position", ac: "None", dc: "2 USB-C PD 65 W, one each side. 2 reading lights"}
    - {zone: "Living area", ac: "1 double", dc: "2 USB-C PD 65 W"}
    - {zone: "Wet room", ac: "None in the wet area", dc: "24 V light. The RA 15-60 runs from the 12 V bus"}
    - {zone: "Laundry", ac: "2 single, the washer and the dryer, on S1", dc: "-"}
    - {zone: "Electrical board", ac: "1 single service outlet", dc: "Starlink Mini on a 24 V fused circuit"}
    - {zone: "Outside, kerb side", ac: "1 weatherproof double, IP56 (G3)", dc: "1 Anderson SB50 12 V outlet with a 10 A fuse, 1 USB-C (G2)"}

# report 19 section 6, the ventilation modes (one rotary switch or a Cerbo GX page), m3/h. The generator rule: run the
# two EU22i on the ground ahead of the drawbar, at least 6 m from the trailer and downwind of it, exhausts pointing away,
# never in the drawbar box, so the front wall faces them and the side walls' fans and the RESPA's intake do not (F4-09)
ventilation_modes:
  - {mode: "Normal day", e2: "30 a pair", ra: "15, boost on humidity", topup: "15", respa: "Off", split: "Thermostat"}
  - {mode: "Night", e2: "22.5 a pair", ra: "15", topup: "15", respa: "Off", split: "Quiet fan"}
  - {mode: "Towing (dust)", e2: "Off", ra: "Off", topup: "Off", respa: "On, 150 to 200", split: "Off"}
  - {mode: "Parked, dust storm", e2: "Off", ra: "Off", topup: "40", respa: "On", split: "Thermostat"}
  - {mode: "Smoke", e2: "Off", ra: "Off", topup: "15 to 40 through the carbon", respa: "Off, or on with the odour filter", split: "Thermostat"}
  - {mode: "Low battery", e2: "22.5 a pair", ra: "15", topup: "15", respa: "Off", split: "Setpoint up 2 K, heat by diesel"}
  - {mode: "On the generators", e2: "Fans C and D off: on GENERATOR the changeover switch's first auxiliary stage opens their 12 V feed, because they sit low on the front wall facing the generators, and its second closes the Cerbo's digital input 3, which shows the mode. Fans A and B on the side walls, one from each pair, run on in opposite phases as one balanced pair (LUNOS to confirm for the 5/UNI-FT)", ra: "15", topup: "Off", respa: "On, 150 m3/h through its MERV 16 and carbon filters, so the cabin stays above outside", split: "Thermostat"}

# The energy budget's groups for the site's Electrical page (cad/services.py). Each names load ids of research report
# 20's model (research/models/20/loads.yaml), or their two-letter prefixes. INV and DCDC are the model's conversion losses.
energy_groups:
  - {name: "Split, and the Combi on diesel", ids: [AC, HE]}
  - {name: "Fresh air, extract, hood, sensors", ids: [VE, RH, SN]}
  - {name: "Fridge and freezer", ids: [FR, FZ]}
  - {name: "Hob and oven", ids: [KI]}
  - {name: "Showers and hot water", ids: [SH, HW]}
  - {name: "Washer and dryer", ids: [LA]}
  - {name: "Lights", ids: [LI]}
  - {name: "Desk, screens, Starlink", ids: [DE, NE]}
  - {name: "Pumps and the lift bed", ids: [WP, BE]}
  - {name: "Monitoring and standby", ids: [SB]}
  - {name: "Conversion losses", ids: [INV, DCDC]}
# short names for the model's four design cases, for the table's columns
energy_cases: {hot: "Hot, all electric", hot_diesel: "Hot, diesel water", cold_diesel: "Cold, diesel heat", cold_hp: "Cold, heat pump"}
# the chosen bank's row in the model's comparison of banks against decision H3
battery_bank: "Victron Lithium NG 51.2 V 100 Ah x 5 (48 V)"

# report 21 section 10.1: two people, litres a day
water_budget:
  daily:
    - {use: "Showers, 2 x 20 min", fresh_l: 10, grey_l: 10, basis: "DauerShower 2.0, 5 L each (maker)"}
    - {use: "Dishes", fresh_l: 8, grey_l: 8, basis: "Two washes of 4 L in the 350 x 350 mm sink (est.)"}
    - {use: "Drinking", fresh_l: 6, grey_l: 0, basis: "3 L a person in heat (est.)"}
    - {use: "Basin", fresh_l: 6, grey_l: 6, basis: "3 L a person at 4 L/min (est.)"}
    - {use: "Outdoor rinse at the rear door", fresh_l: 4, grey_l: 0, basis: "To the ground (est.)"}
    - {use: "Cooking", fresh_l: 3, grey_l: 1, basis: "Estimate"}
    - {use: "Toilet flush", fresh_l: 2, grey_l: 0, basis: "About 8 flushes of 0.25 L, into the cassette (est.)"}
    - {use: "Cleaning", fresh_l: 2, grey_l: 2, basis: "Estimate"}
  wash: {use: "One wash and dry", fresh_l: 44, grey_l: 44, basis: "Camec 3.5 kg washer, 44 L (WELS, maker). The dryer returns about 2 L as condensate (est.)"}
  stores:
    - {case: "In travel, at most 300 L (H13, H21), no laundry", litres: 300, washes_a_week: 0}
    - {case: "In travel, 300 L, three washes a week", litres: 300, washes_a_week: 3}
    - {case: "Tanks full at camp, 420 L, three washes a week", litres: 420, washes_a_week: 3}
  grey_tank_l: 130
  grey_hours_one_wash: 72

# report 19: the design days and the HVAC units, for the HVAC page
hvac:
  design_days:
    - {case: "Design hot day: 42 C peak at 15:00, 27 C at 03:00, clear sky, inside 24 C", heat_kwh: 37.1, peak_kw: 3.29, battery_kwh: 9.0, src: "research/models/19/loads.out"}
    - {case: "Design cold night: -5 C for 14 h, inside 20 C", heat_kwh: 17.6, peak_kw: null, battery_kwh: 6.6, src: "research/models/19/loads.out, on the heat pump"}
  units:
    - {line: "AC-01, AC-02", unit: "Mitsubishi Electric MSZ-AP25VGKD2 and MUZ-AP25VGD2 inverter split", does: "Cools 1.1 to 3.6 kW and heats 1.3 to 5.0 kW, down to -15 C outside", where: "Indoor unit high on the partition's road end, blowing forward. Outdoor unit high on the rear wall's road half, on wire-rope isolators behind a guard"}
    - {line: "LA-03", unit: "Truma Combi D 6 E", does: "Backup heat and the hot water, on diesel or its 900 or 1,800 W elements, through four warm-air ducts", where: "Tower base, road side, its cowl low in the road wall"}
    - {line: "VE-01A to VE-01D", unit: "Two LUNOS e2 60 pairs with MERV 13 covers", does: "Fresh air through heat recovery, 83 % at up to 60 m3/h a pair", where: "Fans A and B in the side walls, C and D low on the front wall"}
    - {line: "VE-03", unit: "LUNOS RA 15-60", does: "Wet room extract, 15 to 60 m3/h, boosted on humidity", where: "High in the rear wall's kerb half"}
    - {line: "VE-05", unit: "24 V EC fan with ISO coarse, ePM1 80 % and carbon filters", does: "Filtered top-up of 15 m3/h, 40 in wind or dust, so the cabin sits above outside", where: "Tower top, sharing the intake hood"}
    - {line: "VE-04", unit: "Sy-Klone RESPA-CF2, MERV 16 and carbon filters", does: "Towing and dust storms: a powered precleaner and 150 to 200 m3/h, about 20 Pa inside", where: "Tower top, its hood high on the road wall"}
    - {line: "VE-06", unit: "Pressure relief valve, 30 cm2, and a 0 to 125 Pa gauge", does: "Lets the excess air out through the wet room. The gauge shows a blocked filter or a failed seal", where: "Low in the rear wall"}
    - {line: "VE-07", unit: "Sphere TCR-001 range hood", does: "Kitchen extract, ducted outside through a cowl with a backdraft flap", where: "Over the hob"}
    - {line: "VE-08", unit: "Three RuuviTags and an NDIR CO2 sensor on the Cerbo GX", does: "Boosts the e2 pairs above 900 ppm CO2 and the extract on humidity", where: "Bed, living zone and wet room"}

# Lamps, reflectors and the number plate, to ADR 13/00 (UNECE R48/03 as its Appendix A) and VSB1 section 3.1. The ute
# drives them at 12 V through the 12-pin plug (DB-07). Positions are DIM-01: X from the ball, rearward, Y from the
# centreline, road side positive, Z up from the ground at design ride height. `y` and `z` are a device's centre and
# `size` its width and height in mm (est.). A device with `y` above 0 is a pair, mirrored to the kerb side. Side devices
# take X from the chassis stations they sit on. The extreme outer edges are the overall width's (DIM-01): the entry
# door's handle on the kerb side and the hoods on the road side. cad/lamps.py resolves the positions and checks every rule.
lamps:
  clearance_mm: 25            # to a wall opening or the outdoor unit's cradle (est.)
  between_mm: 15              # between two devices on one face (est.)
  rear_door_stay_deg: 150     # BD-15's stay
  plate_lamp_depth_mm: 35     # how far the hooded plate lamp stands off the wall (est.)
  plate:
    w: 372
    h: 134
    y: -614
    z: 1157
    top_max: 1300
    mount: "Rear wall, kerb half, on rivnuts in a bonded insert strip"
    why: >-
      The road half has the rinse box and the outdoor unit, and the centre has the rear door and its step. A plate low on
      the outriggers would sit over the recovery tongues and their shackles.
    src: "https://www.nsw.gov.au/driving-boating-and-transport/vehicle-registration/vehicle-number-plates/displaying-number-plates"
  devices:
    - {id: LP-01, name: "Rear combination lamp: stop, tail and indicator", does: [stop, rear_position, rear_indicator], colour: "red and amber", face: rear, mount: "Rear outrigger's rear face", y: 1115, z: 811, size: [150, 80]}
    - {id: RR-01, name: "Rear reflector, red triangle with 150 mm sides, apex up", does: [rear_reflector], colour: red, face: rear, mount: "Rear outrigger's rear face, on a 2 mm aluminium backing plate", y: 940, z: 814, size: [150, 130]}
    - {id: LP-02, name: "Reversing lamp", does: [reversing], colour: white, face: rear, mount: "Rear outrigger's rear face", y: 805, z: 811, size: [80, 50]}
    - {id: LP-03, name: "Rear end-outline lamp", does: [rear_end_outline], colour: red, face: rear, mount: "Rear wall's upper corners, below the outdoor unit's cradle", y: 1160, z: 2240, size: [70, 50]}
    - {id: LP-04, name: "Number plate lamp, hooded so no white light shows to the rear", does: [plate_lamp], colour: white, face: rear, mount: "Rear wall, over the plate", y: -614, z: 1250, size: [100, 30], single: true}
    - {id: LP-05, name: "Front position lamp", does: [front_position], colour: white, face: front, mount: "Front outrigger's front face", y: 1165, z: 845, size: [60, 45]}
    - {id: FR-01, name: "Front reflector", does: [front_reflector], colour: white, face: front, mount: "Front outrigger's front face, below the position lamp", y: 1165, z: 780, size: [60, 45]}
    - {id: LP-06, name: "Front end-outline lamp", does: [front_end_outline], colour: white, face: front, mount: "Front wall's flat panel, high, inboard of the corner pieces", y: 900, z: 2760, size: [70, 50]}
    - {id: SM-01, name: "Side marker lamp with an integral reflector", does: [side_marker, side_reflector], colour: amber, face: side, mount: "Outrigger end caps, upright", stations: ["between front and diesel bay (1)", "XT centre", "rear"], z: 811, size: [40, 80]}
