# The glands' fittings, for SVC-09 (cad/routes.py `glands`): each gland's footprint on both faces of its panel, from
# its `fit` (kind gland, frame, grommet or plate). A round gland with no `fit` is a nylon cable gland of its hole's
# metric thread, its body above the panel and its locknut below, a gland with `w` and `h` and no `fit` a transit frame.
# `under` names a part a floor fitting may stand under (the battery box's own vents), `flush` a fitting flush with
# the floor, which may stand in a keep-clear box.
# The modules and the glands seal round cable only, so every run through a frame or a gland is round: the 230 V circuits
# in Prysmian's 450/750 V 2C+E orange circular, 9.8 mm across in 2.5 mm2 and 10.8 mm in 4 mm2, inside an RM 15's 3 to
# 11 mm (I2-29), the DC circuits in round sheathed twin, D-07's two 95 mm2 cores each in an RM 30, and the sensors in
# round sheathed cable. Flat twin is used nowhere on these runs.
fittings:
  locknut_ac: {16: 25.4, 20: 27.7, 25: 34.6, 32: 41.6, 40: 53.1, 50: 63.5, 63: 77.0}   # across corners, mm, by thread: CMP Products standard locknuts, M63 from its EMC locknuts
  locknut_src: "CMP Products, locknuts for cable glands (www.cmp-products.com/glands/products/accessories/locknuts-for-cable-glands/): M16 to M50 across flats 22, 24, 30, 36, 46 and 55 mm, M63 70 mm"
  spanner_mm: 12          # (est.) a spanner's jaw round a locknut, about a quarter of an M40's 46 mm flats: the web kept between its corners and the next fitting
  web_mm: 10              # (est.) the least floor or wall left between two fittings where no nut is turned, for the panel's insert round each cut-out
  frame_rim_mm: 12        # (est.) a transit frame's 4 mm wall and an 8 mm rim past its packing space, bonded and screwed into the floor's insert
  frame_wall_mm: 4        # the frame's wall, so the cut-out is the packing space plus 4 mm a side
  frame_src: "Roxtec CF 8, a catalogue frame for comparison: packing space 40 x 80, external 75 x 140, aperture 61 x 127 mm, with its compression built in (www.roxtec.com, Roxtec CF 8/32 frame)"
  modules: {15: [3, 11], 20: [4, 14.5], 30: [10, 25], 40: [21.5, 34.5], 60: [28, 54]}   # each Roxtec RM module's cable range, mm (roxtec.com, Roxtec RM module with Multidiameter, read 22 Nov 2026). A cell [dx, dy, m, 2] is a pair's two cores, each in its own module of m, side by side across the frame (in Y), and [dx, dy, m, 2, x] along it
  grommet_lip_mm: 8       # (est.) a rubber grommet's or pipe boot's lip past its hole

# Every hole the runs make in a chassis member and every cut-out over 60 mm in the floor, for the structural checks
# (I2-27). A hole is where a run threaded through a member crosses its wall (cad/routes.py member_holes, which
# cad/tests/test_routes.py holds this list to): its point, its size across (the run's outside diameter and a 6 mm
# bush, est.) and its length along the wall where the run passes it on a slant. A frame's cut-out is its packing
# space and its 4 mm walls. The three cables of the kerb frame's raiser space keep inside the raiser, clear of its
# seam with the rail. K-08 and K-09 (I2-27) rise outside the rails behind the grey tank, enter the raisers through
# their inner faces 110 mm above the seam, and leave them into the outriggers OR-05 through a 16 x 27 mm slot in the
# middle of each outrigger's end, 26 mm above the seam and 12 mm inside the outrigger's walls, clear of its welds (est.).
holes:
  - {member: OR-05K, face: road side, run: K-08, x: 4390, y: -638, z: 782, d: 16, length: 27}
  - {member: OR-05K, face: kerb side, run: K-08, x: 4390, y: -1200, z: 800, d: 16, length: 16}
  - {member: OR-05R, face: kerb side, run: K-09, x: 4390, y: 638, z: 782, d: 16, length: 27}
