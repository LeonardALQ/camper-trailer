# 05-bike-geometry.yaml  (machine-readable companion to 05-bike-geometry.md)
# Every value: v = value, u = units, src = source URL, conf = high|medium|low. TODO = not yet measured.
schema_version: 2
generated: 2026-11-16
frame:
  origin: ground directly below the front axle
  x: positive towards the rear of the bike
  y: positive to the bike's left
  z: up
  state: upright, level ground, unladen, no rider, ride height as in maker studio image
  units: mm
sources:
  aprilia_manual: &aprilia_manual https://www.scribd.com/document/884477164/Aprilia-tuareg-660-Rally-e5-en
  aprilia_rally_spec: &aprilia_rally_spec https://library.rvusa.com/brochure/2026-Aprilia-Tuareg-Rally-660-brochure.pdf
  aprilia_2024_spec: &aprilia_2024_spec https://wlassets.aprilia.com/wlassets/aprilia/rs/tech_spec/2024/Tuareg660/original/Tuareg660.pdf
  aprilia_rally_image: &tu_img https://www.apriliaoficial.com.ar/2025/wp-content/uploads/2025/10/ficha_tuareg_rally_comprimida.pdf
  ps1000_rally: &ps1000 https://www.1000ps.com/de-at/modell/12747/aprilia-tuareg-660-rally/2025
  advpulse_rally: &advpulse https://www.advpulse.com/adv-news/aprilia-tuareg-660-rally-review/
  triumph_au_spec: &tri_au https://www.triumphmotorcycles.com.au/motorcycles/roadsters/street-triple-765/specification
  triumph_us_spec: &tri_us https://www.triumphmotorcycles.com/motorcycles/roadsters/street-triple-765/specification
  motoit_2023_rs: &motoit23 https://www.moto.it/listino/triumph/street-triple/street-triple-765-rs-2023-26/p7frAe
  motoit_2017_rs: &motoit17 https://www.moto.it/listino/triumph/street-triple/street-triple-rs-2017-19/GdkJpQ
  bikesocial_2020_rs: &bs20 https://www.bennetts.co.uk/bikesocial/reviews/bikes/triumph/triumph-street-triple-rs-2020-review-price-spec
  triumph_handbook_2020_22: &tri_hb https://static-cdn.cars24.com/prod/new-bike-cms/Triumph/Street-Triple-R/2025/01/01/9247318d-e61e-41be-8606-e1fd232af342-Triumph_Street-Triple-R_Brochure.pdf
  philharmonic_2020_rs: &ph20 https://philharmonicmoto.com/product/triumph-street-triple-rs-2020-2022/
  triumph_rs_rhs_image: &st_img https://media.triumphmotorcycles.co.uk/image/upload/sitecoremedialibrary/media-library/images/motorcycles/roadsters-supersports/my25/my25%20colours/street%20triple%20765%20rs/web/1080/street%20triple%20rs_my25_phantom%20black_rhs_1080px.jpeg
  triumph_rs_lhs_image: &st_img_l https://media.triumphmotorcycles.co.uk/image/upload/sitecoremedialibrary/media-library/images/motorcycles/roadsters-supersports/my25/my25%20colours/street%20triple%20765%20rs/web/1080/street%20triple%20rs_my25_phantom%20black_lhs_1080px.jpeg
  calc: &calc "calculated from tyre size code: rim inches x 25.4 + 2 x aspect x width"
  owner: &owner "BRIEF.md owner figures (override published)"
  estimate: &est "engineering estimate, no fetched source"

