  # ---------------------------------------------------------------- labour (hired trade rate AUD 120/h incl GST, est.)
  - id: LAB-01
    group: Labour
    item: "Chassis and drawbar fabrication: cut, fit, weld, grind, inspect, prepare for galvanising"
    qty: 70
    unit: h
    unit_aud: 120.00
    total_aud: 8400.00
    basis: estimate
    url: "https://mobilewelders.com.au/"
    date: 2026-11-20
    note: "Hours (est.): cut, cope and drill 45 members and about 70 plate parts with vent and drain holes 12 h. Jig, fit and tack square to 2 mm 14 h. Weld about 18 m of raiser fillets, 6 m of drawbar fillets, about 50 member ends, 32 nut plates and the XT hinge brackets 28 h. Burr-grind toes, dress, inspect and record 10 h. Handling and the post-dip check 6 h. Rate: mobile welders from AUD 110/h. Sydney welder wages AUD 41 to 86/h (https://au.indeed.com/career/welder/salaries/Sydney-NSW)."
