# Sandwich panels sold in Australia for the body: floor, walls and raising roof.
# Research report 12, 20 Nov 2026. research-12-body.md section 2 explains the method.
# Units: mm, kg/m2, MPa. D is bending stiffness in kNm2 per metre width, S shear stiffness in kN per metre width.
# R is the core's thermal resistance in m2K/W. Basis: maker (published), calculated (from maker data), estimate.
# Stiffness: D = E t d^2 / 2 and S = G d^2 / c, with t skin thickness, d skin centre spacing, c core thickness.
# Wrinkling: 0.5 (E Ec G)^(1/3) (HexWeb sandwich design guide).

inserts:
  - id: bighead-sm1-b38a
    product: bigHead SM1-B38A, 316 stainless M6 or M8 stud on a 38 mm perforated head, bonded to a skin
    rated_tension_kN: "0.25 to 3.75, depending on the bigHead and the adhesive"
    rated_shear_kN: "0.1 to 5, depending on the bigHead and the adhesive"
    source: "https://fileserver.mates.it/Prodotti/6_Inserti/TDS/BigHead/bigHead_SM1_B38A_TDS.pdf"
  - id: deform-nut-m6
    product: Deform-Nut TC/DM M6, blind insert potted in structural adhesive
    rated_tension_kN: 2.2
    rated_shear_kN: 1.7
    note: "500 lb and 377 lb, depending on core density and panel thickness"
    source: "https://www.chemical-concepts.com/product/deform-nut-tc-dm-honeycomb-anchoring-system-metric-thread-m6-10x/"
  - id: panelock-aplb-1020
    product: Panelock APLB-1020 bolt with APLN-1010 nut, through-fixing for a 30.8 to 37.7 mm grip
    rated_tension_kN: 20.0
    rated_shear_kN: 14.0
    source: "https://lavenderpanels.com.au/wp-content/uploads/2020/10/Panelock.pdf"
  - id: hd-pvc-strip
    product: High-density PVC insert strip built into the core (Liner Supply grey 500 to 550 kg/m3, 15 to 50 mm thick, 25 to 128 mm wide, up to 6 m. DIY Caravans 70 x 25 mm)
    rated_tension_kN: not published
    rated_shear_kN: not published
    note: Rating set by a pull test in a sample of the real panel (report 02 LR-09)
    source: "https://www.diycaravans.com.au/shop/panel-insertion-hi-density-pvc-70-x-25-mm/"
  - id: pultrusion-strip
    product: Pultruded GRP insert, 50 x 25 or 38 x 25 mm hollow section built into the core
    rated_tension_kN: not published
    rated_shear_kN: not published
    note: DIY Caravans uses it under roof air-conditioners. Rating by pull test
    source: "https://www.diycaravans.com.au/shop/panel-insertion-pultrusion-50-x-25-mm/"
  - id: aluminium-strip
    product: Aluminium 40 x 25 mm insert built into the core
    rated_tension_kN: not published
    rated_shear_kN: not published
    note: DIY Caravans warns of condensation at the cold bridge
    source: "https://www.diycaravans.com.au/shop/panel-insertion-aluminium-40x25-mm/"
