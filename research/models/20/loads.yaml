# report 20 energy model inputs. Read by research/models/20/energy.py. Revision 2, 20 Nov 2026: reports 19 and 21 figures in.
# Units: W, minutes, hours, kWh, V. Times are hours after midnight (18.25 = 18:15).
# side: ac = 230 V through the inverter-charger. dc = straight off the 48 V battery bus.
#       dc24 or dc12 = on the 24 V or 12 V bus, through its DC-DC converters.
# Cases: hot, hot_diesel, cold_diesel, cold_hp. A load gives "hot" and "cold". hot_diesel falls back to hot,
# cold_diesel and cold_hp fall back to cold, unless the load overrides them. An empty spec {} means off.
# A spec holds one or more of:
#   events: [[start_h, minutes, W], ...]   timed use
#   runs: [[start_h, end_h, W], ...]        steady draw over a period (end may pass 24, it wraps)
#   hourly_w: [24 values]                   average W in each hour, 00:00 to 23:00
#   kwh + profile (+ profile_window, scale) a daily energy shaped by a named profile, or kwh: auto
#   peak_w                                  this case's peak, for the coincident-load check
# standby_w applies whenever the load is not drawing. bus_peak_w is the peak used for the DC bus checks.
# provisional: true = neither report 19 nor report 21 gives a figure. The reason is in the note.
# basis: maker, retailer, calculated or estimate. (est.) marks a judgement.

meta:
  date: 2026-11-20
  author: report 20
  sources: "report 19 research/19-hvac-windows-doors.md, research/19-hvac-windows-doors.yaml, research/models/19/loads.out. Report 21 research/21-interior.md, research/21-interior.yaml. Report 13 for the fridge and freezer"
  hot_day: "report 19: 42 C peak at 15:00, 27 C at 05:00, clear sky, 1,000 W/m2 at noon, inside 24 C"
  cold_day: "report 19: cold night -5 C from 17:00 to 07:00, inside 20 C. The day 07:00 to 17:00 rises to 13 C at noon (report 20 est.)"

system:
  bus: 48                    # 16S LiFePO4, 51.2 V nominal
  battery_location: inside   # inside (conditioned space) or underfloor
  usable_fraction: 0.90      # H3
  eol_capacity_fraction: 0.80          # Victron counts NG cycle life to 80 % of nominal (datasheet)
  battery_discharge_efficiency: 0.96   # NG round trip 92 % (datasheet), split evenly
  battery_charge_efficiency: 0.96
  temperature_derating: {inside: 1.00, underfloor_hot: 1.00, underfloor_cold: 0.92}   # est.
  # Daytime heating on the cold day only (07:00 to 17:00). Report 19 gives the night. All est. from report 19's figures.
  thermal:
    ua_w_per_k: 63               # report 19: 1,572 W loss at 25 K with no gains, fabric and ventilation
    solar_gain_w_per_w_m2: 0.35  # est.
    internal_gain_day_w: 350     # report 19 uses 233 to 368 W
    internal_gain_night_w: 250
    inside_cold_c: 20
    cop_heat_at_minus5c: 2.9     # report 19 open point 1
    cop_heat_rise_per_k: 0.114   # report 19: COP 3.7 at 2 C
    cop_heat_max: 4.8            # Mitsubishi: COP 4.8 at 7 C rated heating
  converters:
    dc24: {efficiency: 0.89, idle_w: 8.2, volts: 24.2, continuous_a: 32, ten_second_a: 50,
           note: "Two Victron Orion-Tr 48/24-16 in parallel: 16 A each at 40 C, 25 A for 10 s, 89 %, under 80 mA no-load at 51.2 V (Orion-Tr datasheet)"}
    dc12: {efficiency: 0.87, idle_w: 8.2, volts: 12.2, continuous_a: 60, ten_second_a: 80,
           note: "Two Victron Orion-Tr 48/12-30 in parallel: 30 A each at 40 C, 40 A for 10 s, 87 %, under 80 mA no-load (datasheet). Victron allows any number in parallel"}
  inverter:
    model: Victron MultiPlus-II 48/6k5/100-50
    no_load_w: 28          # datasheet zero-load power (AES 18 W)
    search_w: 8            # datasheet search mode
    max_efficiency: 0.96
    p_at_max_efficiency_w: 2000    # est., about a third of rated output
    continuous_w_25c: 6000
    continuous_w_40c: 5700
    peak_w: 11000                  # for 1 min (datasheet)
    always_on: {hot: true, hot_diesel: true, cold_hp: true, cold_diesel: false}   # false = search mode when no AC load

# Load management. Tier 1 is cooking and the shower heater. Tier 2 (contactor S1) is background heat.
interlocks:
  groups:
    tier1: [KI-01, KI-02, KI-03, SH-01]
    tier2: [HW-01, LA-01, LA-02]
  never_together:
    - [KI-02, KI-03]     # oven and microwave are one appliance
    - [SH-01, KI-02]     # the shower heater and the oven-microwave lock each other out (K2, K4)
    - [SH-01, KI-03]
    - [tier1, tier2]     # S1 opens while any tier 1 load draws
  caps:
    - {when: [SH-01], cap: {KI-01: 1000}}   # above 1 kW on the hob, K4 drops the shower heater
  user_outlets_w: 300      # allowance for small appliances on the bench and living outlets (est.)
  node_red_total_limit_w: 5500
  dc_checks:
    - {name: "12 V bus, worst living case (shower pump, water pump, UV, hood, Combi starting, fans, alarms, flush)", bus: dc12,
       loads: [SH-02, WP-01, WP-02, RH-01, HE-01, VE-01, VE-02, SB-03, SN-01, SN-02, SB-05, TO-01]}
    - {name: "12 V bus, the same with the XT Air compressor levelling", bus: dc12,
       loads: [SH-02, WP-01, WP-02, RH-01, HE-01, VE-01, VE-02, SB-03, SN-01, SN-02, SB-05, TO-01, RG-04]}
    - {name: "12 V bus, the same plus the external 12 V outlet at its 10 A fuse", bus: dc12,
       loads: [SH-02, WP-01, WP-02, RH-01, HE-01, VE-01, VE-02, SB-03, SN-01, SN-02, SB-05, TO-01, RG-04, EX-12],
       note: "Over for longer than 10 s only if the compressor, a shower and the outlet all run together."}
    - {name: "24 V bus, worst parked case (fridge, freezer, lights, two laptops, phones, Starlink, top-up fan)", bus: dc24,
       loads: [FR-01, FZ-01, LI-01, DE-01, DE-03, NE-01, VE-03]}
    - {name: "24 V bus, the same in a parked dust storm with the RESPA-CF2 starting", bus: dc24,
       loads: [FR-01, FZ-01, LI-01, DE-01, DE-03, NE-01, VE-03, VE-04]}
    - {name: "24 V bus, towing (fridge, freezer, Starlink, RESPA-CF2 starting, low lights)", bus: dc24,
       loads: [FR-01, FZ-01, NE-01, VE-04], allowance_w: 10}

