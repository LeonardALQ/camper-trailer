# Engine parts for the LandCruiser VDJ79 1VD-FTV build (research report 14, 20 Nov 2026).
# One entry per item. Prices in AUD including GST, read from the supplier's page on 20 Nov 2026.
# basis: published (supplier's listed price), similar (listed price of a similar product),
#        estimate (judgement, the note says how).
# need, per level: required | optional | alternative (replaces the entry named in the note) | no
# Levels: A = up to 181 kW at the crank, the legal 20 % tune (recommended)
#         B = 220 to 250 kW, needs a VSCCS LA4 certificate
#         C = about 300 kW, LA4, not realistic to certify for this use
# truck: pre-DPF (2007 to Oct 2016), DPF (Oct 2016 to 2024) or both.
# Toyota numbers marked "by VIN" were not found. Order them from a Toyota dealer by VIN.

levels:
  A: {crank_kw: "up to 181 (1.20 x the truck's own stock dyno reading)", crank_nm: "about 650", legal: "no certificate, VSI 06 items 2 and 5", engine_side_aud_pre_dpf: 32208, engine_side_aud_dpf: 35844, cheapest_version_aud: 27028}
  B: {crank_kw: "220 to 250", crank_nm: "about 850", legal: "VSCCS LA4 from an LC4 certifier", engine_side_aud_pre_dpf: 32708, certification_aud: "about 2000, or 12000 plus with a laboratory test"}
  C: {crank_kw: "about 300", crank_nm: "about 1050", legal: "VSCCS LA4, unlikely to be granted", engine_side_aud_pre_dpf: 38733, certification_aud: "about 12000 plus"}

driveline_demand:   # sized in report 15, not counted in the totals here
  A: {torque_nm: 650, note: "Factory clutch slips beyond about 500 Nm (GTurbo booklet page 23)"}
  B: {torque_nm: 850, note: "Clutch and gearbox for about 850 Nm"}
  C: {torque_nm: 1050, note: "For example the NPC 1600 Nm clutch and billet flywheel, AUD 2,178, https://gturbo.com.au/products/vdj79-extra-heavy-duty-clutch-kit-billet-flywheel-1300nm"}

