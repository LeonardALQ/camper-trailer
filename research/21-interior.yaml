# Chosen products for the lift bed, desk, kitchen, laundry, shower, bathroom and water system
# (research report 21, 20 Nov 2026, research/21-interior.md).
# One entry per chosen product. mass_basis: maker (maker's published figure), retailer (stockist's
# published figure), calculated (from size and density), estimate (judgement, basis in the note).
# dims_mm is [L, W, H] as published, with the orientation in dims_note where it matters.
# mass_kg is per unit. Power at the device's own supply. energy_per_use_kwh is at the appliance,
# before inverter loss. price.aud is per unit, AUD including GST. price.basis is listing, quote or
# estimate. price.converted is true when converted at 1 USD = 1.55 AUD, 1 EUR = 1.68 AUD,
# 1 GBP = 1.98 AUD. Foreign listings that exclude VAT have 10 % Australian GST added.

